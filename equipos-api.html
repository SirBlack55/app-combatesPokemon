  const puff=(x,y,vx,vy,r,gr,l,c)=>e.pf.length<160&&e.pf.push({x,y,vx,vy,r,gr,l,m:l,c});
  const dust=(x,y,vx,vy,r)=>puff(x,y,vx,vy,r,R(25,45),R(.7,1.2),['214,199,161','184,169,138','231,229,228'][Math.floor(R(0,3))]);
  e.pf.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.l-=dt});
  e.pf=e.pf.filter(p=>p.l>0);

  // Carga: el suelo tiembla, chispas y piedras flotan, el polvo sale hacia los lados
  if(t<.7){
   shk=Math.max(shk,1.5+t/.7*4);
   for(let i=0;i<4;i++)spark(x+R(-30,30),y+R(5,30),R(-30,30),R(-240,-100),.55,['#fde047','#4ade80','#fff'][i%3],R(2,5));
   if(Math.random()<.35)ps.push({x:x+R(-40,40),y:fy,vx:R(-30,30),vy:R(-150,-60),gy:140,l:.8,m:.8,c:'#a8a29e',s:R(3,6)});
   if(Math.random()<.45){const d=Math.random()<.5?-1:1;dust(x+d*R(10,30),fy+R(-4,6),d*R(60,170),R(-25,0),R(14,24))}
  }
  // Embestida: salida con gran nube de polvo, rastro de polvo y chispas
  else if(t<1){
   shk=Math.max(shk,5);
   if(!e.p0){
    e.p0=[x,y];sfl=.3;sfc='#fffbe0';shk=Math.max(shk,11);
    for(let i=0;i<24;i++){const a=R(0,6.28);dust(x+R(-10,10),fy+R(-4,6),Math.cos(a)*R(90,290),Math.sin(a)*R(15,60)-20,R(22,38))}
   }
   for(let i=0;i<2;i++)dust(x+R(-10,10),fy+R(-4,6),R(-40,40),R(-30,0),R(16,28));
   for(let i=0;i<3;i++)spark(x+R(-12,12),y+R(-16,16),R(-90,90),R(-90,90),.35,['#bef264','#fde047','#fff'][i],R(3,6));
  }
  // Choque: grietas incandescentes, columna de humo y anillo de polvo en el rival
  else{
   if(!e.cr){
    const X=e.cx=tg.x,Y=e.cy=tg.y-25;
    e.cr=Array.from({length:9},(_,i)=>({a:i*.698+R(-.2,.2),l:R(80,170),j:[R(-10,10),R(-6,6)]}));
    for(let i=0;i<14;i++)puff(X+R(-24,24),Y+R(-8,18),R(-50,50),R(-190,-50),R(22,40),R(40,70),R(1,1.6),i%2?'87,83,78':'120,113,108');
    for(let i=0;i<18;i++){const a=R(0,6.28);dust(X,Y+18,Math.cos(a)*R(130,340),Math.sin(a)*R(25,80),R(24,40))}
   }
   if(t<1.9){
    if(Math.random()<.35)spark(x+R(-14,14),y+R(-14,14),R(-40,40),R(-120,-40),R(.3,.6),'#a3e635',R(2,4));
    if(Math.random()<.2)puff(x+R(-14,14),y+R(-10,10),R(-10,10),R(-60,-20),10,18,R(.6,1),'231,229,228');
   }
  }
 },

 edraw(e){
  const o=e.o,t=e.t,x=o.x,y=o.y-30;
  const glow=(X,Y,r,a,c1,c2)=>{
   const g=cx.createRadialGradient(X,Y,1,X,Y,r);
   g.addColorStop(0,'#fff');g.addColorStop(.4,c1);g.addColorStop(1,c2);
   cx.globalAlpha=a;cx.fillStyle=g;cx.beginPath();cx.arc(X,Y,r,0,7);cx.fill();
  };
  const ring=(X,Y,k,w,a,c)=>{cx.globalAlpha=a;cx.strokeStyle=c;cx.lineWidth=w;cx.beginPath();cx.ellipse(X,Y,20+k*220,8+k*72,0,0,7);cx.stroke()};
  cx.save();
  cx.lineCap='round';

  // Polvo y humo: bocanadas blandas que crecen y se desvanecen
  for(const p of e.pf){
   const a=p.l/p.m,r=p.r+p.gr*(1-a),al=Math.min(1,a*1.6)*.55;
   let g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
   g.addColorStop(0,`rgba(${p.c},${al})`);g.addColorStop(1,`rgba(${p.c},0)`);
   cx.globalAlpha=1;cx.fillStyle=g;cx.beginPath();cx.arc(p.x,p.y,r,0,7);cx.fill();
   g=cx.createRadialGradient(p.x-r*.3,p.y-r*.3,0,p.x-r*.3,p.y-r*.3,r*.6);
   g.addColorStop(0,`rgba(255,255,255,${al*.35})`);g.addColorStop(1,'rgba(255,255,255,0)');
   cx.fillStyle=g;cx.beginPath();cx.arc(p.x-r*.3,p.y-r*.3,r*.6,0,7);cx.fill();
  }
  cx.globalCompositeOperation='lighter';

  // Grietas incandescentes en el suelo del rival
  if(e.cr&&t<1.95){
   const a=Math.min(1,(1.95-t)/.7);
   for(const[w,c]of[[7,'#f97316'],[2.5,'#fef08a']]){
    cx.strokeStyle=c;cx.lineWidth=w;cx.globalAlpha=a*.7;
    for(const k of e.cr){
     const cs=Math.cos(k.a),sn=Math.sin(k.a)*.35;
     cx.beginPath();cx.moveTo(e.cx,e.cy+18);
     cx.lineTo(e.cx+cs*k.l*.5+k.j[0],e.cy+18+sn*k.l*.5+k.j[1]);
     cx.lineTo(e.cx+cs*k.l,e.cy+18+sn*k.l);
     cx.stroke();
    }
   }
  }

  // Carga: ondas que salen del suelo y pilar de luz
  if(t<.7){
   const u=t/.7;
   for(let i=0;i<3;i++){const k=(t*2.5+i/3)%1;ring(x,y+22,k*.45,3,(1-k)*u,i%2?'#4ade80':'#fde047')}
  }
  const pw=t<.7?6+t/.7*12:t<.85?18*(1-(t-.7)/.15):0;
  if(pw>0){
   const g=cx.createLinearGradient(x,y+22,x,y-270);
   g.addColorStop(0,'rgba(253,224,71,.9)');g.addColorStop(.6,'rgba(74,222,128,.4)');g.addColorStop(1,'rgba(74,222,128,0)');
   cx.globalAlpha=.8+.2*Math.sin(T*40);cx.fillStyle=g;cx.fillRect(x-pw,y-270,pw*2,292);
  }

  // Haz de energía: del punto de salida al Pokémon, con espirales, estrías de velocidad y cabeza ancha
  if(e.p0&&t<1.35){
   const[x0,y0]=e.p0,dx=x-x0,dy=y-y0,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d,nx=-uy,ny=ux;
   const fade=t<1?1:Math.max(0,1-(t-1)/.35);
   for(const[k,rgb]of[[1,'34,197,94'],[.65,'253,224,71'],[.3,'255,255,255']]){
    const g=cx.createLinearGradient(x0,y0,x,y),hw=38*k;
    g.addColorStop(0,`rgba(${rgb},0)`);g.addColorStop(1,`rgba(${rgb},.9)`);
    cx.globalAlpha=fade;cx.fillStyle=g;cx.beginPath();
    cx.moveTo(x0+nx*2,y0+ny*2);cx.lineTo(x+nx*hw,y+ny*hw);
    cx.lineTo(x-nx*hw,y-ny*hw);cx.lineTo(x0-nx*2,y0-ny*2);
    cx.fill();
   }
   cx.lineWidth=3;
   for(let h=0;h<2;h++){
    cx.strokeStyle=h?'#86efac':'#fde047';cx.globalAlpha=fade*.9;cx.beginPath();
    for(let i=0;i<=24;i++){
     const s=i/24,off=Math.sin(s*14-T*40+h*3.14)*30*s;
     const px=x0+dx*s+nx*off,py=y0+dy*s+ny*off;
     i?cx.lineTo(px,py):cx.moveTo(px,py);
    }
    cx.stroke();
   }
   cx.strokeStyle='#fff';
   for(let i=0;i<9;i++){
    const a=R(10,120),l=R(50,140),o2=R(-48,48);
    cx.globalAlpha=fade*.5;cx.lineWidth=R(1,3);cx.beginPath();
    cx.moveTo(x-ux*a+nx*o2,y-uy*a+ny*o2);cx.lineTo(x-ux*(a+l)+nx*o2,y-uy*(a+l)+ny*o2);cx.stroke();
   }
  }

  // Aura Super Saiyan: once lenguas de fuego verdes, amarillas y blancas que suben y parpadean
  const k=t<.7?t/.7:t<1?1:Math.max(0,1-(t-1)/.25);
  if(k>0){
   glow(x,y+10,60+35*k,.65*k,'#fde047','rgba(74,222,128,0)');
   for(const[sc,c,a]of[[1,'#4ade80',.55],[.68,'#fde047',.8],[.34,'#fff',.85]]){
    cx.fillStyle=c;cx.globalAlpha=a*Math.min(1,k*1.5);
    for(let i=0;i<11;i++){
     const h=(60+30*Math.sin(T*9+i*1.7)+(5-Math.abs(i-5))*14)*k*sc,s=Math.sin(T*12+i*2.1)*8,xo=x+(i-5)*7;
     cx.beginPath();cx.moveTo(xo-8*sc,y+22);
     cx.quadraticCurveTo(xo-7*sc+s,y-h*.5,xo+s*1.4,y+22-h);
     cx.quadraticCurveTo(xo+7*sc+s,y-h*.5,xo+8*sc,y+22);
     cx.fill();
    }
   }
   cx.strokeStyle='#fef9c3';cx.lineWidth=2;cx.globalAlpha=k;
   for(let i=0;i<5;i++)if(Math.random()<.7){
    const a=x+R(-26,26),b=y+R(-34,26);
    cx.beginPath();cx.moveTo(a,b);cx.lineTo(a+R(-16,16),b+R(-16,16));cx.lineTo(a+R(-30,30),b+R(-30,30));cx.stroke();
   }
  }

  // Agotamiento: brillo verdoso que se apaga con parpadeo
  if(t>=1&&t<1.9)glow(x,y,34,(1-(t-1)/.9)*(.3+.2*Math.sin(T*18)),'#a3e635','rgba(74,222,128,0)');

  // Explosión amarilla tipo bomba: destello, bola de fuego abultada, rayos y tres ondas en el suelo
  if(e.cr&&t<1.7){
   const u=(t-1)/.7,a=Math.max(0,1-u*u),X=e.cx,Y=e.cy,r=40+Math.sqrt(u)*150,c2='rgba(234,88,12,0)';
   glow(X,Y,280,Math.max(0,1-u*7)*.9,'#fff','rgba(255,255,255,0)');
   for(let i=0;i<8;i++){const an=i*.785+.3;glow(X+Math.cos(an)*r*.5,Y+Math.sin(an)*r*.5-u*35,r*.6,a,'#facc15',c2)}
   glow(X,Y-u*15,r,a,'#fde047',c2);
   glow(X,Y,r*.5*(1-u),a,'#fff','rgba(255,255,255,0)');
   for(let i=0;i<14;i++){
    const an=i*.449+T*.2;
    cx.strokeStyle=i%2?'#fff':'#fde047';cx.lineWidth=R(2,6)*a;cx.globalAlpha=a*.8;
    cx.beginPath();cx.moveTo(X+Math.cos(an)*r*.3,Y+Math.sin(an)*r*.3);cx.lineTo(X+Math.cos(an)*r*1.4,Y+Math.sin(an)*r*1.4);cx.stroke();
   }
   for(let j=0;j<3;j++){const k2=u*1.6-j*.25;if(k2>0&&k2<1)ring(X,Y+18,k2,8*(1-k2)+1,1-k2,'#fef08a')}
  }
  cx.restore();
 }
};
</script>
<script>
// Cometa Draco (draco-meteor): 5 meteoritos de roca ardiente que caen sobre el rival y se estrellan.
CUSTOM['draco-meteor']={
 // p:130 y c:1 → el conversor multiplicaba el poder por 1.8 (llegaba 234) y c:10 no se usa aquí
 mv:{cu:'draco-meteor',r:420,tk:0,p:130,c:1,est:'distancia'},
 fallback:()=>({n:'Cometa Draco',key:'draco-meteor',p:130,cd:8.4,c:1,r:420,u:1,t:'dragon',cat:'spe',acc:90,sty:'beam',cu:'draco-meteor'}),

 start(m,tg,p){
  m.sc={id:'draco-meteor',t:0,p};
  dim=.5;
  shk=Math.max(shk,6);
  bn={s:p.n,c:'#a855f7',l:1.5};

  // Energía draconiana subiendo desde el atacante
  for(let i=0;i<25;i++){
   const a=R(0,6.28),d=R(15,40);
   ps.push({x:m.x+Math.cos(a)*d,y:m.y-34+Math.sin(a)*d,vx:R(-20,20),vy:R(-250,-150),l:.6,m:.6,c:i%2?'#60a5fa':'#c084fc',s:R(4,8),g:1,sh:'s'});
  }

  // 5 meteoritos escalonados ('delay' lo gestiona el motor: eup() empieza cuando termina).
  // Vienen en diagonal desde el lado con más espacio; el último es el más grande.
  const N=5,side=tg.x<W/2?-1:1;
  for(let i=0;i<N;i++){
   const sx=tg.x-side*R(110,230);
   ents.push({k:'u',cu:'draco-meteor',o:m,tg,cat:p.cat,dm:p.p/N,t:0,idx:i,
    delay:.4+i*.12,
    sx,sy:-120,cx:sx,cy:-120,           // posición inicial válida (edraw puede dibujar antes del primer eup)
    ox:R(-20,20),tx:tg.x,ty:tg.y-20,
    sz:i===N-1?26:R(12,17),             // radio de la roca
    shape:Array.from({length:11},()=>R(.7,1.2)),rot0:R(0,6.28),spin:R(-5,5),
    pf:[],hitDone:false,life:1.5});
  }
 },

 run(m,dt,s){
  const t=s.t;
  if(t<1)dim=Math.max(dim,.4);          // el campo sigue oscuro mientras caen
  if(t<.4){m.x+=Math.sin(t*90)*1.2;return false}   // vibración (m.tilt estira el sprite, mejor mover x)
  return t>=1.2;
 },

 eup(e,dt){
  const o=e.o,tg=e.tg,s=e.sz;
  e.t+=dt;
  e.life=1.5-e.t;
  // Humo y polvo propios: se mueven aquí y se pintan blandos en edraw
  const puff=(x,y,vx,vy,r,gr,l,c)=>e.pf.length<60&&e.pf.push({x,y,vx,vy,r,gr,l,m:l,c});
  e.pf.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.l-=dt});
  e.pf=e.pf.filter(p=>p.l>0);
  if(e.hitDone)return;

  // Caída: acelera hacia donde está el rival (el impacto cae donde está)
  const u=Math.min(1,e.t/.42);
  e.tx=tg.x+e.ox;e.ty=tg.y-20;
  const w=u**1.35;
  e.cx=e.sx+(e.tx-e.sx)*w;
  e.cy=e.sy+(e.ty-e.sy)*w;

  if(u<1){
   puff(e.cx,e.cy,R(-25,25),R(-25,25),s*.8,s*1.8,R(.5,.9),'88,70,100');
   for(let i=0;i<2&&ps.length<900;i++)   // brasas que se desprenden de la roca
    ps.push({x:e.cx+R(-6,6),y:e.cy+R(-6,6),vx:R(-50,50),vy:R(-20,60),gy:220,l:R(.3,.6),m:.6,c:['#fb923c','#fde047','#c084fc'][i+(Math.random()<.4?1:0)],s:R(2,5),g:1});
   return;
  }

  // Impacto (una vez): daño, explosión, escombros, humo y polvo
  e.hitDone=true;e.th=e.t;
  const X=e.ix=e.tx,Y=e.iy=e.ty,k=s/14;
  if(!tg.dead)hit(tg,e.dm,'dragon',o,{cat:e.cat,f:e.idx===0});
  imp(X,Y,'dragon',1.2*Math.sqrt(k));
  blast(X,Y,'#a855f7',45*k);
  ring(X,Y,'#c084fc',90*k,.45,5);
  ring(X,Y,'#fb923c',55*k,.3,3);
  shk=Math.max(shk,7+k*3);sfl=.18;sfc='#f3e8ff';
  for(let i=0;i<22&&ps.length<900;i++){
   const a=R(0,6.28),v=R(100,360)*Math.sqrt(k);
   ps.push({x:X,y:Y,vx:Math.cos(a)*v,vy:Math.sin(a)*v*.8-60,gy:300,l:R(.3,.7),m:.7,c:['#fb923c','#fde047','#c084fc','#fff'][i%4],s:R(2,6),g:1});
  }
  for(let i=0;i<8&&ps.length<900;i++)   // escombros que salen despedidos y caen
   ps.push({x:X+R(-10,10),y:Y,vx:R(-200,200),vy:R(-340,-120),gy:560,l:R(.6,1),m:1,c:i%2?'#57534e':'#3b2a3f',s:R(3,7)});
  for(let i=0;i<6;i++)puff(X+R(-15,15),Y+R(-8,8),R(-40,40),R(-110,-30),s*1.4,s*3,R(.8,1.3),'88,70,100');
  for(let i=0;i<8;i++){const a=R(0,6.28);puff(X,Y+10,Math.cos(a)*R(90,220),Math.sin(a)*R(15,50),s*1.2,s*2.5,R(.7,1.1),'214,199,161')}
 },

 edraw(e){
  if(e.t<=0||e.cx==null)return;
  const t=e.t,s=e.sz;
  const glow=(X,Y,r,a,c1,c2)=>{
   const g=cx.createRadialGradient(X,Y,1,X,Y,r);
   g.addColorStop(0,'#fff');g.addColorStop(.4,c1);g.addColorStop(1,c2);
   cx.globalAlpha=a;cx.fillStyle=g;cx.beginPath();cx.arc(X,Y,r,0,7);cx.fill();
  };
  cx.save();
  cx.lineCap='round';

  // Humo y polvo: bocanadas blandas que crecen y se desvanecen
  for(const p of e.pf){
   const a=p.l/p.m,r=p.r+p.gr*(1-a),g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
   g.addColorStop(0,`rgba(${p.c},${Math.min(1,a*1.6)*.55})`);g.addColorStop(1,`rgba(${p.c},0)`);
   cx.globalAlpha=1;cx.fillStyle=g;cx.beginPath();cx.arc(p.x,p.y,r,0,7);cx.fill();
  }

  if(!e.hitDone){
   const u=Math.min(1,t/.42),dx=e.tx-e.sx,dy=e.ty-e.sy,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,nx=-uy,ny=ux;
   cx.globalCompositeOperation='lighter';

   // Sombra incandescente en el suelo: avisa de dónde va a caer
   cx.save();cx.translate(e.tx,e.ty+10);cx.scale(1,.35);
   glow(0,0,s*(2+u*3),u*.7,'#f0abfc','rgba(147,51,234,0)');
   cx.restore();

   // Cola de fuego cónica en tres capas (plasma morado, fuego naranja, núcleo blanco)
   const tl=s*11*(1+.15*Math.sin(T*40+e.idx));
   for(const[k,rgb]of[[1,'168,85,247'],[.62,'251,146,60'],[.3,'255,247,205']]){
    const hw=s*1.3*k,bx=e.cx-ux*tl,by=e.cy-uy*tl,g=cx.createLinearGradient(e.cx,e.cy,bx,by);
    g.addColorStop(0,`rgba(${rgb},.9)`);g.addColorStop(1,`rgba(${rgb},0)`);
    cx.globalAlpha=1;cx.fillStyle=g;cx.beginPath();
    cx.moveTo(e.cx+nx*hw,e.cy+ny*hw);cx.lineTo(bx,by);cx.lineTo(e.cx-nx*hw,e.cy-ny*hw);cx.fill();
   }
   glow(e.cx,e.cy,s*3.2,1,'#fb923c','rgba(168,85,247,0)');

   // Roca: polígono irregular que gira, oscuro, con grietas al rojo vivo
   cx.globalCompositeOperation='source-over';cx.globalAlpha=1;
   cx.save();cx.translate(e.cx,e.cy);cx.rotate(e.rot0+e.spin*t);
   const n=e.shape.length,P=i=>[Math.cos(i*6.283/n)*s*e.shape[i%n],Math.sin(i*6.283/n)*s*e.shape[i%n]];
   const g=cx.createRadialGradient(-s*.3,-s*.3,1,0,0,s*1.2);
   g.addColorStop(0,'#7c5a6e');g.addColorStop(.6,'#3b2a3f');g.addColorStop(1,'#120a14');
   cx.fillStyle=g;cx.strokeStyle='#1a0f1c';cx.lineWidth=1.5;cx.beginPath();
   for(let i=0;i<n;i++){const[x,y]=P(i);i?cx.lineTo(x,y):cx.moveTo(x,y)}
   cx.closePath();cx.fill();cx.stroke();
   cx.globalCompositeOperation='lighter';cx.strokeStyle='#fdba74';cx.lineWidth=2;
   for(let i=0;i<n;i+=3){
    const[x,y]=P(i);
    cx.beginPath();cx.moveTo(x*.15,y*.15);cx.lineTo(x*.6+Math.sin(i)*3,y*.6+Math.cos(i)*3);cx.lineTo(x*.95,y*.95);cx.stroke();
   }
   cx.restore();

   // Frente al rojo blanco, donde la roca choca con el aire
   glow(e.cx+ux*s*.6,e.cy+uy*s*.6,s*1.6,.9,'#fff7cd','rgba(251,146,60,0)');
  }
  else{
   // Tras el impacto: cráter chamuscado con borde incandescente y bola de fuego
   const v=t-e.th,X=e.ix,Y=e.iy,fade=Math.max(0,1-v/1.1);
   if(fade>0){
    cx.save();cx.translate(X,Y+10);cx.scale(1,.35);
    const c=cx.createRadialGradient(0,0,1,0,0,s*2.4);
    c.addColorStop(0,'rgba(11,6,16,.9)');c.addColorStop(1,'rgba(11,6,16,0)');

        cx.strokeStyle = `rgba(255,255,255,${.55 * fade})`;
        cx.lineWidth = 2.5;
        cx.beginPath();
        cx.ellipse(-rx * .12, -ry * .05, rx * .82, ry * .86, 0, PI * 1.12, PI * 1.48);
        cx.stroke();

        // Segundo reflejo.
        cx.strokeStyle = `rgba(216,180,254,${.65 * fade})`;
        cx.lineWidth = 1.5;
        cx.beginPath();
        cx.ellipse(rx * .12, -ry * .04, rx * .82, ry * .86, 0, PI * 1.55, PI * 1.85);
        cx.stroke();

        // Brillos puntuales.
        glow(-rx * .55, -ry * .58, 5, [
            `rgba(255,255,255,${.75 * fade})`,
            'rgba(255,255,255,0)'
        ]);

        // ==================================================
        // 5. REACCIÓN AL GOLPE BLOQUEADO
        // ==================================================
        if (golpe > 0) {
            const hx = Math.cos(ang) * rx * .86;
            const hy = Math.min(-ry * .15, Math.sin(ang) * ry * .8 - ry * .35);

            // Destello localizado en el punto de impacto.
            glow(hx, hy, rx * .55, [
                `rgba(255,255,255,${.9 * golpe * fade})`,
                `rgba(232,121,249,${.65 * golpe * fade})`,
                'rgba(168,85,247,0)'
            ]);

            // Ondas de choque sobre el cristal.
            cx.globalCompositeOperation = 'lighter';
            cx.strokeStyle = `rgba(255,255,255,${.85 * golpe * fade})`;
            cx.lineWidth = 2.5 * golpe;
            cx.beginPath();
            cx.arc(hx, hy, 8 + golpe * 14, 0, 7);
            cx.stroke();

            cx.strokeStyle = `rgba(232,121,249,${.8 * golpe * fade})`;
            cx.lineWidth = 3 * golpe;
            cx.beginPath();
            cx.arc(hx, hy, 15 + golpe * 19, 0, 7);
            cx.stroke();

            cx.globalCompositeOperation = 'source-over';
        }

        // ==================================================
        // 6. EFECTO DE ENVENENAMIENTO
        // ==================================================
        if (tox > 0) {
            cx.globalCompositeOperation = 'lighter';

            // Pulso verde tóxico en la base.
            const pulse = 1 + Math.sin(T0 * 16) * .1;

            glow(0, 0, rx * .55 * pulse, [
                `rgba(190,242,100,${.55 * tox * fade})`,
                `rgba(132,204,22,${.3 * tox * fade})`,
                'rgba(132,204,22,0)'
            ]);

            // Anillo venenoso.
            cx.strokeStyle = `rgba(190,242,100,${tox * fade})`;
            cx.lineWidth = 3 * tox + 1;
            cx.beginPath();
            cx.ellipse(0, 0, rx * (1 + (1 - tox) * .65), ry * .2 * (1 + (1 - tox) * .65), 0, 0, 7);
            cx.stroke();

            cx.globalCompositeOperation = 'source-over';
        }

        // ==================================================
        // 7. BURBUJAS DE VENENO
        // ==================================================
        for (const b of e.orbs) {
            const bx = b.x + Math.sin(T0 * 2 + b.ph) * 5;
            const by = b.y;
            const r = b.s * (.85 + .15 * Math.sin(T0 * 5 + b.ph));
            const al = Math.max(0, 1 - Math.abs(by + 60) / 90) * fade;

            if (al <= 0) continue;

            // Contorno translúcido.
            cx.fillStyle = `rgba(147,51,234,${al * .3})`;
            cx.strokeStyle = `rgba(216,180,254,${al * .8})`;
            cx.lineWidth = 1.3;

            cx.beginPath();
            cx.arc(bx, by, r, 0, 7);
            cx.fill();
            cx.stroke();

            // Reflejo de la burbuja.
            glow(bx - r * .35, by - r * .35, r * .4, [
                `rgba(255,255,255,${al * .9})`,
                'rgba(255,255,255,0)'
            ]);
        }

        cx.restore();
    }
}

<script>
// Arquetipos del gacha: generan los 4 ataques de un Pokémon a partir de
// especie + arquetipo + ataques disponibles. Es código PURO (sin DOM ni PokéAPI).
//
// Entradas:
//   esp  = { tipos:['fire',...] (códigos del juego, los mismos que mv.t),
//            stats:{hp,atk,def,spa,spd,spe} }
//   movs = ataques ya convertidos con conv() (sin nulos): los que esa especie
//          puede usar en esa etapa (sugeridos/aprendibles del selector).
// El kit NO se guarda en la partida: se calcula con especie + etapa + arquetipo.

// Estilo de un ataque. Un custom puede forzarlo con est:'distancia' en su mv.
function estiloAtaque(mv){
  if(mv.est)return mv.est;
  if(mv.cat==='sta')return 'utilidad';
  if(mv.tk===1||mv.r<=100)return 'contacto';
  if(['storm','quake','wave'].includes(mv.sty))return 'area';
  return 'distancia';
}

const esDano=m=>m.cat!=='sta'&&m.p>0;
const FILTROS={
  phy:m=>m.cat==='phy',
  spe:m=>m.cat==='spe',
  contacto:m=>estiloAtaque(m)==='contacto',
  lejos:m=>['distancia','area'].includes(estiloAtaque(m)),
};
const cuenta=(movs,f)=>movs.filter(m=>esDano(m)&&f(m)).length;

// 'stab' = daño del tipo propio · 'cob' = cobertura (otro tipo) · 'util' = estado
const ARQUETIPOS={
  fisico:{nombre:'Físico',filtro:'phy',stat:'atk',
    huecos:['stab','stab','cob','util'],
    viable:(e,mv)=>e.stats.atk>=e.stats.spa*.75&&cuenta(mv,FILTROS.phy)>=3},
  especial:{nombre:'Especial',filtro:'spe',stat:'spa',
    huecos:['stab','stab','cob','util'],
    viable:(e,mv)=>e.stats.spa>=e.stats.atk*.75&&cuenta(mv,FILTROS.spe)>=3},
  artillero:{nombre:'Artillero',filtro:'lejos',stat:null,
    huecos:['stab','stab','cob','util'],
    viable:(e,mv)=>cuenta(mv,FILTROS.lejos)>=3},
  asaltante:{nombre:'Asaltante',filtro:'contacto',stat:'atk',
    huecos:['stab','stab','cob','util'],
    viable:(e,mv)=>e.stats.atk>=e.stats.spa*.75&&cuenta(mv,FILTROS.contacto)>=3},
};

// Tabla de tipos (solo lo necesario para elegir cobertura). Códigos = los de mv.t.
const ESTIPOS={ // a qué tipos golpea con ventaja (x2)
  fire:['leaf','ice','bug','steel'],water:['fire','ground','rock'],elec:['water','flying'],
  leaf:['water','ground','rock'],ice:['leaf','ground','flying','dragon'],
  fighting:['normal','ice','rock','dark','steel'],poison:['leaf','fairy'],
  ground:['fire','elec','poison','rock','steel'],flying:['leaf','fighting','bug'],
  psychic:['fighting','poison'],bug:['leaf','psychic','dark'],rock:['fire','ice','flying','bug'],
  ghost:['psychic','ghost'],dragon:['dragon'],dark:['psychic','ghost'],
  steel:['ice','rock','fairy'],fairy:['fighting','dragon','dark'],normal:[]};
const EPOCO={ // a qué tipos les hace poco o nada
  normal:['rock','steel','ghost'],fire:['fire','water','rock','dragon'],water:['water','leaf','dragon'],
  elec:['elec','leaf','dragon','ground'],leaf:['fire','leaf','poison','flying','bug','dragon','steel'],
  ice:['fire','water','ice','steel'],fighting:['poison','flying','psychic','bug','fairy','ghost'],
  poison:['poison','ground','rock','ghost','steel'],ground:['leaf','bug','flying'],
  flying:['elec','rock','steel'],psychic:['psychic','steel','dark'],
  bug:['fire','fighting','poison','flying','ghost','steel','fairy'],rock:['fighting','ground','steel'],
  ghost:['dark','normal'],dragon:['steel','fairy'],dark:['fighting','dark','fairy'],
  steel:['fire','water','elec','steel'],fairy:['fire','poison','steel']};
// Cuánto mejora la cobertura un ataque de tipo t respecto a los tipos ya cubiertos.
function factorCob(t,cubiertos){
  const ya=new Set();for(const c of cubiertos)for(const d of ESTIPOS[c]||[])ya.add(d);
  const nuevos=(ESTIPOS[t]||[]).filter(d=>!ya.has(d)).length,malos=(EPOCO[t]||[]).length;
  return Math.max(.3,1+.25*(nuevos-.35*malos));
}

// Daño aproximado por segundo: potencia, precisión, enfriamiento, STAB y la
// estadística de ataque de la especie para esa categoría (atk si físico, spa si especial).
const puntos=(m,e)=>(m.p*(m.acc||100)/100)/m.cd*(e.tipos.includes(m.t)?1.5:1)
  *Math.max(20,m.cat==='phy'?e.stats.atk:e.stats.spa)/100;

function arquetiposViables(esp,movs){
  return Object.keys(ARQUETIPOS).filter(k=>ARQUETIPOS[k].viable(esp,movs));
}

// Solo los arquetipos viables cuyo kit se diferencia de los ya aceptados
// (parecido < umbral, 0 = nada en común, 1 = idénticos). Evita ofrecer dos cartas casi iguales.
function arquetiposDistintos(esp,movs,umbral=.5){
  const ok=[],ks=[];
  for(const a of arquetiposViables(esp,movs)){
    const k=new Set(generarKit(esp,a,movs).map(m=>m.key));
    const repetido=ks.some(o=>[...k].filter(x=>o.has(x)).length/new Set([...k,...o]).size>=umbral);
    if(!repetido){ok.push(a);ks.push(k)}
  }
  return ok;
}

function generarKit(esp,arq,movs){
  const A=ARQUETIPOS[arq];if(!A)return [];
  const dano=movs.filter(esDano),usados=new Set(),tipos=new Set(),kit=[];
  let ult=false;
  const stat=A.stat||(esp.stats.atk>=esp.stats.spa?'atk':'spa');
  const libre=m=>!usados.has(m.key)&&!(m.u&&ult);
  const tomar=m=>{usados.add(m.key);tipos.add(m.t);if(m.u)ult=true;return m};

  function elegirDano(hueco){
    const f=FILTROS[A.filtro];
    // intentos de más a menos estricto; el último acepta cualquier ataque de daño
    const intentos=[[f,hueco],[f,'libre'],[()=>true,'libre']];
    for(const[fil,modo]of intentos){
      let c=dano.filter(m=>libre(m)&&fil(m));
      if(modo==='stab'){
        const s=c.filter(m=>esp.tipos.includes(m.t));
        if(s.length){const n=s.filter(m=>!tipos.has(m.t));c=n.length?n:s}else continue;
      }else if(modo==='cob'){
        const s=c.filter(m=>!tipos.has(m.t)&&!esp.tipos.includes(m.t));
        if(s.length)c=s;
      }
      if(c.length){
        const cub=[...esp.tipos,...tipos],val=m=>puntos(m,esp)*(modo==='cob'?factorCob(m.t,cub):1);
        return tomar(c.sort((a,b)=>val(b)-val(a))[0]);
      }
    }
    return null;
  }
  function elegirUtil(){
    const val=m=>{const e=m.ef||{};
      if(e.s)return e.s[stat]>0?3:e.s.spe>0?2:1;
      if(e.o)return 1.2;
      if(e.h)return .8;return 0};
    const c=movs.filter(m=>m.cat==='sta'&&!usados.has(m.key)&&val(m)>0)
      .sort((a,b)=>val(b)-val(a));
    return c.length?tomar(c[0]):null;
  }
  for(const h of A.huecos){
    const m=h==='util'?(elegirUtil()||elegirDano('cob')):elegirDano(h);
    if(m)kit.push(m);
  }
  return kit;
}

// MTs: sustituyen un hueco del kit. mts=[{slot:3,mv:<ataque ya convertido>}]
function aplicarMT(kit,mts=[]){
  const k=kit.slice();
  for(const t of mts)if(t.slot>=0&&t.slot<k.length)k[t.slot]=t.mv;
  return k;
}

// Cuenta qué ataques salen más en los kits de todas las especies y arquetipos
// viables. Esa lista es el orden recomendado para hacer ataques custom.
// lista = [{esp, movs}, ...]
function contarUsoAtaques(lista){
  const c={};
  for(const{esp,movs}of lista)
    for(const a of arquetiposViables(esp,movs))
      for(const m of generarKit(esp,a,movs))c[m.key]=(c[m.key]||0)+1;
  return Object.entries(c).sort((a,b)=>b[1]-a[1]);
}

if(typeof module!=='undefined')module.exports={estiloAtaque,ARQUETIPOS,arquetiposViables,arquetiposDistintos,generarKit,aplicarMT,contarUsoAtaques};
</script>
<script>
// HERRAMIENTA TEMPORAL (se puede borrar cuando ya no haga falta).
// Carga las especies de la PokéAPI, genera los kits de todos los arquetipos viables
// y muestra: ranking de ataques más usados (orden para hacer customs),
// cuántas especies admiten cada arquetipo y cuánto se solapan entre sí.
// Añade un botón flotante "🧮 Kits". Necesita: pokeapi.js, conversor.js y arquetipos.js.
(function(){
const AQ=typeof module!=='undefined'?require('./arquetipos.js'):{arquetiposViables,arquetiposDistintos,generarKit,estiloAtaque,ARQUETIPOS};

// ---------- Análisis (puro, sin DOM ni red) ----------
// lista = [{esp:{tipos,stats,...}, movs:[ataques convertidos]}]
function analizarKits(lista){
  const uso={},mvs={},viab={},sol={},dist={};let kits=0,cortos=0,sinUtil=0;
  for(const{esp,movs}of lista){
    const via=AQ.arquetiposViables(esp,movs),ks={};
    for(const a of AQ.arquetiposDistintos(esp,movs))dist[a]=(dist[a]||0)+1;
    for(const a of via){
      const k=AQ.generarKit(esp,a,movs);ks[a]=new Set(k.map(m=>m.key));
      viab[a]=(viab[a]||0)+1;kits++;
      if(k.length<4)cortos++;
      if(!k.some(m=>m.cat==='sta'))sinUtil++;
      for(const m of k){uso[m.key]=(uso[m.key]||0)+1;mvs[m.key]=m}
    }
    for(let i=0;i<via.length;i++)for(let j=i+1;j<via.length;j++){
      const A=ks[via[i]],B=ks[via[j]],inter=[...A].filter(x=>B.has(x)).length,uni=new Set([...A,...B]).size;
      const id=via[i]+'/'+via[j];(sol[id]=sol[id]||{s:0,n:0});sol[id].s+=inter/uni;sol[id].n++;
    }
  }
  const ranking=Object.entries(uso).sort((a,b)=>b[1]-a[1]).map(([key,n])=>({key,n,mv:mvs[key]}));
  const solape=Object.entries(sol).map(([id,o])=>({id,media:o.s/o.n,n:o.n}));
  return{especies:lista.length,kits,cortos,sinUtil,viables:viab,distintos:dist,ranking,solape};
}

if(typeof module!=='undefined'){module.exports={analizarKits};return}

// ---------- Carga desde la PokéAPI ----------
const KC='kits-especies-v1';let cache={};try{cache=JSON.parse(localStorage.getItem(KC)||'{}')}catch(e){}
async function cargarEsp(id){
  if(cache[id])return cache[id];
  const p=await jf(API+'pokemon/'+id),sm={};p.stats.forEach(x=>sm[x.stat.name]=x.base_stat);
  return cache[id]={id,n:p.name,tipos:p.types.map(x=>TN[x.type.name]||'normal'),
    stats:{hp:sm.hp,atk:sm.attack,def:sm.defense,spa:sm['special-attack'],spd:sm['special-defense'],spe:sm.speed},
    moves:p.moves.map(m=>m.move.name)};
}
async function lotes(items,fn,tam,prog){
  const out=[];
  for(let i=0;i<items.length;i+=tam){
    out.push(...await Promise.all(items.slice(i,i+tam).map(x=>fn(x).catch(()=>null))));
    prog(Math.min(items.length,i+tam),items.length);
  }
  return out;
}
async function ejecutar(a,b,prog){
  const ids=[];for(let i=a;i<=b;i++)ids.push(i);
  prog('Cargando especies…');
  const esps=(await lotes(ids,cargarEsp,9,(d,t)=>prog(`Especies ${d}/${t}`))).filter(Boolean);
  try{localStorage.setItem(KC,JSON.stringify(cache))}catch(e){}
  const nombres=[...new Set(esps.flatMap(e=>e.moves))],mv={};
  const r=await lotes(nombres,n=>mvData({n,u:API+'move/'+n+'/'}),9,(d,t)=>prog(`Ataques ${d}/${t}`));
  nombres.forEach((n,i)=>{if(r[i])mv[n]=r[i]});
  return analizarKits(esps.map(e=>({esp:e,movs:e.moves.map(n=>mv[n]).filter(Boolean)})));
}

// ---------- Pantalla ----------
const $$=(t,css,html)=>{const e=document.createElement(t);if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;return e};
function abrir(){
  const ov=$$('div','position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.75);overflow:auto;padding:12px;font:13px system-ui,sans-serif;color:#e2e8f0');

  const sel=$$('select','',GEN.map((g,i)=>`<option value="${i}">Gen ${i+1} (${g[0]}-${g[1]})</option>`).join('')+'<option value="all">Todas (lento)</option>');

<script>
// Rareza de cada especie según su línea evolutiva (N < R < SR < SSR < UR < LR).
// Regla: la ETAPA FINAL de cada línea marca el techo (por estadísticas base, o LR si es
// legendario/mítico) y cada etapa anterior baja un escalón por paso, como el "awaken" de Dokkan.
// Código PURO (sin red ni DOM). La rareza se calcula, no se guarda en la partida.
//
// cadenas = [{id, hijos:[{id, hijos:[...]}]}]   (árbol de cada línea evolutiva)
// info    = { [id]: {bst:<suma de estadísticas base>, legendario:<true/false>} }

const RAREZAS=['N','R','SR','SSR','UR','LR'];
const RAREZA_CFG={
  // bst de la etapa final: <cortes[0] → R · <cortes[1] → SR · <cortes[2] → SSR · resto → UR
  cortes:[475,500,580],
  // Legendarios y míticos: LR si su bst es ≥ este valor; si no, UR (0 = todos LR).
  legendarioLR:600,
  // Excepciones a mano sobre la ETAPA FINAL: {id: 'SR'}  (p. ej. subir un Pokémon popular)
  excepciones:{},
};

function rarezaFinalIdx(f,cfg=RAREZA_CFG){
  const ex=cfg.excepciones[f.id];
  if(ex!=null)return typeof ex==='number'?ex:RAREZAS.indexOf(ex);
  if(f.legendario)return cfg.legendarioLR&&(f.bst||0)<cfg.legendarioLR?4:5;
  return 1+cfg.cortes.filter(c=>(f.bst||0)>=c).length;
}

// Devuelve {[id]: {rareza, idx, etapa, final, techo}}
//   etapa = posición en la línea (1 = primera) · final = id de la evolución final hacia la que apunta
//   techo = índice de rareza de esa final.
// Si hay ramas (Eevee), cada especie apunta a su mejor final (la de más rareza; a igualdad, la más cercana).
function construirRarezas(cadenas,info,cfg=RAREZA_CFG){
  const out={};
  const rec=(n,etapa)=>{
    let mejor=null;const hs=n.hijos||[];
    if(!hs.length)mejor={idx:rarezaFinalIdx({id:n.id,...(info[n.id]||{})},cfg),pasos:0,final:n.id};
    for(const h of hs){
      const r=rec(h,etapa+1),c={idx:r.idx,pasos:r.pasos+1,final:r.final};
      if(!mejor||c.idx>mejor.idx||(c.idx===mejor.idx&&c.pasos<mejor.pasos))mejor=c;
    }
    const idx=Math.max(0,mejor.idx-mejor.pasos);
    out[n.id]={rareza:RAREZAS[idx],idx,etapa,final:mejor.final,techo:mejor.idx};
    return mejor;
  };
  for(const c of cadenas)rec(c,1);
  return out;
}

// Cuántas especies hay por rareza: en todas las etapas y solo en la primera (las que salen en tiradas).
function resumenRarezas(r){
  const t=RAREZAS.map(()=>0),p=RAREZAS.map(()=>0);
  for(const o of Object.values(r)){t[o.idx]++;if(o.etapa===1)p[o.idx]++}
  return RAREZAS.map((n,i)=>({rareza:n,todas:t[i],primeraEtapa:p[i]}));
}

if(typeof module!=='undefined')module.exports={RAREZAS,RAREZA_CFG,rarezaFinalIdx,construirRarezas,resumenRarezas};
</script>
<script>
// HERRAMIENTA TEMPORAL (se puede borrar cuando ya no haga falta).
// Descarga las líneas evolutivas de la PokéAPI y calcula la rareza de todas las especies
// con los cortes que tú pongas. Añade un botón flotante "🎚 Rareza".
// Necesita: pokeapi.js y rareza.js. Los datos se guardan en caché local (la 1ª vez tarda).
(function(){
const RK='rareza-datos-v1',KC='kits-especies-v1',MAX=GEN[GEN.length-1][1];
let RC={};try{RC=JSON.parse(localStorage.getItem(RK)||'{}')}catch(e){}
RC.sp=RC.sp||{};RC.ch=RC.ch||{};RC.bst=RC.bst||{};
let kits={};try{kits=JSON.parse(localStorage.getItem(KC)||'{}')}catch(e){}   // reutiliza lo que bajó la herramienta de kits
const idDe=u=>+u.split('/').filter(Boolean).pop();
const nom=id=>{const n=(RC.sp[id]||[])[2];return n?n.replace(/-/g,' ').replace(/^./,c=>c.toUpperCase()):'#'+id};

async function cargarSp(id){
  if(RC.sp[id])return;
  const s=await jf(API+'pokemon-species/'+id+'/');
  RC.sp[id]=[(s.is_legendary||s.is_mythical)?1:0,idDe(s.evolution_chain.url),s.name];
}
async function cargarCh(cid){
  if(RC.ch[cid])return;
  const c=await jf(API+'evolution-chain/'+cid+'/');
  const conv=n=>({id:idDe(n.species.url),hijos:n.evolves_to.map(conv)});
  RC.ch[cid]=conv(c.chain);
}
async function cargarBst(id){
  if(RC.bst[id])return;
  if(kits[id]){RC.bst[id]=Object.values(kits[id].stats).reduce((a,b)=>a+b,0);return}
  const p=await jf(API+'pokemon/'+id);RC.bst[id]=p.stats.reduce((a,x)=>a+x.base_stat,0);
}
async function lotes(items,fn,prog,txt){
  for(let i=0;i<items.length;i+=9){
    await Promise.all(items.slice(i,i+9).map(x=>fn(x).catch(()=>null)));
    prog(`${txt} ${Math.min(items.length,i+9)}/${items.length}`);
  }
}
async function cargarTodo(prog){
  const ids=Array.from({length:MAX},(_,i)=>i+1);
  await lotes(ids,cargarSp,prog,'Especies');
  const cids=[...new Set(ids.map(i=>RC.sp[i]&&RC.sp[i][1]).filter(Boolean))];
  await lotes(cids,cargarCh,prog,'Líneas evolutivas');
  await lotes(ids,cargarBst,prog,'Estadísticas');
  try{localStorage.setItem(RK,JSON.stringify(RC))}catch(e){}
}
function calcular(cortes,leg){
  const info={};for(const id in RC.sp)info[id]={bst:RC.bst[id]||0,legendario:!!RC.sp[id][0]};
  const cfg={...RAREZA_CFG,cortes,legendarioLR:leg};
  return construirRarezas(Object.values(RC.ch),info,cfg);
}

  const go=$$('button','margin-right:6px','▶ Cargar y calcular'),x=$$('button','float:right','✕'),st=$$('div','margin:8px 0;min-height:18px'),out=$$('div');

  const tb='width:100%;border-collapse:collapse;margin:6px 0 14px',tr=c=>`<tr>${c.map(v=>`<td style="padding:3px 6px;border-bottom:1px solid #1e293b;vertical-align:top">${v}</td>`).join('')}</tr>`;

<script>
// Lógica de banners del gacha (código PURO: sin red ni DOM).
// Una "carta" = especie en primera etapa + arquetipo + rareza (la rareza se calcula con rarezaDe(id)).
//
// Banner inicial (tipo 'tutorial'): gratis, de un solo uso, 10 cartas = 1 inicial garantizado + 9 de relleno,
// con reroll ilimitado: nada se guarda hasta que el jugador se queda con una tirada.
//   { id, nombre, tipo:'tutorial', gratis:true, unSoloUso:true, tiradas:10, reroll:true,
//     garantizado:{cantidad:1, pool:[{id, arqs:[...]}]},
//     relleno:{cantidad:9, sinRepetir:true, prob:{N,R,SR,SSR}, pool:[{id, arqs:[...]}]} }
// 'arqs' = arquetipos distintos de esa especie; al tirar se elige uno al azar.

// 3 iniciales por generación (sin Pikachu ni Eevee de Let's Go)
const INICIALES_IDS=[1,4,7,152,155,158,252,255,258,387,390,393,495,498,501,650,653,656,722,725,728,810,813,816,906,909,912];

// Especies que NO entran en el relleno del banner inicial (para que el primer banner sea "amable"):
// Ultraentes (Alola) y Paradoja (Paldea). Se pueden reservar para banners especiales.
const EXCLUIDOS_DEL_INICIAL=[793,794,795,796,797,798,799,803,804,805,806,
  984,985,986,987,988,989,990,991,992,993,994,995,1005,1006,1009,1010,1020,1021,1022,1023];

// Generador de números aleatorios con semilla (para sortear pools reproducibles).
function crearRng(seed){
  let a=seed>>>0;
  return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296};
}

// Elige las especies de relleno de un banner respetando cuotas por rareza y buscando variedad:
// premia los tipos que aún no han salido y penaliza repetir un tipo o la misma combinación de tipos.
// cands=[{id,rareza,tipos:[]}], cuotas={N:10,R:9,...}
function sortearRelleno(cands,cuotas,rng){
  const out=[],cuenta={},combos=new Set();
  for(const[r,n]of Object.entries(cuotas)){
    const libres=cands.filter(c=>c.rareza===r);
    for(let i=0;i<n&&libres.length;i++){
      const w=libres.map(c=>{
        const nuevos=c.tipos.filter(t=>!cuenta[t]).length,rep=Math.max(...c.tipos.map(t=>cuenta[t]||0));
        return(1+3*nuevos)/(1+rep)*(combos.has(c.tipos.slice().sort().join('/'))?.1:1);
      });
      let q=rng()*w.reduce((a,b)=>a+b,0),k=0;
      while(k<libres.length-1&&(q-=w[k])>0)k++;
      const c=libres.splice(k,1)[0];
      c.tipos.forEach(t=>cuenta[t]=(cuenta[t]||0)+1);combos.add(c.tipos.slice().sort().join('/'));out.push(c.id);
    }
  }
  return out;
}

function crearBannerInicial(iniciales,relleno,prob={N:40,R:38,SR:17,SSR:5}){
  return{id:'inicial',nombre:'Banner inicial',tipo:'tutorial',gratis:true,unSoloUso:true,tiradas:10,reroll:true,
    garantizado:{cantidad:1,pool:iniciales},
    relleno:{cantidad:9,sinRepetir:true,prob,pool:relleno}};
}

// Una tirada del banner inicial. rarezaDe(id) → 'N'|'R'|... · rng por defecto: Math.random.
// Devuelve [{especieId, arquetipo, rareza}] con el inicial garantizado primero.
function tiradaInicial(b,rarezaDe,rng=Math.random){
  const cartas=[],usados=new Set();
  const pick=a=>a[Math.floor(rng()*a.length)];
  const carta=e=>({especieId:e.id,arquetipo:pick(e.arqs),rareza:rarezaDe(e.id)});
  for(let i=0;i<b.garantizado.cantidad;i++){
    const libres=b.garantizado.pool.filter(e=>!usados.has(e.id));
    if(!libres.length)break;
    const e=pick(libres);usados.add(e.id);cartas.push(carta(e));
  }
  for(let i=0;i<b.relleno.cantidad;i++){
    const libres=b.relleno.pool.filter(e=>!usados.has(e.id));
    // solo cuentan las rarezas que aún tienen especies libres (la probabilidad de las vacías se reparte)
    const tiers=Object.entries(b.relleno.prob).filter(([r])=>libres.some(e=>rarezaDe(e.id)===r));
    if(!tiers.length)break;
    let q=rng()*tiers.reduce((a,[,p])=>a+p,0),k=0;
    while(k<tiers.length-1&&(q-=tiers[k][1])>0)k++;
    const e=pick(libres.filter(e=>rarezaDe(e.id)===tiers[k][0]));usados.add(e.id);cartas.push(carta(e));
  }
  return cartas;
}

if(typeof module!=='undefined')module.exports={INICIALES_IDS,EXCLUIDOS_DEL_INICIAL,crearRng,sortearRelleno,crearBannerInicial,tiradaInicial};
</script>
<script>
// Motor de tirada de los banners NORMALES (de las celebraciones). Código PURO: sin red ni DOM.
// A diferencia del banner inicial, aquí se puede repetir carta (las copias se fusionan) y hay destacados y pity.
//   banner = { id, nombre, tipo:'normal', precio:{una,multi}, prob:{N,R,SR,SSR,UR,LR}, rateUp, pity,
//              destacados:[{id,arq}], pool:[{id,arq}] }      (arq = arquetipo FIJO de esa carta en este banner)
//  · prob = peso de cada rareza; las rarezas que no existen en el banner se quitan y el resto se reparte.
//  · rateUp = probabilidad de que, DENTRO de la rareza de un destacado, salga el destacado (0.5 = la mitad).
//  · pity = nº de tiradas sin destacado a partir de las cuales la siguiente es un destacado seguro (se reinicia al salir uno).
// Estado del pity: partida.pity[banner.id] = tiradas seguidas sin destacado.
const BannersNormales=(()=>{
  const RAREZAS=['N','R','SR','SSR','UR','LR'];
  const PROB={N:15,R:40,SR:30,SSR:10,UR:4,LR:1};
  const RATE_UP=.5;
  const tramos=(b,rz)=>{   // rarezas presentes con su peso y sus especies (normales y destacadas)
    const prob=b.prob||PROB,pool=b.pool||[],des=b.destacados||[];
    return RAREZAS.filter(r=>prob[r]>0).map(r=>({r,w:prob[r],ps:pool.filter(e=>rz(e.id)===r),ds:des.filter(e=>rz(e.id)===r)}))
      .filter(t=>t.ps.length||t.ds.length);
  };
  // Una tirada. pity = tiradas seguidas sin destacado hasta ahora. Devuelve {carta:{especieId,arquetipo,rareza,destacado}, pity, porPity}
  function tirada(b,rz,pity=0,rng=Math.random){
    const pick=a=>a[Math.floor(rng()*a.length)],des=b.destacados||[],n=pity+1;
    let e,dest=false,porPity=false;
    if(b.pity&&des.length&&n>=b.pity){e=pick(des);dest=true;porPity=true}
    else{
      const t=tramos(b,rz);if(!t.length)throw new Error('Banner sin cartas');
      let q=rng()*t.reduce((s,x)=>s+x.w,0),k=0;
      while(k<t.length-1&&(q-=t[k].w)>0)k++;
      const x=t[k],ru=b.rateUp??RATE_UP;
      if(x.ds.length&&(!x.ps.length||rng()<ru)){e=pick(x.ds);dest=true}else e=pick(x.ps);
    }
    return{carta:{especieId:e.id,arquetipo:e.arq,rareza:rz(e.id),destacado:dest},pity:dest?0:n,porPity};
  }
  // Varias tiradas seguidas (el pity avanza en cada una). Devuelve {cartas:[{carta,porPity}], pity}
  function tiradas(b,rz,pity,veces,rng=Math.random){
    const cartas=[];
    for(let i=0;i<veces;i++){const t=tirada(b,rz,pity,rng);pity=t.pity;cartas.push({...t.carta,porPity:t.porPity})}
    return{cartas,pity};
  }
  // Probabilidades que se enseñan al jugador (sin contar el pity): % por rareza y % de destacado en una tirada.
  function probabilidades(b,rz){
    const t=tramos(b,rz),tot=t.reduce((s,x)=>s+x.w,0),ru=b.rateUp??RATE_UP;let dest=0;const por={};
    for(const x of t){
      const p=x.w/tot*100;por[x.r]=p;
      if(x.ds.length)dest+=x.ps.length?p*ru:p;
    }
    return{porRareza:por,destacado:dest};
  }
  return{RAREZAS,PROB,tirada,tiradas,probabilidades};
})();
if(typeof module!=='undefined')module.exports=BannersNormales;
</script>
<script>
// Celebraciones del gacha (código PURO: sin red ni DOM). Una celebración es un paquete temporal: banners propios,
// regalo de entrada y (más adelante) eventos, misiones y login propios. Al acabar, sus banners dejan de estar disponibles.
//   { id, nombre, desc, tipo:'relativa', dias, ... }       → empieza cuando el jugador la ve por primera vez y dura `dias` días (p. ej. bienvenida)
//   { id, nombre, desc, tipo:'fechas', inicio, fin, ... }  → fechas reales 'AAAA-MM-DD' (ambas incluidas), iguales para todos
//   resto: regalo:{objeto:n} (se da una vez al empezar) · banners:[banner normal, ver banners-normales.js]
// Se guarda en la partida: partida.celebraciones = { id: {inicio, regalo:true} }.
// Las fechas son locales (las del dispositivo); `hoy` se pasa de fuera para poder probar con una fecha de prueba.
const Celebraciones=(()=>{
  const aFecha=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
  const aTexto=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const sumar=(s,n)=>{const d=aFecha(s);d.setDate(d.getDate()+n);return aTexto(d)};
  const dias=(a,b)=>Math.round((aFecha(b)-aFecha(a))/86400000);   // días de a hasta b

  // Estado de una celebración ese día: {fase:'proxima'|'activa'|'terminada', inicio, fin, quedan (activa: incluido hoy), empieza (próxima: días que faltan)}
  function estado(c,p,hoy){
    let inicio,fin;
    if(c.tipo==='relativa'){
      const r=p.celebraciones&&p.celebraciones[c.id];
      inicio=r?r.inicio:hoy;fin=sumar(inicio,c.dias-1);          // aún sin empezar: empezaría hoy
    }else{inicio=c.inicio;fin=c.fin}
    if(hoy<inicio)return{fase:'proxima',inicio,fin,empieza:dias(hoy,inicio)};
    if(hoy>fin)return{fase:'terminada',inicio,fin};
    return{fase:'activa',inicio,fin,quedan:dias(hoy,fin)+1};
  }
  const activas=(lista,p,hoy)=>lista.filter(c=>estado(c,p,hoy).fase==='activa');
  const proximas=(lista,p,hoy)=>lista.filter(c=>estado(c,p,hoy).fase==='proxima').sort((a,b)=>estado(a,p,hoy).empieza-estado(b,p,hoy).empieza);

  // Al abrir el gacha: apunta el inicio de las relativas, y da el regalo de cada celebración activa (una sola vez).
  // Devuelve {cambio, mensajes:[{celebracion, premio}]}
  function entrar(lista,p,hoy){
    const reg=p.celebraciones||(p.celebraciones={});let cambio=false;const mensajes=[];
    for(const c of lista){
      if(c.tipo==='relativa'&&!reg[c.id]){reg[c.id]={inicio:hoy};cambio=true}
      if(estado(c,p,hoy).fase!=='activa')continue;
      const r=reg[c.id]||(reg[c.id]={inicio:hoy});
      if(c.regalo&&!r.regalo){
        p.objetos=p.objetos||{};for(const[k,n]of Object.entries(c.regalo))p.objetos[k]=(p.objetos[k]||0)+n;
        r.regalo=true;cambio=true;mensajes.push({celebracion:c,premio:c.regalo});
      }
    }
    return{cambio,mensajes};
  }
  return{estado,activas,proximas,entrar,sumar,dias};
})();
if(typeof module!=='undefined')module.exports=Celebraciones;
</script>
<script>
// Experiencia del gacha (código PURO: sin red ni DOM). Las 6 curvas de los juegos de Pokémon.
// El grupo de cada especie viene de la PokéAPI (experiencia-datos.js → GRUPO_EXP[id]).
//   r Rápido · m Medio · p Parabólico · l Lento · e Errático · f Fluctuante
// xp de una carta = XP TOTAL acumulada; su nivel sale de esa XP con la curva de su especie. Sin tope por carta: el máximo es el 100.
const Experiencia=(()=>{
  const NIVEL_MAX=100;
  const GRUPOS={r:'Rápido',m:'Medio',p:'Parabólico',l:'Lento',e:'Errático',f:'Fluctuante'};
  // XP total necesaria para llegar al nivel n (fórmulas de los juegos)
  const F={
    r:n=>4*n**3/5,
    m:n=>n**3,
    p:n=>6*n**3/5-15*n**2+100*n-140,
    l:n=>5*n**3/4,
    e:n=>n<50?n**3*(100-n)/50:n<68?n**3*(150-n)/100:n<98?n**3*Math.floor((1911-10*n)/3)/500:n**3*(160-n)/100,
    f:n=>n<15?n**3*(Math.floor((n+1)/3)+24)/50:n<36?n**3*(n+14)/50:n**3*(Math.floor(n/2)+32)/50,
  };
  const xpTotal=(g,n)=>n<=1?0:Math.max(0,Math.floor((F[g]||F.m)(Math.min(n,NIVEL_MAX))));
  function nivelPorXp(g,xp){let n=1;while(n<NIVEL_MAX&&xpTotal(g,n+1)<=xp)n++;return n}
  // Caramelos: XP fija por unidad (valores de ejemplo, a probar)
  const XP_CARAMELO={'caramelo-s':100,'caramelo-m':500,'caramelo-l':2000,'caramelo-xl':10000};

  // Plan automático de caramelos para llegar a un nivel. inv = {clave: cantidad que tiene el jugador}.
  // Criterio: 1º gastar la mínima XP posible (la XP de más no se pierde, pero se queda en esa carta y se la quitas a las demás);
  // 2º, a igualdad, el menor número de caramelos. Mochila exacta, así que sirve con cualquier valor de XP por caramelo.
  // Devuelve {ok, usar:{clave:n}, xp (total que da), sobrante (XP por encima de lo necesario), n (caramelos)}; ok=false si no alcanza.
  const mcd=(a,b)=>b?mcd(b,a%b):a;
  function planCaramelos(g,xp,objetivo,inv){
    const falta=xpTotal(g,Math.min(objetivo,NIVEL_MAX))-xp;
    if(falta<=0)return{ok:true,usar:{},xp:0,sobrante:0,n:0};
    const tipos=Object.keys(XP_CARAMELO).filter(k=>(inv[k]||0)>0);
    if(!tipos.length)return{ok:false,usar:{},xp:0,sobrante:0,n:0};

    const items=[];   // lotes de 1,2,4,8... caramelos de cada tipo (mochila acotada)
    for(const k of tipos){let resto=inv[k],p=1;while(resto>0){const c=Math.min(p,resto);items.push({k,c,v:c*XP_CARAMELO[k]/u});resto-=c;p*=2}}
    let dp=new Array(limite+1).fill(Infinity);dp[0]=0;
    const toma=[];
    for(const it of items){
      const nd=dp.slice(),tk=new Uint8Array(limite+1);

      dp=nd;toma.push(tk);
    }
    let t=need;while(t<=limite&&dp[t]===Infinity)t++;
    if(t>limite)return{ok:false,usar:{},xp:0,sobrante:0,n:0};
    const total=t*u,usar={};let n=0;
    for(let i=items.length-1;i>=0;i--)if(toma[i][t]){usar[items[i].k]=(usar[items[i].k]||0)+items[i].c;n+=items[i].c;t-=items[i].v}
    return{ok:true,usar,xp:total,sobrante:total-falta,n};

<script>
// Fusión de repetidos del gacha (código PURO: sin red ni DOM).
// Una carta (la BASE) absorbe a otra (el MATERIAL), que desaparece, y la base gana estrellas. Reglas:
//  · el material debe ser de la misma especie que la base o de una etapa ANTERIOR de su camino evolutivo
//    (Eevee sirve para cualquier eeveelución; Vaporeon no sirve para Flareon; Charmander sirve para Charmeleon);
//  · mismo arquetipo y carta no bloqueada;
//  · si en esa línea el sexo decide una evolución (Kirlia→Gallade, Salandit→Salazzle...), mismo sexo: una copia que
//    nunca podría llegar a esa especie no cuenta; en el resto de líneas el sexo no importa.
// Estrellas: una carta de N estrellas equivale a N+1 copias, así que base + material = base + material + 1 (máx. 5).
// EV = EVOLUCIONES (evoluciones-datos.js): { idOrigen:[{a, g?, ...}] }.
const Fusion=(()=>{
  const MAX_ESTRELLAS=5,memo=new WeakMap();
  function indice(EV){
    if(memo.has(EV))return memo.get(EV);
    const ix={padres:{},hijos:{},anc:{},raiz:{},genero:{}};
    for(const de in EV)for(const e of EV[de]){(ix.padres[e.a]=ix.padres[e.a]||[]).push(+de);(ix.hijos[de]=ix.hijos[de]||[]).push(e)}
    memo.set(EV,ix);return ix;
  }
  function ancestros(id,EV){   // la propia especie y todas sus etapas anteriores
    const ix=indice(EV);if(ix.anc[id])return ix.anc[id];
    const s=new Set([id]),pila=[id];
    while(pila.length)for(const p of ix.padres[pila.pop()]||[])if(!s.has(p)){s.add(p);pila.push(p)}
    return ix.anc[id]=s;
  }
  function raiz(id,EV){   // primera etapa de la línea
    const ix=indice(EV);if(ix.raiz[id]!==undefined)return ix.raiz[id];
    let r=id,n=0;while((ix.padres[r]||[]).length&&n++<10)r=ix.padres[r][0];
    return ix.raiz[id]=r;
  }
  function generoDecide(id,EV){   // ¿alguna evolución de la línea exige un género?
    const ix=indice(EV),r=raiz(id,EV);if(ix.genero[r]!==undefined)return ix.genero[r];
    const vis=new Set([r]),pila=[r];let si=false;
    while(pila.length)for(const e of ix.hijos[pila.pop()]||[]){if(e.g)si=true;if(!vis.has(e.a)){vis.add(e.a);pila.push(e.a)}}
    return ix.genero[r]=si;
  }
  const mismaLinea=(a,b,EV)=>raiz(a.especieId,EV)===raiz(b.especieId,EV);
  function puedeFusionar(base,mat,EV){
    if(mat.id===base.id)return{ok:false,motivo:'Es la misma carta'};
    if(mat.bloqueado)return{ok:false,motivo:'Está bloqueada'};
    if(!mismaLinea(base,mat,EV))return{ok:false,motivo:'Es de otra línea evolutiva'};
    if(!ancestros(base.especieId,EV).has(mat.especieId))return{ok:false,motivo:'No es una etapa anterior de esta evolución'};
    if(mat.arquetipo!==base.arquetipo)return{ok:false,motivo:'Distinto arquetipo'};
    if(generoDecide(base.especieId,EV)&&mat.genero!==base.genero)return{ok:false,motivo:'En esta línea el sexo decide una evolución: hace falta el mismo sexo'};
    return{ok:true};
  }
  function resultado(base,mats){
    const bruto=(base.estrellas||0)+mats.reduce((s,m)=>s+(m.estrellas||0)+1,0),final=Math.min(MAX_ESTRELLAS,bruto);
    return{estrellas:final,perdidas:bruto-final};
  }
  return{MAX_ESTRELLAS,ancestros,raiz,generoDecide,mismaLinea,puedeFusionar,resultado};
})();
if(typeof module!=='undefined')module.exports=Fusion;
</script>
<script>
// Misiones y login diario del gacha (código PURO: sin red ni DOM). Los premios son objetos del inventario (partida.objetos).
// Todas las cantidades son de EJEMPLO para probar el ritmo: la Pokécoin tiene que ser difícil de conseguir.
//   Ritmo previsto: ~1 Pokécoin de login + 2 de misiones diarias al día, 6 el 7º día de racha, y 3-15 por cada hito general.
// "Diario" = por fecha LOCAL del dispositivo (no UTC). Lo guardado en la partida:
//   partida.login     = {racha, ultimoDia}
//   partida.misiones  = {dia, contDia:{evento:n}, hechasDia:{id:true}, cont:{evento:n}, hechas:{id:true}}
// Eventos que cuentan: 'entrenar' (veces que se entrena), 'caramelos' (caramelos gastados), 'evolucion', 'fusion', 'tirada' (tiradas en banners normales).
// Para añadir una misión: una entrada en DIARIAS/GENERALES con ev (contador de eventos) o est (función del estado de la partida).
const Misiones=(()=>{
  const hoyLocal=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  // Fecha que usa el juego: la del dispositivo, o la «fecha de prueba» (localStorage 'gacha-fecha-prueba', solo para probar días/celebraciones)
  const fechaJuego=()=>{try{const f=localStorage.getItem('gacha-fecha-prueba');if(/^\d{4}-\d{2}-\d{2}$/.test(f||''))return f}catch(e){}return hoyLocal()};
  const ayerDe=hoy=>{const[y,m,d]=hoy.split('-').map(Number);return hoyLocal(new Date(y,m-1,d-1))};

  // Login: premio de cada día de la racha (se repite cada 7 días; si faltas un día, vuelve al día 1)
  const LOGIN=[
    {pokecoin:1},{pokecoin:1,'caramelo-s':10},{pokecoin:1},{pokecoin:1,'caramelo-m':3},
    {pokecoin:1},{pokecoin:1,'caramelo-l':2},{pokecoin:6}];

  const maxDe=(p,f)=>p.box.reduce((x,c)=>Math.max(x,f(c)),0);
  const rarIdx=(p,x)=>p.box.some(c=>x.ORD.indexOf(x.rz(c.especieId))>=x.i)?1:0;
  const DIARIAS=[
    {id:'d-entrenar',nombre:'Entrena una carta',desc:'Usa caramelos en una carta.',ev:'entrenar',meta:1,premio:{pokecoin:1,'caramelo-s':5}},
    {id:'d-caramelos',nombre:'Gasta 5 caramelos',desc:'Usa 5 caramelos de cualquier tamaño.',ev:'caramelos',meta:5,premio:{pokecoin:1,'caramelo-s':5}},
    // (cuando haya banners normales: "Haz una tirada", y cuando haya combates: "Gana un combate")
  ].map(m=>({...m,tipo:'diaria'}));
  const GENERALES=[
    {id:'g-evo1',nombre:'Primera evolución',desc:'Evoluciona una carta.',ev:'evolucion',meta:1,premio:{pokecoin:3}},
    {id:'g-evo5',nombre:'Evolucionista',desc:'Evoluciona 5 cartas.',ev:'evolucion',meta:5,premio:{pokecoin:5}},
    {id:'g-fus1',nombre:'Primera fusión',desc:'Fusiona una carta.',ev:'fusion',meta:1,premio:{pokecoin:3}},
    {id:'g-fus5',nombre:'Fusionador',desc:'Haz 5 fusiones.',ev:'fusion',meta:5,premio:{pokecoin:5}},
    {id:'g-tir1',nombre:'Primera invocación',desc:'Haz una tirada en un banner.',ev:'tirada',meta:1,premio:{pokecoin:1,'caramelo-m':5}},
    {id:'g-tir30',nombre:'Invocador',desc:'Haz 30 tiradas en banners.',ev:'tirada',meta:30,premio:{pokecoin:5}},
    {id:'g-tir100',nombre:'Gran invocador',desc:'Haz 100 tiradas en banners.',ev:'tirada',meta:100,premio:{pokecoin:10}},
    {id:'g-nv20',nombre:'Entrenador novato',desc:'Sube una carta al nivel 20.',est:p=>maxDe(p,c=>c.nivel),meta:20,premio:{pokecoin:3,'caramelo-m':5}},
    {id:'g-nv50',nombre:'Entrenador experto',desc:'Sube una carta al nivel 50.',est:p=>maxDe(p,c=>c.nivel),meta:50,premio:{pokecoin:5,'caramelo-l':5}},
    {id:'g-nv100',nombre:'Maestro Pokémon',desc:'Sube una carta al nivel 100.',est:p=>maxDe(p,c=>c.nivel),meta:100,premio:{pokecoin:15,'caramelo-xl':3}},
    {id:'g-est3',nombre:'Tres estrellas',desc:'Consigue una carta con 3 estrellas.',est:p=>maxDe(p,c=>c.estrellas||0),meta:3,premio:{pokecoin:5}},
    {id:'g-est5',nombre:'Estrella máxima',desc:'Consigue una carta con 5 estrellas.',est:p=>maxDe(p,c=>c.estrellas||0),meta:5,premio:{pokecoin:15}},
    {id:'g-box20',nombre:'Coleccionista',desc:'Ten 20 cartas en la box.',est:p=>p.box.length,meta:20,premio:{pokecoin:3}},
    {id:'g-box50',nombre:'Gran coleccionista',desc:'Ten 50 cartas en la box.',est:p=>p.box.length,meta:50,premio:{pokecoin:10}},
    {id:'g-ssr',nombre:'Carta SSR',desc:'Consigue una carta SSR o superior.',est:(p,x)=>rarIdx(p,{...x,i:3}),meta:1,premio:{pokecoin:5}},
    {id:'g-ur',nombre:'Carta UR',desc:'Consigue una carta UR o superior.',est:(p,x)=>rarIdx(p,{...x,i:4}),meta:1,premio:{pokecoin:10}},
    {id:'g-lr',nombre:'Carta LR',desc:'Consigue una carta LR.',est:(p,x)=>rarIdx(p,{...x,i:5}),meta:1,premio:{pokecoin:15}},
  ].map(m=>({...m,tipo:'general'}));
  const TODAS=[...DIARIAS,...GENERALES];

  function estado(p,hoy=fechaJuego()){   // normaliza partida.misiones y reinicia las diarias si cambió el día
    const M=p.misiones||(p.misiones={});
    M.cont=M.cont||{};M.hechas=M.hechas||{};
    if(M.dia!==hoy||!M.contDia||!M.hechasDia){M.dia=hoy;M.contDia={};M.hechasDia={}}
    return M;
  }
  function dar(p,premio){p.objetos=p.objetos||{};for(const[k,n]of Object.entries(premio))p.objetos[k]=(p.objetos[k]||0)+n}

  // Al abrir el gacha: reinicia las diarias y da el login del día (una vez al día). cambio=true si hay que guardar.
  function entrar(p,hoy=fechaJuego()){
    const dia0=(p.misiones||{}).dia;estado(p,hoy);
    let cambio=dia0!==hoy,login=null;
    const L=p.login||(p.login={racha:0,ultimoDia:null});
    if(L.ultimoDia!==hoy){
      L.racha=L.ultimoDia===ayerDe(hoy)?L.racha+1:1;L.ultimoDia=hoy;
      const dia=(L.racha-1)%7+1,premio=LOGIN[dia-1];
      dar(p,premio);login={dia,racha:L.racha,premio};cambio=true;
    }
    return{cambio,login};
  }
  const diaLogin=p=>p.login&&p.login.racha?(p.login.racha-1)%7+1:0;

  function registrar(p,ev,n=1,hoy=fechaJuego()){const M=estado(p,hoy);M.cont[ev]=(M.cont[ev]||0)+n;M.contDia[ev]=(M.contDia[ev]||0)+n}

  function progreso(p,m,x,hoy=fechaJuego()){
    const M=estado(p,hoy),v=m.est?m.est(p,x):((m.tipo==='diaria'?M.contDia:M.cont)[m.ev]||0);
    return Math.min(v,m.meta);
  }
  const reclamada=(p,m,hoy=fechaJuego())=>{const M=estado(p,hoy);return!!(m.tipo==='diaria'?M.hechasDia:M.hechas)[m.id]};
  const completa=(p,m,x,hoy=fechaJuego())=>progreso(p,m,x,hoy)>=m.meta;
  const pendientes=(p,x,hoy=fechaJuego())=>TODAS.filter(m=>completa(p,m,x,hoy)&&!reclamada(p,m,hoy)).length;

  function reclamar(p,id,x,hoy=fechaJuego()){   // devuelve el premio o null
    const m=TODAS.find(t=>t.id===id);
    if(!m||reclamada(p,m,hoy)||!completa(p,m,x,hoy))return null;
    const M=estado(p,hoy);(m.tipo==='diaria'?M.hechasDia:M.hechas)[m.id]=true;dar(p,m.premio);return m.premio;
  }
  function reclamarTodas(p,x,hoy=fechaJuego()){   // premio total sumado o null
    const tot={};let hubo=false;
    for(const m of TODAS){const pr=reclamar(p,m.id,x,hoy);if(pr){hubo=true;for(const[k,n]of Object.entries(pr))tot[k]=(tot[k]||0)+n}}
    return hubo?tot:null;
  }
  return{hoyLocal,fechaJuego,LOGIN,DIARIAS,GENERALES,entrar,diaLogin,registrar,progreso,reclamada,completa,pendientes,reclamar,reclamarTodas};
})();
if(typeof module!=='undefined')module.exports=Misiones;
</script>
<script>
// Eventos del gacha (código PURO: sin red ni DOM). Los datos están en eventos-datos.js y las pantallas en eventos-pantallas.js.
// Tres tipos, como en Dokkan:  farmeo (recursos de entrenamiento) · historia (celebraciones) · desafio (combates difíciles).
//   evento = { id, nombre, icono, desc, tipo, dias?:[0..6] (0 = domingo; sin 'dias' = siempre), desbloqueo?:'orden'|'libre', fases:[fase] }
//   fase   = { id, nombre, desc?, equipo (cartas que puede llevar el jugador), intentosDia? (sin valor = ilimitado),
//              rivales:[{esp, nivel, arq?}], drop:[{o, min, max, prob?}], primera?:{objeto:n} }
//  · drop = tabla de recompensas por VICTORIA: cada línea se sortea por separado (prob 0..1, por defecto 1).
//  · primera = premio extra que solo se da la primera vez que se supera la fase.
//  · El intento se gasta al EMPEZAR el combate (se gane o se pierda). Los intentos diarios se reinician por fecha del juego.
//  · rival.hpMult (opcional) = multiplica la vida del rival (jefes). Pásalo a vidaCombate(hp, hpMult).
// MISIONES PROPIAS de cada evento (opcional): evento.misiones=[{id,nombre,desc,ev,meta,premio:{objeto:n}}]. Sin 'misiones' no hay botón.
//  · Contadores que se llevan solos: 'combate' (al gastar un intento), 'victoria' (al ganar) y 'victoria:<faseId>' (victorias de esa fase).
//  · Las misiones se hacen una sola vez (no se reinician cada día).
// Lo guardado en la partida: partida.eventos[id] = {dia, intentos:{faseId:n}, victorias:{faseId:n}, primera:{faseId:true}, cont:{contador:n}, hechas:{misionId:true}}
const Eventos=(()=>{
  const TIPOS={
    farmeo:{nombre:'Farmeo',icono:'🍬',desc:'Consigue caramelos y otros recursos para entrenar a tus cartas.'},
    historia:{nombre:'Historia',icono:'📖',desc:'Eventos de las celebraciones: fases con historia y recompensas únicas.'},
    desafio:{nombre:'Desafíos',icono:'🔥',desc:'Combates difíciles con rivales fuertes y grandes recompensas.'},
  };
  const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const aFecha=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
  const IVS_RIVAL={hp:15,atk:15,def:15,spa:15,spd:15,spe:15};

  function estado(p,ev,hoy){   // normaliza partida.eventos[id] y reinicia los intentos si cambió el día
    const R=p.eventos||(p.eventos={}),E=R[ev.id]||(R[ev.id]={});
    E.victorias=E.victorias||{};E.primera=E.primera||{};E.cont=E.cont||{};E.hechas=E.hechas||{};
    if(E.dia!==hoy||!E.intentos){E.dia=hoy;E.intentos={}}
    return E;
  }
  const disponible=(ev,hoy)=>!ev.dias||ev.dias.includes(aFecha(hoy).getDay());
  const diasTexto=ev=>ev.dias?ev.dias.map(d=>DIAS[d]).join(', '):'todos los días';
  const desbloqueada=(p,ev,i,hoy)=>ev.desbloqueo==='libre'||i===0||(estado(p,ev,hoy).victorias[ev.fases[i-1].id]||0)>0;
  const intentosRestantes=(p,ev,f,hoy)=>f.intentosDia==null?Infinity:Math.max(0,f.intentosDia-(estado(p,ev,hoy).intentos[f.id]||0));
  const puedeEntrar=(p,ev,i,hoy)=>disponible(ev,hoy)&&desbloqueada(p,ev,i,hoy)&&intentosRestantes(p,ev,ev.fases[i],hoy)>0;

  const contar=(E,k,n=1)=>{E.cont[k]=(E.cont[k]||0)+n};
  function gastarIntento(p,ev,f,hoy){   // false si ya no quedan
    const i=ev.fases.indexOf(f);
    if(i<0||!puedeEntrar(p,ev,i,hoy))return false;
    const E=estado(p,ev,hoy);E.intentos[f.id]=(E.intentos[f.id]||0)+1;contar(E,'combate');return true;
  }
  const dar=(p,pr)=>{p.objetos=p.objetos||{};for(const[k,n]of Object.entries(pr))p.objetos[k]=(p.objetos[k]||0)+n};

  // Victoria: sortea el drop, añade el premio de primera vez, lo mete en el inventario y cuenta la victoria.
  function resolver(p,ev,f,hoy,rng=Math.random){
    const E=estado(p,ev,hoy),premio={},add=(k,n)=>{if(n>0)premio[k]=(premio[k]||0)+n};
    for(const d of f.drop||[])if(rng()<(d.prob??1))add(d.o,d.min+Math.floor(rng()*(d.max-d.min+1)));
    const primera=!E.primera[f.id];
    if(primera){E.primera[f.id]=true;for(const[k,n]of Object.entries(f.primera||{}))add(k,n)}
    E.victorias[f.id]=(E.victorias[f.id]||0)+1;contar(E,'victoria');contar(E,'victoria:'+f.id);
    dar(p,premio);
    return{premio,primera};
  }

  // Estadísticas de una carta (fórmula de los juegos, sin EVs). b = stats base, nat = {u,d} de Guardado.NATURALEZAS.
  function estadisticas(b,ivs,nivel,nat){
    nat=nat||{};const r={hp:Math.floor((2*b.hp+ivs.hp)*nivel/100)+nivel+10};
    for(const s of['atk','def','spa','spd','spe']){
      const v=Math.floor((2*b[s]+ivs[s])*nivel/100)+5;r[s]=Math.floor(v*(nat.u===s?110:nat.d===s?90:100)/100);
    }
    return r;
  }
  // PS en combate: con esta escala una carta de nivel ~50 queda parecida a un Pokémon normal del simulador. Ajustable.
  const vidaCombate=(hp,mult=1)=>Math.round((hp+60)*mult);

  // ---------- Misiones del evento ----------
  const misiones=ev=>ev.misiones||[];
  const tieneMisiones=ev=>misiones(ev).length>0;   // si es false, no se enseña el botón de misiones
  const progresoMision=(p,ev,m,hoy)=>Math.min(estado(p,ev,hoy).cont[m.ev]||0,m.meta);
  const misionCompleta=(p,ev,m,hoy)=>progresoMision(p,ev,m,hoy)>=m.meta;
  const misionReclamada=(p,ev,m,hoy)=>!!estado(p,ev,hoy).hechas[m.id];
  const misionesPendientes=(p,ev,hoy)=>misiones(ev).filter(m=>misionCompleta(p,ev,m,hoy)&&!misionReclamada(p,ev,m,hoy)).length;
  function reclamarMision(p,ev,id,hoy){   // devuelve el premio o null
    const m=misiones(ev).find(x=>x.id===id);
    if(!m||misionReclamada(p,ev,m,hoy)||!misionCompleta(p,ev,m,hoy))return null;
    estado(p,ev,hoy).hechas[m.id]=true;dar(p,m.premio);return m.premio;
  }
  function reclamarMisiones(p,ev,hoy){   // premio total sumado o null
    const tot={};let hubo=false;
    for(const m of misiones(ev)){const pr=reclamarMision(p,ev,m.id,hoy);if(pr){hubo=true;for(const[k,n]of Object.entries(pr))tot[k]=(tot[k]||0)+n}}
    return hubo?tot:null;
  }

  return{misiones,tieneMisiones,progresoMision,misionCompleta,misionReclamada,misionesPendientes,reclamarMision,reclamarMisiones,TIPOS,IVS_RIVAL,estado,disponible,diasTexto,desbloqueada,intentosRestantes,puedeEntrar,gastarIntento,resolver,estadisticas,vidaCombate};
})();
if(typeof module!=='undefined')module.exports=Eventos;
</script>
<script>
// PANTALLAS DE EVENTOS del gacha: lista por tipo, fases, elección de equipo y combate.
// El combate usa el simulador: monta las cartas como Pokémon temporales (TY['ev-...']), cambia a su pantalla,
// y al terminar (gancho alTerminarCombate) vuelve aquí, da el premio y guarda.
// Cada evento puede tener misiones propias (botón «📜 Misiones» solo si Eventos.tieneMisiones(ev)). Un rival puede llevar hpMult (vida ×N, jefes).
// Necesita: eventos.js + eventos-datos.js, y que gacha.js le pase sus funciones (ver Gacha → eventosGacha()).

  function crear(X){
    const{h,esc,limpiar,cabecera,guardar,volver,carta,nombreEs,datosEsp,kitDe}=X;
    const P=()=>X.partida(),C=()=>X.cont(),hoy=()=>X.hoy();
    const ico=k=>typeof objetoIcono==='function'?objetoIcono(k):'📦';
    let tipoActual='farmeo',combate=null;

    const dropHtml=f=>(f.drop||[]).map(d=>`<span style="white-space:nowrap">${ico(d.o)} ${d.min===d.max?d.min:d.min+'-'+d.max}${(d.prob??1)<1?` <small>(${Math.round(d.prob*100)} %)</small>`:''}</span>`).join(' · ');
    const nombres=el=>el.querySelectorAll('.nm').forEach(e=>nombreEs(+e.dataset.id).then(n=>{e.textContent=n}));

    // ---------- Lista de eventos por tipo ----------
    function pantallaEventos(tipo){
      tipoActual=tipo||tipoActual;
      limpiar();C().append(cabecera('🗡️ Eventos',volver));
      const tabs=h('div','display:flex;gap:6px;flex-wrap:wrap;margin:8px 0');
      for(const[k,t]of Object.entries(Eventos.TIPOS)){
        const b=h('button',`padding:6px 10px;${k===tipoActual?'border-color:#4ade80':''}`,`${t.icono} ${t.nombre}`);
        b.onclick=()=>pantallaEventos(k);tabs.append(b);
      }
      C().append(tabs,h('div','font-size:12px;opacity:.75;margin:4px 0;max-width:520px',esc(Eventos.TIPOS[tipoActual].desc)));
      const lista=EVENTOS.filter(e=>e.tipo===tipoActual),l=h('div','display:flex;flex-direction:column;gap:8px;max-width:520px');
      for(const ev of lista){
        const dis=Eventos.disponible(ev,hoy()),pend=Eventos.tieneMisiones(ev)?Eventos.misionesPendientes(P(),ev,hoy()):0;
        const b=h('button','text-align:left;padding:12px',`<b>${ev.icono||''} ${esc(ev.nombre)}</b>${pend?` · 🔴 ${pend}`:''}<br><small>${dis?esc(ev.desc):'Hoy no disponible · abre: '+Eventos.diasTexto(ev)}</small>`);
        b.onclick=()=>pantallaEvento(ev);l.append(b);
      }
      C().append(l);
      if(!lista.length)C().append(h('p','opacity:.7','Próximamente.'));
    }

    // ---------- Fases de un evento ----------
    function pantallaEvento(ev,aviso){
      limpiar();C().append(cabecera(`${ev.icono||''} ${ev.nombre}`,()=>pantallaEventos(ev.tipo)));
      if(aviso)C().append(h('div','background:#14532d;border:1px solid #4ade80;border-radius:8px;padding:8px 10px;margin:8px 0;max-width:520px;font-size:13px',aviso));
      C().append(h('div','font-size:12px;opacity:.8;margin:4px 0;max-width:520px',esc(ev.desc)));
      const dis=Eventos.disponible(ev,hoy());
      if(!dis)C().append(h('div','color:#fbbf24;font-size:13px;margin:6px 0','Hoy no está disponible. Abre: '+Eventos.diasTexto(ev)));
      if(Eventos.tieneMisiones(ev)){   // sin misiones propias, no hay botón
        const pend=Eventos.misionesPendientes(P(),ev,hoy()),bm=h('button','margin:8px 0;padding:8px 12px',`📜 Misiones del evento${pend?` · 🔴 ${pend}`:''}`);
        bm.onclick=()=>pantallaMisiones(ev);C().append(bm);
      }
      ev.fases.forEach((f,i)=>{
        const lock=!Eventos.desbloqueada(P(),ev,i,hoy()),rest=Eventos.intentosRestantes(P(),ev,f,hoy()),
          vic=Eventos.estado(P(),ev,hoy()).victorias[f.id]||0;
        const riv=f.rivales.map(r=>`<span style="display:inline-block;text-align:center;font-size:10px"><img src="${SPR+r.esp}.png" style="width:40px;height:40px;image-rendering:pixelated" alt=""><br><span class="nm" data-id="${r.esp}">#${r.esp}</span><br>Nv ${r.nivel}${r.hpMult>1?`<br><b>Vida ×${r.hpMult}</b>`:''}</span>`).join(' ');
        const d=h('div',`display:flex;align-items:center;gap:8px;border:1px solid #334155;border-radius:8px;padding:8px;margin:8px 0;max-width:520px;${lock?'opacity:.55':''}`,
          `<div style="flex:1"><b>${esc(f.nombre)}</b> ${vic?'<small style="color:#4ade80">✔ superada</small>':''}${lock?' <small>🔒 supera la fase anterior</small>':''}
           <div style="margin:4px 0">${riv}</div>
           <div style="font-size:12px">Premios: ${dropHtml(f)}</div>
           ${!vic&&f.primera?`<div style="font-size:12px">Primera vez: ${X.premioHtml(f.primera)}</div>`:''}
           <small style="opacity:.75">${f.intentosDia==null?'Intentos ilimitados':`Intentos hoy: ${rest}/${f.intentosDia}`} · llevas hasta ${f.equipo} carta${f.equipo>1?'s':''}</small></div>`);
        const b=h('button','padding:8px 12px','⚔️ Combatir');b.disabled=lock||!dis||rest<=0;
        b.onclick=()=>pantallaEquipo(ev,f);d.append(b);nombres(d);C().append(d);
      });
    }

    // ---------- Misiones del evento ----------
    const recibes=p=>'Recibes: '+Object.entries(p).map(([k,n])=>n+' × '+objetoNombre(k)).join(', ');
    function pantallaMisiones(ev,aviso){
      limpiar();C().append(cabecera(`📜 ${ev.nombre}`,()=>pantallaEvento(ev)));
      if(aviso)C().append(h('p','color:#4ade80;margin:6px 0;font-size:13px',esc(aviso)));
      const pend=Eventos.misionesPendientes(P(),ev,hoy());
      if(pend){
        const b=h('button','margin:8px 0',`🔴 Reclamar todas (${pend})`);
        b.onclick=async()=>{const t=Eventos.reclamarMisiones(P(),ev,hoy());await guardar();pantallaMisiones(ev,t?recibes(t):null)};
        C().append(b);
      }
      const l=h('div','display:flex;flex-direction:column;gap:6px;max-width:560px;margin-top:8px');
      for(const m of Eventos.misiones(ev)){
        const pr=Eventos.progresoMision(P(),ev,m,hoy()),ok=pr>=m.meta,hecha=Eventos.misionReclamada(P(),ev,m,hoy());
        const f=h('div',`display:flex;align-items:center;gap:8px;border:1px solid ${ok&&!hecha?'#4ade80':'#334155'};border-radius:8px;padding:6px 8px;${hecha?'opacity:.55':''}`,
          `<div style="flex:1"><b>${esc(m.nombre)}</b> <small style="opacity:.7">· ${esc(m.desc)}</small>
           <div style="background:#1e293b;height:6px;border-radius:3px;margin:4px 0;max-width:260px"><div style="width:${pr/m.meta*100}%;height:6px;background:${ok?'#4ade80':'#38bdf8'};border-radius:3px"></div></div>
           <small>${pr}/${m.meta} · ${X.premioHtml(m.premio)}</small></div>`);
        const b=h('button','',hecha?'✔':'Reclamar');b.disabled=hecha||!ok;
        b.onclick=async()=>{const p=Eventos.reclamarMision(P(),ev,m.id,hoy());await guardar();pantallaMisiones(ev,p?recibes(p):null)};
        f.append(b);l.append(f);
      }
      C().append(l);
    }

    // ---------- Elegir equipo ----------
    function pantallaEquipo(ev,f){
      limpiar();C().append(cabecera(`${f.nombre} · ${ev.nombre}`,()=>pantallaEvento(ev)));
      const box=[...P().box].sort((a,b)=>b.nivel-a.nivel||a.especieId-b.especieId);
      if(!box.length){C().append(h('p','','No tienes cartas. Consigue algunas en un banner.'));return}
      const max=f.equipo,ids=new Set(),info=h('div','margin:8px 0;font-size:13px'),go=h('button','padding:10px 14px','⚔️ Combatir'),g=h('div','');
      g.className='gc-grid';
      const upd=()=>{info.innerHTML=`Elige hasta <b>${max}</b> carta${max>1?'s':''}: <b>${ids.size}/${max}</b> <small style="opacity:.7">(se gasta 1 intento al empezar)</small>`;go.disabled=!ids.size};
      for(const c of box){
        const d=carta(c,{alClick:()=>{
          if(ids.has(c.id)){ids.delete(c.id);d.style.outline=''}
          else if(ids.size<max){ids.add(c.id);d.style.outline='3px solid #4ade80'}
          upd();
        }});
        g.append(d);
      }
      go.onclick=()=>combatir(ev,f,box.filter(c=>ids.has(c.id)));
      C().append(info,go,g);upd();
    }

    // ---------- Combate ----------
    // Convierte una carta (o un rival) en un Pokémon temporal del simulador y devuelve su casilla de equipo {t,s}.
    async function montar(key,esp,nivel,ivs,natKey,arq,hpMult=1,hab=null,obj=null){
      const e=await datosEsp(esp),kit=await kitDe({especieId:esp,arquetipo:arq}),nm=await nombreEs(esp),
        st=Eventos.estadisticas(e.stats,ivs,nivel,X.NAT[natKey]),pool=kit.length?kit.slice(0,4):[N0],fi=new Image();
      fi.src=SPR+esp+'.png';
      TY[key]={n:nm,e:'',c:[TCOL[e.tipos[0]],'#fff','#334155'],st,H:Eventos.vidaCombate(st.hp,hpMult),types:e.tipos,pool,
        ds:pool.map((_,i)=>i),api:1,learn:null,sg:pool.length,img:fi.src,fi,bi:new Image()};
      return{t:key,s:pool.map((_,i)=>i),hab,obj};
    }
    async function combatir(ev,f,cartas){
      if(typeof start!=='function'||typeof TY==='undefined'||typeof irA!=='function'){alert('Falta cargar el simulador.');return}
      if(!Eventos.gastarIntento(P(),ev,f,hoy())){pantallaEvento(ev);return}
      await guardar();
      limpiar();C().append(cabecera('Preparando combate…'));
      const st=h('p','','Cargando ataques de los Pokémon (la primera vez tarda un poco)…');C().append(st);
      try{
        const mios=[],riv=[];
        for(let i=0;i<cartas.length;i++){const c=cartas[i];mios.push({...await montar('ev-m'+i,c.especieId,c.nivel,c.ivs,c.naturaleza,c.arquetipo,1,c.habilidad||null,c.objeto||null),cid:c.id})}
        for(let i=0;i<f.rivales.length;i++){const r=f.rivales[i];riv.push(await montar('ev-r'+i,r.esp,r.nivel,Eventos.IVS_RIVAL,null,r.arq,r.hpMult||1,r.hab||null,r.obj||null))}
        const claves=new Set([...mios,...riv].map(x=>x.t));
        combate={ev,f,claves};TM=[mios,riv];
        alTerminarCombate=w=>{
          if(!combate||document.body.dataset.modo!=='simulador'||!team[0].some(u=>claves.has(u.t)))return;   // no es nuestro combate
          const vic=w===0;
          $('#ban').innerHTML=`${vic?'🏆<br>¡Victoria!':'💀<br>Derrota'}<div style="margin-top:10px"><button id="evfin">Continuar</button></div>`;
          $('#evfin').onclick=()=>terminar(vic);
        };
        $('#rs').style.display='none';
        irA('simulador');start();
      }catch(e){
        combate=null;
        // el intento ya está gastado: se devuelve si el fallo fue al preparar (nunca llegó a empezar el combate)
        const E=Eventos.estado(P(),ev,hoy());E.intentos[f.id]=Math.max(0,(E.intentos[f.id]||0)-1);E.cont.combate=Math.max(0,(E.cont.combate||0)-1);await guardar();
        limpiar();C().append(cabecera('Error',()=>pantallaEvento(ev)),h('p','color:#f87171',typeof ERR!=='undefined'?ERR:'No se pudo preparar el combate.'),h('small','opacity:.7','No se ha gastado ningún intento.'));
      }
    }
    async function terminar(vic){
      const c=combate;combate=null;alTerminarCombate=null;
      // objetos de un solo uso gastados en el combate: desaparecen de su carta (se lee antes de limpiar el simulador)
      const gastadas=c?team[0].filter(u=>u.objGastado&&u.cid).map(u=>u.cid):[];
      $('#rs').style.display='';
      TM=[[],[]];toSetup();                      // deja el simulador limpio para cuando se use de verdad
      document.body.dataset.modo='gacha';window.scrollTo&&window.scrollTo(0,0);
      if(!c)return;
      if(gastadas.length){for(const k of P().box)if(gastadas.includes(k.id))k.objeto=null;await guardar()}
      let aviso;
      if(vic){
        const r=Eventos.resolver(P(),c.ev,c.f,hoy());X.reg('evento',1);await guardar();
        aviso=`🏆 <b>¡Victoria!</b> Recibes: ${X.premioHtml(r.premio)||'nada esta vez'}${r.primera&&c.f.primera?' <small>(incluye el premio de primera vez)</small>':''}`;
      }else aviso='💀 <b>Derrota.</b> Has perdido el intento. Prueba con cartas de más nivel o con otro equipo.';
      const pm=Eventos.tieneMisiones(c.ev)?Eventos.misionesPendientes(P(),c.ev,hoy()):0;
      if(pm)aviso+=`<br>🔴 Tienes ${pm} misión${pm>1?'es':''} del evento por reclamar`;
      pantallaEvento(c.ev,aviso);
    }

    return{abrir:()=>pantallaEventos(tipoActual)};
  }
  return{crear};
})();
</script>
