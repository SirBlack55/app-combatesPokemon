<script>
// HERRAMIENTA TEMPORAL (se puede borrar cuando ya no haga falta).
// Crea el BANNER INICIAL: elige los iniciales garantizados (27), sortea el relleno (con semilla,
// cuotas por rareza y variedad de tipos), deja quitar especies a mano, simula tiradas con reroll
// y descarga banners-datos.js. Botón flotante "🎴 Banners".
// Necesita: pokeapi.js, conversor.js, rarezas.js (RAREZA_POR_ESPECIE), arquetipos.js y banners.js.
// Usa la caché de la herramienta de kits (si falta alguna especie, la descarga).
(function(){
const KC='kits-especies-v1';let kits={};try{kits=JSON.parse(localStorage.getItem(KC)||'{}')}catch(e){}
const cap=n=>String(n).replace(/-/g,' ').replace(/^./,c=>c.toUpperCase());
const RAR=['N','R','SR','SSR'];   // el banner inicial no da UR ni LR
const S={iniciales:null,relleno:null,semilla:1,cuotas:{N:10,R:9,SR:4,SSR:2}};

async function esp(id){
  if(kits[id])return kits[id];
  const p=await jf(API+'pokemon/'+id),sm={};p.stats.forEach(x=>sm[x.stat.name]=x.base_stat);
  return kits[id]={id,n:p.name,tipos:p.types.map(x=>TN[x.type.name]||'normal'),
    stats:{hp:sm.hp,atk:sm.attack,def:sm.defense,spa:sm['special-attack'],spd:sm['special-defense'],spe:sm.speed},
    moves:p.moves.map(m=>m.move.name)};
}
async function espMuchos(ids,prog){
  const falta=ids.filter(i=>!kits[i]);
  for(let i=0;i<falta.length;i+=9){
    await Promise.all(falta.slice(i,i+9).map(esp));
    if(prog)prog(`Descargando especies ${Math.min(falta.length,i+9)}/${falta.length}`);
  }
}
async function arqsDe(id){
  const e=await esp(id),movs=[];
  for(let i=0;i<e.moves.length;i+=9)
    movs.push(...await Promise.all(e.moves.slice(i,i+9).map(n=>mvData({n,u:API+'move/'+n+'/'}))));
  return arquetiposDistintos(e,movs.filter(Boolean));
}
const rz=id=>RAREZA_POR_ESPECIE[id][0];

// Genera iniciales (1ª vez) y sortea el relleno con la semilla y cuotas actuales.
async function generar(prog=()=>{}){
  if(typeof RAREZA_POR_ESPECIE==='undefined')throw new Error('Falta rarezas.js');
  if(!S.iniciales){
    await espMuchos(INICIALES_IDS,prog);S.iniciales=[];
    for(const id of INICIALES_IDS){prog(`Arquetipos de iniciales ${S.iniciales.length+1}/${INICIALES_IDS.length}`);S.iniciales.push({id,arqs:await arqsDe(id)})}
  }
  // especies ya reservadas por otros banners (el relleno debe ser exclusivo)
  const usados=new Set([...INICIALES_IDS,...EXCLUIDOS_DEL_INICIAL]);
  if(typeof BANNERS!=='undefined')for(const b of BANNERS)if(b.id!=='inicial')
    for(const p of[b.garantizado,b.relleno,b])if(p&&p.pool)p.pool.forEach(e=>usados.add(e.id));
  const ids=Object.keys(RAREZA_POR_ESPECIE).map(Number)
    .filter(id=>RAREZA_POR_ESPECIE[id][1]===1&&RAR.includes(rz(id))&&!usados.has(id));
  await espMuchos(ids,prog);
  const cands=ids.map(id=>({id,rareza:rz(id),tipos:kits[id].tipos})),rng=crearRng(S.semilla);
  const total=Object.values(S.cuotas).reduce((a,b)=>a+b,0),malas=new Set();
  S.relleno=[];
  let cuotas={...S.cuotas};
  for(let ronda=0;ronda<6;ronda++){
    const ocupados=new Set([...S.relleno.map(e=>e.id),...malas]);
    const pedir=sortearRelleno(cands.filter(c=>!ocupados.has(c.id)),cuotas,rng);
    if(!pedir.length)break;
    for(const id of pedir){
      prog(`Calculando arquetipos del relleno ${S.relleno.length+1}/${total}`);
      const a=await arqsDe(id);
      if(a.length)S.relleno.push({id,arqs:a});else malas.add(id);   // sin arquetipo viable: se descarta y se repone
    }
    cuotas={};for(const r of RAR){const f=S.cuotas[r]-S.relleno.filter(e=>rz(e.id)===r).length;if(f>0)cuotas[r]=f}
    if(!Object.keys(cuotas).length)break;
  }
}

// ---------- Pantalla ----------
const $$=(t,css,html)=>{const e=document.createElement(t);if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;return e};
function chip(e,quitable){
  const k=kits[e.id];
  return `<span style="display:inline-block;border:1px solid #334155;border-radius:6px;padding:2px 6px;margin:2px;font-size:12px">${cap(k.n)} <small style="opacity:.7">${k.tipos.join('/')} · ${e.arqs.join('/')}</small>${quitable?` <a href="#" data-x="${e.id}" style="color:#f87171;text-decoration:none">✕</a>`:''}</span>`;
}
function abrir(){
  const ov=$$('div','position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.75);overflow:auto;padding:12px;font:13px system-ui,sans-serif;color:#e2e8f0');
  const pn=$$('div','max-width:760px;margin:0 auto;background:#0f172a;border:1px solid #334155;border-radius:10px;padding:12px');
  const inp=(id,v,w=56)=>`<input id="${id}" type="number" value="${v}" style="width:${w}px">`;
  const f=$$('div','margin:8px 0',`Relleno (cuántas especies de cada rareza): N ${inp('b-N',S.cuotas.N)} R ${inp('b-R',S.cuotas.R)} SR ${inp('b-SR',S.cuotas.SR)} SSR ${inp('b-SSR',S.cuotas.SSR)} · Semilla ${inp('b-s',S.semilla,70)}`);
  const go=$$('button','margin-right:6px','🎲 Sortear relleno'),sim=$$('button','margin-right:6px','🎰 Simular tirada'),x=$$('button','float:right','✕'),
    st=$$('div','margin:8px 0;min-height:18px'),out=$$('div'),ts=$$('div','margin:8px 0');
  pn.append(x,$$('b','','🎴 Banner inicial'),f,go,sim,st,ts,out);ov.append(pn);document.body.append(ov);x.onclick=()=>ov.remove();

  const leer=()=>{for(const r of RAR)S.cuotas[r]=+f.querySelector('#b-'+r).value||0;S.semilla=+f.querySelector('#b-s').value||1};
  function pintar(){
    if(!S.relleno)return;
    const falta=S.relleno.length-9;
    let h=`<h4>Iniciales garantizados (${S.iniciales.length}) <small>· sale 1 al azar por tirada</small></h4>`+S.iniciales.map(e=>chip(e)).join('');
    h+=`<h4>Relleno (${S.relleno.length} especies) <small>· cada tirada saca 9 distintas${falta<0?' · <b style="color:#f87171">¡hacen falta al menos 9!</b>':''}</small></h4>`;
    for(const r of RAR){
      const l=S.relleno.filter(e=>rz(e.id)===r);
      if(l.length)h+=`<div><b>${r}</b> (${l.length}) ${l.map(e=>chip(e,true)).join('')}</div>`;
    }
    out.innerHTML=h;
    const d=$$('button','margin-top:12px','⬇ Descargar banners-datos.js');
    d.onclick=()=>{
      const b=crearBannerInicial(S.iniciales,S.relleno);
      const otros=typeof BANNERS!=='undefined'?BANNERS.filter(x=>x.id!=='inicial'):[];
      const txt='// Generado con la herramienta de banners.\nconst BANNERS='+JSON.stringify([b,...otros])+';\n';
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/javascript'}));a.download='banners-datos.js';a.click();
    };
    out.append(d);
  }
  go.onclick=async()=>{
    go.disabled=true;leer();ts.innerHTML='';
    try{await generar(t=>st.textContent=t);st.textContent='Listo. Cambia la semilla para otro sorteo o quita especies con ✕.';pintar()}
    catch(e){st.textContent=e.message==='Falta rarezas.js'?'Falta cargar rarezas.js en index.html.':ERR}
    go.disabled=false;
  };
  out.addEventListener('click',e=>{
    const id=e.target.dataset&&e.target.dataset.x;if(!id)return;
    e.preventDefault();S.relleno=S.relleno.filter(x=>x.id!=+id);pintar();
  });
  sim.onclick=()=>{
    if(!S.relleno||S.relleno.length<9){st.textContent='Primero sortea el relleno (mínimo 9 especies).';return}
    const t=tiradaInicial(crearBannerInicial(S.iniciales,S.relleno),rz);
    ts.innerHTML='<b>Tirada simulada</b> <small>(pulsa otra vez para hacer reroll)</small><br>'+t.map((c,i)=>
      `<div>${i?'':'⭐ '}${cap(kits[c.especieId].n)} <small style="opacity:.75">${c.arquetipo} · ${c.rareza}</small></div>`).join('');
  };
  if(S.relleno)pintar();
}
const b=$$('button','position:fixed;right:10px;bottom:82px;z-index:9998;opacity:.85','🎴 Banners');
b.onclick=abrir;document.body.append(b);
window.herramientaBanners={S,generar};
})();
</script>
<script>
// HERRAMIENTA TEMPORAL (se puede borrar cuando ya no haga falta).
// Descarga todas las líneas evolutivas de la PokéAPI (con sus requisitos), clasifica cada evolución
// (nivel / objeto / intercambio / felicidad / especial) y las muestra con el sprite de cada Pokémon.
// Las de felicidad y especial son las "Próximamente": la tabla de requisitos dice qué habría que meter en el juego.
// Las formas regionales (Alola, Galar, Hisui, Paldea) salen en líneas aparte, con el sprite de su forma.
// Añade un botón flotante "🧬 Evoluciones". Necesita: pokeapi.js (API, SPR, jf, ERR).
(function(){
const cap=n=>String(n).replace(/-/g,' ').replace(/^./,c=>c.toUpperCase());
const idDe=u=>+u.split('/').filter(Boolean).pop();

// ---------- Clasificación (puro, sin DOM ni red) ----------
// Una "entrada" = una forma de cumplir una evolución (una evolución puede tener varias). Formato simplificado:
// {trigger:'level-up', min_level:16, item:'fire-stone', held_item:..., min_happiness:..., time_of_day:..., ...} (solo campos con valor)
const ORDEN=['nivel','objeto','intercambio','felicidad','especial'];
const FEL=['min_happiness','min_affection','min_beauty'];
const TRG={shed:'Hueco libre en el equipo y una Poké Ball',spin:'Girar con un dulce','tower-of-darkness':'Torre Oscura',
  'tower-of-waters':'Torre Agua','three-critical-hits':'3 golpes críticos en un combate','take-damage':'Recibir daño',
  other:'Condición especial','agile-style-move':'Usar un ataque en estilo ágil','strong-style-move':'Usar un ataque en estilo fuerte',
  'recoil-damage':'Daño por retroceso','use-move':'Usar un ataque muchas veces','three-defeated-bisharp':'Derrotar 3 Bisharp líder',
  'gimmighoul-coins':'Llevar 999 monedas'};
const KL={min_level:'nivel',item:'objeto',held_item:'objeto equipado',min_happiness:'felicidad',min_affection:'cariño',min_beauty:'belleza',
  time_of_day:'hora del día',known_move:'conocer un ataque',known_move_type:'conocer un ataque de un tipo',location:'lugar',gender:'género',
  relative_physical_stats:'ataque vs defensa',needs_overworld_rain:'lluvia',party_species:'otra especie en el equipo',party_type:'un tipo en el equipo',
  turn_upside_down:'consola del revés',trade_species:'intercambio con una especie concreta',min_damage_taken:'daño recibido',
  min_move_count:'usos de un ataque',min_steps:'pasos',region:'región',base_form:'forma base',used_move:'ataque usado'};
const MANEJADOS=['trigger','item','min_level','held_item','min_happiness','min_affection','min_beauty','time_of_day','known_move',
  'known_move_type','location','gender','relative_physical_stats','needs_overworld_rain','party_species','party_type','trade_species','turn_upside_down'];

// La PokéAPI añade a cada entrada datos que no son requisitos (version_group, is_default y las formas que
// requiere/produce la evolución): no se muestran como requisito. Las formas sí se usan para repartir las entradas.
const META=['version_group','is_default','required_pokemon_form','evolved_pokemon_form'];
const limpiar=d=>{const o={};for(const[k,v]of Object.entries(d))if(!META.includes(k))o[k]=v;return o};
// Quita metadatos y entradas repetidas (la API repite la misma evolución por cada grupo de versiones).
function limpiarEntradas(ds){
  const vistos=new Set(),out=[];
  for(const d of ds.map(limpiar)){const k=JSON.stringify(d);if(!vistos.has(k)){vistos.add(k);out.push(d)}}
  return out;
}

function clasEntrada(d){
  const ks=Object.keys(d).filter(k=>k!=='trigger'),t=d.trigger,solo=a=>ks.every(k=>a.includes(k));
  if(t==='level-up'){
    if(ks.some(k=>FEL.includes(k)))return'felicidad';
    return ks.length&&solo(['min_level'])?'nivel':'especial';
  }
  if(t==='use-item')return ks.includes('item')&&solo(['item'])?'objeto':'especial';
  if(t==='trade')return solo(['held_item','trade_species'])?'intercambio':'especial';
  return'especial';
}
function textoEntrada(d){
  const p=[],t=d.trigger;
  if(t==='trade')p.push('Intercambio');
  else if(t==='use-item')p.push('Usar '+cap(d.item||'?'));
  else if(t!=='level-up')p.push(TRG[t]||cap(t||'?'));
  if(d.min_level!=null)p.push('nivel '+d.min_level);
  if(d.held_item)p.push('con '+cap(d.held_item)+' equipado');
  if(d.trade_species)p.push('por '+cap(d.trade_species));
  if(d.min_happiness!=null)p.push('felicidad ≥ '+d.min_happiness);
  if(d.min_affection!=null)p.push('cariño ≥ '+d.min_affection);
  if(d.min_beauty!=null)p.push('belleza ≥ '+d.min_beauty);
  if(d.time_of_day)p.push({day:'de día',night:'de noche',dusk:'al atardecer'}[d.time_of_day]||d.time_of_day);
  if(d.known_move)p.push('conociendo '+cap(d.known_move));
  if(d.known_move_type)p.push('conociendo un ataque de tipo '+cap(d.known_move_type));
  if(d.location)p.push('en '+cap(d.location));
  if(d.gender!=null)p.push(d.gender===1?'solo hembra':d.gender===2?'solo macho':'género '+d.gender);
  if(d.relative_physical_stats!=null)p.push({1:'Ataque > Defensa',[-1]:'Ataque < Defensa',0:'Ataque = Defensa'}[d.relative_physical_stats]||'ataque vs defensa');
  if(d.needs_overworld_rain)p.push('con lluvia');
  if(d.party_species)p.push('con '+cap(d.party_species)+' en el equipo');
  if(d.party_type)p.push('con un Pokémon de tipo '+cap(d.party_type)+' en el equipo');
  if(d.turn_upside_down)p.push('con la consola del revés');
  for(const[k,v]of Object.entries(d))if(!MANEJADOS.includes(k))p.push(k.replace(/_/g,' ')+': '+v);
  if(t==='level-up'&&d.min_level==null&&p.length===0)p.push('Sube de nivel (sin dato en la PokéAPI)');
  const s=p.join(' · ');return s.charAt(0).toUpperCase()+s.slice(1);
}
// Clasifica una evolución (lista de entradas): vale la mejor de sus formas (nivel > objeto > intercambio > felicidad > especial).
function clasArista(ds){
  ds=ds&&limpiarEntradas(ds);
  if(!ds||!ds.length)return{cat:'especial',d:{},txt:['Sin datos en la PokéAPI'],ds:[]};
  const cs=ds.map(clasEntrada),mejor=ORDEN.find(c=>cs.includes(c));
  return{cat:mejor,d:ds[cs.indexOf(mejor)],txt:ds.map(textoEntrada),ds};
}
function claveReq(cat,d){
  const t=d.trigger,ks=Object.keys(d).filter(k=>k!=='trigger');
  const pre=['level-up','use-item','trade'].includes(t)?(t==='trade'?'intercambio · ':''):(TRG[t]||cap(t||'?'))+' · ';
  return cat+': '+pre+(ks.map(k=>KL[k]||k).join(' + ')||'sin condición');
}
// ---------- Formas regionales ----------
// La PokéAPI mete las formas regionales dentro de la línea normal (Raticate de Alola es otro requisito de "Raticate").
// Aquí se separan en líneas propias. Los sprites de las formas salen de la lista de Pokémon de la API (ids 10001+).
const REGIONES={alola:'Alola',galar:'Galar',hisui:'Hisui',paldea:'Paldea'};
// Especies que solo existen como evolución de una forma regional (la API las cuelga de la especie normal).
const EXCLUSIVAS={perrserker:'galar',cursola:'galar',sirfetchd:'galar','mr-rime':'galar',runerigus:'galar',obstagoon:'galar',
  sneasler:'hisui',overqwil:'hisui',basculegion:'hisui',clodsire:'paldea'};

// lista = [{name,url}] de /pokemon → {base:{region:{id,n}}}
function parsearFormas(lista){
  const mejor={};
  for(const r of lista){
    const m=r.name.match(/^(.+?)-(alola|galar|hisui|paldea)(-.+)?$/);
    if(!m||/cap|totem/.test(m[3]||''))continue;
    const id=idDe(r.url),rest=m[3]||'',rango=rest===''?0:rest==='-standard'?1:2;
    const o=(mejor[m[1]]=mejor[m[1]]||{}),v=o[m[2]];
    if(!v||rango<v.rango||(rango===v.rango&&id<v.id))o[m[2]]={id,n:r.name,rango};
  }
  const out={};
  for(const b in mejor){out[b]={};for(const r in mejor[b])out[b][r]={id:mejor[b][r].id,n:mejor[b][r].n}}

}
// Devuelve [{tipo:'normal'|'alola'|..., raiz, hayVariantes}] : por cada línea de la API, la normal y una por cada región con forma.
// Cuando una evolución tiene varios requisitos y la especie tiene forma regional, la API no dice cuál es de cada forma:
// se asume el orden de la API (el 1º es el de la forma normal y el último el de la forma regional).
function construirLineas(cadenas,formas){
  // Elige las entradas de una evolución para una línea (reg = null para la normal, o 'alola'/'galar'/...).
  // La API marca con required/evolved_pokemon_form qué entradas son de una forma regional. Si no trae esos datos
  // y hay varios requisitos, se asume el orden de la API (el 1º es el normal y el último el regional).
  const esReg=d=>/-(alola|galar|hisui|paldea)/.test((d.required_pokemon_form||'')+' '+(d.evolved_pokemon_form||''));
  const deReg=(d,R)=>((d.required_pokemon_form||'')+' '+(d.evolved_pokemon_form||'')).includes('-'+R);
  const pos=(ds,R)=>{
    ds=ds||[];
    if(ds.some(d=>d.required_pokemon_form||d.evolved_pokemon_form)){
      const base=ds.filter(d=>!esReg(d)),r=R?ds.filter(d=>deReg(d,R)):[];
      return limpiarEntradas(r.length?r:base.length?base:ds);
    }
    ds=limpiarEntradas(ds);
    return ds.length>1?[R?ds[ds.length-1]:ds[0]]:ds;
  };
  const normal=n=>{
    if(EXCLUSIVAS[n.n])return null;
    return{id:n.id,n:n.n,d:pos(n.d,null),h:n.h.map(normal).filter(Boolean)};
  };
  const variante=(n,R)=>{
    const f=(formas[n.n]||{})[R],ex=EXCLUSIVAS[n.n]===R,hs=n.h.map(h=>variante(h,R)).filter(Boolean);
    if(!f&&!ex&&!hs.length)return null;
    return{id:f?f.id:n.id,n:f?f.n:n.n,d:pos(n.d,f||ex?R:null),h:hs};
  };
  const out=[];
  for(const c of cadenas){
    const vs=[];
    for(const R in REGIONES){const v=variante(c,R);if(v&&v.h.length)vs.push({tipo:R,raiz:v})}
    out.push({tipo:'normal',raiz:normal(c),hayVariantes:vs.length>0},...vs.map(v=>({...v,hayVariantes:true})));
  }
  return out;
}

// cadenas = [{id,n,d:[entradas con las que se llega a esta especie],h:[hijos]}]
function analizar(cadenas){
  const ar=[],vistas=new Set();
  const rec=n=>{
    for(const h of n.h){
      const c=clasArista(h.d),k=n.id+'>'+h.id+'>'+c.txt.join('|');
      if(!vistas.has(k)){vistas.add(k);
      ar.push({de:n.id,dn:n.n,a:h.id,an:h.n,cat:c.cat,txt:c.txt,ent:c.ds,clave:claveReq(c.cat,c.d),rama:n.h.length>1})}
      rec(h);
    }
  };
  cadenas.forEach(rec);
  const conteo={};ORDEN.forEach(c=>conteo[c]=0);ar.forEach(a=>conteo[a.cat]++);
  const g={};
  for(const a of ar)if(a.cat==='felicidad'||a.cat==='especial')(g[a.clave]=g[a.clave]||[]).push(cap(a.dn)+' → '+cap(a.an));
  const grupos=Object.entries(g).map(([clave,l])=>({clave,n:l.length,ej:l.slice(0,8)})).sort((a,b)=>b.n-a.n);
  // Evoluciones que piden un lugar o una región (da igual qué otros requisitos tengan además: nivel, objeto, hora...).
  // 'alt' = otras formas de cumplirla que ya no piden lugar. Una entrada con 'region' pide toda una región (p. ej. Alola).
  const lug={},vl=new Set();
  for(const a of ar)for(const d of a.ent){
    const lk=Object.keys(d).find(k=>/location|region/.test(k)&&typeof d[k]==='string');
    if(!lk)continue;
    const esReg=lk!=='location',key=esReg?'región: '+d[lk]:d[lk],k=key+'|'+a.de+'|'+a.a;
    if(vl.has(k))continue;vl.add(k);
    (lug[key]=lug[key]||{region:esReg?d[lk]:'',evos:[]}).evos.push({de:a.de,dn:a.dn,a:a.a,an:a.an,req:textoEntrada(d),
      alt:a.ent.filter(x=>!Object.keys(x).some(y=>/location|region/.test(y))).map(x=>clasEntrada(x)+': '+textoEntrada(x))});
  }
  const lugares=Object.entries(lug).map(([lugar,o])=>({lugar,region:o.region,evos:o.evos})).sort((x,y)=>y.evos.length-x.evos.length);
  // Evoluciones hacia una forma regional (o hacia una especie exclusiva de una región) cuya entrada no dice ningún lugar:
  // la API no indica "estando en Alola", pero la evolución es propia de esa región.
  const regDe=a=>{const m=a.an.match(/-(alola|galar|hisui|paldea)/);return m?m[1]:EXCLUSIVAS[a.an]||''};
  const formasRegionales=ar.filter(a=>(a.a>=10000||EXCLUSIVAS[a.an])&&regDe(a)
    &&!a.ent.some(d=>Object.keys(d).some(y=>/location|region/.test(y))))
    .map(a=>({de:a.de,dn:a.dn,a:a.a,an:a.an,region:regDe(a),cat:a.cat,req:a.txt.join(' / ')}));
  const intercambioConObjeto=ar.filter(a=>a.cat==='intercambio'&&a.txt.some(t=>/equipado|por /.test(t))).length;
  return{aristas:ar,conteo,grupos,lugares,formasRegionales,intercambioConObjeto,ramasSinObjeto:ar.filter(a=>a.rama&&a.cat!=='objeto').length};
}

if(typeof module!=='undefined'){module.exports={clasEntrada,textoEntrada,clasArista,analizar,limpiarEntradas,parsearFormas,construirLineas};return}

<script>
// HERRAMIENTA TEMPORAL (se puede borrar cuando ya no haga falta).
// Descarga TODOS los ataques de la PokéAPI, los pasa por el conversor del juego y te dice, agrupados por motivo:
//   🔴 cuáles siguen ocultos (el conversor los descarta) · ⚪ cuáles no hacen nada (a propósito)
//   🟠 cuáles están disponibles pero les falta su mecánica · 🟢 qué ya está hecho a medida
// Botón flotante "🧾 Ataques". Necesita: pokeapi.js (API, jf, ERR), conversor.js, datos/ataques-especiales.js (ESP, EFX, AIL) y los ataques (CUSTOM).
// Los ataques se guardan reducidos en el navegador (la 1ª vez descarga ~900 peticiones).
// ¡OJO! Los grupos 🟠 salen de las listas a mano de abajo (la PokéAPI no dice qué ataques cargan, cambian de estadística, etc.):
// si falta alguno, añádelo ahí. Un ataque sale como pendiente solo si el juego aún no lo trata (sin fx, dt, rep, hits, efecto extra, animación propia...).
// Los que sí vienen de la API son: varios golpes, prioridad y crítico alto.
(function(){
const cap=n=>String(n).replace(/-/g,' ').replace(/^./,c=>c.toUpperCase());
const idDe=u=>+u.split('/').filter(Boolean).pop();

// ---------- Listas a mano (editables) ----------
const DOS_TURNOS=['solar-beam','solar-blade','razor-wind','skull-bash','sky-attack','freeze-shock','ice-burn','meteor-beam','electro-shot','dig','dive','bounce','phantom-force','shadow-force','sky-drop','geomancy','fly'];
const OTRA_ESTAD=['psyshock','psystrike','secret-sword','foul-play','body-press','photon-geyser','shell-side-arm','tera-blast','light-that-burns-the-sky'];
const POT_CONDICIONAL=['weather-ball','hex','venoshock','facade','brine','acrobatics','assurance','revenge','avalanche','payback','retaliate','stomping-tantrum','knock-off','smelling-salts','wake-up-slap','round','fusion-bolt','fusion-flare','echoed-voice','fury-cutter','triple-kick','triple-axel','pursuit','bolt-beak','fishious-rend','lash-out','rage-fist','last-respects','terrain-pulse','expanding-force','rising-voltage','collision-course','electro-drift','hydro-steam','stored-power','power-trip','barb-barrage','infernal-parade','temper-flare'];
const REPITE_TURNOS=['outrage','thrash','petal-dance','uproar','rollout','ice-ball','raging-fury','rage'];
const EFECTO_EXTRA=['rapid-spin','mortal-spin','brick-break','psychic-fangs','raging-bull','clear-smog','smack-down','thousand-arrows','sparkling-aria','tidy-up','steel-roller','ice-spinner'];
// Se pueden usar, pero el simulador no tiene la condición (objetos, aliados, formas): se queda la potencia/efecto base
const APROX=['covet','thief','round','fusion-flare','fusion-bolt','pursuit','poltergeist','relic-song','tera-starstorm','supercell-slam'];
const LISTAS=[
 ['dos','Dos turnos (cargan o son invulnerables en el primero)',DOS_TURNOS],
 ['otra','Daño con otra estadística (p. ej. ataca con Def. en vez de Def. Esp.)',OTRA_ESTAD],
 ['cond','Potencia condicional (clima, estado, objeto, daño recibido...)',POT_CONDICIONAL],
 ['rep','Se repite varios turnos seguidos',REPITE_TURNOS],
 ['extra','Efecto extra pendiente (rompe pantallas, quita trampas, roba objetos...)',EFECTO_EXTRA],
];

// ---------- Análisis (puro, sin DOM ni red) ----------
// lista = ataques reducidos (mismo formato que usa conv0). Devuelve {total, ok, grupos:[{id,tipo,titulo,moves:[{id,n}]}]}
function auditar(lista){
 const G={};
 const meter=(id,tipo,titulo,d)=>{(G[id]=G[id]||{id,tipo,titulo,moves:[]}).moves.push({id:d.name,n:((d.names||[])[0]||{}).name||cap(d.name)})};
 let ok=0;
 for(const d of lista){
  const meta=d.meta||{},cl=d.damage_class.name,cat=(meta.category||{}).name||'?',ail=(meta.ailment||{}).name||'none';
  let mv=null;try{mv=conv0(d)}catch(e){}
  if(!mv){
   if(cl==='status'){
    if(ail!=='none'&&ail!=='unknown'&&!AIL[ail])meter('o-ail','oculto','🔴 Estado alterado que aún no existe ('+ail+')',d);
    else meter('o-st-'+cat,'oculto','🔴 Ataque de estado sin efecto reconocido · categoría "'+cat+'"',d);
   }else meter('o-pot','oculto','🔴 Ataque con daño pero sin potencia en la PokéAPI',d);
   continue;
  }
  if(mv.ef&&mv.ef.nada){meter('sin','sin','⚪ Disponible pero no hace nada (a propósito)',d);continue}
  let pend=false;
  const p=(id,t)=>{meter(id,'pend',t,d);pend=true};
  // ¿el juego ya trata este ataque? (mecánica especial, dos turnos, repetición, efecto extra, animación propia o ataque de estado con efecto)
  const hecho=!!(mv.fx||mv.dt||mv.rep||mv.hits||(mv.sec&&mv.sec.x)||(typeof TRAMPA_DANO!=='undefined'&&TRAMPA_DANO.includes(d.name))||(typeof ESP!=='undefined'&&ESP[d.name])||(typeof CUSTOM!=='undefined'&&CUSTOM[d.name])||(typeof EFX!=='undefined'&&EFX[d.name]));
  if((meta.max_hits||0)>1&&!mv.hits&&!(mv.c>1)&&!hecho)p('p-hits','🟠 Varios golpes (hoy da un solo golpe)');
  if(!hecho)for(const[id,t,l]of LISTAS)if(l.includes(d.name))p('p-'+id,'🟠 '+t);
  if(cl!=='status'&&(meta.crit_rate||0)>0&&!mv.cr)p('p-crit','🟠 Índice de crítico alto (sin tratar)');
  if(cl!=='status'&&ail!=='none'&&ail!=='unknown'&&!AIL[ail]&&!(mv.ef&&mv.ef.a))p('p-ail','🟠 Provoca un estado que aún no existe ('+ail+')');
  if(APROX.includes(d.name)){meter('a-aprox','aprox','🟡 Potencia o efecto base: la condición real no existe en el simulador',d);pend=false}
  if(!pend)ok++;
  if(typeof CUSTOM!=='undefined'&&CUSTOM[d.name])meter('i-cu','info','🟢 Con animación propia (custom)',d);
  if(mv.hits)meter('i-hits','info','🟢 Varios golpes',d);
  if(mv.dt)meter('i-dt','info','🟢 Dos turnos (carga o se esconde)',d);
  if(mv.rep)meter('i-rep','info','🟢 Se repite varios turnos',d);
  if(mv.pr)meter('i-pr','info','🟢 Con prioridad (golpea más rápido, la IA lo usa para rematar)',d);
  if(mv.cr)meter('i-cr','info','🟢 Con índice de crítico alto',d);
  if(mv.sec&&mv.sec.x)meter('i-x','info','🟢 Con efecto extra (quita trampas, rompe pantallas...)',d);
  if(typeof ESP!=='undefined'&&ESP[d.name])meter('i-esp','info','🟢 Con mecánica especial (daño fijo, KO, potencia variable, contraataque, se debilita...)',d);
  if(typeof EFX!=='undefined'&&EFX[d.name]&&!EFX[d.name].nada)meter('i-efx','info','🟢 Ataque de estado con efecto propio (campo, protección, control, cambios...)',d);
 }
 const ord={oculto:0,sin:1,pend:2,aprox:3,info:4};
 const grupos=Object.values(G).sort((a,b)=>ord[a.tipo]-ord[b.tipo]||b.moves.length-a.moves.length);
 for(const g of grupos)g.moves.sort((a,b)=>a.n.localeCompare(b.n));
 return{total:lista.length,ok,grupos};
}
if(typeof module!=='undefined'){module.exports={auditar,LISTAS};return}

// ---------- Carga desde la PokéAPI ----------
const AK='ataques-auditoria-v1';let AC={};try{AC=JSON.parse(localStorage.getItem(AK)||'{}')}catch(e){}
const reducir=j=>({name:j.name,names:(j.names||[]).filter(x=>x.language.name==='es').slice(0,1),type:{name:j.type.name},damage_class:{name:j.damage_class.name},
 power:j.power,accuracy:j.accuracy,priority:j.priority,stat_changes:j.stat_changes||[],target:j.target&&{name:j.target.name},
 meta:j.meta&&{ailment:j.meta.ailment,ailment_chance:j.meta.ailment_chance,flinch_chance:j.meta.flinch_chance,drain:j.meta.drain,healing:j.meta.healing,
  stat_chance:j.meta.stat_chance,min_hits:j.meta.min_hits,max_hits:j.meta.max_hits,crit_rate:j.meta.crit_rate,category:j.meta.category}});
async function cargar(prog){
 const l=await jf(API+'move?limit=2000'),nombres=l.results.filter(r=>idDe(r.url)<=10000).map(r=>r.name),falta=nombres.filter(n=>!AC[n]);
 for(let i=0;i<falta.length;i+=9){
  await Promise.all(falta.slice(i,i+9).map(async n=>{try{AC[n]=reducir(await jf(API+'move/'+n+'/'))}catch(e){}}));
  prog(`Ataques ${Math.min(falta.length,i+9)}/${falta.length}`);
 }
 try{localStorage.setItem(AK,JSON.stringify(AC))}catch(e){}
 return nombres.map(n=>AC[n]).filter(Boolean);
}

// ---------- Pantalla ----------
const $$=(t,css,html)=>{const e=document.createElement(t);if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;return e};
const COL={oculto:'#f87171',sin:'#94a3b8',pend:'#fb923c',aprox:'#facc15',info:'#4ade80'};
function pintar(out,R,filtro){
 const q=(filtro||'').trim().toLowerCase();
 const cuenta=t=>R.grupos.filter(g=>g.tipo===t).reduce((s,g)=>s+g.moves.length,0);
 let h=`<b>${R.total} ataques analizados</b> · completos y sin pendientes: <b style="color:#4ade80">${R.ok}</b><br>
  <small>Un ataque puede salir en varios grupos 🟠 a la vez. Los números de cada grupo cuentan ataques, no repeticiones.</small>
  <table style="border-collapse:collapse;margin:8px 0">${[['oculto','🔴 Ocultos'],['sin','⚪ No hacen nada'],['pend','🟠 Entradas pendientes (suma por grupo)'],['info','🟢 Hechos a medida (suma por grupo)']]
  .map(([t,l])=>`<tr><td style="padding:2px 12px 2px 0">${l}</td><td><b style="color:${COL[t]}">${cuenta(t)}</b></td></tr>`).join('')}</table>`;
 for(const g of R.grupos){
  const m=q?g.moves.filter(x=>x.n.toLowerCase().includes(q)||x.id.includes(q)):g.moves;
  if(!m.length)continue;
  h+=`<details style="margin:6px 0" ${q?'open':''}><summary style="cursor:pointer;color:${COL[g.tipo]}"><b>${g.titulo}</b> <small>(${m.length}${q?' de '+g.moves.length:''})</small></summary>
   <div style="padding:4px 0 6px">${m.map(x=>`<span style="display:inline-block;border:1px solid #334155;border-radius:6px;padding:1px 6px;margin:2px;font-size:12px">${x.n} <small style="opacity:.55">${x.id}</small></span>`).join('')}</div></details>`;
 }
 out.innerHTML=h;
}
function abrir(){
 const ov=$$('div','position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.75);overflow:auto;padding:12px;font:13px system-ui,sans-serif;color:#e2e8f0');
 const pn=$$('div','max-width:820px;margin:0 auto;background:#0f172a;border:1px solid #334155;border-radius:10px;padding:12px');
 const go=$$('button','margin-right:6px','▶ Cargar y auditar'),x=$$('button','float:right','✕'),st=$$('div','margin:8px 0;min-height:18px'),
  bus=$$('input','margin:6px 6px 6px 0;width:180px;display:none'),out=$$('div'),acc=$$('div','margin:8px 0;display:none');
 bus.placeholder='Buscar ataque…';
 pn.append(x,$$('b','','🧾 Auditoría de ataques'),$$('div','margin:8px 0','Pasa todos los ataques de la PokéAPI por el conversor del juego y los agrupa por lo que les falta. La 1ª vez descarga unos 900 ataques.'),go,st,acc,bus,out);
 ov.append(pn);document.body.append(ov);x.onclick=()=>ov.remove();
 let R=null;
 const mostrar=lista=>{
  R=auditar(lista);pintar(out,R);bus.style.display='inline-block';acc.style.display='block';acc.innerHTML='';
  const d=$$('button','margin-right:6px','⬇ Descargar informe (JSON)');
  d.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(R,null,1)],{type:'application/json'}));a.download='auditoria-ataques.json';a.click()};
  const c=$$('button','','📋 Copiar ocultos (ids)');
  c.onclick=()=>{const t=R.grupos.filter(g=>g.tipo==='oculto').flatMap(g=>g.moves.map(m=>m.id)).join('\n');navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>{st.textContent='Copiados '+t.split('\n').length+' ids de ataques ocultos.'})};
  acc.append(d,c);
 };
 bus.oninput=()=>R&&pintar(out,R,bus.value);
 go.onclick=async()=>{
  go.disabled=true;
  try{const l=await cargar(t=>st.textContent=t);st.textContent='Listo.';mostrar(l)}catch(e){st.textContent=ERR}
  go.disabled=false;
 };
 if(Object.keys(AC).length>700){st.textContent='Datos en caché.';mostrar(Object.values(AC))}
}
const b=$$('button','position:fixed;right:10px;bottom:190px;z-index:9998;opacity:.85','🧾 Ataques');
b.onclick=abrir;document.body.append(b);
})();

<script>
// HERRAMIENTA TEMPORAL (se puede borrar cuando ya no haga falta).
// 1) Descarga de la PokéAPI las habilidades de cada especie (normales y oculta) con su nombre y descripción en español y genera habilidades-datos.js.
// 2) Auditoría: qué habilidades y objetos están hechos (HAB, OBJ_EQ), agrupados por tipo de efecto, y cuáles faltan (las habilidades, ordenadas por nº de especies que las tienen).
// Botón flotante "🧬 Habilidades". Necesita: pokeapi.js (API, jf, GEN, ERR) y los ganchos del motor (HAB, OBJ_EQ). Va después de pokeapi.js.
// HABILIDADES_ESP[id] = [[normales], oculta|null] · HABILIDADES_INFO[habilidad] = [nombre, descripción]
(function(){
const cap=n=>String(n).replace(/-/g,' ').replace(/^./,c=>c.toUpperCase());

// ---------- Auditoría (pura, sin DOM ni red) ----------
// ESP = HABILIDADES_ESP · INFO = HABILIDADES_INFO · H = HAB · O = OBJ_EQ · holdables = claves de objetos equipables de la PokéAPI
function auditar(ESP,INFO,H,O,holdables=[]){
 const uso={};
 for(const id in ESP){const[n,o]=ESP[id];for(const a of new Set([...(n||[]),o].filter(Boolean)))uso[a]=(uso[a]||0)+1}
 const G={},pend=[];
 for(const a of Object.keys(uso)){
  const it={id:a,n:(INFO[a]||[])[0]||(H[a]&&H[a].n)||cap(a),especies:uso[a]};
  if(H[a]){const g=H[a].g||'Otras';(G[g]=G[g]||[]).push(it)}else pend.push(it);
 }
 pend.sort((a,b)=>b.especies-a.especies||a.n.localeCompare(b.n));
 const grupos=Object.entries(G).map(([g,l])=>({g,l:l.sort((a,b)=>b.especies-a.especies)})).sort((a,b)=>b.l.length-a.l.length);
 const OG={};
 for(const k of Object.keys(O)){const g=O[k].g||'Otros';(OG[g]=OG[g]||[]).push({id:k,n:O[k].n})}
 const objGrupos=Object.entries(OG).map(([g,l])=>({g,l}));
 const objPend=holdables.filter(k=>!O[k]).sort();
 const hechas=Object.keys(uso).length-pend.length;
 return{total:Object.keys(uso).length,hechas,grupos,pendientes:pend,objHechos:Object.keys(O).length,objGrupos,objPendientes:objPend};
}
if(typeof module!=='undefined'){module.exports={auditar};return}

// ---------- Carga desde la PokéAPI ----------
const MAX=GEN[GEN.length-1][1],KE='habilidades-especies-v1',KI='habilidades-info-v1',KH='habilidades-holdables-v1';
const rd=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch(e){return d}};
let CE=rd(KE,{}),CI=rd(KI,{}),CH=rd(KH,null);
const guardar=()=>{try{localStorage.setItem(KE,JSON.stringify(CE));localStorage.setItem(KI,JSON.stringify(CI));if(CH)localStorage.setItem(KH,JSON.stringify(CH))}catch(e){}};
async function lotes(items,fn,prog,txt){
 for(let i=0;i<items.length;i+=9){await Promise.all(items.slice(i,i+9).map(x=>fn(x).catch(()=>null)));prog(`${txt} ${Math.min(items.length,i+9)}/${items.length}`)}
}
async function cargar(prog){
 const ids=[];for(let i=1;i<=MAX;i++)if(!CE[i])ids.push(i);
 await lotes(ids,async id=>{
  const p=await jf(API+'pokemon/'+id),ab=p.abilities.slice().sort((a,b)=>a.slot-b.slot);
  const n=[...new Set(ab.filter(x=>!x.is_hidden).map(x=>x.ability.name))],o=(ab.find(x=>x.is_hidden)||{ability:{}}).ability.name||null;
  CE[id]=[n,o];
 },prog,'Especies');
 const nombres=[...new Set(Object.values(CE).flatMap(([n,o])=>[...n,o].filter(Boolean)))].filter(a=>!CI[a]);
 await lotes(nombres,async a=>{
  const j=await jf(API+'ability/'+a+'/'),es=j.names.find(x=>x.language.name==='es'),
   ft=j.flavor_text_entries.filter(x=>x.language.name==='es').pop()||j.flavor_text_entries.filter(x=>x.language.name==='en').pop(),
   ef=(j.effect_entries.find(x=>x.language.name==='en')||{}).short_effect;
  CI[a]=[es?es.name:cap(a),((ft&&ft.flavor_text)||ef||'').replace(/\s+/g,' ')];
 },prog,'Habilidades');
 if(!CH){prog('Objetos equipables…');CH=(await jf(API+'item-attribute/holdable')).items.map(x=>x.name)}
 guardar();
}

<script>
// Habilidad y objeto equipado de las CARTAS del gacha (código PURO: sin red ni DOM).
//  · carta.habilidad = clave de la habilidad (PokéAPI) · carta.habSlot = hueco de la especie: 0, 1 (normales) o 'o' (oculta) · carta.objeto = clave de OBJ_EQ o null
//  · La habilidad se sortea al conseguir la carta con las de su especie (HABILIDADES_ESP, generado por la herramienta 🧬 Habilidades): la oculta sale rara.
//  · Al evolucionar se conserva el hueco (la habilidad cambia si la nueva especie tiene otra en ese hueco).
//  · Un objeto se equipa sacando 1 unidad del inventario; si ya había otro, vuelve al inventario (no se pierde). Se puede quitar (vuelve al inventario). Solo se pierden los de un solo uso gastados en combate.
// Va DESPUÉS de evoluciones-datos.js (registra los objetos nuevos en OBJETOS) y ANTES de guardado.js.
const HabCarta=(()=>{
 const P_OCULTA=.05;   // probabilidad de la habilidad oculta (si la especie la tiene)
 const cap=n=>String(n).replace(/-/g,' ').replace(/^./,c=>c.toUpperCase());
 const datos=()=>typeof HABILIDADES_ESP!=='undefined'?HABILIDADES_ESP:null;
 const info_=()=>typeof HABILIDADES_INFO!=='undefined'?HABILIDADES_INFO:{};
 function opciones(id){const d=datos(),e=d&&d[id];return e?{n:e[0]||[],o:e[1]||null}:null}
 function sortear(id,rng=Math.random){
  const e=opciones(id);if(!e||(!e.n.length&&!e.o))return null;
  if(e.o&&(!e.n.length||rng()<P_OCULTA))return{hab:e.o,slot:'o'};
  const i=Math.floor(rng()*e.n.length);return{hab:e.n[i],slot:i};
 }
 function slotDe(id,hab){const e=opciones(id);if(!e)return 0;if(e.o===hab)return'o';const i=e.n.indexOf(hab);return i<0?0:i}
 function porSlot(id,slot){const e=opciones(id);if(!e)return null;
  if(slot==='o'&&e.o)return{hab:e.o,slot:'o'};
  const i=typeof slot==='number'&&e.n[slot]?slot:0;
  return e.n[i]?{hab:e.n[i],slot:i}:(e.o?{hab:e.o,slot:'o'}:null);
 }
 // Cartas que aún no tienen habilidad (antiguas o conseguidas sin datos): se les sortea. Devuelve true si cambió algo.
 function dar(c,rng){
  let cambio=false;
  if(c.objeto===undefined){c.objeto=null;cambio=true}
  if(!c.habilidad){const h=sortear(c.especieId,rng);if(h){c.habilidad=h.hab;c.habSlot=h.slot;cambio=true}}
  return cambio;
 }
 function alEvolucionar(c){const h=porSlot(c.especieId,c.habSlot);if(h){c.habilidad=h.hab;c.habSlot=h.slot}}
 const infoHab=k=>{
  if(!k)return{n:'—',d:'Sin habilidad (faltan los datos: carga habilidades-datos.js).',hecho:false};
  const H=typeof HAB!=='undefined'&&HAB[k],I=info_()[k]||[];
  return{n:I[0]||(H&&H.n)||cap(k),d:(H&&H.d)||I[1]||'',hecho:!!H};   // el nombre oficial de la PokéAPI manda; el de la tabla es de reserva
 };
 const infoObj=k=>{const O=typeof OBJ_EQ!=='undefined'&&OBJ_EQ[k];return O?{n:O.n,i:O.i||'📦',d:O.d||''}:{n:cap(k),i:'📦',d:''}};
 const objetosEquipables=()=>typeof OBJ_EQ!=='undefined'?Object.keys(OBJ_EQ):[];
 // Equipa el objeto k sacando 1 del inventario; el que llevaba la carta (si había) vuelve al inventario. Devuelve {ok, devuelto (el que había antes) | motivo}
 function equipar(p,c,k){
  if(typeof OBJ_EQ==='undefined'||!OBJ_EQ[k])return{ok:false,motivo:'Ese objeto no se puede equipar'};
  const o=p.objetos||(p.objetos={});
  if(!(o[k]>0))return{ok:false,motivo:'No te quedan'};
  o[k]--;if(o[k]<=0)delete o[k];
  const devuelto=c.objeto||null;if(devuelto)o[devuelto]=(o[devuelto]||0)+1;
  c.objeto=k;return{ok:true,devuelto};
 }
 // Quita el objeto de la carta y lo devuelve al inventario. Devuelve {ok, quitado | motivo}
 function quitar(p,c){
  if(!c.objeto)return{ok:false,motivo:'No lleva objeto'};
  const o=p.objetos||(p.objetos={}),k=c.objeto;o[k]=(o[k]||0)+1;c.objeto=null;return{ok:true,quitado:k};
 }
 // Objetos nuevos → inventario (nombre e icono) y objetos de prueba
 if(typeof OBJETOS!=='undefined'&&typeof OBJ_EQ!=='undefined')for(const k of Object.keys(OBJ_EQ))if(!OBJETOS[k])OBJETOS[k]=[OBJ_EQ[k].n,OBJ_EQ[k].i||'📦'];
 if(typeof OBJETOS_PRUEBA!=='undefined')Object.assign(OBJETOS_PRUEBA,{'leftovers':2,'life-orb':2,'sitrus-berry':5});
 // Cartas de prueba con habilidad y objeto: [especie, nivel, arquetipo, género, estrellas, habilidad, objeto]
 const CARTAS_PRUEBA=[[130,30,'fisico',null,0,'intimidate','leftovers'],[92,30,'especial',null,0,'levitate','life-orb'],[291,30,'fisico',null,0,'speed-boost','sitrus-berry']];
 return{P_OCULTA,opciones,quitar,sortear,slotDe,porSlot,dar,alEvolucionar,infoHab,infoObj,objetosEquipables,equipar,CARTAS_PRUEBA};
})();
if(typeof module!=='undefined')module.exports=HabCarta;
</script>
<script>
// Capa de guardado LOCAL del modo gacha: perfiles + partida de cada perfil.
// Todas las funciones son async a propósito: si algún día se guarda en un servidor,
// solo habría que cambiar este archivo y los modos seguirían igual.
//
// Lo que se guarda por perfil (localStorage, una clave por perfil):
//   { version, jugador:{nombre,creado}, contador, monedas:{gemas}, objetos:{}, box:[cartas],
//     equipo:[], pity:{}, tutorial:{inicial}, misiones:{}, login:{}, eventos:{} }
// Una carta de la box es una INSTANCIA: {id, especieId, arquetipo, nivel, xp, estrellas, ivs,
//   naturaleza, ataquesMT, bloqueado, obtenidoEn, origen, habilidad, habSlot, objeto}. La rareza y el kit NO se guardan: se calculan.

const Guardado=(()=>{
  const VERSION=1;
  const K={perfiles:'gacha-perfiles',activo:'gacha-perfil-activo',partida:id=>'gacha-partida-'+id};
  const hoy=()=>new Date().toISOString().slice(0,10);
  const leer=(k,def)=>{try{const v=localStorage.getItem(k);return v==null?def:JSON.parse(v)}catch(e){return def}};
  const escribir=(k,v)=>localStorage.setItem(k,JSON.stringify(v));   // puede lanzar si no queda espacio

  // Naturalezas: nombre en español, estadística que sube (u) y la que baja (d)
  const NATURALEZAS={
    hardy:{n:'Fuerte'},lonely:{n:'Huraña',u:'atk',d:'def'},brave:{n:'Audaz',u:'atk',d:'spe'},adamant:{n:'Firme',u:'atk',d:'spa'},
    naughty:{n:'Pícara',u:'atk',d:'spd'},bold:{n:'Osada',u:'def',d:'atk'},docile:{n:'Dócil'},relaxed:{n:'Plácida',u:'def',d:'spe'},
    impish:{n:'Agitada',u:'def',d:'spa'},lax:{n:'Floja',u:'def',d:'spd'},timid:{n:'Miedosa',u:'spe',d:'atk'},
    hasty:{n:'Activa',u:'spe',d:'def'},serious:{n:'Seria'},jolly:{n:'Alegre',u:'spe',d:'spa'},naive:{n:'Ingenua',u:'spe',d:'spd'},
    modest:{n:'Modesta',u:'spa',d:'atk'},mild:{n:'Afable',u:'spa',d:'def'},quiet:{n:'Mansa',u:'spa',d:'spe'},bashful:{n:'Tímida'},
    rash:{n:'Alocada',u:'spa',d:'spd'},calm:{n:'Serena',u:'spd',d:'atk'},gentle:{n:'Amable',u:'spd',d:'def'},
    sassy:{n:'Grosera',u:'spd',d:'spe'},careful:{n:'Cauta',u:'spd',d:'spa'},quirky:{n:'Rara'}};

  function nuevaPartida(nombre){
    return{version:VERSION,jugador:{nombre,creado:hoy()},contador:0,monedas:{gemas:0},objetos:{},box:[],equipo:[],
      pity:{},tutorial:{inicial:false},misiones:{},login:{racha:0,ultimoDia:null},eventos:{}};
  }
  // Valida una partida y la pone al día (aquí irán las migraciones cuando cambie el formato).
  function migrar(d){
    if(!d||typeof d!=='object'||!Array.isArray(d.box))throw new Error('Partida no válida');
    return{...nuevaPartida((d.jugador&&d.jugador.nombre)||'Jugador'),...d,version:VERSION};
  }
  const nuevoId=()=>'j'+Date.now().toString(36)+Math.floor(Math.random()*46656).toString(36);

  const listarPerfiles=async()=>leer(K.perfiles,[]);
  async function crearPerfil(nombre,datos){
    const id=nuevoId(),ps=leer(K.perfiles,[]);
    ps.push({id,nombre,creado:hoy()});
    escribir(K.partida(id),datos||nuevaPartida(nombre));escribir(K.perfiles,ps);escribir(K.activo,id);
    return id;
  }
  async function borrarPerfil(id){
    escribir(K.perfiles,leer(K.perfiles,[]).filter(p=>p.id!==id));
    localStorage.removeItem(K.partida(id));
    if(leer(K.activo,null)===id)localStorage.removeItem(K.activo);
  }
  async function perfilActivo(){
    const id=leer(K.activo,null);
    return leer(K.perfiles,[]).some(p=>p.id===id)?id:null;
  }
  const elegirPerfil=async id=>escribir(K.activo,id);
  async function cargarPartida(id){const d=leer(K.partida(id),null);return d?migrar(d):null}
  const guardarPartida=async(id,d)=>escribir(K.partida(id),d);

  const exportarPartida=d=>JSON.stringify(d,null,1);
  // Importa como perfil NUEVO (nunca pisa uno existente).
  async function importarPartida(texto){
    const d=migrar(JSON.parse(texto)),nombre=d.jugador.nombre+' (importado)';
    d.jugador={...d.jugador,nombre};
    return crearPerfil(nombre,d);
  }

  // Crea la instancia de una carta tirada ({especieId, arquetipo}) y la mete en la box.
  function nuevaCarta(partida,carta,origen,rng=Math.random){
    const ivs={};for(const s of['hp','atk','def','spa','spd','spe'])ivs[s]=Math.floor(rng()*32);
    const nat=Object.keys(NATURALEZAS);
    const c={id:'p'+(++partida.contador),especieId:carta.especieId,arquetipo:carta.arquetipo,nivel:1,xp:0,estrellas:0,
      ivs,naturaleza:nat[Math.floor(rng()*nat.length)],ataquesMT:[],bloqueado:false,obtenidoEn:hoy(),origen,objeto:null};
    if(typeof HabCarta!=='undefined'){const h=HabCarta.sortear(carta.especieId,rng);if(h){c.habilidad=h.hab;c.habSlot=h.slot}}   // habilidad sorteada (ver habilidades-carta.js)
    partida.box.push(c);
    return c;
  }

  return{VERSION,NATURALEZAS,nuevaPartida,migrar,listarPerfiles,crearPerfil,borrarPerfil,perfilActivo,elegirPerfil,
    cargarPartida,guardarPartida,exportarPartida,importarPartida,nuevaCarta};
})();

if(typeof module!=='undefined')module.exports=Guardado;
</script>

<script>
// Selector de ataques: ⭐ sugeridos · 📚 aprendibles (nivel/MT/tutor/huevo) · 🌐 todos.
// Los ataques elegidos se añaden a TY[pokemon].pool y se guarda su índice en o.s,
// así que el combate (spawn) no necesita cambios.
const SA_TIPOS={normal:'Normal',fire:'Fuego',water:'Agua',electric:'Eléctrico',grass:'Planta',ice:'Hielo',fighting:'Lucha',poison:'Veneno',ground:'Tierra',flying:'Volador',psychic:'Psíquico',bug:'Bicho',rock:'Roca',ghost:'Fantasma',dragon:'Dragón',dark:'Siniestro',steel:'Acero',fairy:'Hada'};
let saMode='sug',saF={q:'',ty:'',cat:'',me:'',so:'nivel'},saLim=40,saTok=0,saDb=0,saAll=null,saMC={};
const saNz=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\s-]+/g,'');
const saCur=()=>TM[sel[0]]&&TM[sel[0]][sel[1]];
const saEff=y=>saMode=='learn'&&!y.learn?'sug':saMode;
const saOpt=(L,cur)=>L.map(([k,l])=>`<option value="${k}"${cur==k?' selected':''}>${l}</option>`).join('');
const saTags=e=>[e.m.nivel?`<span class="tag">${e.lv>0?'Nv '+e.lv:'Evol.'}</span>`:'',e.m.mt?'<span class="tag">MT</span>':'',e.m.tutor?'<span class="tag">Tutor</span>':'',e.m.egg?'<span class="tag">Huevo</span>':'',(e.m.otro&&!e.m.nivel&&!e.m.mt&&!e.m.tutor&&!e.m.egg)?'<span class="tag">Especial</span>':''].join('');

// Lista completa de ataques con su tipo (18 peticiones la primera vez; luego localStorage).
async function saLoadList(){if(saAll)return saAll;
 try{const c=JSON.parse(localStorage.getItem('sa-ataques')||'null');if(c&&c.length>500){saAll=c;return saAll}}catch(e){}
 const L=[];await Promise.all(Object.keys(SA_TIPOS).map(async t=>{const j=await jf(API+'type/'+t);for(const m of j.moves)L.push({n:m.name,t})}));
 L.sort((a,b)=>a.n<b.n?-1:a.n>b.n?1:0);saAll=L;try{localStorage.setItem('sa-ataques',JSON.stringify(L))}catch(e){}return L}
function saNames(){const q=saNz(saF.q);return(saAll||[]).filter(m=>(!saF.ty||m.t==saF.ty)&&(!q||saNz(m.n).includes(q)))}

// Carga los detalles de los ataques (lotes de 9, con la caché mvc de pokeapi.js).
async function saEnsure(names,tok){const todo=names.filter(n=>saMC[n]===undefined);
 for(let i=0;i<todo.length;i+=9){if(tok!=saTok)return;const b=todo.slice(i,i+9),r=await Promise.all(b.map(n=>mvData({n,u:API+'move/'+n+'/'})));if(tok!=saTok)return;
  b.forEach((n,k)=>{if(r[k]||mvc[n]!==undefined)saMC[n]=r[k]});saDraw()}}

function saIdx(o,k){const y=TY[o.t],v=saMC[k];if(!v)return -1;let i=y.pool.findIndex(x=>x&&!Array.isArray(x)&&x.key==v.key);if(i<0){y.pool.push(v);i=y.pool.length-1}return i}
function saToggle(o,i){const k=o.s.indexOf(i);if(k>=0)o.s.splice(k,1);else if(o.s.length<4)o.s.push(i)}

function saPanel(o,y){const md=saEff(y),tab=(k,l)=>`<button data-md="${k}" class="${md==k?'on':''}">${l}</button>`,
 ty=`<select id="mty"><option value="">Todos los tipos</option>${saOpt(Object.entries(SA_TIPOS),saF.ty)}</select>`,
 ex=md=='learn'?`<select id="mcat">${saOpt([['','Toda categoría'],['phy','Físico'],['spe','Especial'],['sta','Estado']],saF.cat)}</select><select id="mme">${saOpt([['','Cualquier forma'],['nivel','Por nivel'],['mt','MT'],['tutor','Tutor'],['egg','Huevo']],saF.me)}</select><select id="mso">${saOpt([['nivel','Orden: nivel'],['poder','Orden: poder'],['nombre','Orden: nombre']],saF.so)}</select>`:'',
 fl=md=='sug'?'':`<div class="mfl"><input id="ms" placeholder="${md=='all'?'Buscar (nombre en inglés)…':'Buscar ataque…'}" value="${saF.q.replace(/"/g,'&quot;')}">${ty}${ex}</div>`;
 return `<div class="mh">Ataques · elige 4 <b id="mcnt" class="${o.s.length==4?'ok':'no'}">${o.s.length}/4</b><small>⚔️ Físico · ✨ Especial · 🛡️ Estado</small></div><div id="meq" class="meq"></div><div class="mtabs">${tab('sug','⭐ Sugeridos')}${y.learn?tab('learn','📚 Aprendibles'):''}${tab('all','🌐 Todos')}</div>${fl}<div id="mnote"></div><div class="mg" id="mlist"></div><button id="mmore" data-more="1" style="display:none">Ver más</button>`}

function saItems(o,y,md){
 if(md=='sug')return{L:y.pool.slice(0,y.sg||y.pool.length).map((a,i)=>({v:mkmv(o.t,a),at:`data-m="${i}"`,on:o.s.includes(i)})),more:false};
 const q=saNz(saF.q),mk=(n,tags)=>{const v=saMC[n];if(!v)return null;const i=y.pool.findIndex(x=>x&&!Array.isArray(x)&&x.key==v.key);return{v,tags,at:`data-mk="${n}"`,on:i>=0&&o.s.includes(i)}};
 if(md=='learn'){
  const L=Object.values(y.learn).map(e=>({e,v:saMC[e.n]})).filter(x=>x.v&&(!q||saNz(x.e.n).includes(q)||saNz(x.v.n).includes(q))&&(!saF.ty||x.v.t==TN[saF.ty])&&(!saF.cat||x.v.cat==saF.cat)&&(!saF.me||x.e.m[saF.me])),so=saF.so,lv=x=>x.e.m.nivel?(x.e.lv||0):999;
  L.sort((a,b)=>so=='poder'?(b.v.p-a.v.p)||a.v.n.localeCompare(b.v.n):so=='nombre'?a.v.n.localeCompare(b.v.n):(lv(a)-lv(b))||a.v.n.localeCompare(b.v.n));
  return{L:L.map(x=>mk(x.e.n,saTags(x.e))),more:false}}
 const A=saNames();return{L:A.slice(0,saLim).map(m=>mk(m.n,'')).filter(Boolean),more:A.length>saLim}}

const saCard=x=>{const v=x.v;return `<button class="mc${x.on?' on':''}" ${x.at} style="--t:${TC[v.t]}"><div class="mt">${TI(v.t,18)}<b>${v.n}</b>${x.on?'<span class="ck">✓</span>':''}</div><div class="mm"><span>${CI[v.cat]} ${v.cat=='phy'?'Físico':v.cat=='sta'?'Estado':'Especial'}</span>${v.p?`<span>Poder ${Math.round(v.p)}</span>`:''}${v.acc?`<span>${v.acc}%</span>`:''}<span>⏱ ${v.cd.toFixed(1)}s</span>${v.u?'<span class="ul">★ Final</span>':''}</div>${x.tags?`<div class="tg">${x.tags}</div>`:''}${v.ef?`<div class="ef">${v.ef.d}</div>`:''}</button>`};

// Redibuja SOLO las zonas del selector (no toda la pantalla), para no perder el foco al escribir.
function saDraw(){const o=saCur(),box=$('#mlist');if(!o||!box)return;const y=TY[o.t],md=saEff(y);
 $('#meq').innerHTML=o.s.length?o.s.map(i=>{const v=mkmv(o.t,y.pool[i]);return `<button class="mq" data-m="${i}" style="--t:${TC[v.t]}">${TI(v.t,16)}<b>${v.n}</b><span>✕</span></button>`}).join(''):'<small>Aún no has elegido ataques</small>';
 const c=$('#mcnt');c.textContent=o.s.length+'/4';c.className=o.s.length==4?'ok':'no';
 const{L,more}=saItems(o,y,md),st=box.scrollTop;box.innerHTML=L.map(saCard).join('')||'<small>Sin resultados</small>';box.scrollTop=st;
 let note='';
 if(md=='learn'){const T=Object.keys(y.learn),d=T.filter(n=>saMC[n]!==undefined).length;note=d<T.length?`Cargando ataques… ${d}/${T.length}`:`${L.length} ataques que puede aprender (se ocultan los que el juego aún no puede simular)`}
 else if(md=='all')note=saAll?`${saNames().length} ataques en la lista (se ocultan los que el juego aún no puede simular)`:'Cargando lista de ataques…';
 $('#mnote').textContent=note;$('#mmore').style.display=more?'block':'none'}

function saMore(){const o=saCur();if(o&&saEff(TY[o.t])=='all')saEnsure(saNames().slice(0,saLim).map(m=>m.n),saTok)}
async function saLoadAll(tok){try{await saLoadList()}catch(e){const n=$('#mnote');if(n)n.textContent=ERR;return}if(tok!=saTok)return;saDraw();saMore()}
function saStart(){saTok++;const o=saCur();if(!o)return;const y=TY[o.t],md=saEff(y),tok=saTok;saDraw();
 if(md=='learn')saEnsure(Object.values(y.learn).sort((a,b)=>(b.m.nivel?1:0)-(a.m.nivel?1:0)).map(e=>e.n),tok);
 else if(md=='all')saLoadAll(tok)}
function saFilt(){const o=saCur();if(!o)return;saLim=40;saDraw();if(saEff(TY[o.t])=='all'){clearTimeout(saDb);saDb=setTimeout(saMore,250)}}

$('#setup').addEventListener('input',e=>{if(e.target.id=='ms'){saF.q=e.target.value;saFilt()}});

<script>
// Pantalla de selección de equipos.
let TM=[[],[]],sel=[0,0];
function focusFi(){const e=document.querySelector('.fi');if(e&&e.scrollIntoView)e.scrollIntoView({behavior:'smooth',block:'nearest'})}
const miHTML=o=>{const y=TY[o.t];return o.s.map(j=>TI(mkmv(o.t,y.pool[j]).t,12)).join('')+(o.s.length!=4?'<em>'+o.s.length+'/4</em>':'')};
function goState(){$('#go').disabled=!(TM[0].length&&TM[1].length)||TM.some(a=>a.some(o=>o.s.length!=4))}
// Actualiza solo la casilla del Pokémon seleccionado (iconos de ataque, borde naranja) y el botón de comenzar.
function slotUpd(){const o=saCur();if(!o)return;const b=document.querySelector(`.sc[data-s="${sel[0]}"][data-i="${sel[1]}"]`);if(b){b.querySelector('.mi').innerHTML=miHTML(o);b.classList.toggle('bad',o.s.length!=4)}goState()}
// Habilidad y objeto equipado del Pokémon seleccionado (se guardan en o.hab / o.obj y viajan al combate con start()).
// Habilidades: las de su especie (HABILIDADES_ESP) y, aparte, todas las que el juego ya sabe hacer (para probar).
function haPanel(o){
 if(typeof HAB==='undefined'||typeof OBJ_EQ==='undefined')return'';
 const id=parseInt(String(o.t).slice(1)),E=typeof HabCarta!=='undefined'?HabCarta.opciones(id):null,nm=k=>typeof HabCarta!=='undefined'?HabCarta.infoHab(k).n:k,
  esp=E?[...E.n,E.o].filter(Boolean):[],otras=Object.keys(HAB).filter(k=>!esp.includes(k)),
  op=(k,t)=>`<option value="${k}"${o.hab===k?' selected':''}>${t}</option>`;
 return `<div class="mh">Habilidad y objeto</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0">
  <select id="hab-sel" style="flex:1;min-width:150px"><option value="">Sin habilidad</option>
   ${esp.length?`<optgroup label="De la especie">${esp.map(k=>op(k,nm(k)+(E&&k===E.o?' (oculta)':'')+(HAB[k]?'':' · sin efecto aún'))).join('')}</optgroup>`:''}
   ${otras.length?`<optgroup label="Otras (para probar)">${otras.map(k=>op(k,nm(k))).join('')}</optgroup>`:''}</select>
  <select id="obj-sel" style="flex:1;min-width:150px"><option value="">Sin objeto</option>${Object.keys(OBJ_EQ).map(k=>`<option value="${k}"${o.obj===k?' selected':''}>${OBJ_EQ[k].i||''} ${OBJ_EQ[k].n}</option>`).join('')}</select></div>
  <small style="opacity:.7" id="ha-desc">${haDesc(o)}</small>`;
}
const haDesc=o=>[o.hab&&HAB[o.hab]?'🧬 '+HAB[o.hab].d:'',o.obj&&OBJ_EQ[o.obj]?'🎒 '+OBJ_EQ[o.obj].d:''].filter(Boolean).join(' · ');
$('#setup').addEventListener('change',e=>{
 if(e.target.id!='hab-sel'&&e.target.id!='obj-sel')return;
 const o=saCur();if(!o)return;
 if(e.target.id=='hab-sel')o.hab=e.target.value||null;else o.obj=e.target.value||null;
 const d=$('#ha-desc');if(d)d.textContent=haDesc(o)});
function rend(){const SC={hp:'#22c55e',atk:'#f97316',def:'#eab308',spa:'#38bdf8',spd:'#84cc16',spe:'#f472b6'};
 let h=TM.map((a,s)=>`<div class="tp" style="--c:${s?'#ef4444':'#3b82f6'}"><div class="th"><span>${s?'🔴':'🔵'} EQUIPO ${s+1}</span><span>${a.length}/6</span></div><div class="sg">${[0,1,2,3,4,5].map(i=>{const o=a[i];if(!o)return `<button class="sc em" data-s="${s}" data-i="${i}">+</button>`;const y=TY[o.t],bad=o.s.length!=4;
  return `<button class="sc${sel[0]==s&&sel[1]==i?' on':''}${bad?' bad':''}" data-s="${s}" data-i="${i}"><img class="sp" src="${y.img}"><b>${y.n}</b><span class="ty">${y.types.map(t=>TI(t,16)).join('')}</span><span class="mi">${miHTML(o)}</span></button>`}).join('')}</div><button class="clr" data-s="${s}" data-c="1">🗑️ Vaciar equipo</button></div>`).join('<div class="vs">VS</div>');
 const o=TM[sel[0]]&&TM[sel[0]][sel[1]];
 if(o){const y=TY[o.t],tot=Object.values(y.st).reduce((a,b)=>a+b,0);
  h+=`<div class="fi" style="--c:${sel[0]?'#ef4444':'#3b82f6'}"><div class="fh"><img class="fp" src="${y.img}"><div><div class="fn">${y.n}</div><div>${y.types.map(t=>TI(t,22)).join(' ')}</div><small>Total de stats ${tot} · PS en combate ${y.H}</small></div><div class="qa"><button data-rr="1">🎲 Re-sortear</button><button class="qb" data-q="1">Quitar</button></div></div>
  <div class="sb">${ST.map(([k,l])=>`<div class="sr"><span>${l}</span><div class="bt"><i style="width:${Math.min(100,y.st[k]/1.8)}%;background:${SC[k]}"></i></div><b>${y.st[k]}</b></div>`).join('')}</div>
  ${haPanel(o)}${saPanel(o,y)}</div>`}
 $('#setup').innerHTML=h;goState();saStart()}
$('#setup').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 // Elegir / quitar ataque (d.m = índice del pool, d.mk = nombre del ataque aprendible o de la lista completa)
 if(d.m!==undefined||d.mk!==undefined){const o=saCur();if(o){const i=d.m!==undefined?+d.m:saIdx(o,d.mk);if(i>=0)saToggle(o,i);saDraw();slotUpd()}return}
 if(d.rr){resort(sel[0],sel[1]);return}
 if(d.md){saMode=d.md;saLim=40;rend();return}
 if(d.more){saLim+=40;saDraw();saMore();return}
 if(d.q){TM[sel[0]].splice(sel[1],1);sel=[sel[0],0]}
 else{const s=+d.s,a=TM[s];
  if(d.i!==undefined){if(a[+d.i]){sel=[s,+d.i];setTimeout(focusFi,60)}}
  else if(d.c){TM[s]=[];if(sel[0]==s)sel=[s,0]}}
 rend()};
</script>
<script>
// Buscador de Pokémon (PokéAPI) con filtros de tipo/generación y sorteo configurable.
let ALL=[],tgt=0,loading=false,TYMAP=null,fT=new Set(),fMode='any',shown=120;
const TYPES=['normal','fire','water','electric','grass','ice','fighting','poison','ground','flying','psychic','bug','rock','ghost','dragon','dark','steel','fairy'];
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\s_]+/g,'-').replace(/[^a-z0-9-]/g,'');
const idOf=u=>+u.split('/').filter(Boolean).pop();

async function addSp(id,s){if(loading)return;if(TM[s].length>=6){setSt('Ese equipo ya tiene 6.');return}loading=true;setSt('Cargando Pokémon y sus ataques…');
 try{const k=await loadSp(id);TM[s].push({t:k,s:[...TY[k].ds]});sel=[s,TM[s].length-1];setSt('');rend()}catch(e){setSt(ERR)}loading=false}

function rng(){const g=$('#gen').value;return g=='all'?[1,1025]:GEN[+g]}

// Mapa id -> tipos. Son 18 peticiones, solo la primera vez (luego queda en localStorage).
async function loadTypes(){
 if(TYMAP)return TYMAP;
 try{const c=JSON.parse(localStorage.getItem('tymap')||'null');if(c){TYMAP=c;return TYMAP}}catch(e){}
 const m={};
 await Promise.all(TYPES.map(async t=>{const j=await(await fetch(API+'type/'+t)).json();
  for(const p of j.pokemon){const id=idOf(p.pokemon.url);if(id>1025)continue;(m[id]=m[id]||[]).push(t)}}));
 TYMAP=m;try{localStorage.setItem('tymap',JSON.stringify(m))}catch(e){}
 return m}

function okType(id){if(!fT.size)return true;const t=TYMAP&&TYMAP[id];if(!t)return false;
 if(fMode=='mono')return t.length==1&&fT.has(t[0]);
 if(fMode=='all')return[...fT].every(x=>t.includes(x));
 return[...fT].some(x=>t.includes(x))}

// Pokémon que cumplen generación + tipo (sin texto de búsqueda). También lo usa el sorteo.
function pool(){const[a,b]=rng();return ALL.filter(x=>x.id>=a&&x.id<=b&&okType(x.id))}

function sample(L,n){const A=[...L];for(let i=0;i<n;i++){const j=i+Math.floor(Math.random()*(A.length-i));[A[i],A[j]]=[A[j],A[i]]}return A.slice(0,n)}

function buildUI(){if($('#filt'))return;const d=document.createElement('div');d.id='filt';d.style.cssText='width:100%;margin:6px 0;display:flex;flex-direction:column;gap:6px';
 d.innerHTML=`<div id="tch" style="display:flex;flex-wrap:wrap;gap:4px">${TYPES.map(t=>`<button class="tc" data-t="${t}" title="${t}" style="padding:2px;border-radius:8px;border:2px solid transparent;background:none;cursor:pointer">${TI(TN[t]||t,22)}</button>`).join('')}</div>
 <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
  <select id="fm"><option value="any">Cualquiera de los tipos</option><option value="mono">Solo monotipo</option><option value="all">Con todos los tipos elegidos</option></select>
  <label>Sorteo: <select id="rn"><option value="r">3-6 al azar</option>${[1,2,3,4,5,6].map(n=>`<option value="${n}"${n==6?' selected':''}>${n}</option>`).join('')}</select></label>
  <button id="rnd2">🎲 Sortear ambos equipos</button><button id="fclr">Limpiar filtros</button></div>`;
 $('#res').parentNode.insertBefore(d,$('#res'));
 $('#tch').onclick=e=>{const b=e.target.closest('.tc');if(!b)return;const t=b.dataset.t;fT.has(t)?fT.delete(t):fT.add(t);shown=120;showRes()};
 $('#fm').onchange=()=>{fMode=$('#fm').value;shown=120;showRes()};
 $('#rnd2').onclick=()=>sortear([0,1]);
 $('#fclr').onclick=()=>{fT.clear();fMode='any';$('#fm').value='any';$('#q').value='';$('#gen').value='all';shown=120;showRes()}}

function chips(){document.querySelectorAll('#tch .tc').forEach(b=>{const on=fT.has(b.dataset.t);b.style.borderColor=on?'#3b82f6':'transparent';b.style.opacity=!fT.size||on?1:.45})}

function showRes(){buildUI();chips();
 if(fT.size&&!TYMAP){setSt('Cargando tipos…');loadTypes().then(()=>{setSt('');showRes()}).catch(()=>setSt(ERR));return}
 const q=norm($('#q').value.trim().replace(/^#/,'')),P=pool();
 let L=!q?P:P.filter(x=>x.name.includes(q)||String(x.id)==q);
 if(q)L.sort((x,y)=>(y.name.startsWith(q)-x.name.startsWith(q))||x.id-y.id);
 const V=L.slice(0,shown);
 $('#res').innerHTML=`<small style="width:100%">${L.length} Pokémon</small>`+(V.length?V.map(x=>`<button class="rs" data-id="${x.id}"><img src="${SPR}${x.id}.png" width="48" height="48" loading="lazy" style="image-rendering:pixelated"><small>#${x.id} ${x.name}</small></button>`).join('')+(L.length>V.length?`<button id="more" style="width:100%">Ver más (${L.length-V.length})</button>`:''):'<small>Sin resultados</small>')}

function dst(){$('#d0').style.borderColor=tgt?'':'#3b82f6';$('#d1').style.borderColor=tgt?'#ef4444':''}
$('#gen').onchange=()=>{shown=120;showRes()};$('#q').oninput=()=>{shown=120;showRes()};
$('#res').onclick=e=>{if(e.target.closest('#more')){shown+=120;showRes();return}const b=e.target.closest('.rs');if(b)addSp(+b.dataset.id,tgt)};
$('#d0').onclick=()=>{tgt=0;dst()};$('#d1').onclick=()=>{tgt=1;dst()};

async function okTypes(){if(!fT.size||TYMAP)return true;try{setSt('Cargando tipos…');await loadTypes();return true}catch(e){setSt(ERR);return false}}
// Sorteo: sides = [0], [1] o [0,1]. Con dos equipos no se repite ningún Pokémon entre ellos.
async function sortear(sides){if(loading||!await okTypes())return;
 const P=pool(),v=$('#rn')?$('#rn').value:'r',k=sides.length;let n=v=='r'?3+Math.floor(Math.random()*4):+v;n=Math.min(n,Math.floor(P.length/k));
 if(!n){setSt(P.length?'Hay muy pocos Pokémon con esos filtros para sortear '+k+' equipos.':'Ningún Pokémon cumple los filtros.');return}
 loading=true;const ids=sample(P,n*k).map(x=>x.id),ks=[];
 try{for(const id of ids){setSt(`Cargando… ${ks.length+1}/${ids.length}`);ks.push(await loadSp(id))}
  sides.forEach((s,j)=>{TM[s]=ks.slice(j*n,(j+1)*n).map(t=>({t,s:[...TY[t].ds]}))});sel=[sides[0],0];setSt('');rend()}catch(e){setSt(ERR)}loading=false}
// Cambia solo un Pokémon del equipo por otro al azar (respeta los filtros y no repite ninguno de los dos equipos).
async function resort(s,i){if(loading||!TM[s]||!TM[s][i]||!await okTypes())return;
 const used=new Set(TM.flat().map(o=>+String(o.t).slice(1))),C=pool().filter(x=>!used.has(x.id));
 if(!C.length){setSt('No quedan Pokémon distintos con esos filtros.');return}
 loading=true;
 try{setSt('Cargando Pokémon…');const t=await loadSp(C[Math.floor(Math.random()*C.length)].id);TM[s][i]={t,s:[...TY[t].ds]};sel=[s,i];setSt('');rend()}catch(e){setSt(ERR)}loading=false}
$('#rnd').onclick=()=>sortear([tgt]);

setSt('Cargando lista de Pokémon…');
fetch(API+'pokemon?limit=1025').then(r=>r.json()).then(j=>{ALL=j.results.map(x=>({id:idOf(x.url),name:x.name}));setSt('Toca un Pokémon para añadirlo al equipo elegido (→ 🔵 / → 🔴).');showRes()}).catch(()=>setSt(ERR));
</script>
<script>
// Laboratorio de ataques: prueba cualquier ataque sobre dos Pokémon que no mueren.
let lab=0,labT=null,labSide=0,labAuto=true,labMv=null,labIdle=0;
// La esfera de protección dura 1,5 s pero no es un ataque "en curso": no debe bloquear el siguiente ataque
const labPers=e=>e.cu=='protect';
const labBusy=()=>mons.some(m=>m.sc||m.lw>0||m.lunge>0||m.freeze>0)||ents.some(e=>e.k!='v'&&!labPers(e));
// ¿Está ESE Pokémon en mitad de un ataque? (el otro puede lanzar el suyo mientras tanto: así se prueba Protección contra un ataque en marcha)
const labBusyDe=m=>!!(m.sc||m.lw>0||m.lunge>0||m.freeze>0||ents.some(e=>e.o===m&&e.k!='v'&&!labPers(e)));
function labFire(){if(!labMv)return;const m=mons[labSide],o=mons[1-labSide];if(!m||!o)return;m.tg=o;o.tg=m;const mv={...labMv,acc:100};m.mv=[mv];m.mc=[0];m.pi=0;m.plan=mv;m.freeze=0;m.cd=0;atk(m)}
async function labMove(name){name=name.trim().toLowerCase().replace(/\s+/g,'-');let mv=null;try{mv=await mvData({n:name,u:API+'move/'+name+'/'})}catch(e){}if(!mv&&CUSTOM[name])mv=CUSTOM[name].fallback();return mv}
async function labStart(){const a=+$('#la').value||18,b=+$('#lb').value||143;$('#setup').style.display=$('#go').style.display=$('#srch').style.display='none';$('#game').style.display='block';$('#game').classList.add('lab');$('#lst').textContent='Cargando Pokémon…';
 try{const ka=await loadSp(a),kb=await loadSp(b);mons=[];ents=[];ps=[];txt=[];rg=[];scars=[];campo=nuevoCampo();logs=[];team=[[],[]];over=true;paused=false;inGame=true;lab=1;bn=null;$('#ban').style.display='none';rs();
  spawn(0,{t:ka,s:[0],used:false});spawn(1,{t:kb,s:[0],used:false});
  for(const m of mons){m.lab=1;m.enter=0;m.y=230;m.home={x:m.x,y:230};m.mv=[];m.mc=[];m.max=m.hp=99999}
  mons[0].tg=mons[1];mons[1].tg=mons[0];$('#lst').textContent=labMv?'Listo. Pulsa ▶ Probar para repetir.':'Escribe el ID de un ataque y pulsa ▶ Probar.';
  clearInterval(labT);labT=setInterval(()=>{if(!lab)return;if(labBusy()){labIdle=0;return}labIdle+=200;if(labAuto&&labMv&&labIdle>=1400){labIdle=0;labFire()}},200)}catch(e){$('#lst').textContent=ERR}}
$('#labb').onclick=labStart;$('#la').onchange=$('#lb').onchange=labStart;

  // ---------- Estadísticas en hexágono (como en los juegos) ----------
  const STO=['hp','atk','def','spe','spd','spa'];   // sentido horario desde arriba
  const STN={hp:'PS',atk:'ATAQUE',def:'DEFENSA',spe:'VELOCIDAD',spd:'DEF. ESP.',spa:'AT. ESP.'};
  function hexagono(vals,max,color,nat={}){
    const X=130,Y=118,R=78,pt=(i,k)=>{const a=(-90+i*60)*Math.PI/180;return[X+Math.cos(a)*R*k,Y+Math.sin(a)*R*k]};
    const poly=k=>STO.map((_,i)=>pt(i,k).map(n=>n.toFixed(1)).join(',')).join(' ');
    let s=`<svg class="gd-svg" viewBox="0 0 260 236" xmlns="http://www.w3.org/2000/svg">`;
    for(const k of[1/3,2/3,1])s+=`<polygon points="${poly(k)}" fill="${k===1?'#0b1220':'none'}" stroke="#334155" stroke-width="1"/>`;
    STO.forEach((_,i)=>{const[x,y]=pt(i,1);s+=`<line x1="${X}" y1="${Y}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#1e293b"/>`});
    const dat=STO.map((k,i)=>pt(i,Math.max(.04,Math.min(1,vals[k]/max))).map(n=>n.toFixed(1)).join(',')).join(' ');
    s+=`<polygon points="${dat}" fill="${color}" fill-opacity=".4" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    STO.forEach((k,i)=>{
      const a=(-90+i*60)*Math.PI/180,lx=X+Math.cos(a)*102,ly=Y+Math.sin(a)*102;
      const fl=nat.u===k?'<tspan fill="#4ade80"> ▲</tspan>':nat.d===k?'<tspan fill="#f87171"> ▼</tspan>':'';
      s+=`<text x="${lx.toFixed(1)}" y="${(ly-2).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#94a3b8">${STN[k]}${fl}</text>`
        +`<text x="${lx.toFixed(1)}" y="${(ly+12).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="800" fill="#f1f5f9">${vals[k]}</text>`;
    });
    return s+'</svg>';
  }

    tabs.append(bs,bi);box.append(tabs,gr);
    function pintar(){
      bs.className=modo==='stats'?'on':'';bi.className=modo==='iv'?'on':'';
      if(modo==='iv'){
        gr.innerHTML=hexagono(c.ivs,31,'#4ade80')+`<div class="gd-nota">IVs: de 0 a 31 en cada estadística</div>`;return;
      }
      const base=BASE[c.especieId];
      if(base===undefined){gr.innerHTML='<small style="opacity:.7">Calculando estadísticas…</small>';return}
      if(!base){gr.innerHTML='<small style="color:#f87171">No se pudieron cargar las estadísticas (¿sin conexión?). Los IVs sí se pueden ver.</small>';return}
      const v=statsCarta(c),max=Math.max(60,...STO.map(k=>v[k]))*1.1;

    if(BASE[c.especieId]===undefined)pe.then(e=>{BASE[c.especieId]=e.stats}).catch(()=>{BASE[c.especieId]=null}).then(()=>{if(box.isConnected)pintar()});
    else pintar();
  }

  let pestana='datos';   // pestaña abierta del detalle (se recuerda al volver a pintar tras entrenar, fusionar...)

      </div></div>

    // Sprite animado (Showdown, hasta la gen 9); si no existe, el sprite estático. Se escala en enteros para que no se vea borroso.
    const im=d.querySelector('.gd-img');

    im.onerror=()=>{im.onerror=null;im.src=SPR+c.especieId+'.png'};
    // Tipos y estadísticas: necesitan las estadísticas base de la especie (caché de las herramientas)
    const pe=datosEsp(c.especieId);
    pe.then(e=>{d.querySelector('.gd-types').innerHTML=e.tipos.map(t=>`<span class="gd-t" style="background:${TC[t]||'#64748b'}">${TIPN[t]||esc(t)}</span>`).join('')})
      .catch(()=>{d.querySelector('.gd-types').innerHTML=''});
    nombreEs(c.especieId).then(n=>{const e=d.querySelector('.nm');if(e)e.textContent=n});

    const tabs=d.querySelector('.gd-tabs2'),body=d.querySelector('.gd-body'),bts={};

          <div>Naturaleza: <b>${esc(nat.n)}</b> <small>(${efecto})</small></div>
          <div style="opacity:.7;font-size:12px">Conseguida el ${esc(c.obtenidoEn)} · ${esc(c.origen)}</div></div>
          <div class="gd-ho"></div><div class="gd-stats"></div>`;
        body.querySelector('.gd-ho').append(seccionHabObj(c));

      }else if(pestana==='ataques'){
        const kz=h('div','');kz.className='kit';kz.innerHTML='<small style="opacity:.7">Cargando ataques…</small>';body.append(kz);
        kitDe(c,(a,t)=>{if(kz.isConnected)kz.innerHTML=`<small style="opacity:.7">Cargando ataques ${a}/${t}…</small>`})
          .then(kit=>{if(kz.isConnected)kz.innerHTML=kit.length?kit.map(filaAtaque).join(''):'<small>Sin ataques disponibles</small>'})
          .catch(()=>{if(kz.isConnected)kz.innerHTML='<small style="color:#f87171">No se pudieron cargar los ataques (¿sin conexión?)</small>'});
