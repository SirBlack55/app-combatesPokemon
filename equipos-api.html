<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena Aérea</title>
<style>
/* Estilos de Arena Pokémon. Tema oscuro. */
:root{--bg:#0b1220;--fg:#e2e8f0;--card:#1e293b;--bd:#334155;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--fg:#e2e8f0;--card:#1e293b;--bd:#334155}}
:root[data-theme="dark"]{--bg:#0b1220;--fg:#e2e8f0;--card:#1e293b;--bd:#334155}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:900px;padding:10px}
h1{font-size:19px;margin:4px 0 8px;text-align:center}
#bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px}
button{padding:9px 12px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--fg);font-weight:700;font-size:14px;cursor:pointer}
button:active{transform:scale(.96)}
canvas{width:100%;display:block;border-radius:14px;border:3px solid var(--bd);background:#4c9a3d;touch-action:manipulation}
#kos{display:flex;gap:10px;justify-content:center;margin:8px 0;font-weight:700;font-size:14px;flex-wrap:wrap}
#log{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:8px 12px;font-size:13px;min-height:100px;line-height:1.5}
.cw{position:relative}#ban{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.55);border-radius:14px;color:#fff;font-size:24px;font-weight:800;text-align:center}
.col{flex:1;min-width:150px;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:8px}
#setup{display:flex;gap:8px;flex-wrap:wrap}
#go{width:100%;margin-top:8px;background:#7c3aed;color:#fff;border-color:#6d28d9}#go:disabled{opacity:.4}
#mvp{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.mp{flex:1;min-width:150px;background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:6px;font-size:12px}
.rs{display:flex;flex-direction:column;align-items:center;width:84px;padding:3px;font-size:10px}.rs small{font-size:10px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#srch select,#srch input{padding:8px;border-radius:8px;border:2px solid var(--bd);background:var(--card);color:var(--fg);font-size:14px}#res{display:flex;flex-wrap:wrap;gap:2px;max-height:340px;overflow:auto;margin-top:6px}
body{background:radial-gradient(circle at 50% -10%,#1e3a8a 0,#0b1220 55%) fixed}
h1{font-size:22px;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(90deg,#60a5fa,#f87171);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0 12px}
#srch{background:linear-gradient(#1e293b,#0f172a);border:2px solid #475569;border-radius:14px}
.rs{background:#0f172a;border:2px solid #334155;border-radius:10px}.rs:hover{border-color:#60a5fa}.rs small{text-transform:capitalize}
#setup{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.tp{flex:1;min-width:290px;border:2px solid var(--c);border-radius:14px;background:linear-gradient(#1e293b,#0f172a);box-shadow:0 0 12px var(--c);overflow:hidden}
.th{display:flex;justify-content:space-between;padding:8px 12px;background:var(--c);color:#fff;font-weight:800;letter-spacing:1px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px}
.sc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;border:2px solid #334155;background:#0f172a;color:var(--fg);min-height:122px;cursor:pointer}
.sc.em{justify-content:center;font-size:28px;border-style:dashed;opacity:.6}.sc.on{border-color:var(--c);background:#1e293b;box-shadow:0 0 10px var(--c)}.sc.bad{border-color:#f59e0b}
.sc .sp{width:64px;height:64px;image-rendering:pixelated}.sc b{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:capitalize}
.sc .ty,.sc .mi{display:flex;gap:2px;align-items:center}.sc em{font-size:10px;color:#fbbf24;font-style:normal;margin-left:3px}
.clr{margin:0 8px 8px;font-size:12px;padding:6px 10px}
.vs{align-self:center;font-weight:900;font-size:26px;color:#fbbf24;text-shadow:0 0 12px #f59e0b;width:100%;text-align:center}@media(min-width:760px){.vs{width:auto}}
.fi{flex-basis:100%;border:2px solid var(--c);border-radius:14px;background:linear-gradient(#1e293b,#0f172a);padding:12px;box-shadow:0 0 12px var(--c)}
.fh{display:flex;gap:12px;align-items:center}.fp{width:96px;height:96px;image-rendering:pixelated;background:radial-gradient(#334155,transparent 70%)}
.fn{font-size:22px;font-weight:800;text-transform:capitalize}.qb{margin-left:auto}
.sb{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:10px 0}.sr{display:flex;align-items:center;gap:6px;font-size:12px}.sr span{width:62px;color:#94a3b8;font-weight:700}.sr b{width:28px;text-align:right}
.bt{flex:1;height:8px;background:#0b1220;border-radius:4px;overflow:hidden}.bt i{display:block;height:100%;border-radius:4px}
.mh{font-weight:800;margin:6px 0}.mh small{font-weight:400;opacity:.7;margin-left:8px}.mh b.ok{color:#22c55e}.mh b.no{color:#f59e0b}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mc{text-align:left;padding:8px;border-radius:10px;border:2px solid var(--t);background:rgba(15,23,42,.8);color:var(--fg);opacity:.6;font-weight:400}.mc.on{opacity:1;background:#1e293b;box-shadow:0 0 8px var(--t)}
.mt{display:flex;align-items:center;gap:6px;font-size:13px}.mt b{flex:1}.ck{color:#4ade80;font-weight:900}
.mm{display:flex;flex-wrap:wrap;gap:3px 8px;font-size:11px;margin-top:4px}.ul{color:#fbbf24;font-weight:700}.ef{font-size:11px;margin-top:3px;color:#a7f3d0}
#go{font-size:18px;letter-spacing:1px;padding:14px;border-radius:14px;background:linear-gradient(#a855f7,#6d28d9);border:2px solid #c4b5fd;box-shadow:0 0 18px #7c3aed88}
#hud{display:flex;gap:8px;margin-bottom:6px}
.hb{flex:1;min-width:0;display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:12px;background:linear-gradient(#1e293b,#0f172a);border:2px solid var(--c);box-shadow:0 0 10px var(--c)}
#h1{flex-direction:row-reverse;text-align:right}.hs{width:56px;height:56px;image-rendering:pixelated;flex:none}#h1 .hs{transform:scaleX(-1)}
.hi{flex:1;min-width:0}.hn{display:flex;gap:6px;align-items:center;font-size:14px;text-transform:capitalize}#h1 .hn{flex-direction:row-reverse}.hn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp{display:flex;align-items:center;gap:6px;margin:3px 0}.hp em{font-style:normal;font-size:10px;font-weight:800;color:#fbbf24;background:#7c2d12;border-radius:4px;padding:0 4px}
.hbar{flex:1;height:10px;background:#0b1220;border:1px solid #475569;border-radius:6px;overflow:hidden}.hbar i{display:block;height:100%;transition:width .5s,background .3s}
.hv{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}.hst{display:flex;gap:3px;flex-wrap:wrap;min-height:16px}#h1 .hst,#h1 .balls{justify-content:flex-end}
.ch{font-size:10px;padding:1px 5px;border-radius:6px;font-weight:700}.ch.up{background:#14532d;color:#86efac}.ch.dn{background:#7f1d1d;color:#fca5a5}
.balls{display:flex;gap:3px;margin-top:2px}.pb{width:11px;height:11px;border-radius:50%;border:1px solid #0f172a;background:linear-gradient(#ef4444 45%,#0f172a 45% 55%,#f8fafc 55%)}.pb.a{box-shadow:0 0 0 2px #fbbf24}.pb.d{background:#475569;opacity:.6}
@media(max-width:560px){.hs{display:none}.hb{padding:5px 7px}.hn{font-size:12px}}
.mp{background:linear-gradient(#1e293b,#0f172a);border:2px solid var(--bd);border-radius:12px;padding:8px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}.ph b{text-transform:capitalize;font-size:13px}
.pst{display:flex;gap:3px}.pst span{background:#0b1220;border-radius:6px;padding:1px 5px;text-align:center;font-size:12px;font-weight:700}.pst small{display:block;font-size:8px;color:#94a3b8;font-weight:600}.pst .up{color:#4ade80}.pst .dn{color:#f87171}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mv{border:2px solid var(--t);border-radius:8px;padding:5px 6px;background:#0b1220;opacity:.75}.mv.rd{opacity:1;box-shadow:0 0 8px #22c55e88;border-color:#22c55e}.mv.pl{outline:2px solid #fbbf24}
.mn{display:flex;align-items:center;gap:4px;font-size:11px}.mn b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cb{height:5px;background:#1e293b;border-radius:3px;margin:3px 0;overflow:hidden}.cb i{display:block;height:100%;background:var(--t)}.mv.rd .cb i{background:#22c55e}.cs{font-size:11px;font-weight:700;text-align:right}.mv.rd .cs{color:#4ade80}
#labui{display:none}#game.lab #labui{display:block}#game.lab #hud,#game.lab #mvp,#game.lab #log,#game.lab #bar{display:none!important}
.lr{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;align-items:center;font-size:13px}.lr input[type=number]{width:72px}#lm{flex:1;min-width:170px}
#labui input{padding:8px;border-radius:8px;border:2px solid var(--bd);background:var(--card);color:var(--fg);font-size:13px}
/* Selector de ataques (sugeridos / aprendibles / todos) */
.meq{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;min-height:30px;align-items:center}
.mq{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:10px;border:2px solid var(--t);background:#1e293b;font-size:12px}.mq span{color:#f87171}
.mtabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.mtabs button{padding:6px 10px;font-size:13px}.mtabs button.on{border-color:#a855f7;background:#4c1d95}
.mfl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.mfl input,.mfl select{padding:7px;border-radius:8px;border:2px solid var(--bd);background:var(--card);color:var(--fg);font-size:13px}.mfl input{flex:1;min-width:140px}
#mnote{font-size:12px;opacity:.8;min-height:16px;margin:4px 0}
#mlist{max-height:440px;overflow:auto;padding:2px}
.tg{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}.tag{font-size:10px;padding:0 5px;border-radius:6px;background:#334155;color:#cbd5e1;font-weight:700}
#mmore{width:100%;margin-top:6px}
/* Filtros del buscador */
#filt select,#filt input{padding:7px;border-radius:8px;border:2px solid var(--bd);background:var(--card);color:var(--fg);font-size:13px}
.qa{margin-left:auto;display:flex;gap:6px}.qa .qb{margin-left:0}
</style>

<h1>🌿 Arena Aérea · Combates por equipos</h1>
<div class="col" id="srch" style="margin-bottom:8px"><b>🌐 Pokémon desde PokéAPI</b>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0"><select id="gen"><option value="0">Gen 1</option><option value="1">Gen 2</option><option value="2">Gen 3</option><option value="3">Gen 4</option><option value="4">Gen 5</option><option value="5">Gen 6</option><option value="6">Gen 7</option><option value="7">Gen 8</option><option value="8">Gen 9</option><option value="all">Todas</option></select><input id="q" placeholder="Buscar nombre o número…" style="flex:1;min-width:130px"><button id="d0" style="border-color:#3b82f6">→ 🔵</button><button id="d1">→ 🔴</button><button id="rnd">🎲 Equipo</button><button id="labb">🧪 Laboratorio</button></div>
<div id="st" style="font-size:12px;min-height:16px"></div><div id="res"></div></div>
<div id="setup"></div><button id="go">⚔️ ¡COMENZAR COMBATE!</button>
<section id="game" style="display:none">
<div id="labui"><div class="col" style="margin-bottom:6px"><b>🧪 Laboratorio de ataques</b> <small>Dos Pokémon de prueba que no mueren</small>
<div class="lr"><label>Atacante # <input id="la" type="number" value="18"></label><label>Rival # <input id="lb" type="number" value="143"></label><button id="lsw">Atacante: 🔵</button></div>
<div class="lr"><input id="lm" value="fly" placeholder="ID del ataque en inglés (fly, flamethrower…)"><button id="lgo">▶ Probar</button></div>
<div class="lr" id="lq"></div><div class="lr"><button id="lauto">🔁 Auto: sí</button><button id="lslow">Velocidad x1</button><button id="lex">← Volver</button></div><div id="lst" style="font-size:12px;min-height:16px"></div></div></div>
<div id="bar"><button id="sp">Velocidad x1</button><button id="pa">Pausa</button><button id="tg">Ocultar ataques</button><button id="rs">Equipos</button></div>
<div id="hud"><div class="hb" id="h0"></div><div class="hb" id="h1"></div></div><div class="cw"><canvas id="cv"></canvas><div id="ban"></div></div><div id="mvp"><div class="mp" id="mv0"></div><div class="mp" id="mv1"></div></div>
<div id="log"></div></section>

<script>
// Aleatoriedad.
//  R(a,b)  -> SOLO efectos visuales (partículas, temblores). Siempre Math.random().
//  RS(a,b) / rnd() -> SIMULACIÓN (daño, críticos, precisión, IA, posiciones). Se puede fijar con semilla(n)
//                     para que un combate sea repetible (necesario para el modo online).
//  Regla de oro al crear ataques: lo que afecta al resultado usa rnd()/RS(); lo que solo se ve usa R().
let _semilla=null;
function semilla(n){_semilla=(n==null)?null:n>>>0}
function rnd(){if(_semilla===null)return Math.random();_semilla=(_semilla+0x6D2B79F5)>>>0;let t=_semilla;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}
const RS=(a,b)=>a+rnd()*(b-a),R=(a,b)=>a+Math.random()*(b-a);

</script>

// Convierte un ataque de la PokéAPI en un ataque del juego (tipo de animación, daño, cooldown...).
const STY=[[/slash|scratch|claw|cut|blade|shear|scissor|sword|fury-swipes|razor|slice/,'slash'],[/bite|crunch|fang|chomp/,'bite'],[/punch|hammer|fist|mach|thrash|superpower|close-combat|cross-chop|karate|jab|rage/,'punch'],[/kick|stomp|stamp|trample|jump|strike/,'kick'],[/tail|whip|vine|wrap|bind|lash|slap|pound|crush|slam|squeeze/,'whip'],[/beam|ray|cannon|laser|solar|pulse|spit|flash/,'beam'],[/storm|tornado|hurricane|twister|cyclone|blizzard|whirl|typhoon|swarm|rain|barrage/,'storm'],[/quake|slide|fissure|bulldoze|tectonic|magnitude|rumble/,'quake'],[/surf|wave|tsunami|torrent/,'wave']],MEL=['slash','bite','punch','kick','whip','hit'];
const fxDe=F=>F&&F.k?{fx:F}:{};
const SNM={attack:'atk',defense:'def','special-attack':'spa','special-defense':'spd',speed:'spe',accuracy:'acc',evasion:'eva'};
// Estado alterado que provoca un ataque (null si no lo hay o aún no existe en el juego)
function ailDe(d,mt){const k=AIL[(mt.ailment||{}).name];return k==='psn'&&TOXICOS.includes(d.name)?'tox':k}
// Efectos secundarios de un ataque con daño: a=estado, pa=% · f=% retroceso · dr=drenar(+)/retroceso de PS(−) en % del daño · so/ss=stats del rival/propios, ps=%
function secDe(d,mt){const s={},k=ailDe(d,mt);
 if(k){s.a=k;s.pa=mt.ailment_chance||100}
 if(mt.flinch_chance>0)s.f=mt.flinch_chance;
 if(mt.drain)s.dr=mt.drain;
 if(CAMBIA_YO.includes(d.name))s.sw='yo';else if(CAMBIA_RIVAL.includes(d.name))s.sw='rival';
 if(SEC_X[d.name])s.x=SEC_X[d.name];
 if(TRAMPA_DANO.includes(d.name)){s.a='net';s.pa=100}
 const o={},y={};for(const c of d.stat_changes||[]){const q=SNM[c.stat.name];if(q&&!SIN_STATS.includes(d.name))(c.change>0||AUTOBAJA.includes(d.name)?y:o)[q]=Math.max(-3,Math.min(3,c.change))}
 if(Object.keys(o).length)s.so=o;if(Object.keys(y).length)s.ss=y;
 if(s.so||s.ss)s.ps=mt.stat_chance||100;
 return Object.keys(s).length?s:undefined}
const secX=(d,mt)=>{const s=secDe(d,mt);return s?{sec:s}:{}};
// Rasgos de un ataque con daño: dt dos turnos · rep se repite · pr prioridad · cr crítico alto · hits [mín,máx] golpes (solo si el ataque da un golpe por lanzamiento)
function rasgos(d,mt,c){const o={};
 if(DT[d.name]&&!CUSTOM[d.name])o.dt=DT[d.name];
 if(REP[d.name])o.rep=REP[d.name];
 if(d.priority>0)o.pr=d.priority;
 if(mt.crit_rate>0)o.cr=mt.crit_rate;
 if((mt.max_hits||0)>1&&c===1&&!REP[d.name])o.hits=[mt.min_hits||mt.max_hits,mt.max_hits];
 if((d.name=='triple-kick'||d.name=='triple-axel')&&c===1){o.hits=[3,3];o.ramp=1}   // 3 golpes: potencia x1, x2, x3
 return o}
function conv0(d){const t=TN[d.type.name]||'normal',nm=(d.names.find(x=>x.language.name=='es')||{name:d.name}).name,cl=d.damage_class.name,mt=d.meta||{};

 const F=ESP[d.name];   // efectos especiales (datos/ataques-especiales.js)
 const X=EFX[d.name];   // ataques de estado con efecto propio (datos/ataques-especiales.js)
 if(X){const of=X.of&&!X.yo;return{n:nm,key:d.name,p:0,cd:(X.cd||9)*1.4,c:1,r:of?320:999,u:0,t,cat:'sta',ef:X,acc:of?(d.accuracy||0):0}}
 if(F&&F.k=='contra')return{n:nm,key:d.name,p:0,cd:14,c:1,r:999,u:0,t,cat:'sta',ef:{c:F,d:F.d},acc:0};
 if(cl=='status'){const ef={},LB={atk:'Ataque',def:'Defensa',spa:'At. Esp.',spd:'Def. Esp.',spe:'Velocidad',acc:'Precisión',eva:'Evasión'},al=ailDe(d,mt),me=!!(d.target&&['user','user-or-ally','users-field','user-and-allies'].includes(d.target.name));
  if(d.name=='rest'){ef.h=1;ef.a={k:'slp',yo:1};ef.d='Cura todos los PS y duerme'}
  else if(mt.healing>0){ef.h=mt.healing/100;ef.d='Cura '+mt.healing+'% PS'}
  else{const o={};for(const c of d.stat_changes||[]){const k=SNM[c.stat.name];if(k)o[k]=Math.max(-3,Math.min(3,c.change))}
   const v=Object.values(o);
   if(v.length){if(me&&v.some(x=>x>0))ef.s=o;else if(!me&&(v.some(x=>x<0)||al))ef.o=o;else if(!al)return null;
    if(ef.s||ef.o)ef.d=(me?'':'Rival: ')+Object.entries(o).map(([k,x])=>(x>0?'+':'−')+Math.abs(x)+' '+LB[k]).join(', ')}
   else if(!al)return null}
  if(al&&!me&&!ef.a){const k=al==='trap'?'net':al;ef.a={k,yo:0};ef.d=(ef.d?ef.d+' · ':'')+AIL_TXT[k]}
  if(!ef.h&&!ef.s&&!ef.o&&!ef.a)return null;
  const of=ef.a&&!ef.a.yo;
  return{n:nm,key:d.name,p:0,cd:(mt.healing>0?18:9)*1.4,c:1,r:of?320:999,u:0,t,cat:'sta',ef,acc:of?(d.accuracy||0):0}}
 if(!d.power&&!(F&&F.p))return null;const P=d.power||F.p,phy=cl=='physical',acc=d.accuracy||100;let sty=phy?'hit':'orb';for(const[r,k]of STY)if(r.test(d.name)){sty=k;break}
 if(F&&F.sty)sty=F.sty;if(!phy&&MEL.includes(sty))sty='orb';
 if(phy&&MEL.includes(sty))return{n:nm,key:d.name,p:P,cd:(1+P/45)*1.4,c:1,r:55,u:0,tk:1,t,cat:'phy',acc,sty,...fxDe(F),...secX(d,mt),...rasgos(d,mt,1)};
 const u=!phy&&P>=110,K=u?ultK(t):({beam:'s',storm:'z',quake:'q',wave:'w'}[sty]||(t=='elec'?'b':'p')),c=K=='s'?5:K=='z'?(u?6:5):K=='q'||K=='w'||K=='x'?1:K=='m'?10:K=='b'?(u?6:P<=60?1:P<=90?2:3):(P<=50?1:P<=70?3:P<=90?5:6);
 return{n:nm,key:d.name,p:u&&K=='m'?P*1.8:P,cd:(u?6:1+P/45)*1.4,c:F&&F.k!='stat'&&F.k!='wb'?1:c,r:u?300:P<=70?230:260,u:u?1:0,t,cat:phy?'phy':'spe',acc,sty,...fxDe(F),...secX(d,mt),...rasgos(d,mt,F&&F.k!='stat'&&F.k!='wb'?1:c)}}
function conv(d){const mv=conv0(d);if(mv&&CUSTOM[d.name])Object.assign(mv,CUSTOM[d.name].mv);return mv}

function emit(x,y,t,n,vm,o={}){const Q=IMP[t]||IMP.normal;for(let i=0;i<n&&ps.length<900;i++){const a=R(0,6.283),v=R(.2,1)*vm;ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(Q.up?60:0),gy:Q.gy,l:R(.4,.9),m:.9,c:Q.c[i%Q.c.length],s:R(3,7),g:Q.g,sh:Q.sh,r:R(0,6),vr:R(-8,8),...o})}}
function imp(x,y,t,k=1){const Q=IMP[t]||IMP.normal;emit(x,y,t,Math.round(Q.n*k),Q.v*k);ring(x,y,Q.ring,40*k+20);if(Q.rings)for(let i=1;i<=Q.rings;i++)ring(x,y,Q.ring,30+i*22,.4+i*.12,3);shk=Math.max(shk,k*2)}
function vfx(x,y,sty,t){ents.push({k:'v',vs:sty||'hit',x,y,life:.35,m:.35,cc:TCOL[t]||'#fff'})}
function ring(x,y,c,r1,l=.5,w=6){rg.push({x,y,c,r1,l,m:l,w})}
function blast(x,y,c,r,n=40){ring(x,y,c,r);ring(x,y,'#fff',r*.7,.35,4);ring(x,y,c,r*1.3,.7,3);for(let i=0;i<n&&ps.length<700;i++){const a=R(0,7),v=R(60,r*3.2);ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:R(.4,1),m:1,c:i%3?c:'#fff',s:R(3,8),g:1})}shk=Math.max(shk,r/12);sfl=Math.max(sfl,Math.min(.45,r/200));sfc=c}
function burst(x,y,col,n,sp=140,glow){for(let i=0;i<n&&ps.length<700;i++){const a=R(0,7),v=R(30,sp);ps.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:R(.3,.7),m:.7,c:col,s:R(2,5),g:glow})}}

<script>
// Elección de ataque de la IA.
function wt(m,v,i){if(m.mc[i]>0)return 0;
 const V=m.vol||{};   // control: Tormento, Otra Vez, Anulación, Mofa, Último Recurso
 if(m.pi!=null&&((V.torment&&i===m.pi)||((V.encore||V.furia)&&i!==m.pi)))return 0;
 if(V.sil&&typeof SONIDO!=='undefined'&&SONIDO.includes(v.key))return 0;
 if(V.disable&&V.disable.i===i)return 0;
 if(V.taunt&&v.cat=='sta')return 0;
 if(v.fx&&v.fx.k=='ultimo'&&!m.mv.every((x,j)=>j===i||(m.us&&m.us[j])))return 0;
 const f=v.fx;if(f){if(f.k=='kamik'||f.k=='gambito')return m.hp/m.max<.35?3:.15;if(f.k=='igualar')return m.tg&&m.tg.hp>m.hp?2:0}
 if(v.cat=='sta'){const e=v.ef||{},o=m.tg;if(e.c)return m.cnt?0:1;
  const w=wtEfx(m,e,o);if(w!==undefined)return w;
  if(e.a&&!e.a.yo){if(!o||!puedeEst(o,e.a.k))return 0;return e.a.k=='slp'||e.a.k=='par'?1.6:1.2}if(e.h)return m.hp/m.max<.5?4:m.hp/m.max<.8?.3:0;
  if(e.s)return Object.keys(e.s).every(x=>m.stg[x]>=2)?0:1.3;
  if(e.o)return !o||Object.keys(e.o).every(x=>o.stg[x]<=-2)?0:1.1;return 0}
 return(v.u?.8:v.tk?1:1.3)*(v.pr?(m.tg&&m.tg.hp/m.tg.max<.3?2.2:1.15):1)}   // los de prioridad: más ganas de rematar
function plan(m){const L=m.mv,w=L.map((v,i)=>wt(m,v,i)),S=w.reduce((a,b)=>a+b,0);if(!S){m.plan=null;return}let q=rnd()*S,i=0;while(i<L.length-1&&(q-=w[i])>0)i++;if(!w[i])i=w.findIndex(x=>x>0);m.plan=L[i];m.pi=i}
</script>
<script>

 for(const k in o){const b=x.stg[k]||0,n=Math.max(-6,Math.min(6,b+o[k])),up=o[k]>0;x.stg[k]=n;txt.push({x:x.x,y:x.y-46-j++*13,s:n!=b?N[k]+(up?' ▲':' ▼').repeat(Math.abs(o[k])):N[k]+(up?' al máximo':' al mínimo'),c:up?'#fde047':'#fca5a5',l:1.5,sm:1});ring(x.x,x.y,up?'#fde047':'#f87171',45,.6)}}
// Efectos que caen sobre el rival (los devuelve la Capa Mágica; los bloquea el Sustituto)
// Intercambios y repartos (Cambiacorazón, Cambiadefensa, Psicocambio...)
function intercambio(m,tg,k){
 const sw=(a,b,ks)=>{for(const q of ks){const t=a.stg[q]||0;a.stg[q]=b.stg[q]||0;b.stg[q]=t}};
 switch(k){
  case'heart':sw(m,tg,['atk','def','spa','spd','spe','acc','eva']);break;

  case'speed':{const t=m.st.spe;m.st.spe=tg.st.spe;tg.st.spe=t;const s=m.spd;m.spd=tg.spd;tg.spd=s;break}
  case'ptrick':{const t=m.st.atk;m.st.atk=m.st.def;m.st.def=t;break}
  case'pshift':{let t=m.st.atk;m.st.atk=m.st.def;m.st.def=t;t=m.st.spa;m.st.spa=m.st.spd;m.st.spd=t;break}
  case'psplit':{const a=Math.round((m.st.atk+tg.st.atk)/2),b=Math.round((m.st.spa+tg.st.spa)/2);m.st.atk=tg.st.atk=a;m.st.spa=tg.st.spa=b;break}
  case'gsplit':{const a=Math.round((m.st.def+tg.st.def)/2),b=Math.round((m.st.spd+tg.st.spd)/2);m.st.def=tg.st.def=a;m.st.spd=tg.st.spd=b;break}
  case'topsy':for(const q in tg.stg)tg.stg[q]=-tg.stg[q];break;
  case'trans':if(m.ail&&puedeEst(tg,m.ail.k,m)){const k2=m.ail.k;m.ail=null;aplicarEst(tg,k2,m,true)}else fallo(m);break;
 }
 txt.push({x:m.x,y:m.y-56,s:'¡Intercambio!',c:'#e9d5ff',l:1.2,sm:1});
}

 if(tg.vol&&tg.vol.sub&&(ef.o||ef.a||ef.v||ef.ty||ef.ta)){fallo(tg,'¡El sustituto lo bloquea!');return}

 if(ef.nada){fallo(m,'¡Pero no pasó nada!');return}
 if(ef.req&&!(campo.cl&&campo.cl.k==ef.req)){fallo(m);return}
 if(ef.cost){const c=Math.round(m.max*ef.cost);if(m.hp<=c){fallo(m);return}m.hp-=c;txt.push({x:m.x,y:m.y-30,s:'-'+c,c:'#f87171',l:.9})}
 if(ef.sb){const c=Math.round(m.max*.25);if((m.vol&&m.vol.sub)||m.hp<=c){fallo(m);return}m.hp-=c;(m.vol=m.vol||{}).sub={l:60,t:0,hp:c};txt.push({x:m.x,y:m.y-56,s:'¡Sustituto!',c:'#fbbf24',l:1.2,sm:1})}
 if(ef.pr)protege(m,ef.pr);
 if(ef.h){
  if(m.vol&&m.vol.hblock)fallo(m,'¡Cura bloqueada!');
  else{let h=ef.h;if(['moonlight','synthesis','morning-sun'].includes(p.key)&&campo.cl)h=campo.cl.k=='sun'?.67:.25;
   const r=Math.min(Math.round(m.max*h),m.max-m.hp);m.hp+=r;txt.push({x:m.x,y:m.y-40,s:'+'+r,c:'#4ade80',l:1.1});ring(m.x,m.y,'#4ade80',50,.7);for(let i=0;i<14;i++)ps.push({x:m.x+R(-22,22),y:m.y+R(-10,16),vx:R(-10,10),vy:R(-90,-30),l:.9,m:.9,c:i%2?'#bbf7d0':'#4ade80',s:R(3,6),g:1})}}
 if(ef.s)stg(m,ef.s);
 if(ef.c){m.cnt={cat:ef.c.cat,m:ef.c.m,l:ef.c.t};txt.push({x:m.x,y:m.y-46,s:'¡En guardia!',c:'#fbbf24',l:1.2,sm:1});ring(m.x,m.y,'#fbbf24',45,.6)}
 // campo
 if(ef.cl)ponerCampo('cl',ef.cl,m);if(ef.te)ponerCampo('te',ef.te,m);if(ef.sa)ponerCampo('sa',ef.sa,m);
 if(ef.dep)ponerDep(ef.dep,m);if(ef.ha)ponerHaz(m,ef.ha);
 // propios
 if(ef.cu){
  if(m.types.includes('ghost')){const c=Math.round(m.max*.5);if(tg&&m.hp>c&&!(tg.vol&&tg.vol.sub)){m.hp-=c;txt.push({x:m.x,y:m.y-30,s:'-'+c,c:'#f87171',l:.9});(tg.vol=tg.vol||{}).curse={l:12,t:0,by:m}}else fallo(m)}
  else stg(m,{atk:1,def:1,spe:-1})}
 if(ef.cur){m.ail=null;if(m.vol){delete m.vol.cnf;delete m.vol.inf}txt.push({x:m.x,y:m.y-56,s:'¡Curado!',c:'#bbf7d0',l:1.2,sm:1})}
 if(ef.pu&&tg)Object.assign(m.stg,tg.stg);
 if(ef.hz){for(const x of[m,tg])if(x)for(const k in x.stg)x.stg[k]=0;txt.push({x:m.x,y:m.y-56,s:'¡Estadísticas reiniciadas!',c:'#e2e8f0',l:1.2,sm:1})}
 if(ef.pd&&tg){const a=Math.round((m.hp+tg.hp)/2);m.hp=Math.min(m.max,a);tg.hp=Math.min(tg.max,a)}
 if(ef.ce)aplicarEst(m,'focus',m);
 if(ef.lf)m.lf=1;if(ef.lk)m.lock=1;
 if(ef.mi){const q=tg&&tg.last;if(!q||q.cat===undefined||(q.ef&&q.ef.mi)||m.mv.includes(q))fallo(m);else{m.mv[m.pi]=q;m.mc[m.pi]=0;txt.push({x:m.x,y:m.y-56,s:'¡Aprendió '+q.n+'!',c:'#fde047',l:1.4,sm:1})}}
 if(ef.cv&&m.mv[0])m.types=[m.mv[0].t];
 if(ef.tys)m.types=[ef.tys];

 if(ef.swl){const n=m.stk||0;if(!n||(m.vol&&m.vol.hblock))fallo(m);else{curaPS(m,[0,.25,.5,1][n]);m.stk=0}}
 if(ef.rv){const u=team[m.side]&&team[m.side].find(x=>x.dead);if(!u)fallo(m);else{u.dead=false;u.used=false;txt.push({x:m.x,y:m.y-56,s:'¡Un aliado vuelve!',c:'#fde047',l:1.4,sm:1})}}

 if(ef.ts)for(const x of[m,tg])if(x&&!x.dead&&x.types.includes(ef.ts.t))stg(x,ef.ts.s);
 if(ef.sx&&tg)intercambio(m,tg,ef.sx);
 // sobre el rival
 stOfensivo(m,tg,ef);
 if(ef.v&&!ef.of){const ks=[].concat(ef.v);
  if(ef.yo)for(const k of ks)aplicarEst(m,k,m);

 if(ef.a&&ef.a.yo){m.ail=null;aplicarEst(m,ef.a.k,m)}

<script>
// Campo de batalla: clima, terreno, salas, deportes y trampas de entrada, además de protecciones, precisión, críticos,
// cambios de Pokémon y pesos de la IA de los ataques de estado nuevos. Se reinicia en cada combate (nuevoCampo).
// Duraciones y fuerzas: constantes de abajo.
const CAMPO_L=15,CLIMA_DOT=.03,TERRENO_CURA=.03;
// El clima se lee y se escribe como campo.cl; mientras algún luchador lo anule (Cielo Despejado, Bucle Aire) se ve como null y no corre su tiempo.
const nuevoCampo=()=>({_cl:null,get cl(){return this._cl&&!(typeof climaAnulado==='function'&&climaAnulado())?this._cl:null},set cl(v){this._cl=v},te:null,sa:null,dep:{},haz:[{},{}],tc:0,gp:[]});   // gp = golpes pendientes de los ataques de varios golpes
var campo=nuevoCampo();
const salaK=k=>!!(campo.sa&&campo.sa.k==k);
const NOM_CAMPO={sun:'☀ Sol',rain:'🌧 Lluvia',sand:'🏜 Tormenta de arena',hail:'❄ Granizo',elec:'⚡ Campo eléctrico',leaf:'🌿 Campo de hierba',mist:'🌫 Campo de niebla',psy:'🔮 Campo psíquico',trick:'🔄 Sala Trampa',wonder:'🔀 Sala Extraña'};
// Color de la esfera de cada protección (proteccion.js)
const PROT_COL={protect:'#38bdf8',endure:'#fbbf24',king:'#e2e8f0',spiky:'#84cc16',bunker:'#c084fc',obstruct:'#f87171',silk:'#f9a8d4',bulwark:'#fb923c'};
const NOM_HAZ={spikes:'Púas',tspikes:'Púas tóxicas',rocks:'Rocas',web:'Red'};

function fallo(m,s='¡Falló!'){txt.push({x:m.x,y:m.y-46,s,c:'#cbd5e1',l:1,sm:1})}
function ponerCampo(tipo,k,m){
 const o=campo[tipo];
 if(o&&o.k==k){fallo(m);return}
 campo[tipo]={k,l:CAMPO_L};
 txt.push({x:m.x,y:m.y-56,s:NOM_CAMPO[k]+'!',c:'#fde047',l:1.5,sm:1});log(`${NOM_CAMPO[k]}`);
}
function ponerDep(k,m){if(campo.dep[k]){fallo(m);return}campo.dep[k]=CAMPO_L;txt.push({x:m.x,y:m.y-56,s:'¡'+(k=='water'?'Chorro de agua':'Chorro de barro')+'!',c:'#bae6fd',l:1.2,sm:1})}
function ponerHaz(m,k){
 if(k=='limpia'){campo.haz=[{},{}];txt.push({x:m.x,y:m.y-56,s:'¡Trampas despejadas!',c:'#bae6fd',l:1.2,sm:1});return}
 const h=campo.haz[1-m.side],tope={spikes:3,tspikes:2,rocks:1,web:1}[k];
 if((h[k]||0)>=tope){fallo(m);return}
 h[k]=(h[k]||0)+1;
 txt.push({x:m.x,y:m.y-56,s:'¡'+NOM_HAZ[k]+' en el campo rival!',c:'#fdba74',l:1.4,sm:1});
}
// Al entrar un Pokémon (luchadores.js, spawn)
function aplicaHaz(m){
 const h=campo.haz[m.side],vuela=m.types.includes('flying')||!!gancho('inmune',m,'ground');
 if(h.spikes&&!vuela)dotDano(m,[0,.125,.1667,.25][h.spikes],'#fdba74');
 if(h.tspikes&&!vuela){if(m.types.includes('poison'))delete h.tspikes;else aplicarEst(m,h.tspikes>1?'tox':'psn',null)}
 if(h.rocks&&!m.dead)dotDano(m,.125*tEff('rock',m.types),'#a8a29e');
 if(h.web&&!vuela&&!m.dead)stg(m,{spe:-1});
}
// Ataques de varios golpes: el primero lo da hit(); los demás se agendan cada .11 s (nHits sortea cuántos)
function nHits([mn,mx]){
 if(mn>=mx)return mn;
 if(mn==2&&mx==5)return pickP([2,3,4,5],[3,3,1,1]);
 return mn+Math.floor(rnd()*(mx-mn+1));
}
function agendaHits(o,tg,dm,t,cat,fx){
 const n=nHits(o.last.hits)-1;
 for(let i=1;i<=n;i++)campo.gp.push({t:.11*i,o,tg,dm:o.last.ramp?dm*(i+1):dm,tt:t,cat,fx,sec:o.last.sec,sty:o.last.sty});
}
function tickCampo(dt){
 const c=campo;
 if(c.gp.length){
  for(const g of c.gp)g.t-=dt;
  const listos=c.gp.filter(g=>g.t<=0);c.gp=c.gp.filter(g=>g.t>0);
  for(const g of listos){if(g.tg.dead||g.o.dead)continue;hit(g.tg,g.dm,g.tt,g.o,{cat:g.cat,f:false,mh:1,fx:g.fx,sec:g.sec});vfx(g.tg.x,g.tg.y-20,g.sty,g.tt)}
 }
 for(const k of['cl','te','sa'])if(c[k]&&(c[k].l-=dt)<=0)c[k]=null;
 for(const k of Object.keys(c.dep))if((c.dep[k]-=dt)<=0)delete c.dep[k];
 c.tc+=dt;
 if(c.tc<1)return;
 c.tc-=1;
 for(const m of mons.slice()){
  if(m.dead||m.enter>0)continue;
  const cl=c.cl&&c.cl.k;
  if(cl=='sand'&&!m.types.some(t=>['rock','ground','steel'].includes(t))&&!gancho('sinClimaDano',m,'sand'))dotDano(m,CLIMA_DOT,'#d6a550');
  else if(cl=='hail'&&!m.types.includes('ice')&&!gancho('sinClimaDano',m,'hail'))dotDano(m,CLIMA_DOT,'#a5f3fc');
  if(!m.dead&&c.te&&c.te.k=='leaf'&&m.hp<m.max){const r=Math.min(Math.round(m.max*TERRENO_CURA),m.max-m.hp);m.hp+=r;txt.push({x:m.x,y:m.y-40,s:'+'+r,c:'#4ade80',l:.7,sm:1})}
 }
}
// Multiplicador de daño por clima, terreno, deportes y pantallas
function campoMul(t,tg,cat){
 let f=1;const c=campo,cl=c.cl&&c.cl.k,te=c.te&&c.te.k;
 if(cl=='sun')f*=t=='fire'?1.5:t=='water'?.5:1;
 if(cl=='rain')f*=t=='water'?1.5:t=='fire'?.5:1;
 if(te=='elec'&&t=='elec')f*=1.3;if(te=='leaf'&&t=='leaf')f*=1.3;if(te=='psy'&&t=='psychic')f*=1.3;if(te=='mist'&&t=='dragon')f*=.5;
 if(c.dep.water&&t=='fire')f*=.33;if(c.dep.mud&&t=='elec')f*=.33;
 const V=tg.vol;if(V&&(V.aveil||(cat=='phy'?V.reflect:V.lscreen)))f*=.6;
 return f;
}
// Precisión efectiva (estados de precisión/evasión, Fijar Blanco, clima)
function accEf(m,tg,p){
 if(m.lock){m.lock=0;return 1e9}
 if(gancho('noFalla',m)||gancho('noFalla',tg))return 1e9;
 const c=campo.cl&&campo.cl.k,tr=p.key=='thunder'||p.key=='hurricane';
 if(c=='rain'&&tr||c=='hail'&&p.key=='blizzard')return 1e9;
 const s=Math.max(-6,Math.min(6,(m.stg.acc||0)-(tg.stg.eva||0)));
 return p.acc*(s>=0?(3+s)/3:3/(3-s))*(c=='sun'&&tr?.7:1)*ganchoMul('accMul',m,tg,p)*ganchoMul('accRec',tg,m,p);
}
function critP(o,tg,e){
 if(tg.vol&&tg.vol.lucky)return 0;
 if(gancho('sinCrit',tg))return 0;   // Armadura Batalla, Caparazón
 if(o.lf&&(!e||e.f)){o.lf=0;return 1}
 const et=((o.last&&o.last.cr)||0)+(o.vol&&o.vol.focus?2:0)+ganchoSum('critEt',o);   // etapas de crítico: 0 → 6,25 % · 1 → 12,5 % · 2 → 50 % · 3 → 100 %
 return[.0625,.125,.5,1][Math.min(3,et)];
}
// Efectividad de un tipo contra un luchador, con Levitación (inmune a Tierra) e Identificado (quita inmunidades de Fantasma/Siniestro)
function efTipo(t,tg){
 const V=tg.vol;let ts=tg.types;
 if(V&&V.ident)ts=ts.filter(x=>!((x=='ghost'&&(t=='normal'||t=='fighting'))||(x=='dark'&&t=='psychic')));
 if(V&&V.levit&&t=='ground')return 0;
 if(gancho('inmune',tg,t))return 0;   // habilidades y objetos (Levitación...)
 return tEff(t,ts);
}
// Un golpe contra alguien que se protege (hit lo llama y se detiene)
function protegido(tg,o,e){
 const cat=(e&&e.cat)||(o.plan&&o.plan.cat)||(o.last&&o.last.cat)||'phy';
 // cada golpe bloqueado se nota: el primero con texto grande, los demás (ataques de varios golpes) con uno pequeño
 if(!e||e.f)txt.push({x:tg.x,y:tg.y-48,s:'¡Se protegió!',c:'#93c5fd',l:1,sm:1});
 else if(T-(tg.pbT||-9)>.2)txt.push({x:tg.x+R(-12,12),y:tg.y-40,s:'Bloqueado',c:'#bfdbfe',l:.5,sm:1});
 const col=PROT_COL[tg.prot.k]||'#93c5fd',a=Math.atan2(o.y-tg.y,o.x-tg.x);
 tg.pbT=T;tg.pbA=a;tg.flash=.05;o.failT=T;   // proteccion.js ilumina la esfera por ese lado
 burst(tg.x+Math.cos(a)*40,tg.y-28+Math.sin(a)*34,col,6,130,true);
 if(o.dead||cat!='phy'||(e&&!e.f))return;   // efecto de contacto: ataques FÍSICOS (en los de varios golpes, solo el primero)
 tg.pxT=T;
 switch(tg.prot.k){
  case'spiky':dotDano(o,.125,'#f87171');break;
  case'king':stg(o,{atk:-1});break;
  case'bunker':aplicarEst(o,'psn',tg,true);break;
  case'obstruct':stg(o,{def:-2});break;
  case'silk':stg(o,{spe:-1});break;
  case'bulwark':aplicarEst(o,'brn',tg,true);break;
 }
}
function protege(m,k){
 const n=(T-(m.pt==null?-99:m.pt)<3.5)?(m.pn||0)+1:0;m.pn=n;m.pt=T;
 if(n>0&&rnd()>1/Math.pow(3,n)){fallo(m);return}
 m.prot={k,l:1.5};txt.push({x:m.x,y:m.y-56,s:k=='endure'?'¡Aguanta!':'¡Se protege!',c:'#93c5fd',l:1.2,sm:1});ring(m.x,m.y,'#93c5fd',45,.6);
}
// El Pokémon se retira y entra el siguiente del equipo (si queda alguien). Su carta no cae.
function forzarCambio(m){
 const s=m.side,nx=team[s]&&team[s].find(u=>!u.used);
 if(!nx||m.dead||over)return false;
 m.dead=true;m.fade=.5;m.vol=null;m.ail=null;m.plan=null;send[s]=.3;
 burst(m.x,m.y,'#fff',16,160,true);log(`${tn(m.t)} se retira del combate`);ui();
 return true;
}
// Peso de la IA para los ataques de estado nuevos (undefined = lo decide ia.js como antes)
function wtEfx(m,e,o){
 const V=m.vol||{},fr=m.hp/m.max,tiene=k=>o&&o.vol&&o.vol[k];
 if(e.nada)return 0;
 if(e.sw&&!(team[m.side]&&team[m.side].some(u=>!u.used)))return 0;
 if(e.cost)return fr>.6&&!(e.s&&m.stg.atk>=3)?1.2:0;
 if(e.kam)return fr<.35?3:.1;
 if(e.pr)return m.prot||T-(m.pt==null?-99:m.pt)<2.5?0:.5;
 if(e.cl)return campo.cl&&campo.cl.k==e.cl?0:1;
 if(e.te)return campo.te&&campo.te.k==e.te?0:.9;
 if(e.sa)return campo.sa&&campo.sa.k==e.sa?0:.7;
 if(e.dep)return campo.dep[e.dep]?0:.5;
 if(e.ha){if(e.ha=='limpia')return Object.keys(campo.haz[m.side]).length?2:0;
  return(campo.haz[1-m.side][e.ha]||0)<{spikes:3,tspikes:2,rocks:1,web:1}[e.ha]?.9:0}
 if(e.sb)return V.sub||fr<.5?0:1;
 if(e.v){const ks=[].concat(e.v);
  if(e.of)return!o||tiene(ks[0])||!puedeEst(o,ks[0],m)?0:1;
  if(e.both)return V[ks[0]]||tiene(ks[0])?0:.2;
  if(e.req&&!(campo.cl&&campo.cl.k==e.req))return 0;
  return V[ks[0]]?0:.8}
 if(e.cu)return m.types.includes('ghost')&&fr<=.6?0:1;
 if(e.cur&&!e.s&&!e.h)return m.ail||V.cnf||V.inf?3:0;
 if(e.pu)return o&&Object.values(o.stg).some(x=>x>=2)?1.5:0;
 if(e.hz)return o&&(Object.values(o.stg).some(x=>x>=2)||Object.values(m.stg).some(x=>x<=-2))?1.5:0;
 if(e.pd)return o&&fr<o.hp/o.max-.2?1.5:0;
 if(e.ce)return V.focus?0:.7;
 if(e.lf)return m.lf?0:.5;
 if(e.lk)return m.lock?0:.5;
 if(e.cp)return o&&o.last&&!(o.last.ef&&o.last.ef.cp)?1:0;
 if(e.mi)return o&&o.last&&o.last.cat!==undefined&&!m.mv.includes(o.last)?.8:0;
 if(e.sw)return e.sw=='yo'?(fr<.4?1.5:.2):.6;
 if(e.sp||e.ty||e.ta||e.tys||e.cv||e.rt)return o?.4:0;
 if(e.ac)return .8;
 if(e.sx){const k=e.sx;if(!o)return 0;
  if(k=='heart'||k=='topsy')return Object.values(o.stg).some(x=>x>=2)||Object.values(m.stg).some(x=>x<=-2)?1.5:0;
  if(k=='guard'||k=='power')return Object.values(m.stg).some(x=>x<=-2)?1.2:0;
  if(k=='speed')return o.st.spe>m.st.spe*1.2?1:0;
  if(k=='ptrick'||k=='pshift')return m.st.def>m.st.atk*1.3?.8:0;
  if(k=='psplit')return o.st.atk>m.st.atk*1.2||o.st.spa>m.st.spa*1.2?1:0;
  if(k=='gsplit')return o.st.def<m.st.def*.8||o.st.spd<m.st.spd*.8?0:.6;
  if(k=='trans')return m.ail&&!o.ail&&puedeEst(o,m.ail.k,m)?2:0}
 if(e.cc){const a=Object.keys(campo.haz[m.side]).length,b=Object.keys(campo.haz[1-m.side]).length;return a>b?2:0}
 if(e.ts)return m.types.includes(e.ts.t)||(o&&o.types.includes(e.ts.t))?.6:0;
 if(e.stk)return(m.stk||0)<3?.9:0;
 if(e.swl)return m.stk&&fr<.6?2:0;
 if(e.rv)return team[m.side]&&team[m.side].some(u=>u.dead)?1.5:0;
 return undefined;
}
// Dibujo del clima y etiquetas del campo (dibujo.js, al final de draw)
function dibujaCampo(){
 const c=campo;if(!c)return;
 const cl=c.cl&&c.cl.k,col={sun:'255,200,60',rain:'80,140,255',sand:'200,160,80',hail:'190,230,255'}[cl];
 cx.save();
 if(col){
  cx.globalAlpha=1;cx.fillStyle=`rgba(${col},.1)`;cx.fillRect(0,0,W,H);
  cx.strokeStyle=cx.fillStyle=`rgba(${col},.6)`;cx.lineWidth=1.5;
  for(let i=0;i<46;i++){
   if(cl=='rain'){const x=(i*131)%W,y=(i*53+T*520)%H;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x-5,y+14);cx.stroke()}
   else if(cl=='sand'){const x=(i*97+T*260)%W,y=(i*61)%H+Math.sin(T*3+i)*6;cx.fillRect(x,y,3,2)}
   else if(cl=='hail'){const x=((i*113)%W+Math.sin(T+i)*14+W)%W,y=(i*47+T*70)%H;cx.beginPath();cx.arc(x,y,2.2,0,7);cx.fill()}
  }
  if(cl=='sun'){const g=cx.createRadialGradient(W-60,30,5,W-60,30,260);g.addColorStop(0,'rgba(255,230,120,.45)');g.addColorStop(1,'rgba(255,200,60,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H)}
 }
 const l=[];
 for(const k of['cl','te','sa'])if(c[k])l.push(NOM_CAMPO[c[k].k]+' '+Math.ceil(c[k].l)+'s');
 if(c.dep.water)l.push('Chorro de agua '+Math.ceil(c.dep.water)+'s');if(c.dep.mud)l.push('Chorro de barro '+Math.ceil(c.dep.mud)+'s');
 cx.font='bold 11px system-ui';cx.textAlign='left';cx.lineWidth=3;cx.strokeStyle='rgba(0,0,0,.7)';cx.fillStyle='#fff';
 l.forEach((s,i)=>{cx.strokeText(s,8,16+i*14);cx.fillText(s,8,16+i*14)});
 [0,1].forEach(side=>{
  const h=Object.entries(c.haz[side]).map(([k,n])=>NOM_HAZ[k]+(n>1?' x'+n:'')).join(', ');if(!h)return;
  const s='⚠ '+h;cx.textAlign=side?'right':'left';const x=side?W-8:8;
  cx.strokeText(s,x,H-8);cx.fillStyle=side?'#fca5a5':'#93c5fd';cx.fillText(s,x,H-8);cx.fillStyle='#fff';
 });
 cx.restore();
}

<script>
// Estados alterados: quemadura, parálisis, veneno, sueño, congelación (uno a la vez, "mayores")
// y los volátiles (varios a la vez): confusión, drenadoras, atrapado, enamorado, provocado, pantallas, sustituto...
// Guardado en el luchador: m.ail = {k, l (s que quedan), t, n}  ·  m.vol = {clave:{l, t, by, ...}}
// En combate en tiempo real todo dura segundos (no turnos). Ajusta los números aquí.
const EST={
 brn:{n:'Quemado',c:'#f97316',tag:'QUE',l:20,dot:.015},        // 1,5 % de PS por segundo · ataque x0,5
 par:{n:'Paralizado',c:'#facc15',tag:'PAR',l:20},               // velocidad x0,5 · 25 % de no poder atacar
 psn:{n:'Envenenado',c:'#a855f7',tag:'VEN',l:20,dot:.02},       // 2 % de PS por segundo
 tox:{n:'Muy envenenado',c:'#7e22ce',tag:'TOX',l:20},           // empieza flojo y sube (ver TOX_*)
 slp:{n:'Dormido',c:'#94a3b8',tag:'DOR',l:4},                   // no hace nada
 frz:{n:'Congelado',c:'#7dd3fc',tag:'CON',l:3},                 // no hace nada · un ataque de fuego lo descongela
};
// fijo:1 = duración exacta (sin azar) · dot = % de PS por segundo · heal = % de PS curado por segundo
const VOL={
 cnf:{n:'Confuso',c:'#f472b6',tag:'CNF',l:4},                   // 33 % de golpearse a sí mismo al atacar
 seed:{n:'Drenadoras',c:'#4ade80',tag:'DRE',l:10,dot:.04},      // 4 % de PS por segundo que cura al que las puso
 trap:{n:'Atrapado',c:'#fb923c',tag:'ATR',l:5,dot:.03},         // 3 % de PS por segundo y velocidad x0,6
 net:{n:'Sin escape',c:'#94a3b8',tag:'ESC',l:8},                // velocidad x0,6
 yawn:{n:'Con sueño',c:'#cbd5e1',tag:'SUE',l:3},                // al acabar se queda dormido
 inf:{n:'Enamorado',c:'#fb7185',tag:'ENA',l:5},                 // 50 % de no atacar
 nmare:{n:'Pesadilla',c:'#6d28d9',tag:'PES',l:10,dot:.05},      // 5 % de PS por segundo, solo mientras duerme
 torment:{n:'Atormentado',c:'#a3a3a3',tag:'TOR',l:6},           // no repite ataque
 disable:{n:'Anulado',c:'#a3a3a3',tag:'ANU',l:5},               // un ataque inutilizado
 taunt:{n:'Provocado',c:'#f87171',tag:'PRO',l:4},               // sin ataques de estado
 encore:{n:'Otra vez',c:'#e879f9',tag:'REP',l:3},               // repite su último ataque
 hblock:{n:'Cura bloqueada',c:'#fda4af',tag:'BLQ',l:5},
 perish:{n:'Canto Mortal',c:'#9ca3af',tag:'MUE',l:6,fijo:1},    // se debilita al acabar
 regen:{n:'Raíces',c:'#4ade80',tag:'RAI',l:20,heal:.03},
 safe:{n:'Velo Sagrado',c:'#bae6fd',tag:'VEL',l:10},            // no recibe estados alterados
 mist:{n:'Neblina',c:'#e0f2fe',tag:'NEB',l:8},                  // no le bajan las estadísticas
 lucky:{n:'Amuleto',c:'#fde68a',tag:'AMU',l:8},                 // sin golpes críticos
 mcoat:{n:'Capa Mágica',c:'#f0abfc',tag:'CAP',l:2.5,fijo:1},    // rebota un ataque de estado
 dbond:{n:'Vínculo',c:'#818cf8',tag:'VIN',l:3,fijo:1},
 wish:{n:'Deseo',c:'#fde047',tag:'DES',l:3,fijo:1},             // cura 50 % al acabar
 reflect:{n:'Reflejo',c:'#f9a8d4',tag:'REF',l:10},              // daño físico x0,6
 lscreen:{n:'Pantalla Luz',c:'#fcd34d',tag:'PAN',l:10},         // daño especial x0,6
 aveil:{n:'Velo Aurora',c:'#a5f3fc',tag:'AUR',l:10},            // todo el daño x0,6
 tail:{n:'Viento Afín',c:'#bae6fd',tag:'VIE',l:8},              // velocidad x2
 levit:{n:'Levitando',c:'#a5b4fc',tag:'LEV',l:5},                // inmune a Tierra
 octo:{n:'Octobrazo',c:'#f472b6',tag:'OCT',l:8,tick:{def:-1,spd:-1}},   // velocidad x0,6 y baja Def y Def. Esp. cada segundo
 ident:{n:'Identificado',c:'#fde68a',tag:'IDE',l:20},            // pierde las inmunidades de tipo
 sil:{n:'Silenciado',c:'#94a3b8',tag:'SIL',l:3},                 // sin ataques de sonido
 furia:{n:'Furia',c:'#f97316',tag:'FUR',l:12,fijo:1},            // repite su ataque (Atropello, Pataleta...)
 curse:{n:'Maldito',c:'#6b21a8',tag:'MAL',l:12,dot:.06},     // 6 % de PS por segundo (Maldición de un Fantasma)
 focus:{n:'Concentrado',c:'#fb923c',tag:'FOC',l:20},            // críticos 33 %
 sub:{n:'Sustituto',c:'#fbbf24',tag:'SUS',l:60,fijo:1},         // m.vol.sub.hp = vida del señuelo
};
const TOX_SUBE=.004,TOX_TOPE=.035;
// Tipos inmunes a cada estado
const INMUNE={brn:['fire'],par:['elec'],psn:['poison','steel'],tox:['poison','steel'],frz:['ice'],seed:['leaf'],trap:['ghost']};

// Multiplicador de una estadística por estados, viento, Sala Trampa y clima
function estMul(m,k){
 let f=1;
 if(m.ail){if(m.ail.k=='brn'&&k=='atk')f*=.5;if(m.ail.k=='par'&&k=='spe')f*=.5}
 if(k=='spe'){if(m.vol&&m.vol.tail)f*=2;if(salaK('trick'))f*=10000/(m.st.spe*m.st.spe)}
 const cl=campo.cl&&campo.cl.k;
 if(k=='spd'&&cl=='sand'&&m.types.includes('rock'))f*=1.5;
 if(k=='def'&&cl=='hail'&&m.types.includes('ice'))f*=1.5;
  return f*ganchoMul('statMul',m,k)*statGlobal(m,k);   // habilidades y objetos (Poder Puro, Agallas, Nado Rápido...)
}

function puedeEst(m,k,por){
 if(!m||m.dead)return false;
 const mayor=!!EST[k];
 if(mayor){if(m.ail)return false}else if(m.vol&&m.vol[k])return false;
 if(INMUNE[k]&&m.types.some(t=>INMUNE[k].includes(t)))return false;
 if(k=='nmare'&&!(m.ail&&m.ail.k=='slp'))return false;
 if(k=='disable'&&(m.pi==null||!m.mv||!m.mv[m.pi]))return false;
 const ajeno=por&&por!==m,te=campo.te&&campo.te.k;
 if(ajeno&&(mayor||k=='cnf')){
  if(m.vol&&m.vol.safe)return false;
  if(te=='mist')return false;
  if(te=='elec'&&(k=='slp'))return false;
 }
 if(te=='elec'&&k=='yawn')return false;
 return true;
}
// Pone un estado. por = quien lo provoca. aviso = mostrar "No afecta" si falla. Devuelve true si se aplicó.
function aplicarEst(m,k,por,aviso){
 const E=EST[k]||VOL[k];
 if(!puedeEst(m,k,por)){if(aviso)txt.push({x:m.x,y:m.y-56,s:'No afecta',c:'#e2e8f0',l:1.1,sm:1});return false}
 const l=E.fijo?E.l:E.l*RS(.75,1.25);
 if(EST[k]){m.ail={k,l,t:0,n:0};if(k=='slp'||k=='frz'){m.plan=null;m.lw=0;m.lunge=0}}
 else{(m.vol=m.vol||{})[k]={l,t:0,by:por};if(k=='disable')m.vol[k].i=m.pi}
 txt.push({x:m.x,y:m.y-56,s:'¡'+E.n+'!',c:E.c,l:1.4,sm:1});ring(m.x,m.y,E.c,45,.6);burst(m.x,m.y-10,E.c,10,110,true);
 return true;
}
function dotDano(m,f,c){
 const d=Math.max(1,Math.round(m.max*f));m.hp-=d;
 txt.push({x:m.x+R(-8,8),y:m.y-34,s:'-'+d,c,l:.7,sm:1});burst(m.x,m.y-10,c,3,60,true);
 if(m.hp<=0)debilitar(m,null);
 return d;
}
const curaPS=(m,f,c)=>{const r=Math.min(Math.round(m.max*f),m.max-m.hp);if(r>0){m.hp+=r;txt.push({x:m.x,y:m.y-40,s:'+'+r,c:c||'#4ade80',l:.8,sm:1})}return r};
// Cada paso de simulación (lo llama upM)
function tickEst(m,dt){
 if(m.prot&&(m.prot.l-=dt)<=0)m.prot=null;
 const a=m.ail;
 if(a){const E=EST[a.k];a.l-=dt;a.t+=dt;
  if(a.t>=1){a.t-=1;a.n++;
   if(a.k=='tox')dotDano(m,Math.min(TOX_TOPE,TOX_SUBE*a.n),E.c);else if(E.dot)dotDano(m,E.dot,E.c)}
  if(!m.dead&&a.l<=0){m.ail=null;txt.push({x:m.x,y:m.y-56,s:a.k=='slp'?'¡Despertó!':a.k=='frz'?'¡Se descongeló!':'¡Se recuperó!',c:'#bbf7d0',l:1.2,sm:1})}
 }
 if(m.dead||!m.vol)return;
 for(const k of Object.keys(m.vol)){
  const s=m.vol[k],V=VOL[k];s.l-=dt;s.t+=dt;
  if(s.t>=1&&(V.dot||V.heal||V.tick)){s.t-=1;
   if(V.tick)stg(m,V.tick);
   if(V.dot&&(k!='nmare'||(m.ail&&m.ail.k=='slp'))){const d=dotDano(m,V.dot,V.c);
    if(k=='seed'&&s.by&&!s.by.dead&&d>0)curaPS(s.by,d/s.by.max)}
   if(m.dead)return;
   if(V.heal&&!m.vol.hblock)curaPS(m,V.heal);
  }
  if(m.dead)return;
  if(s.l<=0){delete m.vol[k];
   if(k=='yawn')aplicarEst(m,'slp',s.by);
   else if(k=='perish')debilitar(m,null);
   else if(k=='wish'&&!m.vol.hblock)curaPS(m,.5,'#fde047');
   if(m.dead)return}
 }
}
// ¿Falla el ataque por parálisis, confusión o enamoramiento? (lo llama atk tras gastar el enfriamiento)
function fallaEst(m){
 if(m.ail&&m.ail.k=='par'&&rnd()<.25){txt.push({x:m.x,y:m.y-56,s:'¡Paralizado! No puede moverse',c:'#facc15',l:1.2,sm:1});m.freeze=.5;m.plan=null;return true}
 if(m.vol&&m.vol.inf&&rnd()<.5){txt.push({x:m.x,y:m.y-56,s:'¡Está enamorado!',c:'#fb7185',l:1.2,sm:1});m.freeze=.5;m.plan=null;return true}
 if(m.vol&&m.vol.cnf&&rnd()<.33){txt.push({x:m.x,y:m.y-56,s:'¡Se hirió en su confusión!',c:'#f472b6',l:1.2,sm:1});dotDano(m,.06,'#f472b6');m.flash=.18;m.freeze=.5;m.plan=null;return true}
 return false;
}
function descongelar(tg,t){
 if(tg.ail&&tg.ail.k=='frz'&&t=='fire'){tg.ail=null;txt.push({x:tg.x,y:tg.y-56,s:'¡Se descongeló!',c:'#fde68a',l:1.2,sm:1})}
}
function amedrentar(tg){
 if(tg.dead||tg.sc||tg.lunge>0)return;
 tg.freeze=Math.max(tg.freeze||0,.6);tg.plan=null;tg.lw=0;
 txt.push({x:tg.x,y:tg.y-56,s:'¡Retrocede!',c:'#e2e8f0',l:1,sm:1});
}
// Efectos secundarios de un ataque con daño (s = mv.sec, d = daño hecho, primero = golpe principal del ataque)
function secundarios(s,o,tg,d,primero){
 if(s.dr&&!o.dead){
  if(s.dr>0)curaPS(o,d*s.dr/100/o.max);
  else{dotDano(o,Math.max(1,Math.round(d*-s.dr/100))/o.max,'#f87171');txt.push({x:o.x,y:o.y-56,s:'¡Retroceso!',c:'#f87171',l:1,sm:1})}
 }
 if(!primero)return;
 if(s.x)switch(s.x){   // efectos extra por nombre (SEC_X)
  case'spin':campo.haz[o.side]={};if(o.vol){delete o.vol.trap;delete o.vol.seed}break;
  case'rompe':if(tg.vol){delete tg.vol.reflect;delete tg.vol.lscreen;delete tg.vol.aveil}break;
  case'smog':for(const q in tg.stg)tg.stg[q]=0;break;
  case'baja':if(tg.vol)delete tg.vol.levit;break;
  case'cura':if(tg.ail&&tg.ail.k=='brn')tg.ail=null;break;
  case'terreno':campo.te=null;break;
 }
 if(s.ss&&rnd()*100<s.ps&&!o.dead)stg(o,s.ss);
 if(tg.hp<=0||tg.dead){if(s.sw=='yo'&&!o.dead)forzarCambio(o);return}
 if(s.a&&rnd()*100<s.pa)aplicarEst(tg,s.a,o);
 if(s.f&&rnd()*100<s.f)amedrentar(tg);
 if(s.so&&rnd()*100<s.ps)stg(tg,s.so,true);
 if(s.sw=='rival')forzarCambio(tg);else if(s.sw=='yo'&&!o.dead)forzarCambio(o);
}
// Etiquetas pequeñas junto a la barra de vida (dibujo.js) y en el panel de cada equipo (hud.js)
function etiquetas(m,y){
 if(m.prot&&!m.prot.vis){   // barrera sin animación propia: burbuja sencilla mientras dure
  cx.save();cx.globalAlpha=.35+.15*Math.sin(T*18);cx.strokeStyle=cx.fillStyle=(typeof PROT_COL!=='undefined'&&PROT_COL[m.prot.k])||'#93c5fd';cx.lineWidth=3;
  cx.beginPath();cx.ellipse(m.x,m.y-28,34,38,0,0,7);cx.stroke();cx.globalAlpha*=.25;cx.fill();cx.restore();
 }
 const l=[];if(m.ail)l.push(EST[m.ail.k]);for(const k in m.vol||{})l.push(VOL[k]);
 let x=m.x+24;cx.font='bold 8px system-ui';cx.textAlign='center';
 for(const E of l){cx.fillStyle=E.c;cx.fillRect(x,y-1,22,9);cx.fillStyle='#0f172a';cx.fillText(E.tag,x+11,y+6.5);x+=24}
}

<script>
// Ataques de dos turnos y ataques que se repiten.
//  · k:'carga' (Rayo Solar, Pico Taladro...): se concentra ~0,9 s con partículas y luego lanza el ataque normal.
//  · k:'inv' (Excavar, Buceo, Bote, Golpe Fantasma...): desaparece ~0,8 s (m.inv) y reaparece junto al rival para atacar.
// Datos (qué ataque es de cuál): DT en datos/ataques-especiales.js. atk() llama a iniciaDosTurnos(); cuando acaba el guion
// (SCRIPTS_INT.dt, que _ayudas.js:scr() ejecuta como los de CUSTOM) vuelve a llamar a atk() y esta vez sí lo lanza.
// Mientras está escondido, hit() ignora los golpes salvo los de INV_HIT (p. ej. Terremoto contra Excavar).
const INV_HIT={dig:['earthquake','magnitude','fissure'],dive:['surf','whirlpool'],sky:['thunder','gust','twister','hurricane','sky-uppercut','smack-down'],ghost:[]};

function iniciaDosTurnos(m,tg,p){
 const d=p.dt,c=campo.cl&&campo.cl.k;
 if((d.sun&&c=='sun')||(d.rain&&c=='rain')){m.dtDone=p;atk(m);return}   // con ese clima no hace falta cargar
 m.sc={id:'dt',t:0,p,d,dur:d.k=='carga'?.9:.8};
 if(d.s)stg(m,d.s);
 bn={s:p.n,c:d.c||'#e2e8f0',l:1.1};
 if(d.k=='inv'){m.inv=d.v;if(d.v=='dig'||d.v=='dive')m.hide=true;if(d.v=='ghost')m.invA=1}
}
const finDT=m=>{m.inv=null;m.hide=false;m.invA=null;m.z=0;m.tilt=0;m.sqz=0};

const SCRIPTS_INT={dt:{
 run(m,dt,s){
  const p=s.p,d=s.d,tg=m.tg,t=s.t,u=Math.min(1,t/s.dur);
  if(m.dead){finDT(m);return true}
  if(!tg||tg.dead){finDT(m);return true}   // sin rival: se cancela
  m.a=turn(m.a,Math.atan2(tg.y-m.y,tg.x-m.x),dt*10);
  const col=d.c||'#fff',spark=(x,y,vx,vy,l,c,sz,gy)=>ps.length<900&&ps.push({x,y,vx,vy,gy,l,m:l,c,s:sz,g:1});
  if(d.k=='carga'){
   m.sqz=.3*u;m.x+=Math.sin(t*70)*.7;
   for(let i=0;i<3;i++){const a=R(0,6.28),r=R(25,60),v=R(80,160);spark(m.x+Math.cos(a)*r,m.y-30+Math.sin(a)*r,-Math.cos(a)*v,-Math.sin(a)*v,.3,i%2?col:'#fff',R(2,5))}
  }else if(d.v=='dig'||d.v=='dive'){
   m.sqz=.3*Math.min(1,t/.2);
   const c1=d.v=='dig'?['#a16207','#d6a550','#78350f']:['#38bdf8','#bae6fd','#fff'];
   for(let i=0;i<3;i++)spark(m.x+R(-16,16),m.y+8,R(-60,60),R(-170,-60),R(.3,.6),c1[i%3],R(3,6),420);
  }else if(d.v=='sky'){
   m.z=450*u*u;wind(m.x,m.y-m.z);if(Math.random()<.5)feathers(m.x+R(-14,14),m.y-m.z-20,2,70);
  }else{   // ghost: se desvanece entre humo morado
   m.invA=Math.max(.12,1-u*1.3);
   for(let i=0;i<2;i++)spark(m.x+R(-20,20),m.y-R(0,60),R(-30,30),R(-80,-20),R(.4,.8),i?'#a78bfa':'#4c1d95',R(4,8));
  }
  if(t<s.dur)return false;
  // fase 2: reaparece junto al rival y ataca (atk vuelve a entrar con dtDone y lanza el ataque de verdad)
  finDT(m);
  if(d.k=='inv'){
   const dx=tg.x-m.x,dy=tg.y-m.y,L=Math.hypot(dx,dy)||1;
   m.x=Math.max(100,Math.min(W-100,tg.x-dx/L*36));m.y=Math.max(100,Math.min(350,tg.y-dy/L*14));
   burst(m.x,m.y,col,18,200,true);ring(m.x,m.y,col,60,.4,4);
  }
  m.dtDone=p;m.plan=p;
  atk(m);
  return true;
 }
}};
// Dibujo de quien está escondido bajo tierra o agua (drawM lo llama cuando m.hide; el contexto ya está en la posición del Pokémon)
function invDraw(m){
 if(m.inv=='dig'){
  cx.fillStyle='rgba(120,83,45,.9)';cx.beginPath();cx.ellipse(0,10,26,10,0,0,7);cx.fill();
  cx.fillStyle='rgba(180,140,90,.9)';cx.beginPath();cx.ellipse(-3,6,16,6,0,0,7);cx.fill();
 }else{
  cx.strokeStyle='rgba(125,211,252,.9)';cx.lineWidth=2;
  for(let i=0;i<3;i++){const k=(T*1.6+i/3)%1;cx.globalAlpha=1-k;cx.beginPath();cx.ellipse(0,10,10+k*30,4+k*12,0,0,7);cx.stroke()}
  cx.globalAlpha=1;cx.fillStyle='rgba(2,132,199,.55)';cx.beginPath();cx.ellipse(0,10,16,6,0,0,7);cx.fill();
 }
}
// Ataques que se repiten (Atropello, Pataleta, Danza Pétalo, Rodar...): fija el ataque unos usos seguidos y, si toca, acaba confuso
function repite(m,p){
 const r=p.rep,f=m.vol&&m.vol.furia;
 if(!f){
  const n=r.n[0]+Math.floor(rnd()*(r.n[1]-r.n[0]+1));
  (m.vol=m.vol||{}).furia={l:12,t:0,n:n-1,u:0,conf:r.conf};
  if(n>1)m.mc[m.pi]=p.cd*.3;
 }else{
  f.u++;f.n--;
  if(f.n>0)m.mc[m.pi]=p.cd*.3;
  else{delete m.vol.furia;if(f.conf)aplicarEst(m,'cnf',m)}
 }
}

<script>
// Lógica de los ataques con efectos especiales (ver datos/ataques-especiales.js). Se usa desde dano.js.

// Debilita a un luchador. por = quien le derrota (null = se debilita solo, p. ej. Explosión).
function debilitar(m,por){
 if(m.dead)return;
 m.hp=Math.min(m.hp,0);m.dead=true;m.fade=1.2;m.u.dead=true;send[m.side]=1.4;
 log(por?`${tn(por.t)} derrotó a ${tn(m.t)}`:`${tn(m.t)} se debilitó`);
 burst(m.x,m.y,'#fff',22,200,true);ui();
 if(por&&m.vol&&m.vol.dbond&&!por.dead)debilitar(por,null);   // Mismo Destino
}

// Daño FIJO del ataque (null = el ataque usa la fórmula normal). o = atacante, tg = rival.
function danoEsp(fx,o,tg){
 switch(fx.k){
  case'fijo':return Math.max(1,Math.round(tg.max*(fx.max?RS(fx.pct,fx.max):fx.pct)));
  case'mitad':return Math.max(1,Math.round(tg.hp/2));
  case'igualar':return Math.max(0,Math.round(tg.hp-o.hp));
  case'ohko':return Math.ceil(tg.max*OHKO_FRAC);
  case'gambito':return Math.max(1,Math.round(o.hp));
 }
 return null;
}

// Potencia de los ataques de potencia variable. Los PS máximos sirven de "peso" aproximado (la carga de especies no trae el peso).
const pickP=(v,w)=>{let q=rnd()*w.reduce((a,b)=>a+b,0),i=0;while(i<v.length-1&&(q-=w[i])>0)i++;return v[i]};
function potEsp(f,o,t,fx){
 const pos=m=>Object.values(m.stg).reduce((s,x)=>s+Math.max(0,x),0);
 switch(f){
  case'peso':{const r=t.max;return r<120?20:r<170?40:r<230?60:r<300?80:r<380?100:120}
  case'pesoRel':{const r=o.max/t.max;return r>=5?120:r>=4?100:r>=3?80:r>=2?60:40}
  case'gyro':return Math.min(150,Math.floor(25*stat(t,'spe')/stat(o,'spe'))+1);
  case'electro':{const r=stat(o,'spe')/stat(t,'spe');return r>=4?150:r>=3?120:r>=2?80:r>=1?60:40}
  case'flail':{const q=o.hp/o.max;return q<.0417?200:q<.104?150:q<.208?100:q<.354?80:q<.688?40:20}
  case'castigo':return Math.min(200,60+20*pos(t));
  case'psRival':return Math.max(1,Math.floor(120*t.hp/t.max));
  case'psAtq':return Math.max(1,Math.floor(150*o.hp/o.max));
  case'magnitud':return pickP([10,30,50,70,90,110,150],[5,10,20,30,20,10,5]);
  case'presente':return pickP([40,80,120],[40,30,10]);
  case'stk':{const n=o.stk||0;o.stk=0;return 100*Math.max(1,n)}
  case'hardpress':return Math.max(1,Math.floor(100*t.hp/t.max));
  case'estado':{const q=fx.req,a=q=='self'?o.ail:t.ail;const ok=(q=='any'||q=='self')?!!a:q=='psn'?!!(a&&(a.k=='psn'||a.k=='tox')):!!(a&&a.k==q);return ok?fx.b*2:fx.b}
  case'brine':return t.hp<t.max/2?130:65;
  case'danado':{const x=fx.qui=='yo'?o:t;return T-(x.dmgT==null?-99:x.dmgT)<3?fx.b*2:fx.b}
  case'fija':return fx.v;
  case'poder':return 20+20*pos(o);
  case'cutter':{if(T-(o.fcT==null?-99:o.fcT)>3)o.fc=0;const p=40*Math.pow(2,Math.min(2,o.fc||0));o.fc=(o.fc||0)+1;o.fcT=T;return p}
  case'eco':{if(T-(o.ecT==null?-99:o.ecT)>3)o.ec=0;const p=40*(1+Math.min(4,o.ec||0));o.ec=(o.ec||0)+1;o.ecT=T;return p}
  case'lash':return Object.values(o.stg).some(x=>x<0)?150:75;
  case'ira':return Math.min(350,50+50*(o.nHit||0));
  case'respetos':return 50+50*(team[o.side]?team[o.side].filter(u=>u.dead).length:0);
  case'terreno':return campo.te&&campo.te.k==fx.te?fx.p*fx.mul:fx.p;
  case'primero':return t.cd>.5?fx.b:fx.b*2;   // x2 si el rival aún no ha actuado (sin enfriamiento en marcha)
  case'despues':return t.cd>.5?fx.b*2:fx.b;     // x2 si el rival ya ha actuado (Represalia/Vendetta)
  case'fallo':return T-(o.failT==null?-99:o.failT)<4?fx.b*2:fx.b;   // x2 si su ataque anterior falló
  case'aliado':return team[o.side]&&team[o.side].some(u=>u.dead)?fx.b*2:fx.b;
  case'eficaz':return tEff((o.last&&o.last.t)||'normal',t.types)>1?fx.b*1.33:fx.b;
  case'sol':return campo.cl&&campo.cl.k=='sun'?fx.b*1.5:fx.b;
  case'rollout':{const f=o.vol&&o.vol.furia;return 30*Math.pow(2,f?Math.min(4,f.u||0):0)}
 }
 return 60;
}

<script>
// GANCHOS de habilidades y objetos equipados (motor). Las tablas están en habilidades.js (HAB) y objetos.js (OBJ_EQ).
// Una habilidad u objeto es un objeto con funciones que se llaman en estos momentos (todas opcionales; reciben el luchador dueño primero):
//   entra(m)                    al terminar la animación de entrada. Devuelve 'espera' para reintentarlo (p. ej. aún no hay rival)
//   seg(m)                      una vez por segundo de combate
//   danoMul(o,tg,t,cat,dm)      número: multiplica el daño que HACE el dueño (o = dueño)
//   danoRec(tg,o,t,cat,dm)      número: multiplica el daño que RECIBE el dueño (tg = dueño)
//   daDano(o,tg,d,prim)         tras hacer daño (prim = golpe principal del ataque, no los extras de varios golpes)
//   golpeado(tg,o,d,prim)       tras recibir daño y seguir vivo
//   inmune(m,t)                 true si el dueño es inmune al tipo t (ataques y trampas del suelo)
//   anulaClima(m)               true: mientras esté en combate el clima no tiene efecto (campo.cl se ve null)
//   cdRec(tg,o)                 número: multiplica la recarga de los ataques del rival (Presión)
//   bloqBaya(m)                 true: el rival no puede comer bayas (Nerviosismo)
//   auraMul(dueño,o,tg,t,cat,dm) / statGlobal(dueño,m,k)  auras que afectan a todos (Aura Oscura, Espada Debacle...)
//   rompible:1 (campo de la entrada) = Rompemoldes la ignora · rompe:1 = la entrada tiene Rompemoldes
//   absorbe(m,o,t,e,prim)       true: el ataque no le hace daño (la habilidad aplica su efecto, p. ej. curar, solo si prim) · bloqMove(m,o,p): true si anula un ataque de estado ofensivo
//   aguanta(m,o,d)              true: sobrevive con 1 PS a un golpe que lo mataría (Robustez) · sinClimaDano(m,cl): true si no le hiere ese clima (sand/hail)
//   statMul(m,k)                número: multiplica su estadística k (atk, def, spa, spd, spe). No debe llamar a stat()
//   accMul(o,tg,p) / accRec(tg,o,p)   número: multiplica la precisión de sus ataques / de los ataques que recibe
//   noFalla(m)                  true: sus ataques y los que recibe nunca fallan
//   sinCrit(m)                  true: no recibe golpes críticos · critEt(o): suma etapas de crítico · critMul(o,tg): multiplica el daño crítico
//   secMod(o,sec,tg) / secRec(tg,sec,o)  devuelven los efectos secundarios (mv.sec) que aplican al atacar / al recibir (null = ninguno)
// Campos opcionales de cada entrada: n nombre · d descripción · g grupo (para la auditoría) · i icono (solo objetos).
// m.hab / m.obj = claves de HAB / OBJ_EQ. m.habOff / m.objOff = anuladas (Gastroácido, Embargo...: aún sin usar).
// Un objeto de un solo uso se gasta con gastarObj(m): desaparece del luchador y de su carta (la pantalla de eventos lo quita de la box).
const rivalDe=m=>mons.find(o=>o.side!==m.side&&!o.dead&&!(o.enter>0))||null;
// H_ATQ = atacante mientras se resuelve un golpe o su precisión (lo fijan los envoltorios de hit y accEf, más abajo): si tiene Rompemoldes,
// las habilidades del rival marcadas con rompible:1 no cuentan en ese golpe.
let H_ATQ=null;
const hayHab=k=>mons.some(x=>!x.dead&&!(x.enter>0)&&x.hab===k&&!x.habOff&&!gasNeutro(x));
// Gas Reactivo: mientras haya un luchador con esa habilidad, las demás habilidades no funcionan
const gasNeutro=m=>m.hab!=='neutralizing-gas'&&mons.some(x=>x!==m&&!x.dead&&!(x.enter>0)&&x.hab==='neutralizing-gas'&&!x.habOff);
const climaAnulado=()=>mons.some(m=>!m.dead&&!(m.enter>0)&&!!gancho('anulaClima',m));
function fuentesH(m){
 const r=[],o=m.obj&&!m.objOff&&typeof OBJ_EQ!=='undefined'&&OBJ_EQ[m.obj];let h=m.hab&&!m.habOff&&typeof HAB!=='undefined'&&HAB[m.hab];
 if(h&&gasNeutro(m))h=null;
 if(h&&h.rompible&&H_ATQ&&H_ATQ!==m&&H_ATQ.side!==m.side&&!H_ATQ.habOff&&typeof HAB!=='undefined'&&HAB[H_ATQ.hab]&&HAB[H_ATQ.hab].rompe&&!gasNeutro(H_ATQ))h=null;
 if(h)r.push(h);if(o)r.push(o);return r;
}
// Llama a todas las fuentes y devuelve el primer valor verdadero
function gancho(k,m,...a){let r;for(const E of fuentesH(m)){const f=E[k];if(f){const v=f.call(E,m,...a);if(v&&!r)r=v}}return r}
// Producto de los números que devuelven las fuentes (1 si no hay)
function ganchoMul(k,m,...a){let x=1;for(const E of fuentesH(m)){const f=E[k];if(f){const v=f.call(E,m,...a);if(typeof v==='number')x*=v}}return x}
// Suma de los números que devuelven las fuentes (0 si no hay)
function ganchoSum(k,m,...a){let x=0;for(const E of fuentesH(m)){const f=E[k];if(f){const v=f.call(E,m,...a);if(typeof v==='number')x+=v}}return x}
// Valor que pasa por las fuentes: cada una recibe (m, valor, ...a) y, si devuelve algo distinto de undefined, ese es el nuevo valor
function ganchoVal(k,m,v,...a){for(const E of fuentesH(m)){const f=E[k];if(f){const r=f.call(E,m,v,...a);if(r!==undefined)v=r}}return v}
// Auras de campo: cada luchador en combate puede modificar el daño de TODOS (auraMul(dueño,o,tg,t,cat,dm)) o las estadísticas de los demás (statGlobal(dueño,m,k))
const auraDano=(o,tg,t,cat,dm)=>{let x=1;for(const m of mons)if(!m.dead&&!(m.enter>0))x*=ganchoMul('auraMul',m,o,tg,t,cat,dm);return x};
const statGlobal=(m,k)=>{let x=1;for(const o of mons)if(o!==m&&!o.dead&&!(o.enter>0))x*=ganchoMul('statGlobal',o,m,k);return x};
// Ejecuta f con o como atacante (Rompemoldes también vale para ataques de estado)
function conAtq(o,f){const q=H_ATQ;H_ATQ=o;try{return f()}finally{H_ATQ=q}}
// ¿Es un ataque de estado que actúa sobre el rival?
const ofensivoSt=p=>!!(p.ef&&(p.ef.o||(p.ef.a&&!p.ef.a.yo)||p.ef.of||p.ef.ty||p.ef.ta||p.ef.sp));
const mulDano=(o,tg,t,cat,dm)=>ganchoMul('danoMul',o,tg,t,cat,dm)*ganchoMul('danoRec',tg,o,t,cat,dm)*auraDano(o,tg,t,cat,dm);
function gastarObj(m){const k=m.obj;m.obj=null;if(m.u){m.u.obj=null;m.u.objGastado=1}return k}
// Cada paso de simulación (lo llama upM, tras tickEst)
function tickGanchos(m,dt){
 if(!m.hkE){const r=gancho('entra',m);if(r!=='espera')m.hkE=1}
 m.hkT=(m.hkT||0)+dt;
 while(m.hkT>=1&&!m.dead){m.hkT-=1;gancho('seg',m)}
}
// Envoltorios: mientras se resuelve un golpe o su precisión se sabe quién ataca (Rompemoldes)
{const h0=hit;hit=function(...a){const p=H_ATQ;H_ATQ=a[3];try{return h0.apply(this,a)}finally{H_ATQ=p}}}
{const a0=accEf;accEf=function(m,tg,p){const q=H_ATQ;H_ATQ=m;try{return a0(m,tg,p)}finally{H_ATQ=q}}}

<script>
// HABILIDADES · familia ENTRADA y CAMPO: clima y terreno, auras, avisos y reglas del campo. Se registran en HAB (habilidades.js).
// Decisiones: el clima y el terreno que pone una habilidad duran DUR_CAMPO_HAB s (como los ataques); Presión = el rival recarga un 25 % más lento.
// Rompemoldes: las habilidades marcadas rompible:1 no cuentan cuando el atacante tiene una habilidad con rompe:1 (se aplica al final de este archivo).
const DUR_CAMPO_HAB=15,PRESION_CD=1.25;
const NO_CALCO=['trace','imposter','neutralizing-gas','illusion','disguise','forecast','flower-gift','multitype','stance-change','schooling','zen-mode','power-construct','receiver','power-of-alchemy','as-one-glastrier','as-one-spectrier','commander','protosynthesis','quark-drive','embody-aspect-teal','embody-aspect-hearthflame','embody-aspect-wellspring','embody-aspect-cornerstone'];
const aviso=(m,s,c)=>txt.push({x:m.x,y:m.y-56,s,c:c||'#fbbf24',l:1.3,sm:1});
function campoHab(tipo,k,m){   // pone clima o terreno (o renueva su tiempo si ya estaba)
 const o=campo[tipo];campo[tipo]={k,l:DUR_CAMPO_HAB};
 if(!o||o.k!==k){aviso(m,NOM_CAMPO[k]+'!','#fde047');log(NOM_CAMPO[k])}
}
const teEs=k=>!!(campo.te&&campo.te.k===k);
const mejorStat=m=>['atk','def','spa','spd','spe'].reduce((a,k)=>m.st[k]>m.st[a]?k:a,'atk');
const hClima=(k,nom,d)=>({n:nom,g:'Clima y terreno',d,entra(m){campoHab('cl',k,m)}});
const hTerreno=(k,nom,d)=>({n:nom,g:'Clima y terreno',d,entra(m){campoHab('te',k,m)}});
// Habilidades que solo avisan al entrar (su efecto es una regla del motor: ver ganchos.js)
const hAviso=(nom,g,d,txt_,extra)=>({n:nom,g,d,entra(m){aviso(m,txt_)},...extra});
Object.assign(HAB,{
 // ---------- Clima y terreno ----------
 'drought':hClima('sun','Sequía','Al entrar, hace salir el sol durante '+DUR_CAMPO_HAB+' s.'),
 'drizzle':hClima('rain','Llovizna','Al entrar, hace llover durante '+DUR_CAMPO_HAB+' s.'),
 'sand-stream':hClima('sand','Chorro Arena','Al entrar, levanta una tormenta de arena durante '+DUR_CAMPO_HAB+' s.'),
 'snow-warning':hClima('hail','Nevada','Al entrar, hace nevar (granizo) durante '+DUR_CAMPO_HAB+' s.'),
 'electric-surge':hTerreno('elec','Electrogénesis','Al entrar, crea un campo eléctrico durante '+DUR_CAMPO_HAB+' s.'),
 'grassy-surge':hTerreno('leaf','Herbogénesis','Al entrar, crea un campo de hierba durante '+DUR_CAMPO_HAB+' s.'),
 'misty-surge':hTerreno('mist','Nebulogénesis','Al entrar, crea un campo de niebla durante '+DUR_CAMPO_HAB+' s.'),
 'psychic-surge':hTerreno('psy','Psicogénesis','Al entrar, crea un campo psíquico durante '+DUR_CAMPO_HAB+' s.'),
 'orichalcum-pulse':{n:'Latido Oricalco',g:'Clima y terreno',d:'Al entrar, hace salir el sol; con sol, su Ataque sube un 33 %.',entra(m){campoHab('cl','sun',m)},statMul(m,k){return k==='atk'&&campo.cl&&campo.cl.k==='sun'?1.33:1}},
 'hadron-engine':{n:'Motor Hadrónico',g:'Clima y terreno',d:'Al entrar, crea un campo eléctrico; con él, su At. Esp. sube un 33 %.',entra(m){campoHab('te','elec',m)},statMul(m,k){return k==='spa'&&teEs('elec')?1.33:1}},
 'cloud-nine':{n:'Cielo Despejado',g:'Clima y terreno',d:'Mientras esté en combate, el clima no tiene efecto.',anulaClima(){return true}},
 'air-lock':{n:'Bucle Aire',g:'Clima y terreno',d:'Mientras esté en combate, el clima no tiene efecto.',anulaClima(){return true}},
 'protosynthesis':{n:'Paleosíntesis',g:'Clima y terreno',d:'Con sol, su mejor estadística sube un 30 % (la Velocidad, un 50 %).',statMul(m,k){return k===mejorStat(m)&&campo.cl&&campo.cl.k==='sun'?(k==='spe'?1.5:1.3):1}},
 'quark-drive':{n:'Carga Cuark',g:'Clima y terreno',d:'Con campo eléctrico, su mejor estadística sube un 30 % (la Velocidad, un 50 %).',statMul(m,k){return k===mejorStat(m)&&teEs('elec')?(k==='spe'?1.5:1.3):1}},

 // ---------- Efectos al entrar ----------
 'download':{n:'Descarga',g:'Al entrar',d:'Al entrar, sube el Ataque si la Defensa del rival es menor que su Def. Esp.; si no, el At. Esp.',
  entra(m){const o=rivalDe(m);if(!o)return'espera';aviso(m,'¡Descarga!');stg(m,stat(o,'def')<stat(o,'spd')?{atk:1}:{spa:1})}},
 'intrepid-sword':{n:'Espada Indómita',g:'Al entrar',d:'Al entrar, sube el Ataque.',entra(m){aviso(m,'¡Espada Indómita!');stg(m,{atk:1})}},
 'dauntless-shield':{n:'Escudo Recio',g:'Al entrar',d:'Al entrar, sube la Defensa.',entra(m){aviso(m,'¡Escudo Recio!');stg(m,{def:1})}},
 'supersweet-syrup':{n:'Jarabe Dulce',g:'Al entrar',d:'Al entrar, baja la Evasión del rival.',
  entra(m){const o=rivalDe(m);if(!o)return'espera';aviso(m,'¡Jarabe Dulce!');stg(o,{eva:-1},true)}},
 'screen-cleaner':{n:'Antipantalla',g:'Al entrar',d:'Al entrar, elimina Reflejo, Pantalla de Luz y Velo Aurora de los dos lados.',
  entra(m){aviso(m,'¡Antipantalla!');for(const x of mons)if(x.vol){delete x.vol.reflect;delete x.vol.lscreen;delete x.vol.aveil}}},
 'trace':{n:'Calco',g:'Al entrar',d:'Al entrar, copia la habilidad del rival.',
  entra(m){const o=rivalDe(m);if(!o)return'espera';if(!o.hab||NO_CALCO.includes(o.hab))return;
   m.hab=o.hab;aviso(m,'¡Calco: '+((HAB[m.hab]&&HAB[m.hab].n)||m.hab)+'!');const H=HAB[m.hab];if(H&&H.entra&&!H.entra.call(H,m))return}},
 'frisk':{n:'Inspección',g:'Al entrar',d:'Al entrar, muestra el objeto del rival.',
  entra(m){const o=rivalDe(m);if(!o)return'espera';aviso(m,'Inspección: '+(o.obj&&OBJ_EQ[o.obj]?OBJ_EQ[o.obj].n:'sin objeto'),'#e2e8f0')}},
 'forewarn':{n:'Alerta',g:'Al entrar',d:'Al entrar, muestra el ataque más potente del rival.',
  entra(m){const o=rivalDe(m);if(!o)return'espera';const v=o.mv.filter(x=>x.cat!=='sta').sort((a,b)=>b.p-a.p)[0];aviso(m,'Alerta: '+(v?v.n:'ninguno'),'#e2e8f0')}},
 'anticipation':{n:'Anticipación',g:'Al entrar',d:'Al entrar, avisa si el rival tiene un ataque superefectivo contra él.',
  entra(m){const o=rivalDe(m);if(!o)return'espera';if(o.mv.some(v=>v.cat!=='sta'&&efTipo(v.t,m)>1))aviso(m,'¡Se estremece!','#f87171')}},

 // ---------- Reglas del campo ----------
 'pressure':hAviso('Presión','Reglas del campo','El rival recarga sus ataques un '+Math.round((PRESION_CD-1)*100)+' % más despacio.','¡Presión!',{cdRec(){return PRESION_CD}}),
 'unnerve':hAviso('Nerviosismo','Reglas del campo','El rival no puede comer bayas.','¡Nerviosismo!',{bloqBaya(){return true}}),
 'mold-breaker':hAviso('Rompemoldes','Reglas del campo','Sus ataques ignoran las habilidades defensivas del rival (Levitación, Multiescamas...).','¡Rompemoldes!',{rompe:1}),
 'teravolt':hAviso('Voltaje Cruel','Reglas del campo','Sus ataques ignoran las habilidades defensivas del rival.','¡Aura de rayos!',{rompe:1}),
 'turboblaze':hAviso('Turbollama','Reglas del campo','Sus ataques ignoran las habilidades defensivas del rival.','¡Aura de llamas!',{rompe:1}),
 'neutralizing-gas':hAviso('Gas Reactivo','Reglas del campo','Mientras esté en combate, las habilidades de los demás no funcionan.','¡Gas reactivo!'),
 'dark-aura':hAviso('Aura Oscura','Reglas del campo','Los ataques de tipo Siniestro de todos hacen un 33 % más.','¡Aura oscura!',{auraMul(m,o,tg,t){return t==='dark'?(hayHab('aura-break')?.75:1.33):1}}),
 'fairy-aura':hAviso('Aura Feérica','Reglas del campo','Los ataques de tipo Hada de todos hacen un 33 % más.','¡Aura feérica!',{auraMul(m,o,tg,t){return t==='fairy'?(hayHab('aura-break')?.75:1.33):1}}),
 'aura-break':hAviso('Rompeaura','Reglas del campo','Las auras Oscura y Feérica reducen el daño en vez de aumentarlo.','¡Rompeaura!'),
 'sword-of-ruin':hAviso('Espada Debacle','Reglas del campo','La Defensa de los demás luchadores baja un 25 %.','¡Espada Debacle!',{statGlobal(o,m,k){return k==='def'?.75:1}}),
 'tablets-of-ruin':hAviso('Tablilla Debacle','Reglas del campo','El Ataque de los demás luchadores baja un 25 %.','¡Tablilla Debacle!',{statGlobal(o,m,k){return k==='atk'?.75:1}}),
 'vessel-of-ruin':hAviso('Vasija Debacle','Reglas del campo','El At. Esp. de los demás luchadores baja un 25 %.','¡Vasija Debacle!',{statGlobal(o,m,k){return k==='spa'?.75:1}}),
 'beads-of-ruin':hAviso('Abalorio Debacle','Reglas del campo','La Def. Esp. de los demás luchadores baja un 25 %.','¡Abalorio Debacle!',{statGlobal(o,m,k){return k==='spd'?.75:1}}),
});
// Habilidades que Rompemoldes ignora (las defensivas de la familia daño y Levitación)
for(const k of ['levitate','thick-fat','heatproof','water-bubble','multiscale','shadow-shield','filter','solid-rock','prism-armor','fluffy','ice-scales','fur-coat','marvel-scale','battle-armor','shell-armor','shield-dust','sand-veil','snow-cloak','punk-rock'])if(HAB[k])HAB[k].rompible=1;
</script>
<script>
// HABILIDADES · familia INMUNIDAD: absorben o anulan ataques (gancho absorbe/bloqMove/aguanta) y el daño del clima. Se registran en HAB.
// Absorber = el ataque no hace daño y la habilidad aplica su efecto UNA vez por ataque (no en cada golpe de los de varios golpes).
// Valores (como los juegos): curar 25 % de los PS, +1 a la estadística (Cuerpo Horneado +2), Llamarada +50 % al fuego mientras siga en combate.
const ABS_CURA=.25,CLIMA_PS=.02;   // Piel Seca: % de PS por segundo con lluvia (cura) o sol (hiere)
const L_POLVO=['cotton-spore','poison-powder','powder','rage-powder','sleep-powder','spore','stun-spore','magic-powder'];
const L_BOLA=['acid-spray','aura-sphere','barrage','beak-blast','bullet-seed','egg-bomb','electro-ball','energy-ball','focus-blast','gyro-ball','ice-ball','magnet-bomb','mist-ball','mud-bomb','octazooka','pollen-puff','pyro-ball','rock-blast','rock-wrecker','searing-shot','seed-bomb','shadow-ball','sludge-bomb','syrup-bomb','weather-ball','zap-cannon'];
const L_VIENTO=['air-cutter','bleakwind-storm','blizzard','fairy-wind','gust','heat-wave','hurricane','icy-wind','petal-blizzard','sandsear-storm','springtide-storm','twister','whirlwind','wildbolt-storm'];
const msgAbs=(m,s,c)=>txt.push({x:m.x,y:m.y-56,s,c:c||'#4ade80',l:1.2,sm:1});
const curaAbs=m=>{if(m.hp<m.max&&!(m.vol&&m.vol.hblock))curaPS(m,ABS_CURA);msgAbs(m,'¡Absorbe!')};
const subeAbs=(s,nom)=>m=>{stg(m,s);msgAbs(m,'¡'+nom+'!','#fde047')};
// Absorbe un TIPO de ataque
const hAbsorbe=(nom,tipo,d,efecto,extra)=>({n:nom,g:'Inmunidad',d,rompible:1,absorbe(m,o,t,e,prim){if(t!==tipo)return false;if(prim)efecto(m,o);return true},...extra});
// Anula una LISTA de ataques (daño y estado); efecto opcional al recibirlos
const hLista2=(nom,lista,d,efecto,extra)=>({n:nom,g:'Inmunidad',d,rompible:1,
 absorbe(m,o,t,e,prim){if(!lista.includes((o.last||{}).key))return false;if(prim){if(efecto)efecto(m,o);else msgAbs(m,'No afecta','#e2e8f0')}return true},
 bloqMove(m,o,p){return lista.includes(p.key)},...extra});
Object.assign(HAB,{
 'water-absorb':hAbsorbe('Absorbe Agua','water','Los ataques de Agua no le hacen daño: le curan el 25 % de sus PS.',curaAbs),
 'volt-absorb':hAbsorbe('Absorbe Elec','elec','Los ataques Eléctricos no le hacen daño: le curan el 25 % de sus PS.',curaAbs),
 'earth-eater':hAbsorbe('Geofagia','ground','Los ataques de Tierra no le hacen daño: le curan el 25 % de sus PS.',curaAbs),
 'dry-skin':hAbsorbe('Piel Seca','water','Los ataques de Agua le curan el 25 %, los de Fuego le hacen +25 %; con lluvia se cura y con sol se hiere.',curaAbs,
  {danoRec(tg,o,t){return t==='fire'?1.25:1},
   seg(m){if(campo.cl&&campo.cl.k==='rain'&&m.hp<m.max&&!(m.vol&&m.vol.hblock))curaPS(m,CLIMA_PS);else if(campo.cl&&campo.cl.k==='sun')dotDano(m,CLIMA_PS,'#fb923c')}}),
 'motor-drive':hAbsorbe('Electromotor','elec','Los ataques Eléctricos no le hacen daño: sube su Velocidad.',subeAbs({spe:1},'Electromotor')),
 'sap-sipper':hAbsorbe('Herbívoro','leaf','Los ataques de Planta no le hacen daño: sube su Ataque.',subeAbs({atk:1},'Herbívoro')),
 'lightning-rod':hAbsorbe('Pararrayos','elec','Los ataques Eléctricos no le hacen daño: sube su At. Esp.',subeAbs({spa:1},'Pararrayos')),
 'storm-drain':hAbsorbe('Colector','water','Los ataques de Agua no le hacen daño: sube su At. Esp.',subeAbs({spa:1},'Colector')),
 'well-baked-body':hAbsorbe('Cuerpo Horneado','fire','Los ataques de Fuego no le hacen daño: sube mucho su Defensa.',subeAbs({def:2},'Cuerpo Horneado')),
 'flash-fire':hAbsorbe('Absorbe Fuego','fire','Los ataques de Fuego no le hacen daño y, tras absorber uno, sus ataques de Fuego hacen +50 %.',m=>{m.ffOn=1;msgAbs(m,'¡Llamarada!','#fb923c')},
