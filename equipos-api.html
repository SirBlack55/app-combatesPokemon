<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena Aérea</title>
<style>
/* Estilos de Arena Pokémon. Tema oscuro. */
:root{--bg:#0b1220;--fg:#e2e8f0;--card:#1e293b;--bd:#334155;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--fg:#e2e8f0;--card:#1e293b;--bd:#334155}}
:root[data-theme="dark"]{--bg:#0b1220;--fg:#e2e8f0;--card:#1e293b;--bd:#334155}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:900px;padding:10px}
h1{font-size:19px;margin:4px 0 8px;text-align:center}
#bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px}
button{padding:9px 12px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--fg);font-weight:700;font-size:14px;cursor:pointer}
button:active{transform:scale(.96)}
canvas{width:100%;display:block;border-radius:14px;border:3px solid var(--bd);background:#4c9a3d;touch-action:manipulation}
#kos{display:flex;gap:10px;justify-content:center;margin:8px 0;font-weight:700;font-size:14px;flex-wrap:wrap}
#log{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:8px 12px;font-size:13px;min-height:100px;line-height:1.5}
.cw{position:relative}#ban{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.55);border-radius:14px;color:#fff;font-size:24px;font-weight:800;text-align:center}
.col{flex:1;min-width:150px;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:8px}
#setup{display:flex;gap:8px;flex-wrap:wrap}
#go{width:100%;margin-top:8px;background:#7c3aed;color:#fff;border-color:#6d28d9}#go:disabled{opacity:.4}
#mvp{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.mp{flex:1;min-width:150px;background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:6px;font-size:12px}
.rs{display:flex;flex-direction:column;align-items:center;width:84px;padding:3px;font-size:10px}.rs small{font-size:10px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#srch select,#srch input{padding:8px;border-radius:8px;border:2px solid var(--bd);background:var(--card);color:var(--fg);font-size:14px}#res{display:flex;flex-wrap:wrap;gap:2px;max-height:340px;overflow:auto;margin-top:6px}
body{background:radial-gradient(circle at 50% -10%,#1e3a8a 0,#0b1220 55%) fixed}
h1{font-size:22px;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(90deg,#60a5fa,#f87171);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0 12px}
#srch{background:linear-gradient(#1e293b,#0f172a);border:2px solid #475569;border-radius:14px}
.rs{background:#0f172a;border:2px solid #334155;border-radius:10px}.rs:hover{border-color:#60a5fa}.rs small{text-transform:capitalize}
#setup{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.tp{flex:1;min-width:290px;border:2px solid var(--c);border-radius:14px;background:linear-gradient(#1e293b,#0f172a);box-shadow:0 0 12px var(--c);overflow:hidden}
.th{display:flex;justify-content:space-between;padding:8px 12px;background:var(--c);color:#fff;font-weight:800;letter-spacing:1px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px}
.sc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;border:2px solid #334155;background:#0f172a;color:var(--fg);min-height:122px;cursor:pointer}
.sc.em{justify-content:center;font-size:28px;border-style:dashed;opacity:.6}.sc.on{border-color:var(--c);background:#1e293b;box-shadow:0 0 10px var(--c)}.sc.bad{border-color:#f59e0b}
.sc .sp{width:64px;height:64px;image-rendering:pixelated}.sc b{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:capitalize}
.sc .ty,.sc .mi{display:flex;gap:2px;align-items:center}.sc em{font-size:10px;color:#fbbf24;font-style:normal;margin-left:3px}
.clr{margin:0 8px 8px;font-size:12px;padding:6px 10px}
.vs{align-self:center;font-weight:900;font-size:26px;color:#fbbf24;text-shadow:0 0 12px #f59e0b;width:100%;text-align:center}@media(min-width:760px){.vs{width:auto}}
.fi{flex-basis:100%;border:2px solid var(--c);border-radius:14px;background:linear-gradient(#1e293b,#0f172a);padding:12px;box-shadow:0 0 12px var(--c)}
.fh{display:flex;gap:12px;align-items:center}.fp{width:96px;height:96px;image-rendering:pixelated;background:radial-gradient(#334155,transparent 70%)}
.fn{font-size:22px;font-weight:800;text-transform:capitalize}.qb{margin-left:auto}
.sb{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:10px 0}.sr{display:flex;align-items:center;gap:6px;font-size:12px}.sr span{width:62px;color:#94a3b8;font-weight:700}.sr b{width:28px;text-align:right}
.bt{flex:1;height:8px;background:#0b1220;border-radius:4px;overflow:hidden}.bt i{display:block;height:100%;border-radius:4px}
.mh{font-weight:800;margin:6px 0}.mh small{font-weight:400;opacity:.7;margin-left:8px}.mh b.ok{color:#22c55e}.mh b.no{color:#f59e0b}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mc{text-align:left;padding:8px;border-radius:10px;border:2px solid var(--t);background:rgba(15,23,42,.8);color:var(--fg);opacity:.6;font-weight:400}.mc.on{opacity:1;background:#1e293b;box-shadow:0 0 8px var(--t)}
.mt{display:flex;align-items:center;gap:6px;font-size:13px}.mt b{flex:1}.ck{color:#4ade80;font-weight:900}
.mm{display:flex;flex-wrap:wrap;gap:3px 8px;font-size:11px;margin-top:4px}.ul{color:#fbbf24;font-weight:700}.ef{font-size:11px;margin-top:3px;color:#a7f3d0}
#go{font-size:18px;letter-spacing:1px;padding:14px;border-radius:14px;background:linear-gradient(#a855f7,#6d28d9);border:2px solid #c4b5fd;box-shadow:0 0 18px #7c3aed88}
#hud{display:flex;gap:8px;margin-bottom:6px}
.hb{flex:1;min-width:0;display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:12px;background:linear-gradient(#1e293b,#0f172a);border:2px solid var(--c);box-shadow:0 0 10px var(--c)}
#h1{flex-direction:row-reverse;text-align:right}.hs{width:56px;height:56px;image-rendering:pixelated;flex:none}#h1 .hs{transform:scaleX(-1)}
.hi{flex:1;min-width:0}.hn{display:flex;gap:6px;align-items:center;font-size:14px;text-transform:capitalize}#h1 .hn{flex-direction:row-reverse}.hn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp{display:flex;align-items:center;gap:6px;margin:3px 0}.hp em{font-style:normal;font-size:10px;font-weight:800;color:#fbbf24;background:#7c2d12;border-radius:4px;padding:0 4px}
.hbar{flex:1;height:10px;background:#0b1220;border:1px solid #475569;border-radius:6px;overflow:hidden}.hbar i{display:block;height:100%;transition:width .5s,background .3s}
.hv{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}.hst{display:flex;gap:3px;flex-wrap:wrap;min-height:16px}#h1 .hst,#h1 .balls{justify-content:flex-end}
.ch{font-size:10px;padding:1px 5px;border-radius:6px;font-weight:700}.ch.up{background:#14532d;color:#86efac}.ch.dn{background:#7f1d1d;color:#fca5a5}
.balls{display:flex;gap:3px;margin-top:2px}.pb{width:11px;height:11px;border-radius:50%;border:1px solid #0f172a;background:linear-gradient(#ef4444 45%,#0f172a 45% 55%,#f8fafc 55%)}.pb.a{box-shadow:0 0 0 2px #fbbf24}.pb.d{background:#475569;opacity:.6}
@media(max-width:560px){.hs{display:none}.hb{padding:5px 7px}.hn{font-size:12px}}
.mp{background:linear-gradient(#1e293b,#0f172a);border:2px solid var(--bd);border-radius:12px;padding:8px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}.ph b{text-transform:capitalize;font-size:13px}
.pst{display:flex;gap:3px}.pst span{background:#0b1220;border-radius:6px;padding:1px 5px;text-align:center;font-size:12px;font-weight:700}.pst small{display:block;font-size:8px;color:#94a3b8;font-weight:600}.pst .up{color:#4ade80}.pst .dn{color:#f87171}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mv{border:2px solid var(--t);border-radius:8px;padding:5px 6px;background:#0b1220;opacity:.75}.mv.rd{opacity:1;box-shadow:0 0 8px #22c55e88;border-color:#22c55e}.mv.pl{outline:2px solid #fbbf24}
.mn{display:flex;align-items:center;gap:4px;font-size:11px}.mn b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cb{height:5px;background:#1e293b;border-radius:3px;margin:3px 0;overflow:hidden}.cb i{display:block;height:100%;background:var(--t)}.mv.rd .cb i{background:#22c55e}.cs{font-size:11px;font-weight:700;text-align:right}.mv.rd .cs{color:#4ade80}
#labui{display:none}#game.lab #labui{display:block}#game.lab #hud,#game.lab #mvp,#game.lab #log,#game.lab #bar{display:none!important}
.lr{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;align-items:center;font-size:13px}.lr input[type=number]{width:72px}#lm{flex:1;min-width:170px}
#labui input{padding:8px;border-radius:8px;border:2px solid var(--bd);background:var(--card);color:var(--fg);font-size:13px}

</style>
</head><body><main>
<h1>🌿 Arena Aérea · Combates por equipos</h1>
<div class="col" id="srch" style="margin-bottom:8px"><b>🌐 Pokémon desde PokéAPI</b>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0"><select id="gen"><option value="0">Gen 1</option><option value="1">Gen 2</option><option value="2">Gen 3</option><option value="3">Gen 4</option><option value="4">Gen 5</option><option value="5">Gen 6</option><option value="6">Gen 7</option><option value="7">Gen 8</option><option value="8">Gen 9</option><option value="all">Todas</option></select><input id="q" placeholder="Buscar nombre o número…" style="flex:1;min-width:130px"><button id="d0" style="border-color:#3b82f6">→ 🔵</button><button id="d1">→ 🔴</button><button id="rnd">🎲 Equipo</button><button id="labb">🧪 Laboratorio</button></div>
<div id="st" style="font-size:12px;min-height:16px"></div><div id="res"></div></div>
<div id="setup"></div><button id="go">⚔️ ¡COMENZAR COMBATE!</button>
<section id="game" style="display:none">
<div id="labui"><div class="col" style="margin-bottom:6px"><b>🧪 Laboratorio de ataques</b> <small>Dos Pokémon de prueba que no mueren</small>
<div class="lr"><label>Atacante # <input id="la" type="number" value="18"></label><label>Rival # <input id="lb" type="number" value="143"></label><button id="lsw">Atacante: 🔵</button></div>
<div class="lr"><input id="lm" value="fly" placeholder="ID del ataque en inglés (fly, flamethrower…)"><button id="lgo">▶ Probar</button></div>
<div class="lr" id="lq"></div><div class="lr"><button id="lauto">🔁 Auto: sí</button><button id="lslow">Velocidad x1</button><button id="lex">← Volver</button></div><div id="lst" style="font-size:12px;min-height:16px"></div></div></div>
<div id="bar"><button id="sp">Velocidad x1</button><button id="pa">Pausa</button><button id="tg">Ocultar ataques</button><button id="rs">Equipos</button></div>
<div id="hud"><div class="hb" id="h0"></div><div class="hb" id="h1"></div></div><div class="cw"><canvas id="cv"></canvas><div id="ban"></div></div><div id="mvp"><div class="mp" id="mv0"></div><div class="mp" id="mv1"></div></div>
<div id="log"></div></section>

<script>
// Aleatoriedad.
//  R(a,b)  -> SOLO efectos visuales (partículas, temblores). Siempre Math.random().
//  RS(a,b) / rnd() -> SIMULACIÓN (daño, críticos, precisión, IA, posiciones). Se puede fijar con semilla(n)
//                     para que un combate sea repetible (necesario para el modo online).
//  Regla de oro al crear ataques: lo que afecta al resultado usa rnd()/RS(); lo que solo se ve usa R().
let _semilla=null;
function semilla(n){_semilla=(n==null)?null:n>>>0}
function rnd(){if(_semilla===null)return Math.random();_semilla=(_semilla+0x6D2B79F5)>>>0;let t=_semilla;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}
const RS=(a,b)=>a+rnd()*(b-a),R=(a,b)=>a+Math.random()*(b-a);

</script>

   m.sqz=0;m.tilt=0;
   return true;
  }
  return false;
 },

 eup(e,dt){
  const o=e.o,t=e.tg;
  e.t+=dt;
  e.life=1.65-e.t;

  if(o.dead){e.life=0;return}
  if(t.dead&&e.t<1.4)e.t=1.4;

  const Q=hpos(e);
  if(!Q)return;

  const {Ox,Oy,ux,uy,nx,ny,L,Tx,Ty}=Q;

  // =================================
  // CARGA DE ENERGÍA
  // =================================

  if(e.t<.55){
   const u=e.t/.55;

   // Partículas orbitando la esfera
   for(let i=0;i<4&&ps.length<900;i++){
    const a=R(0,6.28);
    const r=R(24,48)*(1-u*.35);
    const ox=Ox+Math.cos(a)*r;
    const oy=Oy+Math.sin(a)*r;

    ps.push({
     x:ox,y:oy,
     vx:(Ox-ox)*2+ux*R(20,70),
     vy:(Oy-oy)*2+uy*R(20,70),
     l:.35,m:.35,
     c:i%3?'#fbbf24':'#fff7cc',
     s:R(2,5),g:1
    });
   }

   // Chispas concentrándose en el cañón
   if(Math.random()<.6&&ps.length<900){
    const a=R(0,6.28),r=R(25,55);
    ps.push({
     x:Ox+Math.cos(a)*r,
     y:Oy+Math.sin(a)*r,
     vx:-Math.cos(a)*100,
     vy:-Math.sin(a)*100,
     l:.3,m:.3,c:'#fff',
     s:R(2,4),g:1
    });
   }
  }

  // =================================
  // DISPARO Y RETROCESO
  // =================================

  else if(e.t<1.4){

   if(!e.fs){
    e.fs=1;
    o.kx-=ux*105;
    o.ky-=uy*105;
    shk=Math.max(shk,7);
    sfl=.3;sfc='#fff5c4';
    ring(Ox,Oy,'#fbbf24',65,.45,5);
   }

   const fade=e.t>1.17?Math.max(0,1-(e.t-1.17)/.23):1;
   const reach=Math.min(1,(e.t-.55)/.13);

   // Chispas expulsadas por los laterales del rayo
   for(let i=0;i<9&&ps.length<900;i++){
    const s=R(.05,1)*reach;
    const side=R(-1,1);
    const w=(10+(Q.Wm*1.5-10)*s)*.5;

    ps.push({
     x:Ox+ux*L*s+nx*side*w,
     y:Oy+uy*L*s+ny*side*w,
     vx:nx*side*R(80,240)+ux*R(40,150),
     vy:ny*side*R(80,240)+uy*R(40,150),
     l:R(.18,.4),m:.4,
     c:i%3?'#fbbf24':'#fff',
     s:R(2,5),g:1
    });
   }

   // Partículas de energía que salen del impacto
   if(e.t>.72&&Math.random()<.8){
    const a=R(0,6.28),v=R(60,230);
    ps.push({
     x:Tx+R(-15,15),y:Ty+R(-15,15),
     vx:Math.cos(a)*v,
     vy:Math.sin(a)*v,
     gy:40,l:.45,m:.45,
     c:Math.random()<.5?'#fbbf24':'#fff',
     s:R(3,7),g:1
    });
   }

   // Un único golpe
   e.tk+=dt;
   if(e.t>=.78&&!e.hit){
    e.hit=1;
    hit(t,e.dm,'normal',o,{cat:e.cat,f:true});
    blast(Tx,Ty,'#fff0a0',85);
    ring(Tx,Ty,'#fbbf24',110,.65,7);
    ring(Tx,Ty,'#fff',55,.35,4);
    imp(Tx,Ty,'normal',3);
    shk=Math.max(shk,10);
    sfl=.35;sfc='#fff8dc';
   }
  }

  // =================================
  // FINAL DE LA EXPLOSIÓN
  // =================================

  else if(!e.end){
   e.end=1;
   blast(Tx,Ty,'#fbbf24',55);
   ring(Tx,Ty,'#fcd34d',135,.8,5);
   imp(Tx,Ty,'normal',2);
   shk=Math.max(shk,7);
  }
 },

 edraw(e){
  const o=e.o,t=e.tg;
  if(!o||!t)return;

  const Q=hpos(e);
  if(!Q)return;

  const {Ox,Oy,ux,uy,nx,ny,L,Tx,Ty}=Q;
  const time=e.t;

  cx.save();

  // =================================
  // 1. ESFERA DE CARGA
  // =================================

  if(time<.55){
   const u=time/.55;
   const pulse=1+Math.sin(T*23)*.09;
   const r=(7+u*22)*pulse;

   cx.globalCompositeOperation='lighter';

   // Aura exterior
   let g=cx.createRadialGradient(Ox,Oy,1,Ox,Oy,r*2.5);
   g.addColorStop(0,'rgba(255,255,220,.8)');
   g.addColorStop(.3,'rgba(251,191,36,.55)');
   g.addColorStop(1,'rgba(249,115,22,0)');

   cx.fillStyle=g;
   cx.beginPath();
   cx.arc(Ox,Oy,r*2.5,0,7);
   cx.fill();

   // Esfera dorada
   g=cx.createRadialGradient(Ox-r*.25,Oy-r*.3,1,Ox,Oy,r);
   g.addColorStop(0,'#fff');
   g.addColorStop(.25,'#fff7bc');
   g.addColorStop(.6,'#fbbf24');
   g.addColorStop(1,'rgba(249,115,22,.2)');

   cx.fillStyle=g;
   cx.beginPath();
   cx.arc(Ox,Oy,r,0,7);
   cx.fill();

   // Anillos de energía
   cx.globalCompositeOperation='source-over';
   for(let i=0;i<2;i++){
    cx.save();
    cx.translate(Ox,Oy);
    cx.rotate(T*(i? -2.5:3));
    cx.strokeStyle=i?'rgba(255,255,255,.9)':'rgba(251,191,36,.9)';
    cx.lineWidth=2;
    cx.beginPath();
    cx.ellipse(0,0,r*1.55,r*.48,0,0,7);
    cx.stroke();
    cx.restore();
   }

   cx.restore();
   return;
  }

  // =================================
  // 2. CAÑÓN DE ENERGÍA
  // =================================

  if(time<1.4){
   const reach=Math.min(1,(time-.55)/.13);
   const fade=time>1.17?Math.max(0,1-(time-1.17)/.23):1;
   const pulse=1+.055*Math.sin(T*38);

   // Anchura variable: empieza concentrado y
   // se expande progresivamente hacia el objetivo
   const W=s=>(9+(Q.Wm*1.45-9)*s)*.5*fade*pulse;

   const pt=(s,side,extra=0)=>{
    const w=W(s);
    const wave=Math.sin(s*17-T*32+side*2)*w*.12;
    return[
     Ox+ux*L*s+nx*(side*w+wave)+nx*extra,
     Oy+uy*L*s+ny*(side*w+wave)+ny*extra
    ];
   };

   cx.globalAlpha=fade;
   cx.globalCompositeOperation='source-over';

   // Silueta exterior naranja
   cx.fillStyle='rgba(234,88,12,.8)';
   cx.beginPath();
   for(let i=0;i<=24;i++){
    const s=reach*i/24;
    const p=pt(s,1);
    i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]);
   }
   for(let i=24;i>=0;i--){
    const p=pt(reach*i/24,-1);
    cx.lineTo(p[0],p[1]);
   }
   cx.closePath();
   cx.fill();

   // Capas de energía
   for(const [k,col] of [
    [.87,'rgba(249,115,22,.9)'],
    [.68,'rgba(251,191,36,.95)'],
    [.43,'rgba(254,240,138,1)'],
    [.23,'rgba(255,255,255,.98)']
   ]){
    cx.fillStyle=col;
    cx.beginPath();

    for(let i=0;i<=24;i++){
     const s=reach*i/24;
     const p=pt(s,k);
     i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]);
    }

    for(let i=24;i>=0;i--){
     const p=pt(reach*i/24,-k);
     cx.lineTo(p[0],p[1]);
    }

    cx.closePath();
    cx.fill();
   }

   // Filamentos internos de energía
   cx.lineCap='round';

   for(let f=-3;f<=3;f++){
    cx.beginPath();

    for(let i=0;i<=28;i++){
     const s=reach*i/28;
     const w=W(s);
     const wave=Math.sin(s*25-T*48+f*2.1)*w*.24;
     const side=f/3*.24*w+wave;

     const x=Ox+ux*L*s+nx*side;
     const y=Oy+uy*L*s+ny*side;

     i?cx.lineTo(x,y):cx.moveTo(x,y);
    }

    cx.strokeStyle=f%2?'rgba(255,255,255,.9)':'rgba(255,220,100,.95)';
    cx.lineWidth=f===0?4:2;
    cx.stroke();
   }

   // Ondas de energía viajando por el cañón
   for(let k=0;k<8;k++){
    const s=((T*2.8+k/8)%1)*reach;
    const w=W(s);

    cx.strokeStyle=k%2?'rgba(255,255,255,.85)':'rgba(255,191,36,.9)';
    cx.lineWidth=3;

    cx.beginPath();
    cx.moveTo(Ox+ux*L*s+nx*w,Oy+uy*L*s+ny*w);
    cx.quadraticCurveTo(
     Ox+ux*L*s+ux*w*.7,
     Oy+uy*L*s+uy*w*.7,
     Ox+ux*L*s-nx*w,
     Oy+uy*L*s-ny*w
    );
    cx.stroke();
   }

   // Brillo del núcleo del cañón
   cx.globalCompositeOperation='lighter';

   const rr=17*fade+5;
   const glow=cx.createRadialGradient(Ox,Oy,1,Ox,Oy,rr);
   glow.addColorStop(0,'#fff');
   glow.addColorStop(.35,'#fff7c2');
   glow.addColorStop(.7,'#fbbf24');
   glow.addColorStop(1,'rgba(249,115,22,0)');

   cx.fillStyle=glow;
   cx.beginPath();
   cx.arc(Ox,Oy,rr,0,7);
   cx.fill();

   // Cabeza del disparo
   const ex=Ox+ux*L*reach;
   const ey=Oy+uy*L*reach;
   const ew=W(reach)*1.4;

   cx.fillStyle='rgba(255,240,170,.9)';
   cx.beginPath();
   cx.ellipse(ex,ey,ew*.65,ew,Math.atan2(uy,ux),0,7);
   cx.fill();
  }

  // =================================
  // 3. EXPLOSIÓN FINAL
  // =================================

  if(time>=.78&&time<1.4){
   const u=Math.min(1,(time-.78)/.55);
   const alpha=Math.max(0,1-u);
   const r=15+u*100;

   cx.globalCompositeOperation='lighter';

   // Halo de la explosión
   const g=cx.createRadialGradient(Tx,Ty,1,Tx,Ty,r);
   g.addColorStop(0,`rgba(255,255,255,${alpha*.9})`);
   g.addColorStop(.25,`rgba(255,230,140,${alpha*.7})`);
   g.addColorStop(.6,`rgba(251,146,60,${alpha*.35})`);
   g.addColorStop(1,'rgba(249,115,22,0)');

   cx.fillStyle=g;
   cx.beginPath();
   cx.arc(Tx,Ty,r,0,7);
   cx.fill();

   // Onda circular
   cx.globalCompositeOperation='source-over';
   cx.globalAlpha=alpha*.85;
   cx.strokeStyle='#fff1b5';
   cx.lineWidth=7*(1-u)+1;
   cx.beginPath();
   cx.arc(Tx,Ty,12+u*90,0,7);
   cx.stroke();

   // Rayos radiales
   for(let i=0;i<12;i++){
    const a=i*Math.PI/6+T*.3;
    const len=r*R(0.65,1.1);

    cx.strokeStyle=i%2?'#fff':'#fbbf24';
    cx.lineWidth=R(2,5)*alpha;
    cx.beginPath();
    cx.moveTo(Tx+Math.cos(a)*r*.2,Ty+Math.sin(a)*r*.2);
    cx.lineTo(Tx+Math.cos(a)*len,Ty+Math.sin(a)*len);
    cx.stroke();
   }
  }

  cx.restore();
 }
};

<script>
// Trueno (thunder).
CUSTOM['thunder']={
 mv:{cu:'thunder',r:420,tk:0},

 fallback:()=>({
  n:'Trueno',key:'thunder',p:110,
  cd:8.4,c:1,r:420,u:0,
  t:'elec',cat:'spe',acc:70,
  sty:'hit',cu:'thunder'
 }),

 start(m,tg,p){
  m.sc={id:'thunder',t:0};
  bn={s:p.n,c:'#fde047',l:1.6};
  cz=.06;

  ents.push({
   k:'u',cu:'thunder',
   o:m,tg,cat:p.cat,dm:p.p,
   t:0,tk:0,hit:0,
   life:1.65
  });
 },

 run(m,dt,s){
  const tg=m.tg;

  if(tg&&!tg.dead){
   m.a=turn(
    m.a,
    Math.atan2(tg.y-m.y,tg.x-m.x),
    dt*10
   );
  }

  // Concentración eléctrica
  if(s.t<.5){
   m.sqz=.25*s.t/.5;
   m.tilt=Math.sin(s.t*22)*.025;
  }
  else if(s.t<.9){
   m.sqz=Math.max(0,.25-(s.t-.5)*1.2);
   m.tilt=0;
  }
  else{
   // Recuperación tras invocar el trueno
   m.sqz=Math.max(0,.12-(s.t-.9)*.25);
   m.tilt=Math.sin(s.t*10)*.025;
  }

  if(s.t>=1.65){
   m.sqz=0;
   m.tilt=0;
   return true;
  }

  return false;
 },

 eup(e,dt){
  const o=e.o,t=e.tg;

  e.t+=dt;
  e.life=1.65-e.t;

  if(o.dead){
   e.life=0;
   return;
  }

  // Localizar el rival en el instante del impacto
  if(e.t>=.69&&!e.lock){
   e.lock=1;
   e.tx=t.x;
   e.ty=t.y-34;
  }

  // Si el rival cae antes del impacto
  if(t.dead&&!e.hit){
   e.life=0;
   return;
  }

  // =================================
  // CARGA ELÉCTRICA
  // =================================

  if(e.t<.5){
   const ox=o.x;
   const oy=o.y-34;

   for(let i=0;i<4&&ps.length<900;i++){
    const a=R(0,6.28);
    const r=R(20,48);

    ps.push({
     x:ox+Math.cos(a)*r,
     y:oy+Math.sin(a)*r,
     vx:-Math.cos(a)*R(50,130),
     vy:-Math.sin(a)*R(50,130),
     l:.22,m:.22,
     c:i%2?'#fde047':'#fff',
     s:R(2,5),g:1
    });
   }
  }

  // =================================
  // DESCARGA
  // =================================

  else if(e.t>=.69&&e.t<1.05){

   if(!e.fs){
    e.fs=1;

    shk=Math.max(shk,8);
    sfl=.32;
    sfc='#fffde7';
   }

   // Un único impacto
   if(!e.hit){
    e.hit=1;

    if(!t.dead){
     hit(t,e.dm,'elec',o,{cat:e.cat,f:true});
    }

    blast(e.tx,e.ty,'#fef08a',80);
    ring(e.tx,e.ty,'#fde047',100,.55,7);
    ring(e.tx,e.ty,'#fff',55,.3,4);
    imp(e.tx,e.ty,'elec',3);

    shk=Math.max(shk,11);
    sfl=.35;
    sfc='#fff';
   }

   // Chispas que salen despedidas del suelo
   for(let i=0;i<8&&ps.length<900;i++){
    const a=R(0,6.28);
    const v=R(80,240);

    ps.push({
     x:e.tx+R(-12,12),
     y:e.ty+R(-8,15),
     vx:Math.cos(a)*v,
     vy:Math.sin(a)*v,
     gy:100,
     l:R(.25,.55),m:.55,
     c:i%3?'#fde047':'#fff',
     s:R(3,7),g:1
    });
   }

   // Electricidad residual
   if(Math.random()<.7&&ps.length<900){
    const a=R(0,6.28);
    const r=R(15,65);

    ps.push({
     x:e.tx+Math.cos(a)*r,
     y:e.ty+Math.sin(a)*r,
     vx:Math.cos(a)*R(40,100),
     vy:Math.sin(a)*R(40,100),
     l:.2,m:.2,
     c:'#fff',
     s:R(2,4),g:1
    });
   }
  }

  // =================================
  // FINAL
  // =================================

  else if(e.t>=1.05&&!e.end){
   e.end=1;
   ring(e.tx,e.ty,'#fef08a',125,.65,4);
   imp(e.tx,e.ty,'elec',1.5);
  }
 },

 edraw(e){
  const o=e.o,t=e.tg;
  if(!o||!t)return;

  const time=e.t;

  cx.save();

  // =================================
  // 1. CARGA ELÉCTRICA DEL ATACANTE
  // =================================

  if(time<.5){
   const ox=o.x;
   const oy=o.y-34;
   const u=time/.5;
   const r=15+u*15;

   cx.globalCompositeOperation='lighter';

   // Aura
   const g=cx.createRadialGradient(
    ox,oy,1,ox,oy,r*2
   );

   g.addColorStop(0,'rgba(255,255,255,.85)');
   g.addColorStop(.35,'rgba(253,224,71,.6)');
   g.addColorStop(1,'rgba(250,204,21,0)');

   cx.fillStyle=g;
   cx.beginPath();
   cx.arc(ox,oy,r*2,0,7);
   cx.fill();

   // Chispas orbitando
   for(let i=0;i<7;i++){
    const a=T*5+i*Math.PI*2/7;
    const rr=r*(1+Math.sin(T*12+i)*.2);

    const x=ox+Math.cos(a)*rr;
    const y=oy+Math.sin(a)*rr;

    cx.strokeStyle=i%2?'#fde047':'#fff';
    cx.lineWidth=2.5;
    cx.beginPath();
    cx.moveTo(x,y);
    cx.lineTo(
     x+Math.cos(a+1)*10,
     y+Math.sin(a+1)*10
    );
    cx.stroke();
   }

   cx.restore();
   return;
  }

  // =================================
  // 2. MARCA DE IMPACTO EN EL SUELO
  // =================================

  if(time>=.5&&time<.82){

   const tx=e.lock?e.tx:t.x;
   const ty=e.lock?e.ty:t.y-34;

   const pulse=1+Math.sin(T*28)*.15;
   const u=Math.min(1,(time-.5)/.32);

   cx.globalCompositeOperation='lighter';

   // Luz sobre el suelo
   const g=cx.createRadialGradient(
    tx,ty+22,1,tx,ty+22,65*pulse
   );

   g.addColorStop(0,'rgba(255,255,200,.7)');
   g.addColorStop(.4,'rgba(253,224,71,.35)');
   g.addColorStop(1,'rgba(250,204,21,0)');

   cx.fillStyle=g;
   cx.beginPath();
   cx.ellipse(tx,ty+22,65*pulse,22*pulse,0,0,7);
   cx.fill();

   // Anillos de advertencia
   cx.globalAlpha=.4+u*.5;
   cx.strokeStyle='#fff7ae';
   cx.lineWidth=2.5;
   cx.beginPath();
   cx.ellipse(tx,ty+22,18+u*42,7+u*13,0,0,7);
   cx.stroke();

   // Pequeñas descargas en el suelo
   for(let i=0;i<4;i++){
    const a=T*4+i*Math.PI/2;
    const x=tx+Math.cos(a)*35;
    const y=ty+22+Math.sin(a)*12;

    cx.strokeStyle='#fff';
    cx.lineWidth=2;
    cx.beginPath();
    cx.moveTo(x,y);
    cx.lineTo(x+Math.sin(a)*9,y-9);
    cx.lineTo(x+Math.sin(a)*14,y+3);
    cx.stroke();
   }

   cx.restore();
   return;
  }

  // =================================
  // 3. RELÁMPAGO VERTICAL
  // =================================

  if(time>=.69&&time<1.05){

   const tx=e.lock?e.tx:t.x;
   const ty=e.lock?e.ty:t.y-34;

   const fade=time> .91?Math.max(0,1-(time-.91)/.14):1;

   // El rayo nace fuera de la pantalla
   const top=-35;
   const height=ty-top;

   // Generador de trayectoria irregular
   const bolt=(seed,spread)=>{
    const pts=[];
    const count=13;

    for(let i=0;i<=count;i++){
     const u=i/count;

     const wobble=i===0||i===count?0:
      Math.sin(i*12.73+seed)*spread+
      Math.sin(i*5.31+seed*3)*spread*.45;

     pts.push([
      tx+wobble,
      top+height*u
     ]);
    }

    return pts;
   };

   const drawBolt=(pts,color,width)=>{
    cx.beginPath();
    cx.moveTo(pts[0][0],pts[0][1]);

    for(let i=1;i<pts.length;i++){
     cx.lineTo(pts[i][0],pts[i][1]);
    }

    cx.strokeStyle=color;
    cx.lineWidth=width;
    cx.stroke();
   };

   cx.globalAlpha=fade;
   cx.lineCap='round';
   cx.lineJoin='round';

   // Resplandor exterior
   const main=bolt(1,29);

   cx.globalCompositeOperation='lighter';

   drawBolt(main,'rgba(250,204,21,.25)',34);
   drawBolt(main,'rgba(253,224,71,.55)',19);
   drawBolt(main,'rgba(255,255,255,.95)',7);
   drawBolt(main,'#fff',3);

   // Ramificaciones laterales
   for(let b=0;b<5;b++){
    const index=2+(b*2)%9;
    const start=main[index];

    const side=b%2?1:-1;
    const pts=[
     start,
     [start[0]+side*17,start[1]+12],
     [start[0]+side*28,start[1]+25],
     [start[0]+side*39,start[1]+38]
    ];

    drawBolt(pts,'rgba(253,224,71,.85)',7);
    drawBolt(pts,'#fff',2.5);
   }

   // Destello superior de la descarga
   const glow=cx.createRadialGradient(
    tx,top+height*.35,1,
    tx,top+height*.35,75
   );

   glow.addColorStop(0,'rgba(255,255,255,.75)');
   glow.addColorStop(.4,'rgba(253,224,71,.35)');
   glow.addColorStop(1,'rgba(253,224,71,0)');

   cx.fillStyle=glow;
   cx.beginPath();
   cx.arc(tx,top+height*.35,75,0,7);
   cx.fill();

   // Destello en el punto de impacto
   const impact=cx.createRadialGradient(
    tx,ty,1,tx,ty,65
   );

    m.sc = { id: 'draco-meteor', t: 0, p };
    dim = 0.5;
    shk = Math.max(shk, 6);
    bn = { s: p.n, c: '#a855f7', l: 1.5 };

    // Energía draconiana subiendo desde el atacante
    for (let i = 0; i < 25; i++) {
      const ang = Math.random() * Math.PI * 2, dist = 15 + Math.random() * 25;
      ps.push({ x: m.x + Math.cos(ang) * dist, y: m.y - 34 + Math.sin(ang) * dist, vx: (Math.random() - 0.5) * 40, vy: -150 - Math.random() * 100,
        l: 0.6, m: 0.6, c: i % 2 === 0 ? '#c084fc' : '#60a5fa', s: 4 + Math.random() * 4, g: 1, sh: 's' });
    }

    // 5 meteoros escalonados. 'delay' lo gestiona el motor: eup() empieza cuando termina.
    const N = 5;
    for (let i = 0; i < N; i++) {
      const sx = tg.x + (Math.random() - 0.5) * 60 - 80;
      ents.push({ k: 'u', cu: 'draco-meteor', o: m, tg, cat: p.cat, dm: p.p / N, t: 0, idx: i,
        delay: 0.4 + i * 0.12,
        sx, sy: -100,
        cx: sx, cy: -100,                       // posición inicial válida (edraw puede dibujar antes del primer eup)
        ox: (Math.random() - 0.5) * 40,         // desvío lateral de este meteoro
        tx: tg.x, ty: tg.y - 20,
        hitDone: false, life: 2.0 });
    }
  },

  run(m, dt, s) {
    const t = s.t;
    if (t < 1.0) dim = Math.max(dim, 0.4);       // el campo sigue oscuro mientras caen
    if (t < 0.4) { m.x += Math.sin(t * 90) * 1.2; return false; }   // vibración (m.tilt estira el sprite, mejor mover x)
    return t >= 1.2;
  },

  eup(e, dt) {
    const o = e.o, tg = e.tg;
    e.t += dt;
    const u = Math.min(1, e.t / 0.35);           // 0.35 s de caída
    e.tx = tg.x + e.ox; e.ty = tg.y - 20;        // sigue al rival: el impacto cae donde está
    e.cx = e.sx + (e.tx - e.sx) * u;
    e.cy = e.sy + (e.ty - e.sy) * u;

    if (u < 1) {
      if (Math.random() < 0.7) {
        ps.push({ x: e.cx, y: e.cy, vx: (Math.random() - 0.5) * 30, vy: (Math.random() - 0.5) * 30, l: 0.3, m: 0.3,
          c: Math.random() < 0.5 ? '#a855f7' : '#ec4899', s: 5 + Math.random() * 5, g: 1, sh: 'c' });
      }
      return;
    }
    if (!e.hitDone) {
      e.hitDone = true;
      e.life = 0;
      if (!tg.dead) {
        hit(tg, e.dm, 'dragon', o, { cat: e.cat, f: e.idx === 0 });
        imp(tg.x, tg.y - 30, 'dragon', 1.2);
        blast(tg.x, tg.y - 20, '#a855f7', 35);
        shk = Math.max(shk, 7);
      }
    }
  },

  edraw(e) {
    if (e.hitDone || e.cx == null) return;
    cx.save();
    // Estela: línea que sale hacia atrás de la dirección de caída
    const dx = e.tx - e.sx, dy = e.ty - e.sy, L = Math.hypot(dx, dy) || 1;
    const bx = e.cx - dx / L * 90, by = e.cy - dy / L * 90;
    const tr = cx.createLinearGradient(e.cx, e.cy, bx, by);
    tr.addColorStop(0, 'rgba(192,132,252,.95)'); tr.addColorStop(1, 'rgba(192,132,252,0)');
    cx.strokeStyle = tr; cx.lineWidth = 16; cx.lineCap = 'round';
    cx.beginPath(); cx.moveTo(e.cx, e.cy); cx.lineTo(bx, by); cx.stroke();
    // Halo + núcleo rocoso
    const rad = 10;
    const grad = cx.createRadialGradient(e.cx, e.cy, 2, e.cx, e.cy, rad * 1.8);
    grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.4, '#c084fc'); grad.addColorStop(1, 'rgba(147,51,234,0)');
    cx.fillStyle = grad; cx.beginPath(); cx.arc(e.cx, e.cy, rad * 1.8, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = '#581c87'; cx.beginPath(); cx.arc(e.cx, e.cy, rad * 0.6, 0, Math.PI * 2); cx.fill();
    cx.restore();
  }
};

</script>

 const bi=h.querySelector('.hbar i');bi.style.width=q*100+'%';bi.style.background=q<.2?'#ef4444':q<.5?'#eab308':'#22c55e';
 h.querySelector('.hv').textContent=Math.max(0,Math.round(m.hp))+' / '+m.max;
 h.querySelector('.hst').innerHTML=ST.slice(1).filter(([k])=>m.stg[k]).map(([k,l])=>`<span class="ch ${m.stg[k]>0?'up':'dn'}">${l} ${m.stg[k]>0?'▲':'▼'}${Math.abs(m.stg[k])}</span>`).join('');

<script>

 let h=TM.map((a,s)=>`<div class="tp" style="--c:${s?'#ef4444':'#3b82f6'}"><div class="th"><span>${s?'🔴':'🔵'} EQUIPO ${s+1}</span><span>${a.length}/6</span></div><div class="sg">${[0,1,2,3,4,5].map(i=>{const o=a[i];if(!o)return `<button class="sc em" data-s="${s}" data-i="${i}">+</button>`;const y=TY[o.t],bad=o.s.length!=4;

  <div class="mh">Ataques · elige 4 <b class="${o.s.length==4?'ok':'no'}">${o.s.length}/4</b><small>⚔️ Físico · ✨ Especial · 🛡️ Estado</small></div>
  <div class="mg">${y.pool.map((a,i)=>{const v=mkmv(o.t,a),on=o.s.includes(i);return `<button class="mc${on?' on':''}" data-m="${i}" style="--t:${TC[v.t]}"><div class="mt">${TI(v.t,18)}<b>${v.n}</b>${on?'<span class="ck">✓</span>':''}</div><div class="mm"><span>${CI[v.cat]} ${v.cat=='phy'?'Físico':v.cat=='sta'?'Estado':'Especial'}</span>${v.p?`<span>Poder ${Math.round(v.p)}</span>`:''}${v.acc?`<span>${v.acc}%</span>`:''}<span>⏱ ${v.cd.toFixed(1)}s</span>${v.u?'<span class="ul">★ Final</span>':''}</div>${v.ef?`<div class="ef">${v.ef.d}</div>`:''}</button>`}).join('')}</div></div>`}
 $('#setup').innerHTML=h;$('#go').disabled=!(TM[0].length&&TM[1].length)||TM.some(a=>a.some(o=>o.s.length!=4))}
$('#setup').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.m!==undefined){const o=TM[sel[0]][sel[1]],i=+d.m,k=o.s.indexOf(i);if(k>=0)o.s.splice(k,1);else if(o.s.length<4)o.s.push(i)}
 else if(d.q){TM[sel[0]].splice(sel[1],1);sel=[sel[0],0]}
 else{const s=+d.s,a=TM[s];
  if(d.i!==undefined){if(a[+d.i]){sel=[s,+d.i];setTimeout(focusFi,60)}}
  else if(d.c){TM[s]=[];if(sel[0]==s)sel=[s,0]}}
 rend()};

async function addSp(id,s){if(loading)return;if(TM[s].length>=6){setSt('Ese equipo ya tiene 6.');return}loading=true;setSt('Cargando Pokémon y sus ataques…');
 try{const k=await loadSp(id);TM[s].push({t:k,s:[...TY[k].ds]});sel=[s,TM[s].length-1];setSt('');rend()}catch(e){setSt(ERR)}loading=false}

 const L=ALL.filter(x=>x.id>=a&&x.id<=b&&(!q||x.name.includes(q)||String(x.id)==q));
 $('#res').innerHTML=`<small style="width:100%">${L.length} Pokémon</small>`+L.map(x=>`<button class="rs" data-id="${x.id}"><img src="${SPR}${x.id}.png" width="48" height="48" loading="lazy" style="image-rendering:pixelated"><small>#${x.id} ${x.name}</small></button>`).join('')||'<small>Sin resultados</small>'}

$('#gen').onchange=$('#q').oninput=showRes;$('#res').onclick=e=>{const b=e.target.closest('.rs');if(b)addSp(+b.dataset.id,tgt)};
$('#d0').onclick=()=>{tgt=0;dst()};$('#d1').onclick=()=>{tgt=1;dst()};

 try{const ks=[];for(const id of ids){setSt(`Cargando equipo… ${ks.length+1}/${n}`);ks.push(await loadSp(id))}TM[tgt]=ks.map(k=>({t:k,s:[...TY[k].ds]}));sel=[tgt,0];setSt('');rend()}catch(e){setSt(ERR)}loading=false};

fetch(API+'pokemon?limit=1025').then(r=>r.json()).then(j=>{ALL=j.results.map(x=>({id:+x.url.split('/').filter(Boolean).pop(),name:x.name}));setSt('Toca un Pokémon para añadirlo al equipo elegido (→ 🔵 / → 🔴).');showRes()}).catch(()=>setSt(ERR));

 labMv=mv;$('#lst').textContent=`${mv.n} · ${mv.t} · ${mv.cat=='phy'?'físico':mv.cat=='sta'?'estado':'especial'} · animación: ${mv.cu?'PERSONALIZADA':mv.sty||'—'}${mv.u?' · final':''}`;labIdle=0;if(lab&&!labBusy())labFire()};
