  // ---------- Fusión ----------
  function seccionFusion(c){
    const box=h('div','max-width:520px');box.className='ge';
    if(typeof Fusion==='undefined'||typeof EVOLUCIONES==='undefined'){box.append(h('p','opacity:.7;margin:6px 0','Falta cargar fusion.js en index.html.'));return box}
    const MAX=Fusion.MAX_ESTRELLAS,est=c.estrellas||0;
    const estr=(n,nuevas=0)=>'<span class="gf-s on">★</span>'.repeat(n)+'<span class="gf-s nw">★</span>'.repeat(nuevas)+'<span class="gf-s">★</span>'.repeat(Math.max(0,MAX-n-nuevas));
    const hdr=h('div','');hdr.className='ge-card';
    hdr.innerHTML=`<div class="gf-big">${estr(est)}</div><small style="opacity:.7">${est}/${MAX} estrellas · las suben las copias: la carta que fusionas desaparece</small>`;
    box.append(hdr);
    if(est>=MAX){hdr.append(h('div','margin-top:6px;color:#fbbf24','⭐ Esta carta ya tiene todas las estrellas.'));return box}
    const ok=[],no=[];
    for(const m of partida.box){
      if(m.id===c.id)continue;
      const r=Fusion.puedeFusionar(c,m,EVOLUCIONES);
      if(r.ok)ok.push(m);else if(Fusion.mismaLinea(c,m,EVOLUCIONES))no.push([m,r.motivo]);
    }
    const nom=m=>NOM[m.especieId]||'#'+m.especieId;
    const mini=(m,extra)=>{
      const f=h('div','');f.className='gf-m';
      f.innerHTML=`<img src="${SPR+m.especieId}.png" alt=""><div class="nm"><b>#${m.especieId}</b></div>
        <div><small>Nv ${m.nivel}${simboloG(m.genero)}</small></div><div class="gf-ms">${'★'.repeat(m.estrellas||0)||'<small style="opacity:.5">☆</small>'}</div>${extra||''}`;
      nombreEs(m.especieId).then(n=>{const e=f.querySelector('.nm');if(e)e.innerHTML='<b>'+esc(n)+'</b>'});
      return f;
    };
    if(!ok.length)box.append(h('div','font-size:12px;opacity:.8;padding:4px','No tienes cartas compatibles. Sirven copias de esta misma especie o de una etapa anterior de su línea, con el mismo arquetipo (y el mismo sexo si el sexo decide una evolución de la línea).'));
    else{
      ok.sort((a,b)=>a.nivel-b.nivel||(a.estrellas||0)-(b.estrellas||0)||a.especieId-b.especieId);
      const sel=new Set(),panel=h('div','');panel.className='ge-card';
      panel.innerHTML=`<b>Cartas compatibles (${ok.length})</b> <small style="opacity:.65">· toca para elegir</small>`;
      const acts=h('div','');acts.className='gf-acts';
      const auto=h('button','','⚡ Auto hasta ★'+MAX),nada=h('button','','Ninguna');acts.append(auto,nada);
      const grid=h('div','');grid.className='gf-grid';
      const els=new Map();
      for(const m of ok){
        const pierde=m.nivel>1||(m.estrellas||0)>0,f=mini(m,pierde?'<span class="wa" title="Perderá su nivel y estrellas">⚠</span><span class="ck">✓</span>':'<span class="ck">✓</span>');
        f.onclick=()=>{sel.has(m.id)?sel.delete(m.id):sel.add(m.id);actualizar()};
        els.set(m.id,f);grid.append(f);
      }
      const res=h('div','');res.className='ge-card';
      const go=h('button','','🔀 Fusionar');go.className='ge-go';
      auto.onclick=()=>{sel.clear();let s=est;for(const m of ok){if(s>=MAX)break;sel.add(m.id);s+=(m.estrellas||0)+1}actualizar()};
      nada.onclick=()=>{sel.clear();actualizar()};
      function actualizar(){
        for(const[id,f]of els)f.classList.toggle('on',sel.has(id));
        const s=ok.filter(m=>sel.has(m.id));
        go.disabled=!s.length;
        if(!s.length){res.innerHTML='<small style="opacity:.7">Elige las cartas que quieras fusionar para ver el resultado.</small>';return}
        const r=Fusion.resultado(c,s),pierde=s.filter(m=>m.nivel>1||(m.estrellas||0)>0),ganadas=r.estrellas-est;
        res.innerHTML=`<div class="gf-big">${estr(est,ganadas)}</div>
          <div>${est}★ → <b>${r.estrellas}★</b> <span style="color:#4ade80">(+${ganadas})</span> · se usan ${s.length} carta${s.length>1?'s':''}</div>`
          +(r.perdidas?`<div style="color:#fbbf24;font-size:12px;margin-top:4px">⚠ Te pasas del máximo: se pierden ${r.perdidas} estrella${r.perdidas>1?'s':''}.</div>`:'')
          +(pierde.length?`<div style="color:#fbbf24;font-size:12px;margin-top:4px">⚠ Se perderá su nivel y estrellas: ${pierde.map(m=>`${esc(nom(m))} Nv ${m.nivel}${m.estrellas?' ★'+m.estrellas:''}`).join(', ')}.</div>`:'');
      }
      go.onclick=async()=>{
        const s=ok.filter(m=>sel.has(m.id));if(!s.length)return;
        const r=Fusion.resultado(c,s),n=await nombreEs(c.especieId);
        if(!confirm(`¿Fusionar ${s.length} carta${s.length>1?'s':''} en ${n}? Las cartas usadas desaparecen (se pierden su nivel, XP, IVs y naturaleza).`))return;
        c.estrellas=r.estrellas;
        const ids=new Set(s.map(m=>m.id));
        partida.box=partida.box.filter(m=>!ids.has(m.id));
        partida.equipo=(partida.equipo||[]).filter(x=>!ids.has(x&&x.id||x));
        reg('fusion',1);
        await guardar();
        pantallaDetalle(c,`¡Fusión hecha! ${n} sube a ${r.estrellas} ★ (${s.length} carta${s.length>1?'s usadas':' usada'}).`);
      };
      panel.append(acts,grid);box.append(panel,res,go);actualizar();
    }
    if(no.length){
      const d=h('details','');d.className='ge-card';d.innerHTML=`<summary style="cursor:pointer;opacity:.85">Misma línea, no compatibles (${no.length})</summary>`;
      const g2=h('div','');g2.className='gf-grid';g2.style.marginTop='8px';
      for(const[m,motivo]of no){const f=mini(m,`<div style="color:#f87171;font-size:10px;margin-top:3px">${esc(motivo)}</div>`);f.style.cursor='default';f.style.opacity='.75';g2.append(f)}
      d.append(g2);box.append(d);
    }
    return box;
  }

  // ---------- Entrenamiento ----------
  const CARAMELOS=['caramelo-s','caramelo-m','caramelo-l','caramelo-xl'];
  function seccionEntrenar(c){
    const box=h('div','max-width:520px');box.className='ge';
    if(typeof Experiencia==='undefined'){box.append(h('p','opacity:.7;margin:6px 0','Falta cargar experiencia.js en index.html.'));return box}
    const g=grupoDe(c.especieId),max=Experiencia.NIVEL_MAX,lv=c.nivel;
    const curva=Experiencia.GRUPOS[g]+(typeof GRUPO_EXP==='undefined'?' (falta experiencia-datos.js)':'');
    const hdr=h('div','');hdr.className='ge-card';
    if(lv>=max)hdr.innerHTML=`<div class="ge-lv"><b>Nv ${lv}</b><span>⭐ Nivel máximo</span><small>curva ${curva}</small></div>`;
    else{
      const a=Experiencia.xpTotal(g,lv),b=Experiencia.xpTotal(g,lv+1),pc=Math.max(0,Math.min(100,(c.xp-a)/(b-a)*100));
      hdr.innerHTML=`<div class="ge-lv"><b>Nv ${lv}</b><span>→ Nv ${lv+1}</span><small>curva ${curva}</small></div>
        <div class="ge-bar"><i style="width:${pc}%"></i></div>
        <div class="ge-nums"><span>${c.xp-a} / ${b-a} XP</span><span>faltan ${b-c.xp}</span></div>`;
    }
    box.append(hdr);

    if(lv<max){   // subir N niveles: elige solos los caramelos justos (ver Experiencia.planCaramelos)
      let k=1,plan=null;
      const sel=h('div','');sel.className='ge-card';
      sel.innerHTML=`<b>Subir de nivel</b>
        <div class="ge-big"></div>
        <div class="ge-row"><button class="mn">−</button><input type="range" min="1" max="${max-lv}" value="1"><button class="ms">+</button></div>
        <div class="ge-quick"></div><div class="ge-prev"></div><div class="ge-sts"></div>`;
      const big=sel.querySelector('.ge-big'),rng=sel.querySelector('input'),prev=sel.querySelector('.ge-prev'),sts=sel.querySelector('.ge-sts'),
        go=h('button','','⬆ Entrenar');go.className='ge-go';
      const inv=()=>Object.fromEntries(CARAMELOS.map(x=>[x,tengo(x)]));
      const alcanzable=()=>Experiencia.nivelPorXp(g,c.xp+CARAMELOS.reduce((s,x)=>s+tengo(x)*Experiencia.XP_CARAMELO[x],0));
      const calc=()=>{
        k=Math.max(1,Math.min(k,max-lv));rng.value=k;
        const obj=lv+k;plan=Experiencia.planCaramelos(g,c.xp,obj,inv());
        big.innerHTML=`Nv <b>${lv}</b> → Nv <b style="color:${plan.ok?'#4ade80':'#f87171'}">${obj}</b>`;
        if(plan.ok){
          const l=Object.entries(plan.usar).map(([x,n])=>`<span class="ge-chip">${objetoIcono(x)} ×${n} <small>${esc(objetoNombre(x))}</small></span>`).join('');
          prev.innerHTML=`<div class="ge-chips">${l||'—'}</div><small style="opacity:.65">XP sobrante: ${plan.sobrante} (se queda como progreso hacia el siguiente nivel)</small>`;
        }else prev.innerHTML=alcanzable()<=lv
          ?`<span style="color:#f87171">No tienes caramelos para subir de nivel.</span>`
          :`<span style="color:#f87171">No tienes caramelos suficientes para el nivel ${obj}.</span> <small>Con todos los que tienes llegarías al ${alcanzable()}.</small>`;
        go.disabled=!plan.ok||!Object.keys(plan.usar).length;
        // Estadísticas antes → después (necesita las estadísticas base de la especie)
        const bs=BASE[c.especieId];
        if(bs){
          const a=statsCarta(c),z=statsCarta({...c,nivel:obj});
          sts.innerHTML=Object.keys(ST).map(s=>`<div><small>${ST[s]}</small><span>${a[s]} → <b>${z[s]}</b> <em>+${z[s]-a[s]}</em></span></div>`).join('');
        }else sts.innerHTML='';
      };
      sel.querySelector('.mn').onclick=()=>{k--;calc()};sel.querySelector('.ms').onclick=()=>{k++;calc()};
      rng.oninput=()=>{k=+rng.value;calc()};
      const q=sel.querySelector('.ge-quick');
      for(const n of[1,5,10]){const b=h('button','',`+${n}`);b.onclick=()=>{k=n;calc()};q.append(b)}
      const mx=h('button','','Máx');mx.onclick=()=>{k=Math.max(1,alcanzable()-lv);calc()};q.append(mx);
      go.onclick=()=>entrenarPlan(c,plan);
      sel.append(go);box.append(sel);
      if(BASE[c.especieId]===undefined)datosEsp(c.especieId).then(d=>{BASE[c.especieId]=d.stats}).catch(()=>{BASE[c.especieId]=null}).then(()=>{if(sel.isConnected)calc()});
      calc();
    }

    // Caramelos a mano
    const det=h('details','margin-top:2px');det.className='ge-card';
    det.innerHTML='<summary style="cursor:pointer"><b>🍬 Elegir caramelos a mano</b></summary>';
    const gr=h('div','');gr.className='ge-cand';
    for(const k of CARAMELOS){
      const n=tengo(k),f=h('div','');f.className='ge-c';
      f.innerHTML=`<div class="ge-ci">${objetoIcono(k)}</div><div><b>${esc(objetoNombre(k))}</b><br><small>+${Experiencia.XP_CARAMELO[k]} XP · tienes ${n}</small></div>`;
      const bb=h('div','');bb.className='ge-cb';
      for(const[txt,cant]of[['×1',1],['×10',10],['Todos',Infinity]]){
        const b=h('button','',txt);b.disabled=n<=0||lv>=max;b.onclick=()=>entrenar(c,k,cant);bb.append(b);
      }
      f.append(bb);gr.append(f);
    }
    det.append(gr);box.append(det);
    return box;
  }
  async function entrenarPlan(c,plan){
    if(!plan||!plan.ok)return;
    const g=grupoDe(c.especieId),antes=c.nivel;
    for(const[k,n]of Object.entries(plan.usar)){partida.objetos[k]=tengo(k)-n;if(partida.objetos[k]<=0)delete partida.objetos[k]}
    c.xp+=plan.xp;c.nivel=Experiencia.nivelPorXp(g,c.xp);
    reg('entrenar',1);reg('caramelos',Object.values(plan.usar).reduce((a,b)=>a+b,0));
    await guardar();
    pantallaDetalle(c,`¡Sube del nivel ${antes} al ${c.nivel}! (${Object.entries(plan.usar).map(([k,n])=>n+' × '+objetoNombre(k)).join(', ')})`);
  }
  async function entrenar(c,k,cant){
    const g=grupoDe(c.especieId),xpc=Experiencia.XP_CARAMELO[k],falta=Experiencia.xpTotal(g,Experiencia.NIVEL_MAX)-c.xp;
    const n=Math.min(cant,tengo(k),Math.ceil(falta/xpc));   // no gasta caramelos de más al llegar al 100
    if(n<=0)return;
    const antes=c.nivel;
    c.xp+=n*xpc;partida.objetos[k]=tengo(k)-n;if(partida.objetos[k]<=0)delete partida.objetos[k];
    c.nivel=Experiencia.nivelPorXp(g,c.xp);
    reg('entrenar',1);reg('caramelos',n);
    await guardar();
    pantallaDetalle(c,c.nivel>antes?`¡Sube del nivel ${antes} al ${c.nivel}! (${n} × ${objetoNombre(k)})`:`+${n*xpc} XP (${n} × ${objetoNombre(k)})`);
  }

  // ---------- Evolución ----------
  const tengo=k=>(partida.objetos&&partida.objetos[k])||0;
  const costes=e=>[[e.o,e.n],...(e.x||[])];   // objetos que gasta una evolución
  const BASE={};   // estadísticas base por especie (undefined = sin pedir, null = fallo), para comparar Ataque y Defensa
    function statsCarta(c){   // fórmula de los juegos, sin EVs: PS = ((2·base+IV)·nivel/100)+nivel+10 · resto = (((2·base+IV)·nivel/100)+5) × naturaleza
    const b=BASE[c.especieId],nat=Guardado.NATURALEZAS[c.naturaleza]||{},o={};
    for(const s of Object.keys(ST)){
      const v=Math.floor((2*b[s]+c.ivs[s])*c.nivel/100);
      o[s]=s==='hp'?v+c.nivel+10:Math.floor((v+5)*(nat.u===s?110:nat.d===s?90:100)/100);
    }
    return o;
  }

    const SCOL={hp:'#22c55e',atk:'#f97316',def:'#eab308',spa:'#38bdf8',spd:'#84cc16',spe:'#f472b6'};
  function pintarStats(c,z){
    const b=BASE[c.especieId];
    if(b===undefined){
      z.innerHTML='<small style="opacity:.7">Cargando estadísticas…</small>';
      datosEsp(c.especieId).then(d=>{BASE[c.especieId]=d.stats}).catch(()=>{BASE[c.especieId]=null})
        .then(()=>{if(z.isConnected)pintarStats(c,z)});
      return;
    }
    if(!b){z.innerHTML='<small style="color:#f87171">No se pudieron cargar las estadísticas (¿sin conexión?)</small>';return}
    const s=statsCarta(c),nat=Guardado.NATURALEZAS[c.naturaleza]||{},tot=Object.values(b).reduce((x,y)=>x+y,0);
    const filas=Object.keys(ST).map(k=>{
      const m=nat.u===k?' <b style="color:#4ade80">▲</b>':nat.d===k?' <b style="color:#f87171">▼</b>':'';
      return `<tr><td style="padding-right:8px">${ST[k]}</td>
        <td style="width:120px"><div style="background:#1e293b;height:6px;border-radius:3px"><div style="width:${Math.min(100,b[k]/1.8)}%;height:6px;background:${SCOL[k]};border-radius:3px"></div></div></td>
        <td style="padding-left:8px;text-align:right"><b>${s[k]}</b>${m}</td>
        <td style="padding-left:6px;opacity:.6"><small>base ${b[k]}</small></td></tr>`;
    }).join('');
    z.innerHTML=`<table style="font-size:12px;margin-top:4px">${filas}</table><small style="opacity:.6">Total base ${tot} · valores a nivel ${c.nivel}</small>`;
  }

  function estadoEvo(c,e){   // devuelve {ok, lock, reqs:[{ok,html}], txt}
    if(e.t==='bloqueado')return{ok:false,lock:true,reqs:[{ok:false,html:'Requisito: '+esc(e.req)}],txt:'🔒 Próximamente · requisito: '+esc(e.req)};
    const reqs=[],add=(ok,html)=>reqs.push({ok,html});
    if(e.nivel!=null)add(c.nivel>=e.nivel,`Nivel ${e.nivel} <small>(tu carta: ${c.nivel})</small>`);
    if(e.t==='objeto')for(const[k,n]of costes(e))add(tengo(k)>=n,`${objetoIcono(k)} ${n} × ${esc(objetoNombre(k))} <small>(tienes ${tengo(k)})</small>`);
    if(e.t==='stats'){
      if(BASE[c.especieId]===undefined)add(false,'<small>Calculando estadísticas…</small>');
      else if(!BASE[c.especieId])add(false,'<small>No se pudieron cargar las estadísticas</small>');
      else{
        const s=statsCarta(c),rel=s.atk>s.def?'>':s.atk<s.def?'<':'=';
        add(rel===e.cmp,`Ataque ${s.atk} ${rel} Defensa ${s.def} <small>(hace falta ${e.cmp})</small>`);
      }
    }
    if(e.g){
      const q=GN[e.g],mia=c.genero==='N'?'sin género':GN[c.genero]?GN[c.genero][1].toLowerCase():'sin definir';
      add(c.genero===e.g,`${q[0]} Solo ${q[1].toLowerCase()} <small>(tu carta: ${mia})</small>`);
    }
    return{ok:reqs.every(r=>r.ok),reqs,txt:reqs.map(r=>r.html).join('<br>')};
  }
  function seccionEvolucion(c){
    const box=h('div','max-width:520px');box.className='ge';
    const ops=(typeof EVOLUCIONES!=='undefined'&&EVOLUCIONES[c.especieId])||[];
    if(!ops.length){const f=h('div','','🌟 Esta carta no tiene más evoluciones.');f.className='ge-card';box.append(f);return box}
    if(ops.some(e=>e.t==='stats')&&BASE[c.especieId]===undefined)
      datosEsp(c.especieId).then(d=>{BASE[c.especieId]=d.stats}).catch(()=>{BASE[c.especieId]=null})
        .then(()=>{if(box.isConnected)box.replaceWith(seccionEvolucion(c))});
    const lista=ops.map(e=>({e,st:estadoEvo(c,e)})).sort((a,b)=>(b.st.ok-a.st.ok)||((a.e.t==='bloqueado')-(b.e.t==='bloqueado')));   // primero las que ya puedes hacer
    const badge=r=>`<span style="background:${RC[r]};color:#0f172a;border-radius:8px;padding:0 7px;font-weight:700">${r}</span>`;
    for(const{e,st}of lista){
      const card=h('div','');card.className='ge-card ev'+(st.lock?' lock':'');
      card.innerHTML=`<div class="ev-top">
        <div class="ev-p"><img src="${SPR+c.especieId}.png" alt=""><div class="n0"><small>#${c.especieId}</small></div></div>
        <div class="ev-arrow">➜</div>
        <div class="ev-p"><img src="${SPR+e.a}.png" alt=""><div class="n1"><b>#${e.a}</b></div></div>
        <div class="ev-r">${badge(rz(c.especieId))} → ${badge(rz(e.a))}</div></div>
        <ul class="ev-req">${st.reqs.map(q=>`<li class="${q.ok?'ok':st.lock?'lk':'no'}"><span>${q.ok?'✓':st.lock?'🔒':'✗'}</span><div>${q.html}</div></li>`).join('')}</ul>`;
      nombreEs(c.especieId).then(n=>{const x=card.querySelector('.n0');if(x)x.innerHTML='<small>'+esc(n)+'</small>'});
      nombreEs(e.a).then(n=>{const x=card.querySelector('.n1');if(x)x.innerHTML='<b>'+esc(n)+'</b>'});
      const b=h('button','',st.lock?'🔒 Próximamente':'🧬 Evolucionar');b.className='ge-go';
      b.disabled=!st.ok;if(st.ok)b.onclick=()=>evolucionar(c,e);
      card.append(b);box.append(card);
    }
    return box;
  }
  async function evolucionar(c,e){
    if(!estadoEvo(c,e).ok)return;
    const nom=await nombreEs(e.a),coste=e.t==='objeto'?` Se gastarán ${costes(e).map(([k,n])=>n+' × '+objetoNombre(k)).join(' + ')}.`:'';
    if(!confirm(`¿Evolucionar a ${nom}?${coste}`))return;
    if(e.t==='objeto')for(const[k,n]of costes(e)){partida.objetos[k]=tengo(k)-n;if(partida.objetos[k]<=0)delete partida.objetos[k]}
    // Solo cambia la especie: id, IVs, naturaleza, estrellas, nivel y arquetipo se conservan; el kit se calcula con la especie.
    const g1=grupoDe(c.especieId);
    c.especieId=e.a;
    if(typeof HabCarta!=='undefined')HabCarta.alEvolucionar(c);   // misma ranura de habilidad en la nueva especie
    if(typeof Experiencia!=='undefined'&&grupoDe(e.a)!==g1)c.xp=Experiencia.xpTotal(grupoDe(e.a),c.nivel);   // otra curva de XP: se conserva el nivel
    const r=rateDe(e.a);if(r===-1)c.genero='N';else if(r===0)c.genero='M';else if(r>=8)c.genero='F';   // especies de un solo género
    reg('evolucion',1);
    await guardar();pestana='datos';pantallaDetalle(c,`¡Tu carta ha evolucionado a ${nom}!`);
  }

  // [especie, nivel, arquetipo, género?, estrellas?] → cartas de prueba en la box (género y estrellas opcionales)
  function darCartas(lista){
    for(const[sp,nv,aq,gen,est,hab,obj]of lista){const c=Guardado.nuevaCarta(partida,{especieId:sp,arquetipo:aq},'prueba');c.nivel=nv;if(gen)c.genero=gen;if(est)c.estrellas=est;
      if(hab){c.habilidad=hab;c.habSlot=HabCarta.slotDe(sp,hab)}if(obj)c.objeto=obj}
  }

  function pantallaPartida(){
    limpiar();cont.append(cabecera('💾 Partida',menu));
    const l=h('div','display:flex;flex-direction:column;gap:8px;max-width:380px');
    const ex=h('button','','⬇ Exportar mi partida (copia de seguridad)');
    ex.onclick=()=>{
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([Guardado.exportarPartida(partida)],{type:'application/json'}));
      a.download='gacha-'+partida.jugador.nombre.replace(/[^\w-]+/g,'_')+'.json';a.click();
    };
    const fi=h('input','display:none');fi.type='file';fi.accept='.json,application/json';
    const im=h('button','','⬆ Importar una partida (crea un perfil nuevo)');
    im.onclick=()=>fi.click();
    fi.onchange=async()=>{
      try{const id=await Guardado.importarPartida(await fi.files[0].text());perfil=id;partida=await Guardado.cargarPartida(id);menu()}
      catch(e){alert('No se pudo importar: el archivo no es una partida válida.')}
    };
    const cp=h('button','','👤 Cambiar de perfil');cp.onclick=pantallaPerfil;
    const bo=h('button','color:#f87171','🗑 Borrar este perfil');
    bo.onclick=async()=>{
      if(!confirm('¿Borrar el perfil "'+partida.jugador.nombre+'" y toda su partida? No se puede deshacer.'))return;
      await Guardado.borrarPerfil(perfil);pantallaPerfil();
    };
    const inv=Object.entries(partida.objetos||{});
    cont.append(h('p','margin:6px 0;font-size:13px','<b>🎒 Objetos:</b> '+(inv.length?inv.map(([k,n])=>`${objetoIcono(k)} ${esc(objetoNombre(k))} ×${n}`).join(' · '):'ninguno')));
    const pr=h('button','','🧪 Datos de prueba (cartas y objetos para evolucionar)');
    pr.onclick=async()=>{
      if(!confirm('Esto añade a tu box unas cartas de prueba y objetos de ejemplo. ¿Seguir?'))return;
      darCartas(CARTAS_PRUEBA);
      for(const[k,n]of Object.entries(OBJETOS_PRUEBA))partida.objetos[k]=tengo(k)+n;
      await guardar();pantallaBox(`Añadidas ${CARTAS_PRUEBA.length} cartas de prueba y objetos.`);
    };
    const pf=h('button','','🔀 Cartas de prueba para fusionar');
    pf.onclick=async()=>{darCartas(CARTAS_PRUEBA_FUSION);await guardar();pantallaBox(`Añadidas ${CARTAS_PRUEBA_FUSION.length} cartas de prueba para fusionar.`)};
    const po=h('button','','🍬 Solo objetos de prueba (sin cartas)');
    po.onclick=async()=>{for(const[k,n]of Object.entries(OBJETOS_PRUEBA))partida.objetos[k]=tengo(k)+n;await guardar();pantallaPartida()};
    const ph=h('button','','⚔️ Cartas de prueba con habilidad y objeto');
    ph.onclick=async()=>{if(typeof HabCarta==='undefined')return;darCartas(HabCarta.CARTAS_PRUEBA);await guardar();pantallaBox(`Añadidas ${HabCarta.CARTAS_PRUEBA.length} cartas de prueba con habilidad y objeto.`)};
    l.prepend(ph);l.prepend(pf);l.prepend(po);l.prepend(pr);
    l.append(ex,im,fi,cp,bo);cont.append(l);
    if(typeof Misiones!=='undefined'){   // fecha de prueba: para ver login, misiones diarias y celebraciones sin esperar días
      const real=Misiones.hoyLocal(),act=Misiones.fechaJuego(),fp=h('div','margin-top:16px;font-size:12px;max-width:380px',
        `<b>🕒 Fecha de prueba</b> <small style="opacity:.7">(solo para probar: cambia el login, las misiones diarias y las celebraciones)</small>`
        +(act!==real?`<div style="color:#fbbf24;margin:4px 0">⚠ Estás usando la fecha ${fechaBonita(act)} (hoy es ${fechaBonita(real)})</div>`:''));
      const inp=h('input','margin:6px 6px 0 0');inp.type='date';inp.value=act;
      const ap=h('button','margin-right:6px','Aplicar'),rs=h('button','','Usar la fecha real');
      ap.onclick=()=>{try{localStorage.setItem('gacha-fecha-prueba',inp.value)}catch(e){}pantallaPartida()};
      rs.onclick=()=>{try{localStorage.removeItem('gacha-fecha-prueba')}catch(e){}pantallaPartida()};
      fp.append(h('br'),inp,ap,rs);cont.append(fp);
    }
  }

  // Punto de entrada: lo llama el menú de modos.
  async function abrir(contenedor,volver){
    cont=contenedor;salir=volver;estilo();
    perfil=await Guardado.perfilActivo();
    partida=perfil?await Guardado.cargarPartida(perfil):null;
    if(partida)menu();else pantallaPerfil();
  }
  return{abrir};
})();
</script>

<script>
// Lógica del modo aventura LIBRE (código PURO: sin red ni DOM). Una partida = tu viaje por una región, con su box propia.
// Lo que se guarda (todo JSON):
//   partida = {version:2, region, nombre, contador, pokes:[{uid,especieId,nivel,xp,genero}], equipo:[uid...] (máx. 6),
//              objetos:{pokeball:n,...}, dinero, medallas:[], nodo (dónde estás), visitados:{id:1}, vencidos:{'nodo:e0':1,'nodo:gim':1},
//              hallazgos:{nodo:1}, enc (salvaje en curso), pendCaptura:{id,nv}|null, stats:{combates,capturas,derrotas}}
// Las funciones que necesitan datos del juego reciben `ctx`:
//   {Experiencia, grupoDe(id), EVOLUCIONES, rateDe(id), rz(id)}   (rz = rareza 'N'..'LR')
const Aventura=(()=>{
  // Todo lo ajustable está aquí (valores de EJEMPLO para probar).
  const CFG={
    inicial:{nivel:5,pokeball:8,dinero:300},
    equipoMax:6,
    escala:{stat:[.15,.85],hp:[.35,.65]},   // multiplicador = a + b·nivel/100 (nivel 100 = stats base completas)
    xp:{salvaje:1/8,entrenador:1.5/8},      // XP = suma de stats base del rival · su nivel · factor
    dinero:{salvaje:5,entrenador:40},       // salvaje: nivel·5 · entrenador: suma de niveles·40 (o el `dinero` del entrenador)
    captura:{N:.85,R:.7,SR:.5,SSR:.35,UR:.2,LR:.1},   // probabilidad de atrapar según la rareza de la especie
    bolas:{pokeball:1,superball:1.5},       // multiplicador de cada tipo de bola
    huidaFallo:.2,                          // probabilidad de que el Pokémon escape tras fallar una bola
  };
  const mult=(c,n)=>c[0]+c[1]*n/100;
  const bst=st=>Object.values(st).reduce((a,b)=>a+b,0);
  function escalar(st,H,nv,cfg=CFG){   // stats de combate de un Pokémon de cierto nivel
    const k=mult(cfg.escala.stat,nv),out={};
    for(const s in st)out[s]=Math.max(1,Math.round(st[s]*k));
    return{st:out,H:Math.max(10,Math.round(H*mult(cfg.escala.hp,nv)))};
  }
  const xpVictoria=(bstRival,nv,entrenador,cfg=CFG)=>Math.max(1,Math.round(bstRival*nv*(entrenador?cfg.xp.entrenador:cfg.xp.salvaje)));
  const probCaptura=(rareza,bola='pokeball',cfg=CFG)=>Math.min(.95,(cfg.captura[rareza]??.5)*(cfg.bolas[bola]||1));
  const generoPor=r=>r===undefined||r===null?null:r<0?'N':r===0?'M':r>=8?'F':null;
  function sortearGenero(r,rng=Math.random){const g=generoPor(r);return g||(r===undefined||r===null?null:rng()*8<r?'F':'M')}

  const poke=(run,uid)=>run.pokes.find(p=>p.uid===uid);
  const equipo=run=>run.equipo.map(u=>poke(run,u)).filter(Boolean);
  const tengo=(run,k)=>run.objetos[k]||0;
  const dar=(run,pr)=>{for(const[k,n]of Object.entries(pr||{}))run.objetos[k]=(run.objetos[k]||0)+n};
  const gastar=(run,k,n)=>{run.objetos[k]=tengo(run,k)-n;if(run.objetos[k]<=0)delete run.objetos[k]};

  function nuevoPoke(run,especieId,nivel,ctx,rng=Math.random){
    const p={uid:'a'+(++run.contador),especieId,nivel,xp:ctx.Experiencia.xpTotal(ctx.grupoDe(especieId),nivel),genero:sortearGenero(ctx.rateDe(especieId),rng)};
    run.pokes.push(p);return p;
  }
  function nuevaPartida(R,inicialId,ctx,nombre='Entrenador',rng=Math.random){
    const run={version:2,region:R.id,nombre,contador:0,pokes:[],equipo:[],objetos:{pokeball:CFG.inicial.pokeball},dinero:CFG.inicial.dinero,medallas:[],
      nodo:R.inicio,visitados:{[R.inicio]:1},vencidos:{},hallazgos:{},enc:null,pendCaptura:null,stats:{combates:0,capturas:0,derrotas:0},creada:Date.now()};
    run.equipo.push(nuevoPoke(run,inicialId,CFG.inicial.nivel,ctx,rng).uid);
    return run;
  }

  // ---------- Mapa libre ----------
  function vecinos(R,id){   // las conexiones valen en los dos sentidos
    const n=R.nodos[id];
    return Object.keys(R.nodos).filter(k=>k!==id&&((n.con||[]).includes(k)||(R.nodos[k].con||[]).includes(id)));
  }
  function acceso(run,R,id){   // {ok, motivo}
    const n=R.nodos[id];
    if(!n)return{ok:false,motivo:'No existe'};
    if(n.proximamente)return{ok:false,motivo:'Próximamente'};
    const q=n.requiere||{};
    if(q.medalla&&!run.medallas.includes(q.medalla))return{ok:false,motivo:'Necesitas la medalla '+q.medalla};
    if(q.medallas&&run.medallas.length<q.medallas)return{ok:false,motivo:'Necesitas '+q.medallas+' medallas'};
    return{ok:true};
  }
  const viajeRapido=(run,R)=>Object.keys(run.visitados).filter(id=>id!==run.nodo&&R.nodos[id]&&['pueblo','ciudad'].includes(R.nodos[id].tipo)&&acceso(run,R,id).ok);
  // Ir a un lugar vecino o, con rapido=true, a una ciudad/pueblo ya visitado. Devuelve {ok,motivo}.
  function ir(run,R,id,rapido=false){
    if(run.pendCaptura)return{ok:false,motivo:'Tienes un Pokémon por capturar'};
    const a=acceso(run,R,id);if(!a.ok)return a;
    if(rapido?!viajeRapido(run,R).includes(id):!vecinos(R,run.nodo).includes(id))return{ok:false,motivo:'No se puede ir allí desde aquí'};
    run.nodo=id;run.visitados[id]=1;run.enc=null;return{ok:true};
  }

  // ---------- Evolución ----------
  function puedeEvo(run,p,e){
    if(e.t==='bloqueado'||e.t==='stats')return{ok:false,motivo:'Próximamente'};
    if(e.nivel!=null&&p.nivel<e.nivel)return{ok:false,motivo:'Nivel '+e.nivel};
    if(e.g&&p.genero!==e.g)return{ok:false,motivo:e.g==='M'?'Solo macho':'Solo hembra'};
    if(e.t==='objeto'){
      const cs=[[e.o,e.n],...(e.x||[])];
      if(!cs.every(([k,n])=>tengo(run,k)>=n))return{ok:false,motivo:'Faltan objetos',costes:cs};
      return{ok:true,costes:cs};
    }
    return{ok:true,costes:[]};
  }
  const opcionesEvo=(run,p,ctx)=>(ctx.EVOLUCIONES[p.especieId]||[]).map(e=>({e,...puedeEvo(run,p,e)}));
  function aplicarEvo(run,p,e,ctx){
    for(const[k,n]of puedeEvo(run,p,e).costes||[])gastar(run,k,n);
    const g1=ctx.grupoDe(p.especieId);p.especieId=e.a;
    if(ctx.grupoDe(e.a)!==g1)p.xp=ctx.Experiencia.xpTotal(ctx.grupoDe(e.a),p.nivel);
    const g=generoPor(ctx.rateDe(e.a));if(g)p.genero=g;
  }
  function evolucionar(run,p,e,ctx){   // evolución elegida por el jugador (objeto). false si no se puede
    if(!puedeEvo(run,p,e).ok)return false;
    const de=p.especieId;aplicarEvo(run,p,e,ctx);return{de,a:p.especieId};
  }
  function evolucionAuto(run,p,ctx,rng=Math.random){   // las de nivel se hacen solas
    const out=[];
    for(let i=0;i<4;i++){
      const ok=(ctx.EVOLUCIONES[p.especieId]||[]).filter(e=>e.t==='nivel'&&puedeEvo(run,p,e).ok);
      if(!ok.length)break;
      const e=ok[Math.floor(rng()*ok.length)];out.push({de:p.especieId,a:e.a});aplicarEvo(run,p,e,ctx);
    }
    return out;
  }
  function darXp(run,p,xp,ctx,rng){
    const antes=p.nivel;
    p.xp+=xp;p.nivel=Math.min(ctx.Experiencia.NIVEL_MAX,ctx.Experiencia.nivelPorXp(ctx.grupoDe(p.especieId),p.xp));
    return{xp,antes,despues:p.nivel,evol:evolucionAuto(run,p,ctx,rng)};
  }
  // Caramelos: dan XP fija (Experiencia.XP_CARAMELO). Devuelve el resultado de darXp o null.
  function usarCaramelo(run,p,k,n,ctx,rng){
    const xpc=ctx.Experiencia.XP_CARAMELO[k];
    if(!xpc||p.nivel>=ctx.Experiencia.NIVEL_MAX)return null;
    const falta=ctx.Experiencia.xpTotal(ctx.grupoDe(p.especieId),ctx.Experiencia.NIVEL_MAX)-p.xp;
    n=Math.min(n,tengo(run,k),Math.ceil(falta/xpc));if(n<=0)return null;
    gastar(run,k,n);const r=darXp(run,p,n*xpc,ctx,rng);r.n=n;return r;
  }

  // ---------- Combates ----------
  function elegirEnc(n,rng){
    const t=n.encuentros.reduce((s,e)=>s+e.peso,0);let q=rng()*t,k=0;
    while(k<n.encuentros.length-1&&(q-=n.encuentros[k].peso)>0)k++;
    const e=n.encuentros[k];return{id:e.id,nv:e.min+Math.floor(rng()*(e.max-e.min+1))};
  }
  // Acciones de combate del lugar actual: [{clave, tipo, titulo, enemigos, hecho}]. 'salvaje' fija un encuentro en la partida.
  function acciones(run,R,rng=Math.random){
    const n=R.nodos[run.nodo],out=[];
    if(n.encuentros&&n.encuentros.length){
      if(!run.enc)run.enc=elegirEnc(n,rng);
      out.push({clave:'salvaje',tipo:'salvaje',titulo:'Pokémon salvaje',enemigos:[run.enc],hecho:false});
    }
    (n.entrenadores||[]).forEach((t,i)=>out.push({clave:'e'+i,tipo:'entrenador',titulo:(t.titulo?t.titulo+' ':'')+t.nombre,enemigos:t.equipo,hecho:!!run.vencidos[run.nodo+':e'+i]}));
    if(n.gimnasio)out.push({clave:'gim',tipo:'gimnasio',titulo:(n.gimnasio.titulo?n.gimnasio.titulo+' ':'')+n.gimnasio.nombre,enemigos:n.gimnasio.equipo,hecho:!!run.vencidos[run.nodo+':gim']});
    return out;
  }
  const accion=(run,R,clave,rng)=>acciones(run,R,rng).find(a=>a.clave===clave&&!a.hecho&&!run.pendCaptura)||null;
  const datosRival=(R,run,clave)=>{const n=R.nodos[run.nodo];return clave==='gim'?n.gimnasio:clave[0]==='e'?n.entrenadores[+clave.slice(1)]:null};
  // p = {clave, enemigos:[{id,nv,bst}], usados:[uid]}. Devuelve el informe para la pantalla.
  function victoria(run,R,p,ctx,rng=Math.random){
    const esT=p.clave!=='salvaje',rival=esT?datosRival(R,run,p.clave):null;
    const inf={xp:0,dinero:0,subidas:[],medalla:null,premio:null,captura:null};
    inf.xp=p.enemigos.reduce((s,e)=>s+xpVictoria(e.bst||300,e.nv,esT),0);
    inf.dinero=esT?(rival.dinero??p.enemigos.reduce((s,e)=>s+e.nv,0)*CFG.dinero.entrenador):p.enemigos[0].nv*CFG.dinero.salvaje;
    run.dinero+=inf.dinero;
    for(const uid of new Set(p.usados)){const q=poke(run,uid);if(q)inf.subidas.push({uid,...darXp(run,q,inf.xp,ctx,rng)})}
    run.stats.combates++;
    if(esT){
      run.vencidos[run.nodo+':'+p.clave]=1;
      if(rival.medalla&&!run.medallas.includes(rival.medalla)){run.medallas.push(rival.medalla);inf.medalla=rival.medalla}
      if(rival.premio){dar(run,rival.premio);inf.premio=rival.premio}
    }else{run.pendCaptura={id:p.enemigos[0].id,nv:p.enemigos[0].nv};inf.captura=run.pendCaptura;run.enc=null}
    return inf;
  }
  const derrota=run=>{run.stats.derrotas++;return{}};   // sin castigo: puedes volver a intentarlo

  // ---------- Captura, tienda, hallazgos y equipo ----------
  function lanzarBola(run,ctx,bola='pokeball',rng=Math.random){
    const c=run.pendCaptura;if(!c)return{ok:false,motivo:'nada'};
    if(!(tengo(run,bola)>0))return{ok:false,motivo:'sinBolas'};
    gastar(run,bola,1);
    const prob=probCaptura(ctx.rz(c.id),bola);
    if(rng()<prob){
      const p=nuevoPoke(run,c.id,c.nv,ctx,rng),enEquipo=run.equipo.length<CFG.equipoMax;
      if(enEquipo)run.equipo.push(p.uid);
      run.pendCaptura=null;run.stats.capturas++;
      return{ok:true,capturado:true,poke:p,enEquipo};
    }
    if(rng()<CFG.huidaFallo){run.pendCaptura=null;return{ok:true,capturado:false,huyo:true}}
    return{ok:true,capturado:false,huyo:false,prob};
  }
  const soltarCaptura=run=>{run.pendCaptura=null};
  function comprar(run,o,precio,n=1){
    if(run.dinero<precio*n)return false;
    run.dinero-=precio*n;dar(run,{[o]:n});return true;
  }
  function recogerHallazgo(run,R){
    const n=R.nodos[run.nodo];
    if(!n.hallazgo||run.hallazgos[run.nodo])return null;
    run.hallazgos[run.nodo]=1;dar(run,n.hallazgo);return n.hallazgo;
  }
  function alternarEquipo(run,uid){   // devuelve '' si ok o el motivo
    const i=run.equipo.indexOf(uid);
    if(i>=0){if(run.equipo.length<=1)return'Necesitas al menos un Pokémon en el equipo';run.equipo.splice(i,1);return''}
    if(run.equipo.length>=CFG.equipoMax)return'El equipo ya tiene '+CFG.equipoMax;
    run.equipo.push(uid);return'';
  }
  function liberar(run,uid){
    if(run.pokes.length<=1)return'No puedes liberar a tu último Pokémon';
    if(run.equipo.includes(uid)&&run.equipo.length<=1)return'Necesitas al menos un Pokémon en el equipo';
    run.pokes=run.pokes.filter(p=>p.uid!==uid);run.equipo=run.equipo.filter(u=>u!==uid);return'';
  }
  return{CFG,bst,escalar,xpVictoria,probCaptura,sortearGenero,poke,equipo,tengo,nuevaPartida,nuevoPoke,vecinos,acceso,viajeRapido,ir,
    opcionesEvo,evolucionar,evolucionAuto,darXp,usarCaramelo,acciones,accion,victoria,derrota,lanzarBola,soltarCaptura,comprar,
    recogerHallazgo,alternarEquipo,liberar};
})();
if(typeof module!=='undefined')module.exports=Aventura;
</script>
<script>
// Guardado LOCAL del modo aventura: una partida.
// Todo async a propósito (igual que guardado.js): si algún día se guarda en un servidor solo cambia este archivo.
// (Las "runs" de la versión anterior usaban otra clave y se ignoran.)
const GuardadoAventura=(()=>{
  const K='aventura-partida-v2';
  const leer=()=>{try{const v=localStorage.getItem(K);return v==null?null:JSON.parse(v)}catch(e){return null}};
  const cargar=async()=>{const r=leer();return r&&r.version===2&&Array.isArray(r.pokes)&&r.pokes.length?r:null};
  const guardar=async p=>localStorage.setItem(K,JSON.stringify(p));   // puede lanzar si no queda espacio
  const borrar=async()=>localStorage.removeItem(K);
  return{cargar,guardar,borrar};
})();
if(typeof module!=='undefined')module.exports=GuardadoAventura;
</script>
<script>
// MODO AVENTURA LIBRE (pantallas): mapa por lugares, combates, captura, tienda, viaje rápido y equipo.
// Necesita: aventura/regiones.js, aventura/aventura.js, aventura/guardado-aventura.js, experiencia.js (+ experiencia-datos.js),
//           evoluciones-datos.js, rarezas.js, generos-datos.js y pokeapi.js (loadSp, SPR, jf, ERR) + el simulador (iniciarCombate).
// Los combates usan el motor del simulador: cada Pokémon se registra en TY con sus stats escalados por nivel (clave 'p25@12').
const ModoAventura=(()=>{
  const RC={N:'#94a3b8',R:'#4ade80',SR:'#60a5fa',SSR:'#c084fc',UR:'#fbbf24',LR:'#f472b6'};
  const GN={M:['♂','#60a5fa'],F:['♀','#f472b6']};
  const BOLAS=['pokeball','superball'];
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const h=(t,css,html)=>{const e=document.createElement(t);if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;return e};
  const rz=id=>(typeof RAREZA_POR_ESPECIE!=='undefined'&&RAREZA_POR_ESPECIE[id]||['N'])[0];
  const grupoDe=id=>(typeof GRUPO_EXP!=='undefined'&&GRUPO_EXP[id])||'m';
  const ctx=()=>({Experiencia,grupoDe,EVOLUCIONES:typeof EVOLUCIONES!=='undefined'?EVOLUCIONES:{},
    rateDe:id=>typeof GENERO_RATE!=='undefined'?GENERO_RATE[id]:undefined,rz});
  let cont,salir,run=null,hayEstilo=false,ocupado=false;
  if(typeof OBJETOS!=='undefined'){if(!OBJETOS.pokeball)OBJETOS.pokeball=['Poké Ball','⚪'];if(!OBJETOS.superball)OBJETOS.superball=['Super Ball','🔵']}
  const objN=k=>typeof objetoNombre==='function'?objetoNombre(k):k,objI=k=>typeof objetoIcono==='function'?objetoIcono(k):'📦';
  const premioHtml=p=>Object.entries(p).map(([k,n])=>`<span title="${esc(objN(k))}" style="white-space:nowrap">${objI(k)}×${n}</span>`).join(' ');
  const R$=()=>REGIONES[run.region],nodoAct=()=>R$().nodos[run.nodo];

  // Nombres en español (misma caché que el gacha)
  let NOM={};try{NOM=JSON.parse(localStorage.getItem('nombres-es-v1')||'{}')}catch(e){}
  async function nombreEs(id){
    if(NOM[id])return NOM[id];
    try{
      const s=await jf(API+'pokemon-species/'+id+'/');
      NOM[id]=(s.names.find(x=>x.language.name==='es')||s.names.find(x=>x.language.name==='en')||{name:s.name}).name;
      try{localStorage.setItem('nombres-es-v1',JSON.stringify(NOM))}catch(e){}
      return NOM[id];
    }catch(e){return'#'+id}
  }
  const nm=id=>NOM[id]||'#'+id;
  const cargarNombres=ids=>Promise.all([...new Set(ids)].map(nombreEs));
  async function guardar(){
    try{await GuardadoAventura.guardar(run)}
    catch(e){alert('No se pudo guardar la partida (¿sin espacio en el navegador?).')}
  }
  const limpiar=()=>{cont.innerHTML='';window.scrollTo&&window.scrollTo(0,0)};

  function estilo(){
    if(hayEstilo)return;hayEstilo=true;
    document.head.append(h('style','',`
      .av-grid{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
      .av-card{width:104px;border:2px solid var(--c);border-radius:10px;padding:6px 4px;text-align:center;background:#0f172a;color:#e2e8f0;cursor:pointer;font:12px system-ui,sans-serif}
      .av-card.off{opacity:.55;border-style:dashed}
      .av-card img{width:72px;height:72px;image-rendering:pixelated}
      .av-card .r{display:inline-block;padding:0 6px;border-radius:8px;background:var(--c);color:#0f172a;font-weight:700;font-size:11px}
      .av-card small{display:block;opacity:.75}
      .av-box{border:1px solid #334155;border-radius:10px;padding:10px;margin:10px 0;max-width:560px}
      .av-op{display:block;width:100%;text-align:left;margin:6px 0;padding:10px}
      .av-op small{opacity:.75}`));
  }
  function cabecera(titulo,atras){
    const d=h('div','display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap');
    if(atras){const b=h('button','','← Volver');b.onclick=atras;d.append(b)}
    d.append(h('b','font-size:16px',esc(titulo)));
    if(run)d.append(h('span','margin-left:auto;font-size:13px',
      `💰 <b>${run.dinero}</b> · 🏅 ${run.medallas.length} · ${BOLAS.map(k=>`${objI(k)}<b>${run.objetos[k]||0}</b>`).join(' ')}`));
    return d;
  }
  function tarjeta(p,{alClick,off,extra}={}){
    const r=rz(p.especieId),d=h('div','');d.className='av-card'+(off?' off':'');d.style.setProperty('--c',RC[r]);
    d.innerHTML=`<img src="${SPR+p.especieId}.png" alt=""><div class="n">${esc(nm(p.especieId))}</div><span class="r">${r}</span>${GN[p.genero]?` <b style="color:${GN[p.genero][1]}">${GN[p.genero][0]}</b>`:''}
      <small>Nv ${p.nivel}</small>${extra?`<small>${extra}</small>`:''}`;
    if(alClick)d.onclick=alClick;
    return d;
  }
  const sprites=l=>l.map(e=>`<img src="${SPR+e.id}.png" width="36" height="36" style="image-rendering:pixelated;vertical-align:middle" alt="" title="${esc(nm(e.id))}"><small>Nv ${e.nv}</small>`).join(' ');

  // ---------- Menú e inicial ----------
  async function pantallaMenu(){
    limpiar();run=null;cont.append(cabecera('🗺️ Aventura',salir));
    const g=await GuardadoAventura.cargar();
    if(g){
      const n=REGIONES[g.region].nodos[g.nodo],box=h('div','',`<b>Tu partida</b> · ${esc(REGIONES[g.region].nombre)} · ${n.icono} ${esc(n.nombre)}<br>
        <small>🏅 ${g.medallas.length} medalla${g.medallas.length===1?'':'s'} · ${g.pokes.length} Pokémon · 💰 ${g.dinero}</small><br>`);
      box.className='av-box';
      const c=h('button','margin:6px 6px 0 0;padding:8px 14px','▶ Continuar'),a=h('button','color:#f87171;margin-top:6px','🗑 Borrar partida');
      c.onclick=async()=>{run=g;await cargarNombres(g.pokes.map(p=>p.especieId));pantallaNodo()};
      a.onclick=async()=>{if(!confirm('¿Borrar la partida? Se pierde todo el progreso.'))return;await GuardadoAventura.borrar();pantallaMenu()};
      box.append(c,a);cont.append(box);
    }else{
      const nw=h('button','padding:12px 16px','🆕 Nueva partida');nw.onclick=pantallaInicial;cont.append(nw);
    }
  }
  async function pantallaInicial(){
    limpiar();run=null;cont.append(cabecera('Elige tu inicial',pantallaMenu));
    const R=REGIONES.kanto;await cargarNombres(R.iniciales);
    cont.append(h('p','margin:6px 0',`Empiezas en <b>${esc(R.nombre)}</b> con un Pokémon de nivel ${Aventura.CFG.inicial.nivel}, ${Aventura.CFG.inicial.pokeball} Poké Balls y 💰 ${Aventura.CFG.inicial.dinero}. Ve a donde quieras.`));
    const g=h('div','');g.className='av-grid';
    for(const id of R.iniciales)g.append(tarjeta({especieId:id,nivel:Aventura.CFG.inicial.nivel,genero:null},{alClick:async()=>{
      if(!confirm(`¿Empezar con ${nm(id)}?`))return;
      run=Aventura.nuevaPartida(R,id,ctx());await guardar();pantallaNodo();
    }}));
    cont.append(g);
  }

  // ---------- Lugar actual ----------
  async function pantallaNodo(aviso){
    if(run.pendCaptura)return pantallaCaptura();
    const R=R$(),n=nodoAct(),acc=Aventura.acciones(run,R);await guardar();   // el salvaje en curso queda fijado
    await cargarNombres([...Aventura.equipo(run).map(p=>p.especieId),...acc.flatMap(a=>a.enemigos.map(e=>e.id))]);
    limpiar();cont.append(cabecera(R.nombre,pantallaMenu));
    if(typeof aviso==='string')cont.append(h('p','color:#4ade80;margin:6px 0',esc(aviso)));
    const box=h('div','',`<div style="font-size:20px">${n.icono} <b>${esc(n.nombre)}</b></div><div style="font-size:12px;opacity:.8;margin:2px 0 6px">${esc(n.desc||'')}</div>`);
    box.className='av-box';
    for(const a of acc){
      if(a.hecho){box.append(h('div','font-size:12px;opacity:.6;margin:4px 0',`✔ ${esc(a.titulo)} (derrotado)`));continue}
      const b=h('button','');b.className='av-op';
      b.innerHTML=a.tipo==='salvaje'?`🌿 <b>Buscar Pokémon salvajes</b><br><small>Te sale al paso: ${esc(nm(a.enemigos[0].id))} de nivel ${a.enemigos[0].nv}</small>`
        :`${a.tipo==='gimnasio'?'🏟️':'⚔️'} <b>${esc(a.titulo)}</b><br>${sprites(a.enemigos)}`;
      b.onclick=()=>combatir(a.clave);box.append(b);
    }
    if(n.hallazgo&&!run.hallazgos[run.nodo]){const b=h('button','','🔎 <b>Buscar objetos</b>');b.className='av-op';b.innerHTML='🔎 <b>Buscar objetos</b><br><small>Puede que haya algo por aquí…</small>';
      b.onclick=async()=>{const p=Aventura.recogerHallazgo(run,R);await guardar();pantallaNodo('Encuentras: '+Object.entries(p).map(([k,v])=>v+' × '+objN(k)).join(', '))};box.append(b)}
    if(n.tienda){const b=h('button','');b.className='av-op';b.innerHTML='🛒 <b>Poké Mart</b><br><small>Bolas, caramelos y más</small>';b.onclick=()=>pantallaTienda(n.tienda);box.append(b)}
    cont.append(box);

    // Caminos: todos los lugares vecinos, sin orden obligatorio
    cont.append(h('div','margin-top:10px','<b>🧭 Ir a…</b>'));
    const cam=h('div','max-width:560px');
    for(const id of Aventura.vecinos(R,run.nodo)){
      const s=R.nodos[id],a=Aventura.acceso(run,R,id),b=h('button','');b.className='av-op';
      b.innerHTML=`${s.icono} <b>${esc(s.nombre)}</b>${run.visitados[id]?'':' <small>(nuevo)</small>'}<br><small>${a.ok?esc(s.desc||''):'🔒 '+esc(a.motivo)}</small>`;
      b.disabled=!a.ok;b.onclick=async()=>{const r=Aventura.ir(run,R,id);if(r.ok){await guardar();pantallaNodo()}else alert(r.motivo)};
      cam.append(b);
    }
    cont.append(cam);
    const vr=Aventura.viajeRapido(run,R);
    if(vr.length){const b=h('button','margin:6px 0','✈️ Viaje rápido ('+vr.length+')');b.onclick=pantallaViaje;cont.append(b)}

    cont.append(h('div','margin-top:10px','<b>Tu equipo</b>'));
    const g=h('div','');g.className='av-grid';
    for(const p of Aventura.equipo(run))g.append(tarjeta(p,{alClick:()=>pantallaPoke(p.uid)}));
    cont.append(g);
    const inv=Object.entries(run.objetos);
    cont.append(h('div','font-size:12px;margin:6px 0','<b>🎒</b> '+(inv.length?inv.map(([k,v])=>`${objI(k)} ${esc(objN(k))} ×${v}`).join(' · '):'vacía')));
    const eq=h('button','margin-top:6px','👥 Equipo y box');eq.onclick=()=>pantallaEquipo();cont.append(eq);
  }

  function pantallaViaje(){
    limpiar();cont.append(cabecera('✈️ Viaje rápido',()=>pantallaNodo()));
    const R=R$(),l=h('div','max-width:560px');
    for(const id of Aventura.viajeRapido(run,R)){
      const s=R.nodos[id],b=h('button','');b.className='av-op';b.innerHTML=`${s.icono} <b>${esc(s.nombre)}</b><br><small>${esc(s.desc||'')}</small>`;
      b.onclick=async()=>{const r=Aventura.ir(run,R,id,true);if(r.ok){await guardar();pantallaNodo()}else alert(r.motivo)};l.append(b);
    }
    cont.append(l);
  }

  // ---------- Tienda ----------
  function pantallaTienda(lista,aviso){
    limpiar();cont.append(cabecera('🛒 Poké Mart',()=>pantallaNodo()));
    if(typeof aviso==='string')cont.append(h('p','color:#4ade80;margin:6px 0',esc(aviso)));
    const l=h('div','max-width:560px');
    for(const it of lista){
      const f=h('div','display:flex;align-items:center;gap:8px;border:1px solid #334155;border-radius:8px;padding:6px 8px;margin:6px 0',
        `<div style="flex:1">${objI(it.o)} <b>${esc(objN(it.o))}</b> <small>(tienes ${run.objetos[it.o]||0})</small><br><small>💰 ${it.precio}</small></div>`);
      for(const n of[1,10]){
        const b=h('button','padding:4px 10px','×'+n);b.disabled=run.dinero<it.precio*n;
        b.onclick=async()=>{Aventura.comprar(run,it.o,it.precio,n);await guardar();pantallaTienda(lista,`Compras ${n} × ${objN(it.o)}.`)};f.append(b);
      }
      l.append(f);
    }
    cont.append(l);
  }

  // ---------- Puente con el combate del simulador ----------
  async function claveNivel(id,nv){   // registra en TY una versión de la especie con stats de ese nivel
    const base=await loadSp(id),key=base+'@'+nv;
    if(!TY[key]){const b=TY[base],e=Aventura.escalar(b.st,b.H,nv);TY[key]={...b,st:e.st,H:e.H,n:b.n+' Nv '+nv,bst0:Aventura.bst(b.st)}}
    return key;
  }
  let alContinuar=null;
  document.addEventListener('click',e=>{if(e.target&&e.target.id==='av-ok'&&alContinuar)alContinuar()});
  // Lanza un combate (equipos = listas de {t,s,uid}) y devuelve {ganaJugador, huyo, usados:[uid]}.
  function lanzar(eqJ,eqR){
    return new Promise(res=>{
      const cerrar=r=>{
        alContinuar=null;alTerminarCombate=null;alSalirCombate=null;over=true;inGame=false;
        $('#game').style.display='none';$('#ban').style.display='none';
        $('#setup').style.display='flex';$('#go').style.display='block';$('#srch').style.display='block';   // como toSetup(), para no romper el simulador
        document.body.classList.remove('av-combate');$('#rs').textContent='Equipos';
        res(r);
      };
      alTerminarCombate=w=>{
        const r={ganaJugador:w===0,huyo:false,usados:team[0].filter(u=>u.used).map(u=>u.uid)};
        $('#ban').innerHTML=`${r.ganaJugador?'🏆<br>¡Victoria!':'💀<br>Derrota'}<div style="margin-top:10px"><button id="av-ok">Continuar</button></div>`;
        alContinuar=()=>cerrar(r);
      };
      alSalirCombate=()=>{if(confirm('¿Huir del combate?'))cerrar({ganaJugador:false,huyo:true,usados:[]})};
      document.body.classList.add('av-combate');$('#rs').textContent='Huir';
      iniciarCombate([eqJ,eqR]);
    });
  }
  async function combatir(clave){
    if(ocupado)return;
    const R=R$(),a=Aventura.accion(run,R,clave);if(!a)return;
    ocupado=true;limpiar();cont.append(cabecera('Preparando combate…'));
    const st=h('p','margin:8px 0','Cargando…');cont.append(st);
    try{
      const jug=[],riv=[],bsts=[],mios=Aventura.equipo(run);
      for(let i=0;i<mios.length;i++){st.textContent=`Cargando tu equipo ${i+1}/${mios.length}…`;const t=await claveNivel(mios[i].especieId,mios[i].nivel);jug.push({t,s:[...TY[t].ds],uid:mios[i].uid})}
      for(let i=0;i<a.enemigos.length;i++){st.textContent=`Cargando rival ${i+1}/${a.enemigos.length}…`;const e=a.enemigos[i],t=await claveNivel(e.id,e.nv);riv.push({t,s:[...TY[t].ds]});bsts.push(TY[t].bst0)}
      const r=await lanzar(jug,riv);
      let inf=null;
      if(r.ganaJugador)inf=Aventura.victoria(run,R,{clave,enemigos:a.enemigos.map((e,i)=>({...e,bst:bsts[i]})),usados:r.usados},ctx());
      else if(!r.huyo)inf=Aventura.derrota(run);
      await guardar();ocupado=false;
      if(inf&&inf.subidas)await cargarNombres(inf.subidas.flatMap(s=>[Aventura.poke(run,s.uid).especieId,...s.evol.flatMap(e=>[e.de,e.a])]));
      pantallaResultado(r,inf||{},a);
    }catch(e){
      ocupado=false;st.textContent=ERR;
      const b=h('button','','← Volver');b.onclick=()=>pantallaNodo();cont.append(b);
    }
  }
  function pantallaResultado(r,inf,a){
    limpiar();cont.append(cabecera(r.ganaJugador?'🏆 ¡Victoria!':r.huyo?'💨 Has huido':'💀 Derrota'));
    const box=h('div','');box.className='av-box';
    if(r.ganaJugador){
      box.append(h('div','margin-bottom:6px',`Cada Pokémon que luchó gana <b>${inf.xp} XP</b> · 💰 +${inf.dinero}`));
      for(const s of inf.subidas){
        const p=Aventura.poke(run,s.uid);
        let t=`${esc(nm(p.especieId))}: Nv ${s.antes}${s.despues>s.antes?` → <b style="color:#4ade80">${s.despues}</b>`:''}`;
        for(const e of s.evol)t+=`<br>✨ ¡${esc(nm(e.de))} ha evolucionado a <b>${esc(nm(e.a))}</b>!`;
        box.append(h('div','margin:3px 0',t));
      }
      if(inf.medalla)box.append(h('div','margin-top:8px',`🏅 ¡Medalla ${esc(inf.medalla)} conseguida!`));
      if(inf.premio)box.append(h('div','margin-top:6px',`Premio: ${premioHtml(inf.premio)}`));
    }else if(r.huyo)box.append(h('div','',a.tipo==='salvaje'?'El Pokémon salvaje sigue ahí.':'Puedes volver a intentarlo cuando quieras.'));
    else box.append(h('div','','Tu equipo se retira a descansar. Sin castigo: sube de nivel o cambia de equipo y vuelve a intentarlo.'));
    cont.append(box);
    const b=h('button','padding:10px 16px','Continuar');b.onclick=()=>pantallaNodo();cont.append(b);
  }

  // ---------- Captura ----------
  async function pantallaCaptura(aviso){
    const c=run.pendCaptura;await cargarNombres([c.id]);
    limpiar();cont.append(cabecera('¡Está agotado!'));
    if(typeof aviso==='string')cont.append(h('p','color:#fbbf24;margin:6px 0',esc(aviso)));
    const r=rz(c.id);
    const box=h('div','text-align:center',`<img src="${SPR+c.id}.png" style="width:112px;height:112px;image-rendering:pixelated" alt="">
      <div><b>${esc(nm(c.id))}</b> Nv ${c.nv} <span style="background:${RC[r]};color:#0f172a;border-radius:8px;padding:0 8px;font-weight:700">${r}</span></div>`);
    box.className='av-box';
    let alguna=false;
    for(const k of BOLAS){
      const n=run.objetos[k]||0,pr=Math.round(Aventura.probCaptura(r,k)*100),b=h('button','margin:6px 4px;padding:8px 12px',`${objI(k)} ${esc(objN(k))} · ${pr} % <small>(tienes ${n})</small>`);
      b.disabled=n<=0;if(n>0)alguna=true;
      b.onclick=async()=>{
        const x=Aventura.lanzarBola(run,ctx(),k);await guardar();
        if(x.capturado){await nombreEs(x.poke.especieId);pantallaNodo(`¡${nm(x.poke.especieId)} capturado! ${x.enEquipo?'Se une a tu equipo.':'Va a la box (equipo completo).'}`)}
        else if(x.huyo)pantallaNodo('¡El Pokémon se ha escapado!');
        else pantallaCaptura('¡Se ha soltado! Puedes intentarlo otra vez (pero puede escapar).');
      };
      box.append(b);
    }
    if(!alguna)box.append(h('div','font-size:12px;opacity:.8','No te quedan bolas. Puedes comprar en un Poké Mart… pero este Pokémon se irá.'));
    const d=h('button','margin:6px 4px','Dejarlo marchar');d.onclick=async()=>{Aventura.soltarCaptura(run);await guardar();pantallaNodo()};
    box.append(h('br'),d);cont.append(box);
  }

  // ---------- Equipo y box ----------
  async function pantallaEquipo(aviso){
    await cargarNombres(run.pokes.map(p=>p.especieId));
    limpiar();cont.append(cabecera('👥 Equipo y box',()=>pantallaNodo()));
    if(typeof aviso==='string')cont.append(h('p','color:#4ade80;margin:6px 0',esc(aviso)));
    const sec=(t,l)=>{cont.append(h('div','margin-top:8px',`<b>${t}</b>`));const g=h('div','');g.className='av-grid';
      if(!l.length)g.append(h('small','opacity:.7','Vacío'));
      for(const p of l)g.append(tarjeta(p,{alClick:()=>pantallaPoke(p.uid),off:!run.equipo.includes(p.uid)}));cont.append(g)};
    sec(`Equipo (${run.equipo.length}/${Aventura.CFG.equipoMax})`,Aventura.equipo(run));
    sec('Box',run.pokes.filter(p=>!run.equipo.includes(p.uid)));
  }
  async function pantallaPoke(uid,aviso){
    const p=Aventura.poke(run,uid);if(!p)return pantallaEquipo();
    const ops=Aventura.opcionesEvo(run,p,ctx());await cargarNombres([p.especieId,...ops.map(o=>o.e.a)]);
    limpiar();cont.append(cabecera(nm(p.especieId),()=>pantallaEquipo()));
    if(typeof aviso==='string')cont.append(h('p','color:#4ade80;margin:6px 0',esc(aviso)));
    const g=grupoDe(p.especieId),r=rz(p.especieId),sig=p.nivel<Experiencia.NIVEL_MAX?Experiencia.xpTotal(g,p.nivel+1)-p.xp:0;
    cont.append(h('div','display:flex;gap:14px;flex-wrap:wrap;align-items:center',`<img src="${SPR+p.especieId}.png" style="width:112px;height:112px;image-rendering:pixelated" alt="">
      <div><div style="font-size:18px"><b>${esc(nm(p.especieId))}</b> <span style="background:${RC[r]};color:#0f172a;border-radius:8px;padding:0 8px;font-weight:700">${r}</span>${GN[p.genero]?` <b style="color:${GN[p.genero][1]}">${GN[p.genero][0]}</b>`:''}</div>
      <div>Nivel ${p.nivel}${sig?` · faltan ${sig} XP para el ${p.nivel+1}`:' · nivel máximo'}</div></div>`));
    // Caramelos
    cont.append(h('div','margin-top:12px','<b>🍬 Caramelos</b>'));
    for(const k of Object.keys(Experiencia.XP_CARAMELO)){
      const n=run.objetos[k]||0,f=h('div','display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap',`<span style="min-width:230px">${objI(k)} ${esc(objN(k))} <small>(+${Experiencia.XP_CARAMELO[k]} XP · tienes ${n})</small></span>`);
      for(const[t,c]of[['×1',1],['×10',10]]){
        const b=h('button','padding:2px 8px',t);b.disabled=n<=0||p.nivel>=Experiencia.NIVEL_MAX;
        b.onclick=async()=>{
          const x=Aventura.usarCaramelo(run,p,k,c,ctx());if(!x)return;await guardar();
          await cargarNombres(x.evol.flatMap(e=>[e.de,e.a]));
          pantallaPoke(uid,(x.despues>x.antes?`¡Sube del nivel ${x.antes} al ${x.despues}!`:`+${x.xp} XP`)+x.evol.map(e=>` ✨ ¡${nm(e.de)} evoluciona a ${nm(e.a)}!`).join(''));
        };
        f.append(b);
      }
      cont.append(f);
    }
    // Evolución
    cont.append(h('div','margin-top:12px','<b>🧬 Evolución</b>'));
    if(!ops.length)cont.append(h('p','opacity:.7;margin:6px 0','No tiene más evoluciones.'));
    for(const o of ops){
      const e=o.e,f=h('div','display:flex;align-items:center;gap:8px;border:1px solid #334155;border-radius:8px;padding:6px;margin:6px 0;max-width:520px');
      const req=e.t==='nivel'?`Nivel ${e.nivel} <small>(automática)</small>`:e.t==='objeto'?[[e.o,e.n],...(e.x||[])].map(([k,n])=>`${objI(k)} ${n} × ${esc(objN(k))} <small>(tienes ${run.objetos[k]||0})</small>`).join(' + '):'🔒 Próximamente';
      f.innerHTML=`<img src="${SPR+e.a}.png" style="width:48px;height:48px;image-rendering:pixelated" alt=""><div style="flex:1"><b>${esc(nm(e.a))}</b><br><span style="font-size:12px">${req}</span></div>`;
      if(e.t==='objeto'){
        const b=h('button','','Evolucionar');b.disabled=!o.ok;
        b.onclick=async()=>{if(!confirm(`¿Evolucionar a ${nm(e.a)}?`))return;const x=Aventura.evolucionar(run,p,e,ctx());await guardar();pantallaPoke(uid,x?`¡${nm(x.de)} ha evolucionado a ${nm(x.a)}!`:null)};
        f.append(b);
      }
      cont.append(f);
    }
    const en=run.equipo.includes(uid),b1=h('button','margin:12px 8px 0 0',en?'📦 Pasar a la box':'⭐ Añadir al equipo'),b2=h('button','color:#f87171;margin-top:12px','Liberar');
    b1.onclick=async()=>{const m=Aventura.alternarEquipo(run,uid);if(m){alert(m);return}await guardar();pantallaPoke(uid,en?'Pasa a la box.':'Entra en el equipo.')};
    b2.onclick=async()=>{if(!confirm(`¿Liberar a ${nm(p.especieId)}? No se puede deshacer.`))return;const m=Aventura.liberar(run,uid);if(m){alert(m);return}await guardar();pantallaEquipo('Pokémon liberado.')};
    cont.append(b1,b2);
  }

  // Punto de entrada: lo llama el menú de modos.
  async function abrir(contenedor,volver){cont=contenedor;salir=volver;estilo();pantallaMenu()}
  return{abrir};
})();
</script>
<script>
// Arranque.
addEventListener('resize',rs);rs();rend();requestAnimationFrame(loop);

</script>
<script>
// MENÚ DE MODOS: pantalla inicial para elegir a qué jugar.
// No toca el simulador: solo lo oculta o lo muestra con una clase en <body> (data-modo).
// Para añadir un modo nuevo: añade una entrada a MODOS (con `abrir` si dibuja pantallas propias: recibe su contenedor).
// Va el ÚLTIMO en la lista de scripts de index.html.
const MODOS=[
  {id:'simulador',icono:'⚔️',nombre:'Simulador',desc:'Combates por equipos en la arena'},
  {id:'gacha',icono:'🎴',nombre:'Gacha',desc:'Banners, box, eventos y entrenamiento',
   abrir:c=>Gacha.abrir(c,()=>irA('menu'))},
  {id:'aventura',icono:'🗺️',nombre:'Aventura',desc:'Explora Kanto a tu aire: rutas, capturas y gimnasios',
   abrir:c=>ModoAventura.abrir(c,()=>irA('menu'))},
];

(function(){
  const main=document.querySelector('main')||document.body;
  const conAbrir=MODOS.filter(m=>m.abrir);
  document.head.append(Object.assign(document.createElement('style'),{textContent:`
    body[data-modo]:not([data-modo="simulador"]) main>*:not(script):not(.mm){display:none!important}
    .mm{display:none}
    body[data-modo="menu"] #mm-menu{display:block}
    ${conAbrir.map(m=>`body[data-modo="${m.id}"] #mm-${m.id}`).join(',')}{display:block}
    body[data-modo="simulador"] #mm-volver,body[data-modo="gacha"] #mm-volver{display:block}
    #mm-volver{position:fixed;left:10px;bottom:10px;z-index:9990;opacity:.9}
    /* Combate dentro de la aventura: se oculta el mapa y se enseña la arena del simulador */
    body[data-modo="aventura"].av-combate #mm-aventura{display:none!important}
    body[data-modo="aventura"].av-combate main>#game{display:block!important}
    #mm-menu h1{margin:14px 0 4px}
    .mm-modos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:16px 0;max-width:620px}
    .mm-modos button{padding:22px 12px;text-align:center;font-size:16px}
    .mm-modos small{display:block;opacity:.7;font-weight:400;margin-top:4px}`}));

  const menu=document.createElement('div');menu.id='mm-menu';menu.className='mm';
  menu.innerHTML='<h1>🌿 Arena Aérea</h1><p style="opacity:.8;margin:0">¿A qué quieres jugar?</p>';
  const g=document.createElement('div');g.className='mm-modos';
  for(const m of MODOS){
    const b=document.createElement('button');
    b.innerHTML=`<div style="font-size:34px">${m.icono}</div>${m.nombre}<small>${m.desc}</small>`;
    b.onclick=()=>irA(m.id);g.append(b);
  }
  menu.append(g);

  const conts={};   // un contenedor por cada modo con pantallas propias
  for(const m of conAbrir){const d=document.createElement('div');d.id='mm-'+m.id;d.className='mm';conts[m.id]=d}
  const volver=document.createElement('button');volver.id='mm-volver';volver.textContent='⌂ Modos';
  volver.onclick=()=>irA('menu');
  volver.className='mm';   // solo se ve en el simulador y en el gacha (lo controla el CSS de arriba)
  main.append(menu,...Object.values(conts),volver);

  window.irA=id=>{
    document.body.dataset.modo=id;
    const m=MODOS.find(x=>x.id===id);
    if(m&&m.abrir)m.abrir(conts[id]);
    window.scrollTo&&window.scrollTo(0,0);
  };
  irA('menu');
})();
</script>
</main></body></html>
