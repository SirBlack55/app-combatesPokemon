<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena Aérea</title>
<link rel="stylesheet" href="css/estilo.css">
</head><body><main>
<h1>🌿 Arena Aérea · Combates por equipos</h1>
<div class="col" id="srch" style="margin-bottom:8px"><b>🌐 Pokémon desde PokéAPI</b>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0"><select id="gen"><option value="0">Gen 1</option><option value="1">Gen 2</option><option value="2">Gen 3</option><option value="3">Gen 4</option><option value="4">Gen 5</option><option value="5">Gen 6</option><option value="6">Gen 7</option><option value="7">Gen 8</option><option value="8">Gen 9</option><option value="all">Todas</option></select><input id="q" placeholder="Buscar nombre o número…" style="flex:1;min-width:130px"><button id="d0" style="border-color:#3b82f6">→ 🔵</button><button id="d1">→ 🔴</button><button id="rnd">🎲 Equipo</button><button id="labb">🧪 Laboratorio</button></div>
<div id="st" style="font-size:12px;min-height:16px"></div><div id="res"></div></div>
<div id="setup"></div><button id="go">⚔️ ¡COMENZAR COMBATE!</button>
<section id="game" style="display:none">
<div id="labui"><div class="col" style="margin-bottom:6px"><b>🧪 Laboratorio de ataques</b> <small>Dos Pokémon de prueba que no mueren</small>
<div class="lr"><label>Atacante # <input id="la" type="number" value="18"></label><label>Rival # <input id="lb" type="number" value="143"></label><button id="lsw">Atacante: 🔵</button></div>
<div class="lr"><input id="lm" value="fly" placeholder="ID del ataque en inglés (fly, flamethrower…)"><button id="lgo">▶ Probar</button></div>
<div class="lr" id="lq"></div><div class="lr"><button id="lauto">🔁 Auto: sí</button><button id="lslow">Velocidad x1</button><button id="lex">← Volver</button></div><div id="lst" style="font-size:12px;min-height:16px"></div></div></div>
<div id="bar"><button id="sp">Velocidad x1</button><button id="pa">Pausa</button><button id="tg">Ocultar ataques</button><button id="rs">Equipos</button></div>
<div id="hud"><div class="hb" id="h0"></div><div class="hb" id="h1"></div></div><div class="cw"><canvas id="cv"></canvas><div id="ban"></div></div><div id="mvp"><div class="mp" id="mv0"></div><div class="mp" id="mv1"></div></div>
<div id="log"></div></section>
<!-- El ORDEN importa: nucleo → datos → combate → ataques → ui → modos → principal.
     Para añadir un ataque nuevo: crea js/ataques/mi-ataque.js y añade aquí su <script> junto a los demás ataques. -->
<script src="js/nucleo/base.js"></script>
<script src="js/nucleo/aleatorio.js"></script>
<script src="js/nucleo/estado.js"></script>
<script src="js/datos/tipos.js"></script>
<script src="js/datos/iconos.js"></script>
<script src="js/datos/movimientos.js"></script>
<script src="js/datos/estadisticas.js"></script>
<script src="js/datos/pokeapi.js"></script>
<script src="js/datos/conversor.js"></script>
<script src="js/nucleo/efectos.js"></script>
<script src="js/nucleo/dibujo.js"></script>
<script src="js/nucleo/bucle.js"></script>
<script src="js/combate/luchadores.js"></script>
<script src="js/combate/ia.js"></script>
<script src="js/combate/estados.js"></script>
<script src="js/combate/entidades.js"></script>
<script src="js/combate/dano.js"></script>
<script src="js/combate/ataque.js"></script>
<script src="js/combate/movimiento.js"></script>
<script src="js/ataques/_ayudas.js"></script>
<script src="js/ataques/vuelo.js"></script>
<script src="js/ataques/hidrobomba.js"></script>
<script src="js/ataques/hiperrayo.js"></script>
<script src="js/ataques/trueno.js"></script>
<script src="js/ataques/rayo.js"></script>
<script src="js/ataques/gigaimpacto.js"></script>
<script src="js/ataques/cometa-draco.js"></script>
<script src="js/gacha/arquetipos.js"></script>
<script src="js/gacha/herramienta-kits.js"></script>
<script src="js/gacha/rareza.js"></script>
<script src="js/gacha/herramienta-rareza.js"></script>
<script src="js/gacha/rarezas.js"></script>
<script src="js/gacha/banners.js"></script>
<script src="js/gacha/banners-datos.js"></script>
<script src="js/gacha/herramienta-banners.js"></script>
<script src="js/gacha/herramienta-evoluciones.js"></script>
<script src="js/gacha/guardado.js"></script>
<script src="js/ui/hud.js"></script>
<script src="js/ui/selector-ataques.js"></script>
<script src="js/ui/seleccion.js"></script>
<script src="js/ui/buscador.js"></script>
<script src="js/ui/laboratorio.js"></script>
<script src="js/modos/simulador.js"></script>
<script src="js/modos/gacha.js"></script>
<script src="js/principal.js"></script>
<script src="js/modos/menu-modos.js"></script>
</main></body></html>
